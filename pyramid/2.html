<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ся</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    .sia {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 48px;
      font-weight: bold;
      opacity: 0.8;
      pointer-events: none;
      text-shadow: 0 0 20px #fff;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="sia">Ся</div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const colors = ['#ff0066', '#ff6600', '#ffcc00', '#00ffcc', '#0066ff', '#cc00ff'];
    let t = 0;
    const points = [];

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;

      // Спираль
      for (let i = 0; i < 3; i++) {
        const phase = t + i * 2.094; // 2π/3
        const r = (t * 2 + i * 100) % 400;
        const angle = phase * 3;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        const color = colors[Math.floor((t + i * 50) / 10) % colors.length];

        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        // Линии от центра к точкам
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.strokeStyle = color + '44';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Центральный круг
      ctx.beginPath();
      ctx.arc(cx, cy, 40 + Math.sin(t * 0.05) * 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Точка в центре
      ctx.beginPath();
      ctx.arc(cx, cy, 10 + Math.sin(t * 0.1) * 3, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();

      // Пульсация
      ctx.beginPath();
      ctx.arc(cx, cy, 60 + Math.sin(t * 0.03) * 20, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.stroke();

      t += 0.5;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
