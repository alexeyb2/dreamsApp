<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ся — потоки</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;height:100%}
  canvas{display:block}
  .sia{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
       color:#fff;font-family:Arial;font-size:36px;letter-spacing:8px;
       opacity:.55;text-shadow:0 0 20px #fff;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sia">С Я</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
addEventListener('resize',resize);resize();

// ---------- flow field (невидимое поле) ----------
function noise(x,y,t){
  return Math.sin(x*0.0021+t*0.4)*Math.cos(y*0.0027-t*0.31)
       + Math.sin((x+y)*0.0013+t*0.17)*0.6
       + Math.cos(x*0.0009-y*0.0011-t*0.23)*0.5;
}
function field(x,y,t){
  const n=noise(x,y,t);
  const a=n*Math.PI*1.4;
  return [Math.cos(a),Math.sin(a)];
}

// ---------- частицы потока ----------
const N=900;
const P=[];
for(let i=0;i<N;i++)P.push({
  x:Math.random()*W,y:Math.random()*H,
  vx:0,vy:0,life:Math.random()*400,
  hue:Math.random()*360,size:.6+Math.random()*1.4
});

// ---------- брауновское облако (молекулы) ----------
const B=[];
for(let i=0;i<140;i++)B.push({
  x:W/2+(Math.random()-.5)*W*0.5,
  y:H/2+(Math.random()-.5)*H*0.5,
  vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,
  r:1+Math.random()*2
});

// ---------- пар / струи ----------
const S=[];
for(let i=0;i<120;i++)S.push({
  x:Math.random()*W,y:H+Math.random()*200,
  vy:-(.3+Math.random()*1.1),vx:(Math.random()-.5)*.4,
  r:4+Math.random()*14,a:.05+Math.random()*.12
});

// ---------- векторы мира (точка А → точка Б) ----------
const V=[];
function spawnVector(){
  const ax=Math.random()*W, ay=H-Math.random()*H*0.15;
  const bx=Math.random()*W, by=Math.random()*H*0.15;
  V.push({x:ax,y:ay,tx:bx,ty:by,t:0,speed:.004+Math.random()*.006,
          hue:180+Math.random()*120});
}
for(let i=0;i<60;i++)spawnVector();

// ---------- контур тела ----------
function bodyPath(cx,cy,s){
  ctx.beginPath();
  // голова
  ctx.moveTo(cx, cy-140*s);
  ctx.arc(cx, cy-110*s, 30*s, -Math.PI*0.9, -Math.PI*0.1);
  // плечи и руки
  ctx.moveTo(cx-38*s, cy-80*s);
  ctx.lineTo(cx-95*s, cy+10*s);
  ctx.lineTo(cx-70*s, cy+120*s);
  ctx.moveTo(cx+38*s, cy-80*s);
  ctx.lineTo(cx+95*s, cy+10*s);
  ctx.lineTo(cx+70*s, cy+120*s);
  // торс
  ctx.moveTo(cx-38*s, cy-80*s);
  ctx.lineTo(cx-30*s, cy+90*s);
  ctx.moveTo(cx+38*s, cy-80*s);
  ctx.lineTo(cx+30*s, cy+90*s);
  // ноги
  ctx.moveTo(cx-30*s, cy+90*s);
  ctx.lineTo(cx-40*s, cy+220*s);
  ctx.moveTo(cx+30*s, cy+90*s);
  ctx.lineTo(cx+40*s, cy+220*s);
  ctx.stroke();
}

// ---------- главный цикл ----------
let t=0;
function loop(){
  // затухание (шлейфы)
  ctx.fillStyle='rgba(0,0,0,0.06)';
  ctx.fillRect(0,0,W,H);

  const cx=W/2, cy=H/2;

  // 1. ЧАСТИЦЫ ПО ПОЛЮ — потоки по миру
  ctx.globalCompositeOperation='lighter';
  for(const p of P){
    const [fx,fy]=field(p.x,p.y,t);
    p.vx+=fx*0.35; p.vy+=fy*0.35;
    p.vx*=0.94; p.vy*=0.94;
    p.x+=p.vx; p.y+=p.vy;
    p.life--;
    if(p.life<0||p.x<0||p.x>W||p.y<0||p.y>H){
      p.x=Math.random()*W;p.y=Math.random()*H;p.vx=p.vy=0;p.life=200+Math.random()*300;
    }
    const sp=Math.hypot(p.vx,p.vy);
    const hue=(p.hue+t*0.6)%360;
    ctx.fillStyle=`hsla(${hue},90%,${45+sp*8}%,${0.35+sp*0.15})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.283);ctx.fill();
  }

  // 2. ТЕЛО — потоки по телу
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(120,200,255,0.18)';
  ctx.lineWidth=1.2*devicePixelRatio;
  bodyPath(cx,cy,Math.min(W,H)/1100);

  // поток по позвоночнику (пульсирующий)
  const spinePulse=(Math.sin(t*2)+1)/2;
  const grad=ctx.createLinearGradient(cx,cy-140, cx,cy+220);
  grad.addColorStop(0,`rgba(180,220,255,${0.15+spinePulse*0.35})`);
  grad.addColorStop(0.5,`rgba(255,220,180,${0.2+spinePulse*0.3})`);
  grad.addColorStop(1,`rgba(255,140,220,${0.1+spinePulse*0.25})`);
  ctx.strokeStyle=grad;
  ctx.lineWidth=3*devicePixelRatio;
  ctx.beginPath();
  const sc=Math.min(W,H)/1100;
  ctx.moveTo(cx,cy-140*sc);ctx.lineTo(cx,cy+220*sc);
  ctx.stroke();

  // лучи из головы (потоки в голове)
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2 + t*0.3;
    const r1=35*sc, r2=(70+Math.sin(t*1.5+i)*30)*sc;
    ctx.strokeStyle=`hsla(${(i*15+t*30)%360},90%,70%,0.12)`;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r1, cy-110*sc+Math.sin(a)*r1);
    ctx.lineTo(cx+Math.cos(a)*r2, cy-110*sc+Math.sin(a)*r2);
    ctx.stroke();
  }

  // 3. БРАУНОВСКОЕ ОБЛАКО — молекулы воздуха
  for(const b of B){
    b.vx+=(Math.random()-.5)*0.6;
    b.vy+=(Math.random()-.5)*0.6;
    b.vx*=0.97;b.vy*=0.97;
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<0||b.x>W)b.vx*=-1;
    if(b.y<0||b.y>H)b.vy*=-1;
    ctx.fillStyle='rgba(200,230,255,0.35)';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();
  }
  // связи между близкими молекулами
  ctx.strokeStyle='rgba(150,200,255,0.08)';
  for(let i=0;i<B.length;i++){
    for(let j=i+1;j<B.length;j++){
      const dx=B[i].x-B[j].x, dy=B[i].y-B[j].y;
      const d=dx*dx+dy*dy;
      if(d<7000){
        ctx.beginPath();
        ctx.moveTo(B[i].x,B[i].y);
        ctx.lineTo(B[j].x,B[j].y);
        ctx.stroke();
      }
    }
  }

  // 4. ПАР — восходящие струи
  for(const s of S){
    s.x+=s.vx; s.y+=s.vy;
    s.vx+=(Math.random()-.5)*0.05;
    if(s.y<-50){s.y=H+20;s.x=Math.random()*W;s.vy=-(.3+Math.random()*1.1);}
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);
    g.addColorStop(0,`rgba(255,255,255,${s.a})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
  }

  // 5. ВЕКТОРЫ МИРА — машины из A в B
  for(const v of V){
    v.t+=v.speed;
    if(v.t>1){v.t=0;
      v.x=Math.random()*W;v.y=H-Math.random()*H*0.15;
      v.tx=Math.random()*W;v.ty=Math.random()*H*0.15;
      v.hue=180+Math.random()*120;
    }
    const px=v.x+(v.tx-v.x)*v.t;
    const py=v.y+(v.ty-v.y)*v.t;
    // хвост
    ctx.strokeStyle=`hsla(${v.hue},90%,70%,0.35)`;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(px,py);
    const bx=v.x+(v.tx-v.x)*Math.max(0,v.t-0.05);
    const by=v.y+(v.ty-v.y)*Math.max(0,v.t-0.05);
    ctx.lineTo(bx,by);
    ctx.stroke();
    // точка
    ctx.fillStyle=`hsla(${v.hue},90%,75%,0.9)`;
    ctx.beginPath();ctx.arc(px,py,2.2,0,6.283);ctx.fill();
  }

  ctx.globalCompositeOperation='source-over';
  t+=0.016;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
