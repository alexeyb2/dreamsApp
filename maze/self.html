<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Твои убеждения</title>
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #e8e8f0;
    --accent: #6fa8ff;
    --new: #ffb46f;
    --muted: #6b6b7b;
    --surface: #14141c;
    --surface-2: #1e1e2a;
    --border: #262633;
    --r: 18px;
    --r-sm: 12px;
    --pad: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.45;
    overscroll-behavior: none;
  }
  body { overflow: hidden; }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .screen {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    animation: fadeIn .22s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fallIn {
    from { opacity: 0; transform: scale(1.06); }
    to   { opacity: 1; transform: scale(1); }
  }
  .screen.fall { animation: fallIn .32s cubic-bezier(.22, 1, .36, 1) both; }

  .hdr {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: calc(var(--safe-top) + 10px) var(--pad) 8px;
  }
  .hdr-title {
    flex: 1; font-size: 15px; font-weight: 600; opacity: .82;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-title.left { text-align: left; }

  .icon-btn {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; transition: background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.08); }

  .body {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 var(--pad) calc(var(--safe-bottom) + 24px);
  }
  .footer { flex: none; padding: 12px var(--pad) calc(var(--safe-bottom) + 16px); }

  /* ==== who ==== */
  .who {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 44px; padding: 24px;
  }
  .who h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .emoji-row { display: flex; gap: 22px; }
  .big-emoji-btn {
    width: 104px; height: 104px; border-radius: 28px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 52px; display: flex; align-items: center; justify-content: center;
    transition: transform .15s, border-color .15s;
  }
  .big-emoji-btn:active { transform: scale(.94); border-color: var(--accent); }

  /* ==== forms ==== */
  .field-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .07em; margin: 18px 0 8px;
  }
  .big-input {
    width: 100%; min-height: 116px; resize: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 14px 16px; outline: none;
    line-height: 1.5; transition: border-color .15s;
  }
  .big-input:focus { border-color: var(--accent); }

  .preview {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 14px 16px; min-height: 78px;
    white-space: pre-wrap; word-break: break-word;
    font-size: 17px; line-height: 1.6;
  }
  .preview.empty::before { content: 'Здесь появится текст…'; color: var(--muted); }

  .tok { border-radius: 6px; padding: 1px 3px; margin: 0 -1px; transition: background .15s; cursor: pointer; }
  .tok-existing { color: var(--accent); background: rgba(111,168,255,.13); }
  .tok-new      { color: var(--new);    background: rgba(255,180,111,.13); }
  .tok-stop     { color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 13px; border-radius: 999px;
    background: rgba(255,180,111,.12); color: var(--new);
    border: 1px solid rgba(255,180,111,.25); font-size: 14px;
    transition: background .15s;
  }
  .chip:active { background: rgba(255,180,111,.22); }

  /* ==== buttons ==== */
  .btn {
    display: flex; align-items: center; justify-content: center;
    padding: 15px 22px; border-radius: var(--r);
    font-size: 16px; font-weight: 600; width: 100%;
    transition: transform .12s, opacity .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: #06111f; }
  .btn-ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* ==== рабочий стол (хаб) ==== */
  .desk-current {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 8px 0 22px;
    cursor: pointer;
    transition: transform .15s;
  }
  .desk-current:active { transform: scale(.97); }

  .desk-sphere {
    width: 108px; height: 108px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    background: radial-gradient(circle at 35% 30%, #2b3a5c, #12131c 70%);
    border: 1px solid rgba(111,168,255,.32);
    animation: pulse 3.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(111,168,255,.35); }
    70%  { box-shadow: 0 0 0 22px rgba(111,168,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(111,168,255,0); }
  }

  .desk-word {
    font-size: 19px; font-weight: 600; letter-spacing: -.01em;
    text-align: center; max-width: 90%; word-break: break-word;
  }

  .desk-hint {
    font-size: 12px; color: var(--muted);
    text-align: center; padding: 4px 0 14px;
    letter-spacing: .05em; text-transform: uppercase;
  }

  .desktop {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 14px; padding: 4px 2px 20px;
  }

  .bubble {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: radial-gradient(circle at 32% 28%, rgba(111,168,255,.24), rgba(20,20,28,.95) 72%);
    border: 1px solid rgba(111,168,255,.28);
    box-shadow: 0 8px 24px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.07);
    animation: bubbleFloat 6s ease-in-out infinite;
    will-change: transform;
  }
  .bubble:active { animation: none; transform: scale(.9); filter: brightness(1.25); }
  .bubble:nth-child(2n) { animation-delay: -2s; }
  .bubble:nth-child(3n) { animation-delay: -4s; }
  .bubble:nth-child(4n) { animation-delay: -1s; }
  .bubble:nth-child(5n) { animation-delay: -3s; }

  @keyframes bubbleFloat {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-6px) scale(1.02); }
  }

  .bubble-draft { opacity: .55; font-size: 30px; }
  .bubble-add {
    font-size: 28px; color: var(--muted);
    background: rgba(255,255,255,.025);
    border: 1px dashed var(--border);
    box-shadow: none;
    animation: none;
  }

  /* ==== экран «Воспоминание» ==== */
  .memory-pair {
    display: flex; justify-content: center; align-items: flex-start;
    gap: 26px; padding: 26px 0 30px;
  }

  .memory-cell {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; max-width: 140px;
    transition: transform .15s;
  }
  .memory-cell:active { transform: scale(.94); }

  .memory-emoji {
    width: 118px; height: 118px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 58px;
    background: radial-gradient(circle at 32% 28%, rgba(111,168,255,.26), rgba(20,20,28,.96) 72%);
    border: 1px solid rgba(111,168,255,.34);
    box-shadow: 0 14px 36px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    animation: bubbleFloat 6s ease-in-out infinite;
  }
  .memory-cell:nth-child(2) .memory-emoji { animation-delay: -2s; }

  .memory-caption {
    font-size: 13px; line-height: 1.3;
    color: var(--fg); opacity: .88;
    text-align: center; word-break: break-word;
  }
  .memory-caption.empty { opacity: .4; }

  .memory-note {
    font-size: 13px; color: var(--muted);
    text-align: center; padding: 8px 0;
    line-height: 1.5;
  }

  /* ==== belief card ==== */
  .card-emoji { font-size: 72px; text-align: center; padding: 4px 0 2px; }
  .card-word {
    font-size: 24px; font-weight: 600; text-align: center;
    margin: 0 0 18px; letter-spacing: -.01em; word-break: break-word;
  }
  .block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px;
  }
  .block-title {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .07em; margin-bottom: 10px;
  }
  .block-text { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .block-text.empty::before { content: '—'; color: var(--muted); }

  .ref-list { display: flex; flex-direction: column; gap: 2px; }
  .ref-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: var(--r-sm);
    width: 100%; text-align: left; transition: background .15s;
  }
  .ref-item:active { background: rgba(255,255,255,.06); }
  .ref-emoji { font-size: 22px; width: 28px; text-align: center; }
  .ref-word { flex: 1; font-size: 15px; word-break: break-word; }

  .empty-note { color: var(--muted); font-size: 14px; }

  /* ==== pick ==== */
  .pick-list { display: flex; flex-direction: column; gap: 8px; }
  .pick-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 12px 14px;
  }
  .pick-row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; flex: none;
    border: 2px solid var(--border); border-radius: 7px;
    background: transparent; position: relative;
    transition: background .15s, border-color .15s;
  }
  .pick-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .pick-row input[type="checkbox"]:checked::after {
    content: ''; position: absolute; left: 6px; top: 2px;
    width: 6px; height: 11px;
    border: solid #06111f; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .pick-name {
    flex: 1; text-align: left; font-size: 16px; padding: 4px 0;
    overflow: hidden; text-overflow: ellipsis;
    border-bottom: 1px dashed transparent;
  }
  .pick-name:active { border-bottom-color: var(--muted); }
  .pick-name-input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--accent);
    border-radius: 10px; padding: 8px 10px; outline: none; min-width: 0;
  }
  .pick-emoji {
    width: 42px; height: 42px; flex: none; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 20px; display: flex; align-items: center; justify-content: center;
  }

  /* ==== timeline ==== */
  .tl { display: flex; flex-direction: column; }
  .tl-item {
    position: relative; padding: 0 0 20px 24px;
    border-left: 1px solid var(--border); margin-left: 6px;
  }
  .tl-item:last-child { border-left-color: transparent; padding-bottom: 4px; }
  .tl-dot {
    position: absolute; left: -5px; top: 5px;
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  }
  .tl-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .tl-reason {
    display: inline-block; font-size: 11px; color: var(--accent);
    background: rgba(111,168,255,.12); border-radius: 6px;
    padding: 2px 7px; margin-bottom: 6px;
  }
  .tl-body { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  /* ==== diary (лента по дням) ==== */
  .diary-intro {
    font-size: 13px; color: var(--muted); text-align: center;
    padding: 4px 0 20px; line-height: 1.5;
  }
  .diary { display: flex; flex-direction: column; gap: 20px; }
  .memory {
    position: relative;
    background: radial-gradient(circle at 28% 18%, #1e2536, #111219 78%);
    border: 1px solid rgba(111,168,255,.18);
    border-radius: 26px; padding: 16px 16px 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
    animation: bubbleFloat 7s ease-in-out infinite;
  }
  .memory:nth-child(2n) { animation-delay: -2s; }
  .memory:nth-child(3n) { animation-delay: -4s; }

  .memory-date {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); opacity: .85;
    margin-bottom: 12px; padding-left: 2px;
  }
  .memory-rows { display: flex; flex-direction: column; gap: 6px; }
  .memory-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 14px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.04);
    text-align: left; width: 100%;
    transition: transform .18s, background .18s, border-color .18s;
  }
  .memory-row:active {
    background: rgba(111,168,255,.16);
    border-color: rgba(111,168,255,.4);
  }
  .memory-row.falling {
    transform: scale(1.08);
    background: rgba(111,168,255,.28);
    border-color: var(--accent);
  }
  .memory-emoji-sm { font-size: 26px; line-height: 1; flex: none; }
  .memory-eq { color: var(--muted); font-size: 15px; flex: none; }
  .memory-word { flex: 1; font-size: 15px; line-height: 1.3; word-break: break-word; }
  .memory-arrow { color: var(--muted); font-size: 13px; flex: none; opacity: .6; }

  /* ==== bottom sheet ==== */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.62);
    opacity: 0; transition: opacity .25s;
  }
  .backdrop.show { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface-2);
    border-radius: 24px 24px 0 0;
    padding: 8px var(--pad) calc(var(--safe-bottom) + 20px);
    transform: translateY(102%);
    transition: transform .28s cubic-bezier(.22, 1, .36, 1);
    max-height: 88vh;
    display: flex; flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0,0,0,.55);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    flex: none; width: 40px; height: 4px; border-radius: 2px;
    background: #35354a; margin: 6px auto 14px;
  }
  .sheet-body { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .sheet-title { font-size: 16px; font-weight: 600; margin: 0 0 14px; }

  .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .emoji-cell {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 23px; border-radius: 10px; transition: background .15s;
  }
  .emoji-cell:active { background: rgba(255,255,255,.1); }
  .emoji-cell.sel { background: rgba(111,168,255,.24); }

  .form-row { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px;
  }
  .text-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 12px 14px; outline: none;
    resize: none; transition: border-color .15s;
  }
  .text-input:focus { border-color: var(--accent); }
  .emoji-select {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 30px; display: flex; align-items: center; justify-content: center;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px);
    transform: translate(-50%, 20px); z-index: 500;
    background: #22222f; border: 1px solid var(--border);
    padding: 11px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .22s, transform .22s;
    pointer-events: none; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

  /* =========================================================
     УТИЛИТЫ
     ========================================================= */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function uid() {
    return 'b_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  }
  function nowIso() { return new Date().toISOString(); }

  function normalize(text) {
    return String(text == null ? '' : text)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    const pad = (n) => String(n).padStart(2, '0');
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function formatDayLong(isoDate) {
    const parts = String(isoDate || '').split('-');
    if (parts.length !== 3) return String(isoDate || '');
    const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if (!y || !m || !d) return isoDate;
    return d + ' ' + (MONTHS[m - 1] || '') + ' ' + y;
  }

  /* =========================================================
     ХРАНИЛИЩЕ
     ========================================================= */
  const Store = (function () {
    let state = null;
    let storageOk = true;

    function emptyState() { return { beliefs: [], links: [], versions: [], events: [] }; }

    function read() {
      try { return window.localStorage.getItem(STORAGE_KEY); }
      catch (e) { storageOk = false; return null; }
    }
    function write(value) {
      try { window.localStorage.setItem(STORAGE_KEY, value); }
      catch (e) { storageOk = false; }
    }
    function load() {
      const raw = read();
      if (!raw) { state = emptyState(); return; }
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      if (!parsed || typeof parsed !== 'object') { state = emptyState(); return; }
      state = {
        beliefs: Array.isArray(parsed.beliefs) ? parsed.beliefs : [],
        links: Array.isArray(parsed.links) ? parsed.links : [],
        versions: Array.isArray(parsed.versions) ? parsed.versions : [],
        events: Array.isArray(parsed.events) ? parsed.events : []
      };
    }
    function save() { write(JSON.stringify(state)); }
    function get() { return state; }
    function isOk() { return storageOk; }

    return { load: load, save: save, get: get, isOk: isOk };
  })();

  /* =========================================================
     ЛОГИКА ДАННЫХ
     ========================================================= */
  function getBelief(id) {
    const list = Store.get().beliefs;
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function findBeliefByKey(key) {
    const list = Store.get().beliefs;
    for (let i = 0; i < list.length; i++) {
      if (list[i].status === 'archived') continue;
      if (normalize(list[i].word) === key) return list[i];
    }
    return null;
  }
  function findSelf() {
    const list = Store.get().beliefs;
    for (let i = 0; i < list.length; i++) {
      if (list[i].status !== 'archived' && normalize(list[i].word) === SELF_KEY) return list[i];
    }
    return null;
  }
  function buildIndex() {
    const map = new Map();
    Store.get().beliefs.forEach(function (b) {
      if (b.status === 'archived') return;
      const key = normalize(b.word);
      if (key && !map.has(key)) map.set(key, b);
    });
    return map;
  }
  function addVersion(beliefId, definition, reason) {
    const versions = Store.get().versions;
    let count = 0;
    for (let i = 0; i < versions.length; i++) if (versions[i].belief_id === beliefId) count++;
    versions.push({
      belief_id: beliefId, number: count + 1,
      definition: definition || '', date: nowIso(), reason: reason || ''
    });
  }
  function addEvent(ev) {
    const event = Object.assign({ date: nowIso() }, ev);
    Store.get().events.push(event);
  }
  function linkBeliefs(parentId, childId) {
    if (!parentId || !childId || parentId === childId) return;
    const parent = getBelief(parentId);
    const child = getBelief(childId);
    if (!parent || !child) return;
    if (parent.children.indexOf(childId) === -1) parent.children.push(childId);
    if (child.parents.indexOf(parentId) === -1) child.parents.push(parentId);
    const links = Store.get().links;
    let exists = false;
    for (let i = 0; i < links.length; i++) {
      const l = links[i];
      if (l.from === parentId && l.to === childId && l.type === LINK_TYPE) { exists = true; break; }
    }
    if (!exists) links.push({ from: parentId, to: childId, type: LINK_TYPE, weight: LINK_WEIGHT });
    addEvent({ type: 'linked', from: parentId, to: childId });
    Store.save();
  }
  function createBelief(opts) {
    const word = String(opts.word || '').trim();
    const key = normalize(word);
    if (!key) return { belief: null, created: false };

    const existing = findBeliefByKey(key);
    if (existing) {
      if (opts.parentId) linkBeliefs(opts.parentId, existing.id);
      return { belief: existing, created: false };
    }

    const emoji = opts.emoji || null;
    const belief = {
      id: uid(), emoji: emoji, word: word,
      definition: opts.definition || '',
      children: [], parents: [],
      status: emoji ? 'active' : 'draft',
      created: nowIso()
    };
    Store.get().beliefs.push(belief);
    addVersion(belief.id, belief.definition, 'создание');
    addEvent({ type: 'created', belief_id: belief.id, word: belief.word, emoji: belief.emoji });
    if (opts.parentId) linkBeliefs(opts.parentId, belief.id);
    if (word.indexOf(' ') !== -1 || word.indexOf('\t') !== -1) decomposePhrase(belief.id);
    Store.save();
    return { belief: belief, created: true };
  }
  function decomposePhrase(beliefId) {
    const belief = getBelief(beliefId);
    if (!belief) return;
    const parts = belief.word.split(/\s+/).filter(Boolean);
    if (parts.length < 2) return;
    const seen = new Set();
    parts.forEach(function (part) {
      const key = normalize(part);
      if (!key || seen.has(key)) return;
      seen.add(key);
      const existing = findBeliefByKey(key);
      if (existing) {
        if (existing.id !== belief.id) linkBeliefs(belief.id, existing.id);
        return;
      }
      const child = {
        id: uid(), emoji: null, word: part, definition: '',
        children: [], parents: [], status: 'draft', created: nowIso()
      };
      Store.get().beliefs.push(child);
      addVersion(child.id, '', 'создание');
      addEvent({ type: 'created', belief_id: child.id, word: child.word, emoji: null });
      linkBeliefs(belief.id, child.id);
    });
  }
  function ensureDefinitionChildren(beliefId) {
    const belief = getBelief(beliefId);
    if (!belief || !belief.definition) return;
    const tokens = tokenize(belief.definition, buildIndex());
    const newWords = collectNewWords(tokens);
    if (!newWords.length) return;
    newWords.forEach(function (w) {
      const key = w.normalized;
      if (!key) return;
      const existing = findBeliefByKey(key);
      if (existing) {
        if (existing.id !== belief.id) linkBeliefs(belief.id, existing.id);
        return;
      }
      const child = {
        id: uid(), emoji: null, word: w.text, definition: '',
        children: [], parents: [], status: 'draft', created: nowIso()
      };
      Store.get().beliefs.push(child);
      addVersion(child.id, '', 'создание');
      addEvent({ type: 'created', belief_id: child.id, word: child.word, emoji: null });
      linkBeliefs(belief.id, child.id);
    });
  }
  function updateDefinition(beliefId, definition, reason) {
    const belief = getBelief(beliefId);
    if (!belief) return;
    if (belief.definition === definition) return;
    belief.definition = definition || '';
    addVersion(beliefId, belief.definition, reason || 'правка');
    addEvent({ type: 'edited', belief_id: beliefId });
    Store.save();
  }

  /* =========================================================
     ТОКЕНИЗАЦИЯ
     ========================================================= */
  function classifyChar(ch) {
    if (/[\p{L}\p{N}]/u.test(ch)) return 'word';
    if (/\s/.test(ch)) return 'space';
    return 'punct';
  }
  function splitPieces(text) {
    const pieces = [];
    let buf = '';
    let mode = null;
    const src = String(text == null ? '' : text);
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      const m = classifyChar(ch);
      if (mode === null) { mode = m; buf = ch; }
      else if (m === mode) { buf += ch; }
      else { pieces.push({ text: buf, kind: mode }); buf = ch; mode = m; }
    }
    if (buf) pieces.push({ text: buf, kind: mode });
    return pieces;
  }
  function spaceOnlyBetween(pieces, a, b) {
    for (let k = a + 1; k < b; k++) if (pieces[k].kind !== 'space') return false;
    return true;
  }
  function tokenize(text, index) {
    const pieces = splitPieces(text);
    const wordPieces = [];
    pieces.forEach(function (p, i) { if (p.kind === 'word') wordPieces.push(i); });
    const assignments = new Array(wordPieces.length).fill(null);
    let wi = 0;
    while (wi < wordPieces.length) {
      let handled = false;
      for (let n = MAX_NGRAM; n >= 1; n--) {
        if (wi + n > wordPieces.length) continue;
        const startPiece = wordPieces[wi];
        const endPiece = wordPieces[wi + n - 1];
        if (n > 1 && !spaceOnlyBetween(pieces, startPiece, endPiece)) continue;
        const words = [];
        for (let k = 0; k < n; k++) words.push(normalize(pieces[wordPieces[wi + k]].text));
        const phrase = words.join(' ');
        if (!phrase) continue;
        const belief = index.get(phrase);
        if (belief) {
          for (let k = 0; k < n; k++) {
            assignments[wi + k] = {
              group: k === 0, size: n, kind: 'existing', beliefId: belief.id
            };
          }
          wi += n; handled = true; break;
        }
        if (n === 1) {
          const isStop = STOP_WORDS.has(phrase) || !/[\p{L}]/u.test(phrase);
          assignments[wi] = {
            group: true, size: 1, kind: isStop ? 'stop' : 'new', normalized: phrase
          };
          wi += 1; handled = true; break;
        }
      }
      if (!handled) {
        const w = normalize(pieces[wordPieces[wi]].text);
        assignments[wi] = { group: true, size: 1, kind: 'new', normalized: w };
        wi += 1;
      }
    }
    return buildTokens(pieces, wordPieces, assignments);
  }
  function buildTokens(pieces, wordPieces, assignments) {
    const tokens = [];
    let cursor = 0;
    for (let pi = 0; pi < pieces.length; pi++) {
      const piece = pieces[pi];
      if (piece.kind !== 'word') {
        tokens.push({ type: 'raw', text: piece.text });
        continue;
      }
      const a = assignments[cursor];
      if (!a || !a.group) { cursor += 1; continue; }
      const lastPiece = wordPieces[cursor + a.size - 1];
      let text = '';
      for (let k = pi; k <= lastPiece; k++) text += pieces[k].text;
      tokens.push({ type: a.kind, text: text, beliefId: a.beliefId, normalized: a.normalized });
      pi = lastPiece;
      cursor += a.size;
    }
    return tokens;
  }
  function collectNewWords(tokens) {
    const seen = new Map();
    tokens.forEach(function (t) {
      if (t.type !== 'new') return;
      if (!seen.has(t.normalized)) seen.set(t.normalized, t.text);
    });
    const result = [];
    seen.forEach(function (text, key) { result.push({ normalized: key, text: text }); });
    return result;
  }

  /* =========================================================
     UI: ТОКЕНЫ, TOAST, BOTTOM SHEET
     ========================================================= */
  function renderTokens(container, tokens, opts) {
    container.textContent = '';
    container.classList.remove('empty');
    if (!tokens.length) { container.classList.add('empty'); return; }
    tokens.forEach(function (t) {
      if (t.type === 'raw') {
        container.appendChild(document.createTextNode(t.text));
        return;
      }
      const span = el('span', 'tok tok-' + t.type, t.text);
      if (t.type === 'existing' && t.beliefId) {
        span.addEventListener('click', function () { go('belief', { id: t.beliefId }); });
      } else if (t.type === 'new') {
        span.addEventListener('click', function () {
          openCreateModal({ word: t.text, parentId: opts && opts.parentId });
        });
      }
      container.appendChild(span);
    });
  }

  let toastEl = null, toastTimer = null;
  function toast(message) {
    if (!toastEl) {
      toastEl = el('div', 'toast');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = message;
    requestAnimationFrame(function () { toastEl.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, TOAST_MS);
  }

  let sheetZ = 200;
  function openSheet(content) {
    const z = sheetZ; sheetZ += 2;
    const backdrop = el('div', 'backdrop'); backdrop.style.zIndex = String(z);
    const sheet = el('div', 'sheet'); sheet.style.zIndex = String(z + 1);
    sheet.appendChild(el('div', 'sheet-handle'));
    const body = el('div', 'sheet-body'); body.appendChild(content);
    sheet.appendChild(body);
    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);
    requestAnimationFrame(function () {
      backdrop.classList.add('show'); sheet.classList.add('show');
    });
    let closed = false;
    function close() {
      if (closed) return; closed = true;
      backdrop.classList.remove('show'); sheet.classList.remove('show');
      setTimeout(function () { backdrop.remove(); sheet.remove(); }, SHEET_ANIM_MS);
    }
    backdrop.addEventListener('click', close);
    return { close: close };
  }

  function openEmojiPicker(current, onPick) {
    const wrap = el('div');
    wrap.appendChild(el('div', 'sheet-title', 'Выбери смайлик'));
    const grid = el('div', 'emoji-grid');
    EMOJIS.forEach(function (e) {
      const cell = el('button', 'emoji-cell' + (e === current ? ' sel' : ''), e);
      cell.addEventListener('click', function () { onPick(e); sheet.close(); });
      grid.appendChild(cell);
    });
    wrap.appendChild(grid);
    const sheet = openSheet(wrap);
  }

  function openCreateModal(opts) {
    const options = opts || {};
    let emoji = options.emoji || null;
    const parentId = options.parentId || null;

    const form = el('div');
    form.appendChild(el('div', 'sheet-title', 'Новое воспоминание'));

    const emojiRow = el('div', 'form-row');
    emojiRow.appendChild(el('label', 'form-label', 'Смайлик'));
    const emojiBtn = el('button', 'emoji-select', emoji || '＋');
    emojiBtn.addEventListener('click', function () {
      openEmojiPicker(emoji, function (picked) { emoji = picked; emojiBtn.textContent = picked; });
    });
    emojiRow.appendChild(emojiBtn);
    form.appendChild(emojiRow);

    const wordRow = el('div', 'form-row');
    wordRow.appendChild(el('label', 'form-label', 'Название'));
    const wordInput = document.createElement('input');
    wordInput.className = 'text-input';
    wordInput.type = 'text';
    wordInput.value = options.word || '';
    wordInput.placeholder = 'слово или словосочетание';
    wordRow.appendChild(wordInput);
    form.appendChild(wordRow);

    const defRow = el('div', 'form-row');
    defRow.appendChild(el('label', 'form-label', 'Что это значит'));
    const defInput = document.createElement('textarea');
    defInput.className = 'text-input';
    defInput.rows = 3;
    defInput.value = options.definition || '';
    defInput.placeholder = 'необязательно';
    defRow.appendChild(defInput);
    form.appendChild(defRow);

    const btnRow = el('div', 'btn-row');
    const cancelBtn = el('button', 'btn btn-ghost', 'Отмена');
    const addBtn = el('button', 'btn btn-primary', 'Добавить');
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(addBtn);
    form.appendChild(btnRow);

    const sheet = openSheet(form);

    cancelBtn.addEventListener('click', function () { sheet.close(); });
    addBtn.addEventListener('click', function () {
      const word = wordInput.value.trim();
      if (!word) { toast('Введите название'); return; }
      const result = createBelief({
        emoji: emoji, word: word, definition: defInput.value, parentId: parentId
      });
      if (result.belief && defInput.value.trim()) ensureDefinitionChildren(result.belief.id);
      sheet.close();
      if (!result.created) toast('Уже есть в мире');
      render();
    });

    setTimeout(function () { wordInput.focus(); }, 320);
  }

  /* =========================================================
     НАВИГАЦИЯ
     ========================================================= */
  let navStack = [];
  function go(name, params) {
    navStack.push({ name: name, params: params || {} });
    render();
  }
  function back() {
    if (navStack.length > 1) { navStack.pop(); render(); }
  }
  function reset(name, params) {
    navStack = [{ name: name, params: params || {} }];
    render();
  }

  function render() {
    const app = document.getElementById('app');
    const current = navStack[navStack.length - 1] || { name: 'hub', params: {} };
    app.textContent = '';
    let screen = null;
    switch (current.name) {
      case 'who':      screen = screenWho(); break;
      case 'describe': screen = screenDescribe(); break;
      case 'pick':     screen = screenPick(); break;
      case 'hub':      screen = screenHub(); break;
      case 'memory':   screen = screenMemory(current.params); break;
      case 'belief':   screen = screenBelief(current.params); break;
      case 'edit':     screen = screenEdit(current.params); break;
      case 'history':  screen = screenHistory(current.params); break;
      case 'events':   screen = screenEvents(); break;
      case 'diary':    screen = screenDiary(); break;
      default: screen = screenHub();
    }
    if (screen) app.appendChild(screen);
  }

  function makeHeader(title, withBack) {
    const hdr = el('div', 'hdr');
    if (withBack) {
      const backBtn = el('button', 'icon-btn', '←');
      backBtn.setAttribute('aria-label', 'Назад');
      backBtn.addEventListener('click', back);
      hdr.appendChild(backBtn);
    } else {
      hdr.appendChild(el('div', 'icon-btn'));
    }
    hdr.appendChild(el('div', 'hdr-title', title || ''));
    hdr.appendChild(el('div', 'icon-btn'));
    return hdr;
  }

  function screenWho() {

    describeDraft = '';

  /* =========================================================
     ЭКРАН 2: ОПИШИ СЕБЯ
     ========================================================= */
  let describeDraft = '';

  function screenDescribe() {
    const self = findSelf();
    const wrap = el('div', 'screen');
    wrap.appendChild(makeHeader('Опиши себя', false));

    const body = el('div', 'body');
    const ta = document.createElement('textarea');
    ta.className = 'big-input';
    ta.placeholder = 'Например: я успешный мужчина, зарабатываю деньги…';
    ta.value = describeDraft;
    body.appendChild(ta);

    body.appendChild(el('div', 'field-label', 'Предпросмотр'));
    const preview = el('div', 'preview');
    body.appendChild(preview);

    body.appendChild(el('div', 'field-label', 'Новые слова'));
    const chips = el('div', 'chips');
    body.appendChild(chips);

    wrap.appendChild(body);

    const footer = el('div', 'footer');
    const nextBtn = el('button', 'btn btn-primary', 'Дальше');
    nextBtn.addEventListener('click', function () {
      if (self) updateDefinition(self.id, describeDraft, 'описание себя');
      pickState = null;
      go('pick');
    });
    footer.appendChild(nextBtn);
    wrap.appendChild(footer);

    function refresh() {
      const tokens = tokenize(describeDraft, buildIndex());
      renderTokens(preview, tokens, { parentId: self ? self.id : null });
      renderChips(chips, collectNewWords(tokens), self ? self.id : null);
    }
    ta.addEventListener('input', function () { describeDraft = ta.value; refresh(); });
    refresh();
    return wrap;
  }

  function renderChips(container, words, parentId) {
    container.textContent = '';
    if (!words.length) {
      container.appendChild(el('span', 'empty-note', 'Пока нет новых слов'));
      return;
    }
    words.forEach(function (w) {
      const chip = el('button', 'chip', w.text);
      chip.addEventListener('click', function () {
        openCreateModal({ word: w.text, parentId: parentId });
      });
      container.appendChild(chip);
    });
  }

  /* =========================================================
     ЭКРАН 3: ЧТО ВЗЯТЬ В СВОЙ МИР?
     ========================================================= */
  let pickState = null;

  function screenPick() {
    const self = findSelf();
    if (!self) { reset('who'); return el('div'); }

    const tokens = tokenize(self.definition, buildIndex());
    const newWords = collectNewWords(tokens);

    if (!pickState) pickState = {};
    newWords.forEach(function (w) {
      if (!pickState[w.normalized]) {
        pickState[w.normalized] = { checked: true, name: w.text, emoji: null };
      }
    });

    const wrap = el('div', 'screen');
    wrap.appendChild(makeHeader('Что взять в свой мир?', true));

    const body = el('div', 'body');
    const list = el('div', 'pick-list');
    const keys = Object.keys(pickState);

    if (!keys.length) {
      list.appendChild(el('div', 'empty-note', 'Новых слов не найдено. Добавить воспоминания можно позже.'));
    } else {
      keys.forEach(function (key) { list.appendChild(buildPickRow(key)); });
    }
    body.appendChild(list);
    wrap.appendChild(body);

    const footer = el('div', 'footer');
    const doneBtn = el('button', 'btn btn-primary', 'Готово');
    doneBtn.addEventListener('click', function () { commitPick(self.id); });
    footer.appendChild(doneBtn);
    wrap.appendChild(footer);

    return wrap;
  }

  function buildPickRow(key) {
    const item = pickState[key];
    const row = el('div', 'pick-row');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = item.checked;
    cb.addEventListener('change', function () { item.checked = cb.checked; });
    row.appendChild(cb);

    const nameBtn = el('button', 'pick-name', item.name);
    nameBtn.addEventListener('click', function () { startRename(row, nameBtn, item); });
    row.appendChild(nameBtn);

    const emojiBtn = el('button', 'pick-emoji', item.emoji || '＋');
    emojiBtn.addEventListener('click', function () {
      openEmojiPicker(item.emoji, function (picked) {
        item.emoji = picked; emojiBtn.textContent = picked;
      });
    });
    row.appendChild(emojiBtn);
    return row;
  }

  function startRename(row, nameBtn, item) {
    const input = document.createElement('input');
    input.className = 'pick-name-input';
    input.type = 'text';
    input.value = item.name;
    row.replaceChild(input, nameBtn);
    input.focus(); input.select();
    let done = false;
    function commit() {
      if (done) return; done = true;
      const value = input.value.trim() || item.name;
      item.name = value;
      nameBtn.textContent = value;
      if (input.parentNode === row) row.replaceChild(nameBtn, input);
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
  }

  function commitPick(selfId) {
    Object.keys(pickState).forEach(function (key) {
      const item = pickState[key];
      if (!item || !item.checked) return;
      const word = String(item.name || '').trim();
      if (!word) return;
      createBelief({ emoji: item.emoji, word: word, definition: '', parentId: selfId });
    });
    pickState = null;
    reset('hub');
  }

  /* =========================================================
     ЭКРАН 4: РАБОЧИЙ СТОЛ
     ========================================================= */
  function screenHub() {
    const self = findSelf();
    const wrap = el('div', 'screen');

    const hdr = el('div', 'hdr');
    hdr.appendChild(el('div', 'hdr-title left', 'Рабочий стол'));

    const diaryBtn = el('button', 'icon-btn', '📖');
    diaryBtn.setAttribute('aria-label', 'Дневник');
    diaryBtn.addEventListener('click', function () { go('diary'); });
    hdr.appendChild(diaryBtn);

    const exportBtn = el('button', 'icon-btn', '📤');
    exportBtn.setAttribute('aria-label', 'Экспорт JSON');
    exportBtn.addEventListener('click', exportJson);
    hdr.appendChild(exportBtn);
    wrap.appendChild(hdr);

    const body = el('div', 'body');

    if (!self) {
      body.appendChild(el('div', 'empty-note', 'Нет главного убеждения. Начни с начала.'));
      wrap.appendChild(body);
      return wrap;
    }

    // Текущее убеждение (крупно сверху)
    const current = el('div', 'desk-current');
    current.appendChild(el('div', 'desk-sphere', self.emoji || '🙂'));
    current.appendChild(el('div', 'desk-word', self.word || 'Я'));
    current.addEventListener('click', function () { go('belief', { id: self.id }); });
    body.appendChild(current);

    // Пузырьки
    body.appendChild(el('div', 'desk-hint', 'Твои воспоминания'));
    const desktop = el('div', 'desktop');
    const children = self.children.map(getBelief).filter(Boolean);
    children.forEach(function (child) { desktop.appendChild(buildBubble(child)); });
    desktop.appendChild(buildAddBubble(self.id));
    body.appendChild(desktop);

    wrap.appendChild(body);
    return wrap;
  }

  function buildBubble(belief) {
    const b = el('button', 'bubble' + (belief.emoji ? '' : ' bubble-draft'));
    b.textContent = belief.emoji || '◌';
    b.addEventListener('click', function () {
      go('memory', { id: belief.id, fall: true });
    });
    return b;
  }

  function buildAddBubble(parentId) {
    const b = el('button', 'bubble bubble-add');
    b.textContent = '＋';
    b.addEventListener('click', function () {
      openCreateModal({ parentId: parentId });
    });
    return b;
  }

  function exportJson() {
    try {
      const data = JSON.stringify(Store.get(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tvoi_ubezhdeniya.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Файл сохранён');
    } catch (e) { toast('Не удалось выгрузить'); }
  }

  /* =========================================================
     ЭКРАН: ВОСПОМИНАНИЕ (2 смайлика)
     ========================================================= */
  function screenMemory(params) {
    const belief = getBelief(params.id);
    if (!belief) { reset('hub'); return el('div'); }

    const wrap = el('div', 'screen' + (params.fall ? ' fall' : ''));
    wrap.appendChild(makeHeader('Воспоминание', true));

    const body = el('div', 'body');

    // Найдём «партнёра» — ребёнка, иначе родителя
    let partner = null;
    if (belief.children.length) partner = getBelief(belief.children[0]);
    else if (belief.parents.length) partner = getBelief(belief.parents[0]);

    const pair = el('div', 'memory-pair');
    pair.appendChild(buildMemoryCell(belief));
    if (partner) pair.appendChild(buildMemoryCell(partner));
    body.appendChild(pair);

    if (!partner) {
      body.appendChild(el('div', 'memory-note',
        'У этого воспоминания пока одна сторона. Добавь вторую — открой карточку и опиши, из чего оно состоит.'));
    } else {
      body.appendChild(el('div', 'memory-note',
        'Нажми на любой смайлик — увидишь, что он значит.'));
    }

    wrap.appendChild(body);
    return wrap;
  }

  function buildMemoryCell(belief) {
    const cell = el('button', 'memory-cell');
    cell.appendChild(el('div', 'memory-emoji', belief.emoji || '◌'));
    cell.appendChild(el('div', 'memory-caption' + (belief.word ? '' : ' empty'),
      belief.word || 'без названия'));
    cell.addEventListener('click', function () {
      go('belief', { id: belief.id, fall: true });
    });
    return cell;
  }

  /* =========================================================
     ЭКРАН 5: КАРТОЧКА УБЕЖДЕНИЯ
     ========================================================= */
  function screenBelief(params) {
    const belief = getBelief(params.id);
    if (!belief) { reset('hub'); return el('div'); }

    const wrap = el('div', 'screen' + (params.fall ? ' fall' : ''));
    wrap.appendChild(makeHeader('Воспоминание', true));

    const body = el('div', 'body');
    body.appendChild(el('div', 'card-emoji', belief.emoji || '◌'));
    body.appendChild(el('div', 'card-word', belief.word));

    body.appendChild(buildDefinitionBlock(belief));
    body.appendChild(buildRefBlock(
      'Из чего состоит',
      belief.children.map(getBelief).filter(Boolean),
      'Пока пусто'
    ));
    body.appendChild(buildRefBlock(
      'Куда входит',
      belief.parents.map(getBelief).filter(Boolean),
      'Пока никуда'
    ));

    wrap.appendChild(body);

    const footer = el('div', 'footer');
    const row = el('div', 'btn-row');

    const editBtn = el('button', 'btn btn-primary', 'Править');
    editBtn.addEventListener('click', function () {
      editId = null;
      go('edit', { id: belief.id });
    });
    row.appendChild(editBtn);

    const histBtn = el('button', 'btn btn-ghost', 'История');
    histBtn.addEventListener('click', function () {
      go('history', { id: belief.id });
    });
    row.appendChild(histBtn);

    footer.appendChild(row);
    wrap.appendChild(footer);
    return wrap;
  }

  function buildDefinitionBlock(belief) {
    const block = el('div', 'block');
    block.appendChild(el('div', 'block-title', 'Что это значит'));
    const text = el('div', 'block-text');
    if (belief.definition) {
      renderTokens(text, tokenize(belief.definition, buildIndex()), { parentId: belief.id });
    } else {
      text.classList.add('empty');
    }
    block.appendChild(text);
    return block;
  }

  function buildRefBlock(title, items, emptyText) {
    const block = el('div', 'block');
    block.appendChild(el('div', 'block-title', title));
    if (!items.length) {
      block.appendChild(el('div', 'empty-note', emptyText));
      return block;
    }
    const list = el('div', 'ref-list');
    items.forEach(function (item) {
      const btn = el('button', 'ref-item');
      btn.appendChild(el('span', 'ref-emoji', item.emoji || '◌'));
      btn.appendChild(el('span', 'ref-word', item.word));
      btn.addEventListener('click', function () { go('belief', { id: item.id, fall: true }); });
      list.appendChild(btn);
    });
    block.appendChild(list);
    return block;
  }

  /* =========================================================
     ЭКРАН 6: ПРАВКА
     ========================================================= */
  let editId = null;
  let editDraft = '';
  let editEmoji = null;

  function screenEdit(params) {
    const belief = getBelief(params.id);
    if (!belief) { reset('hub'); return el('div'); }

    if (editId !== belief.id) {
      editId = belief.id;
      editDraft = belief.definition || '';
      editEmoji = belief.emoji;
    }

    const wrap = el('div', 'screen');
    wrap.appendChild(makeHeader('Правка', true));

    const body = el('div', 'body');

    const emojiRow = el('div', 'form-row');
    emojiRow.appendChild(el('div', 'form-label', 'Смайлик'));
    const emojiBtn = el('button', 'emoji-select', editEmoji || '＋');
    emojiBtn.addEventListener('click', function () {
      openEmojiPicker(editEmoji, function (picked) {
        editEmoji = picked; emojiBtn.textContent = picked;
      });
    });
    emojiRow.appendChild(emojiBtn);
    body.appendChild(emojiRow);

    body.appendChild(el('div', 'form-label', 'Что это значит'));
    const ta = document.createElement('textarea');
    ta.className = 'big-input';
    ta.placeholder = 'Опиши словами, что это для тебя…';
    ta.value = editDraft;
    body.appendChild(ta);

    body.appendChild(el('div', 'field-label', 'Предпросмотр'));
    const preview = el('div', 'preview');
    body.appendChild(preview);

    function refresh() {
      renderTokens(preview, tokenize(editDraft, buildIndex()), { parentId: belief.id });
    }
    ta.addEventListener('input', function () { editDraft = ta.value; refresh(); });
    refresh();

    wrap.appendChild(body);

    const footer = el('div', 'footer');
    const saveBtn = el('button', 'btn btn-primary', 'Сохранить');
    saveBtn.addEventListener('click', function () { saveEdit(belief.id); });
    footer.appendChild(saveBtn);
    wrap.appendChild(footer);

    return wrap;
  }

  function saveEdit(beliefId) {
    const belief = getBelief(beliefId);
    if (!belief) { back(); return; }

    if (belief.emoji !== editEmoji) {
      belief.emoji = editEmoji;
      if (editEmoji && belief.status === 'draft') belief.status = 'active';
      addEvent({ type: 'edited', belief_id: belief.id });
    }

    if (belief.definition !== editDraft) {
      belief.definition = editDraft || '';
      addVersion(belief.id, belief.definition, 'правка');
      addEvent({ type: 'edited', belief_id: belief.id });
    }

    Store.save();
    ensureDefinitionChildren(beliefId);

    editId = null;
    back();
  }

  /* =========================================================
     ЭКРАН 7: ИСТОРИЯ
     ========================================================= */
  function screenHistory(params) {
    const wrap = el('div', 'screen');
    wrap.appendChild(makeHeader('История', true));

    const body = el('div', 'body');
    const versions = Store.get().versions
      .filter(function (v) { return v.belief_id === params.id; })
      .sort(function (a, b) { return b.number - a.number; });

    if (!versions.length) {
      body.appendChild(el('div', 'empty-note', 'Версий пока нет'));
    } else {
      const tl = el('div', 'tl');
      versions.forEach(function (v) {
        const item = el('div', 'tl-item');
        item.appendChild(el('div', 'tl-dot'));
        item.appendChild(el('div', 'tl-date', formatDate(v.date)));
        if (v.reason) item.appendChild(el('div', 'tl-reason', v.reason));
        item.appendChild(el('div', 'tl-body', v.definition || '— пусто —'));
        tl.appendChild(item);
      });
      body.appendChild(tl);
    }

    wrap.appendChild(body);
    return wrap;
  }

  /* =========================================================
     ЭКРАН 8: ЛЕНТА СОБЫТИЙ
     ========================================================= */
  function screenEvents() {
    const wrap = el('div', 'screen');
    wrap.appendChild(makeHeader('Лента событий', true));

    const body = el('div', 'body');
    const events = Store.get().events.slice().reverse();

    if (!events.length) {
      body.appendChild(el('div', 'empty-note', 'Событий пока нет'));
    } else {
      const tl = el('div', 'tl');
      events.forEach(function (ev) {
        const item = el('div', 'tl-item');
        item.appendChild(el('div', 'tl-dot'));
        item.appendChild(el('div', 'tl-date', formatDate(ev.date)));
        item.appendChild(el('div', 'tl-body', describeEvent(ev)));
        tl.appendChild(item);
      });
      body.appendChild(tl);
    }

    wrap.appendChild(body);
    return wrap;
  }

  function describeEvent(ev) {
    if (ev.type === 'created') {
      const e = ev.emoji ? ev.emoji + ' ' : '';
      return 'Создано: ' + e + (ev.word || '');
    }
    if (ev.type === 'edited') {
      const b = getBelief(ev.belief_id);
      return 'Изменено: ' + (b ? b.word : ev.belief_id);
    }
    if (ev.type === 'linked') {
      const p = getBelief(ev.from);
      const c = getBelief(ev.to);
      return 'Связь: «' + (c ? c.word : '?') + '» входит в «' + (p ? p.word : '?') + '»';
    }
    return ev.type;
  }

  /* =========================================================
     ЭКРАН: ДНЕВНИК (лента по дням)
     ========================================================= */
  function groupEventsByDay() {
    const events = Store.get().events;
    const map = new Map();
    events.forEach(function (ev) {
      const day = String(ev.date || '').slice(0, 10);
      if (!day) return;
      if (!map.has(day)) map.set(day, []);
      map.get(day).push(ev);
    });
    const days = [];
    map.forEach(function (list, day) { days.push({ day: day, events: list }); });
    days.sort(function (a, b) { return b.day.localeCompare(a.day); });
    return days;
  }

  function dayBeliefs(events) {
    const seen = new Set();
    const result = [];
    events.forEach(function (ev) {
      if (ev.type !== 'created' && ev.type !== 'edited') return;
      const id = ev.belief_id;
      if (!id || seen.has(id)) return;
      seen.add(id);
      const b = getBelief(id);
      if (b) result.push(b);
    });
    return result;
  }

  function screenDiary() {
    const wrap = el('div', 'screen');

    const hdr = el('div', 'hdr');
    const backBtn = el('button', 'icon-btn', '←');
    backBtn.setAttribute('aria-label', 'Назад');
    backBtn.addEventListener('click', back);
    hdr.appendChild(backBtn);
    hdr.appendChild(el('div', 'hdr-title', 'Дневник'));
    const rawBtn = el('button', 'icon-btn', '📜');
    rawBtn.setAttribute('aria-label', 'Все события');
    rawBtn.addEventListener('click', function () { go('events'); });
    hdr.appendChild(rawBtn);
    wrap.appendChild(hdr);

    const body = el('div', 'body');
    const days = groupEventsByDay();

    if (!days.length) {
      body.appendChild(el('div', 'diary-intro',
        'Здесь появятся пузыри-воспоминания по дням. Каждый день, когда ты создаёшь или меняешь воспоминание, оставляет след.'));
      body.appendChild(el('div', 'empty-note', 'Пока пусто.'));
      wrap.appendChild(body);
      return wrap;
    }

    body.appendChild(el('div', 'diary-intro',
      'Каждый пузырь — день твоих слов. Нажми на пару, чтобы провалиться.'));

    const diary = el('div', 'diary');
    days.forEach(function (d) { diary.appendChild(buildDayBubble(d)); });
    body.appendChild(diary);

    wrap.appendChild(body);
    return wrap;
  }

  function buildDayBubble(dayEntry) {
    const bubble = el('div', 'memory');
    bubble.appendChild(el('div', 'memory-date', formatDayLong(dayEntry.day)));

    const beliefs = dayBeliefs(dayEntry.events);
    const rows = el('div', 'memory-rows');

    if (!beliefs.length) {
      rows.appendChild(el('div', 'empty-note', 'только связи'));
    } else {
      beliefs.forEach(function (b) {
        const row = el('button', 'memory-row');
        row.appendChild(el('span', 'memory-emoji-sm', b.emoji || '◌'));
        row.appendChild(el('span', 'memory-eq', '='));
        row.appendChild(el('span', 'memory-word', b.word || '—'));
        row.appendChild(el('span', 'memory-arrow', '→'));
        row.addEventListener('click', function () {
          row.classList.add('falling');
          setTimeout(function () { go('memory', { id: b.id, fall: true }); }, FALL_DELAY);
        });
        rows.appendChild(row);
      });
    }

    bubble.appendChild(rows);
    return bubble;
  }

  /* =========================================================
     ИНИЦИАЛИЗАЦИЯ
     ========================================================= */
  function init() {
    Store.load();
    if (!Store.isOk()) toast('Хранилище недоступно — данные не сохранятся');
    const self = findSelf();
    if (!self) reset('who');
    else reset('hub');
  }

  init();
})();
</script>
</body>
</html>
