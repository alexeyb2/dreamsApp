<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Твои убеждения</title>
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #e8e8f0;
    --accent: #6fa8ff;
    --new: #ffb46f;
    --muted: #6b6b7b;
    --surface: #14141c;
    --surface-2: #1e1e2a;
    --border: #262633;
    --r: 18px;
    --r-sm: 12px;
    --pad: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.45;
    overscroll-behavior: none;
  }
  body { overflow: hidden; }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .screen {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    animation: fadeIn .22s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .hdr {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: calc(var(--safe-top) + 10px) var(--pad) 8px;
  }
  .hdr-title {
    flex: 1; font-size: 15px; font-weight: 600; opacity: .82;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-title.left { text-align: left; }

  .icon-btn {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.08); }

  .body {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 var(--pad) calc(var(--safe-bottom) + 24px);
  }
  .footer { flex: none; padding: 12px var(--pad) calc(var(--safe-bottom) + 16px); }

  /* ==== главный экран ==== */
  .main-title {
    font-size: 26px; font-weight: 700;
    letter-spacing: -.02em;
    padding: 6px 0 22px;
  }
  .main-title .colon { color: var(--accent); }

  .day {
    margin-bottom: 26px;
  }

  .day-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px;
    padding: 0 4px 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .day-date {
    font-size: 13px; color: var(--accent);
    letter-spacing: .1em; text-transform: uppercase;
    opacity: .9;
  }

  .day-emojis {
    font-size: 22px; letter-spacing: 2px;
    line-height: 1;
  }

  .rows { display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: left; width: 100%;
    transition: background .15s, border-color .15s;
  }
  .row:active { background: var(--surface-2); border-color: var(--accent); }

  .row-key {
    flex: none;
    font-size: 22px; line-height: 1.15;
    min-width: 32px;
    word-break: break-word;
  }

  .row-sep {
    flex: none;
    color: var(--muted);
    font-size: 15px; line-height: 1.4;
  }

  .row-val {
    flex: 1;
    font-size: 15px; line-height: 1.4;
    word-break: break-word;
    padding-top: 3px;
  }

  .row-val.empty { color: var(--muted); font-style: italic; }
  .row-val.tag { color: var(--new); }

  .row-tag-key { color: var(--new); }

  .empty-note {
    color: var(--muted); font-size: 14px;
    text-align: center; padding: 20px 12px; line-height: 1.5;
  }

  /* ==== bottom sheet ==== */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.62);
    opacity: 0; transition: opacity .25s;
  }
  .backdrop.show { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface-2);
    border-radius: 24px 24px 0 0;
    padding: 8px var(--pad) calc(var(--safe-bottom) + 20px);
    transform: translateY(102%);
    transition: transform .28s cubic-bezier(.22, 1, .36, 1);
    max-height: 92vh;
    display: flex; flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0,0,0,.55);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    flex: none; width: 40px; height: 4px; border-radius: 2px;
    background: #35354a; margin: 6px auto 14px;
  }
  .sheet-body { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .sheet-title { font-size: 17px; font-weight: 600; margin: 0 0 16px; }

  .form-row { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px;
  }

  .text-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 12px 14px; outline: none;
    resize: none; transition: border-color .15s;
  }
  .text-input:focus { border-color: var(--accent); }

  .emoji-input {
    font-size: 28px;
    padding: 14px 16px;
    letter-spacing: 4px;
    min-height: 62px;
  }

  .hint {
    font-size: 12px; color: var(--muted);
    margin-top: 6px; line-height: 1.4;
  }

  .pair-rows { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

  .pair {
    display: flex; align-items: center; gap: 10px;
  }

  .pair-emoji {
    flex: none;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px;
  }

  .pair-input {
    flex: 1;
    min-width: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px; outline: none;
    transition: border-color .15s;
  }
  .pair-input:focus { border-color: var(--accent); }

  .seg-toggle {
    display: flex; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .seg-btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    color: var(--muted);
    transition: background .15s, color .15s;
  }
  .seg-btn.on {
    background: var(--accent); color: #06111f;
  }

  .btn {
    display: flex; align-items: center; justify-content: center;
    padding: 15px 22px; border-radius: var(--r);
    font-size: 16px; font-weight: 600; width: 100%;
    transition: transform .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: #06111f; }
  .btn-ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .btn-danger { background: rgba(255,90,90,.12); color: #ff8f8f; border: 1px solid rgba(255,90,90,.28); }

  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  .space-12 { height: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px);
    transform: translate(-50%, 20px); z-index: 500;
    background: #22222f; border: 1px solid var(--border);
    padding: 11px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .22s, transform .22s;
    pointer-events: none; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(var(--safe-bottom) + 20px);
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent); color: #06111f;
    font-size: 30px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px rgba(111,168,255,.4);
    z-index: 50;
    transition: transform .12s;
  }
  .fab:active { transform: scale(.92); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  /* =========================================================
     КОНСТАНТЫ
     ========================================================= */
  const STORAGE_KEY = 'tvoi_ubezhdeniya_v4';
  const SHEET_ANIM_MS = 300;
  const TOAST_MS = 2200;

  const MONTHS = [
    'января','февраля','марта','апреля','мая','июня',
    'июля','августа','сентября','октября','ноября','декабря'
  ];

  /* =========================================================
     УТИЛИТЫ
     ========================================================= */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function uid() {
    return 'e_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  }
  function nowIso() { return new Date().toISOString(); }

  function dayKey(iso) { return String(iso || '').slice(0, 10); }

  function formatDayLong(isoDate) {
    const parts = String(isoDate || '').split('-');
    if (parts.length !== 3) return String(isoDate || '');
    const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if (!y || !m || !d) return isoDate;
    return d + ' ' + (MONTHS[m - 1] || '') + ' ' + y;
  }

  /**
   * Разбивает строку с эмодзи на отдельные графемы.
   * ❤️‍🔥 остаётся одним элементом, а не тремя.
   */
  function splitEmojis(str) {
    const s = String(str == null ? '' : str);
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter('ru', { granularity: 'grapheme' });
        const out = [];
        for (const piece of seg.segment(s)) {
          const g = piece.segment;
          if (g && g.trim()) out.push(g);
        }
        return out;
      } catch (e) { /* fallthrough */ }
    }
    // простой fallback — по code points
    const arr = Array.from(s);
    return arr.filter(function (c) { return c && c.trim(); });
  }

  /* =========================================================
     ХРАНИЛИЩЕ
     ========================================================= */
  const Store = (function () {
    let state = null;
    let storageOk = true;

    function emptyState() {
      return { beliefs: [], tags: [] };
    }

    function read() {
      try { return window.localStorage.getItem(STORAGE_KEY); }
      catch (e) { storageOk = false; return null; }
    }
    function write(value) {
      try { window.localStorage.setItem(STORAGE_KEY, value); }
      catch (e) { storageOk = false; }
    }

    function load() {
      const raw = read();
      if (!raw) { state = emptyState(); return; }
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      if (!parsed || typeof parsed !== 'object') { state = emptyState(); return; }
      state = {
        beliefs: Array.isArray(parsed.beliefs) ? parsed.beliefs : [],
        tags: Array.isArray(parsed.tags) ? parsed.tags : []
      };
    }

    function save() { write(JSON.stringify(state)); }
    function get() { return state; }
    function isOk() { return storageOk; }

    return { load: load, save: save, get: get, isOk: isOk };
  })();

  /* =========================================================
     ЛОГИКА ДАННЫХ
     ========================================================= */
  function createBelief(emojis, values) {
    const entry = {
      id: uid(),
      emojis: emojis.slice(),
      values: values.slice(),
      created: nowIso()
    };
    Store.get().beliefs.push(entry);
    Store.save();
    return entry;
  }

  function updateBelief(id, emojis, values) {
    const list = Store.get().beliefs;
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].emojis = emojis.slice();
        list[i].values = values.slice();
        Store.save();
        return list[i];
      }
    }
    return null;
  }

  function deleteBelief(id) {
    const list = Store.get().beliefs;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].id === id) { list.splice(i, 1); Store.save(); return true; }
    }
    return false;
  }

  function createTag(tag, description) {
    const entry = {
      id: uid(),
      tag: String(tag || '').trim(),
      description: String(description || '').trim(),
      created: nowIso()
    };
    Store.get().tags.push(entry);
    Store.save();
    return entry;
  }

  function updateTag(id, tag, description) {
    const list = Store.get().tags;
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].tag = String(tag || '').trim();
        list[i].description = String(description || '').trim();
        Store.save();
        return list[i];
      }
    }
    return null;
  }

  function deleteTag(id) {
    const list = Store.get().tags;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].id === id) { list.splice(i, 1); Store.save(); return true; }
    }
    return false;
  }

  /* =========================================================
     ГРУППИРОВКА ПО ДНЯМ
     ========================================================= */
  function groupByDay() {
    const s = Store.get();
    const map = new Map();

    function ensure(day) {
      if (!map.has(day)) {
        map.set(day, { day: day, beliefs: [], tags: [], emojis: [] });
      }
      return map.get(day);
    }

    s.beliefs.forEach(function (b) {
      const day = dayKey(b.created);
      if (!day) return;
      const g = ensure(day);
      g.beliefs.push(b);
      (b.emojis || []).forEach(function (e) { g.emojis.push(e); });
    });

    s.tags.forEach(function (t) {
      const day = dayKey(t.created);
      if (!day) return;
      const g = ensure(day);
      g.tags.push(t);
    });

    const arr = [];
    map.forEach(function (v) { arr.push(v); });
    arr.sort(function (a, b) { return b.day.localeCompare(a.day); });
    return arr;
  }

  /* =========================================================
     UI: TOAST / SHEET
     ========================================================= */
  let toastEl = null, toastTimer = null;
  function toast(message) {
    if (!toastEl) { toastEl = el('div', 'toast'); document.body.appendChild(toastEl); }
    toastEl.textContent = message;
    requestAnimationFrame(function () { toastEl.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, TOAST_MS);
  }

  let sheetZ = 200;
  function openSheet(content) {
    const z = sheetZ; sheetZ += 2;
    const backdrop = el('div', 'backdrop'); backdrop.style.zIndex = String(z);
    const sheet = el('div', 'sheet'); sheet.style.zIndex = String(z + 1);
    sheet.appendChild(el('div', 'sheet-handle'));
    const body = el('div', 'sheet-body'); body.appendChild(content);
    sheet.appendChild(body);
    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);
    requestAnimationFrame(function () {
      backdrop.classList.add('show'); sheet.classList.add('show');
    });
    let closed = false;
    function close() {
      if (closed) return; closed = true;
      backdrop.classList.remove('show'); sheet.classList.remove('show');
      setTimeout(function () { backdrop.remove(); sheet.remove(); }, SHEET_ANIM_MS);
    }
    backdrop.addEventListener('click', close);
    return { close: close };
  }

  /* =========================================================
     РЕДАКТОР: УБЕЖДЕНИЕ
     ========================================================= */
  function openBeliefEditor(existing) {
    const isEdit = !!existing;

    // Состояние формы
    let emojis = existing ? existing.emojis.slice() : [];
    let values = existing ? existing.values.slice() : [];

    const form = el('div');
    form.appendChild(el('div', 'sheet-title', isEdit ? 'Убеждение' : 'Новое убеждение'));

    // Поле эмодзи
    const emojiRow = el('div', 'form-row');
    emojiRow.appendChild(el('label', 'form-label', 'Смайлики'));
    const emojiInput = document.createElement('input');
    emojiInput.type = 'text';
    emojiInput.className = 'text-input emoji-input';
    emojiInput.placeholder = '🤲❤️‍🔥';
    emojiInput.autocomplete = 'off';
    emojiInput.spellcheck = false;
    emojiInput.value = (existing && existing.emojis ? existing.emojis.join('') : '');
    emojiRow.appendChild(emojiInput);
    const hint = el('div', 'hint', 'Набери или вставь смайлики со своей клавиатуры. Можно один или несколько подряд.');
    emojiRow.appendChild(hint);
    form.appendChild(emojiRow);

    // Динамические строки значений
    const valuesLabel = el('div', 'form-label', 'Что они значат');
    form.appendChild(valuesLabel);

    const pairRows = el('div', 'pair-rows');
    form.appendChild(pairRows);

    const pairInputs = []; // {emoji, input}

    function refreshPairs() {
      // Сохраним текущие значения, чтобы не потерять при перерисовке
      const saved = {};
      pairInputs.forEach(function (p) { saved[p.emoji] = p.input.value; });

      pairRows.textContent = '';
      pairInputs.length = 0;

      const seen = new Set();
      emojis.forEach(function (e) {
        if (seen.has(e)) return;
        seen.add(e);
        const row = el('div', 'pair');
        row.appendChild(el('div', 'pair-emoji', e));
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'pair-input';
        inp.placeholder = 'что это значит…';
        inp.autocomplete = 'off';
        // Начальное значение — из saved, или из values если только что открыли
        const oldIdx = emojis.indexOf(e);
        inp.value = saved[e] !== undefined ? saved[e] : (values[oldIdx] || '');
        row.appendChild(inp);
        pairRows.appendChild(row);
        pairInputs.push({ emoji: e, input: inp });
      });
    }

    // Первичная отрисовка
    refreshPairs();

    // При вводе эмодзи — обновляем строки
    emojiInput.addEventListener('input', function () {
      emojis = splitEmojis(emojiInput.value);
      // Синхронизируем values по позиции: берём из saved не будем — просто держим значения в инпутах
      refreshPairs();
    });

    // Фокус на поле эмодзи
    setTimeout(function () {
      if (!isEdit) emojiInput.focus();
      else emojiInput.focus();
    }, 320);

    // Кнопки
    const btnRow = el('div', 'btn-row');
    const cancelBtn = el('button', 'btn btn-ghost', 'Отмена');
    const saveBtn = el('button', 'btn btn-primary', isEdit ? 'Сохранить' : 'Добавить');
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(saveBtn);
    form.appendChild(btnRow);

    const sheet = openSheet(form);

    cancelBtn.addEventListener('click', function () { sheet.close(); });

    saveBtn.addEventListener('click', function () {
      // Пересобираем эмодзи и значения финально
      const finalEmojis = splitEmojis(emojiInput.value);
      const valueMap = {};
      pairInputs.forEach(function (p) { valueMap[p.emoji] = p.input.value.trim(); });
      const finalValues = finalEmojis.map(function (e) {
        return valueMap[e] !== undefined ? valueMap[e] : '';
      });

      if (!finalEmojis.length) {
        toast('Добавь хотя бы один смайлик');
        return;
      }

      if (isEdit) {
        updateBelief(existing.id, finalEmojis, finalValues);
      } else {
        createBelief(finalEmojis, finalValues);
      }
      sheet.close();
      render();
    });

    // Кнопка удаления при редактировании
    if (isEdit) {
      const delWrap = el('div');
      delWrap.appendChild(el('div', 'space-12'));
      const delBtn = el('button', 'btn btn-danger', 'Удалить');
      delBtn.addEventListener('click', function () {
        if (deleteBelief(existing.id)) {
          sheet.close();
          render();
          toast('Удалено');
        }
      });
      delWrap.appendChild(delBtn);
      form.appendChild(delWrap);
    }
  }

  /* =========================================================
     РЕДАКТОР: ТЕГ
     ========================================================= */
  function openTagEditor(existing) {
    const isEdit = !!existing;

    const form = el('div');
    form.appendChild(el('div', 'sheet-title', isEdit ? 'Тег' : 'Новый тег'));

    const tagRow = el('div', 'form-row');
    tagRow.appendChild(el('label', 'form-label', 'Тег'));
    const tagInput = document.createElement('input');
    tagInput.type = 'text';
    tagInput.className = 'text-input';
    tagInput.placeholder = 'соблазняет';
    tagInput.autocomplete = 'off';
    tagInput.value = existing ? (existing.tag || '').replace(/^#/, '') : '';
    tagRow.appendChild(tagInput);
    form.appendChild(tagRow);

    const descRow = el('div', 'form-row');
    descRow.appendChild(el('label', 'form-label', 'Описание'));
    const descInput = document.createElement('textarea');
    descInput.className = 'text-input';
    descInput.rows = 3;
    descInput.placeholder = 'Привлечь твоё сердце ❤️‍🔥 в свои 🤲 руки';
    descInput.value = existing ? (existing.description || '') : '';
    descRow.appendChild(descInput);
    form.appendChild(descRow);

    const btnRow = el('div', 'btn-row');
    const cancelBtn = el('button', 'btn btn-ghost', 'Отмена');
    const saveBtn = el('button', 'btn btn-primary', isEdit ? 'Сохранить' : 'Добавить');
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(saveBtn);
    form.appendChild(btnRow);

    const sheet = openSheet(form);

    setTimeout(function () { tagInput.focus(); }, 320);

    cancelBtn.addEventListener('click', function () { sheet.close(); });

    saveBtn.addEventListener('click', function () {
      const tag = tagInput.value.trim().replace(/^#/, '');
      const description = descInput.value.trim();
      if (!tag) { toast('Введи тег'); return; }
      if (isEdit) {
        updateTag(existing.id, tag, description);
      } else {
        createTag(tag, description);
      }
      sheet.close();
      render();
    });

    if (isEdit) {
      const delWrap = el('div');
      delWrap.appendChild(el('div', 'space-12'));
      const delBtn = el('button', 'btn btn-danger', 'Удалить');
      delBtn.addEventListener('click', function () {
        if (deleteTag(existing.id)) {
          sheet.close();
          render();
          toast('Удалено');
        }
      });
      delWrap.appendChild(delBtn);
      form.appendChild(delWrap);
    }
  }

  /* =========================================================
     МОДАЛКА: ЧТО СОЗДАТЬ
     ========================================================= */
  function openCreateChooser() {
    const form = el('div');
    form.appendChild(el('div', 'sheet-title', 'Что добавить?'));

    const list = el('div', 'pair-rows');

    const b1 = el('button', 'row');
    b1.appendChild(el('span', 'row-key', '🤲'));
    b1.appendChild(el('span', 'row-sep', '—'));
    b1.appendChild(el('span', 'row-val', 'Убеждение (смайлики и их значения)'));
    b1.addEventListener('click', function () {
      sheet.close();
      setTimeout(function () { openBeliefEditor(null); }, 50);
    });
    list.appendChild(b1);

    const b2 = el('button', 'row');
    b2.appendChild(el('span', 'row-key row-tag-key', '#'));
    b2.appendChild(el('span', 'row-sep', '—'));
    b2.appendChild(el('span', 'row-val', 'Тег (метка и описание)'));
    b2.addEventListener('click', function () {
      sheet.close();
      setTimeout(function () { openTagEditor(null); }, 50);
    });
    list.appendChild(b2);

    form.appendChild(list);

    const sheet = openSheet(form);
  }

  /* =========================================================
     ГЛАВНЫЙ ЭКРАН
     ========================================================= */
  function screenHome() {
    const wrap = el('div', 'screen');

    const hdr = el('div', 'hdr');
    hdr.appendChild(el('div', 'hdr-title left', 'Главная'));

    const exportBtn = el('button', 'icon-btn', '📤');
    exportBtn.setAttribute('aria-label', 'Экспорт JSON');
    exportBtn.addEventListener('click', exportJson);
    hdr.appendChild(exportBtn);

    hdr.appendChild(el('div', 'icon-btn'));
    wrap.appendChild(hdr);

    const body = el('div', 'body');

    const title = el('div', 'main-title');
    title.appendChild(document.createTextNode('Твои убеждения'));
    title.appendChild(el('span', 'colon', ':'));
    body.appendChild(title);

    const days = groupByDay();

    if (!days.length) {
      body.appendChild(el('div', 'empty-note',
        'Пока пусто.\nНажми «＋», чтобы добавить первое убеждение или тег.'));
    } else {
      days.forEach(function (d) { body.appendChild(buildDay(d)); });
    }

    wrap.appendChild(body);

    const fab = el('button', 'fab', '＋');
    fab.setAttribute('aria-label', 'Добавить');
    fab.addEventListener('click', openCreateChooser);
    wrap.appendChild(fab);

    return wrap;
  }

  function buildDay(dayEntry) {
    const block = el('div', 'day');

    const head = el('div', 'day-head');
    head.appendChild(el('div', 'day-date', formatDayLong(dayEntry.day)));

    if (dayEntry.emojis.length) {
      const em = el('div', 'day-emojis');
      em.textContent = dayEntry.emojis.join('');
      head.appendChild(em);
    }
    block.appendChild(head);

    const rows = el('div', 'rows');

    dayEntry.beliefs.forEach(function (b) {
      rows.appendChild(buildBeliefRow(b));
    });

    dayEntry.tags.forEach(function (t) {
      rows.appendChild(buildTagRow(t));
    });

    block.appendChild(rows);
    return block;
  }

  function buildBeliefRow(b) {
    const emojis = b.emojis || [];
    const values = b.values || [];

    // Если один эмодзи — одна строка
    if (emojis.length <= 1) {
      const row = el('button', 'row');
      row.appendChild(el('span', 'row-key', emojis[0] || '◌'));
      row.appendChild(el('span', 'row-sep', ':'));
      const val = el('span', 'row-val' + (values[0] ? '' : ' empty'), values[0] || 'без описания');
      row.appendChild(val);
      row.addEventListener('click', function () { openBeliefEditor(b); });
      return row;
    }

    // Несколько эмодзи — блок из нескольких строк
    const wrap = el('div', 'rows');
    emojis.forEach(function (e, i) {
      const row = el('button', 'row');
      row.appendChild(el('span', 'row-key', e));
      row.appendChild(el('span', 'row-sep', ':'));
      const val = el('span', 'row-val' + (values[i] ? '' : ' empty'), values[i] || 'без описания');
      row.appendChild(val);
      row.addEventListener('click', function () { openBeliefEditor(b); });
      wrap.appendChild(row);
    });
    return wrap;
  }

  function buildTagRow(t) {
    const row = el('button', 'row');
    const key = el('span', 'row-key row-tag-key', '#' + (t.tag || ''));
    key.style.fontSize = '15px';
    key.style.fontWeight = '600';
    row.appendChild(key);
    row.appendChild(el('span', 'row-sep', ':'));
    const val = el('span', 'row-val' + (t.description ? '' : ' empty tag'), t.description || 'без описания');
    row.appendChild(val);
    row.addEventListener('click', function () { openTagEditor(t); });
    return row;
  }

  /* =========================================================
     ЭКСПОРТ
     ========================================================= */
  function exportJson() {
    try {
      const data = JSON.stringify(Store.get(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tvoi_ubezhdeniya.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Файл сохранён');
    } catch (e) { toast('Не удалось выгрузить'); }
  }

  /* =========================================================
     РЕНДЕР
     ========================================================= */
  function render() {
    const app = document.getElementById('app');
    app.textContent = '';
    app.appendChild(screenHome());
  }

  /* =========================================================
     ИНИЦИАЛИЗАЦИЯ
     ========================================================= */
  function init() {
    Store.load();
    if (!Store.isOk()) toast('Хранилище недоступно — данные не сохранятся');
    render();
  }

  init();
})();
</script>
</body>
</html>
