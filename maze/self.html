<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Твои убеждения</title>
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #e8e8f0;
    --accent: #6fa8ff;
    --warn: #ffb46f;
    --danger: #ff8f8f;
    --muted: #6b6b7b;
    --surface: #14141c;
    --surface-2: #1e1e2a;
    --border: #262633;
    --r: 18px;
    --r-sm: 12px;
    --pad: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
    overscroll-behavior: none;
  }
  body { overflow: hidden; }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ==== шапка ==== */
  .hdr {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-top) + 14px) var(--pad) 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    z-index: 5;
  }
  .hdr-title {
    flex: 1;
    font-size: 22px; font-weight: 700;
    letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-title .colon { color: var(--accent); }

  .icon-btn {
    flex: none; width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; transition: background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.08); }

  /* ==== лента ==== */
  .feed {
    flex: 1; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px var(--pad) 20px;
  }

  .msg {
    position: relative;
    margin-bottom: 12px;
    padding: 14px 14px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    animation: msgIn .25s ease both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }

  .msg.selecting {
    border-color: rgba(111,168,255,.4);
    box-shadow: 0 0 0 2px rgba(111,168,255,.14);
  }

  .msg-body {
    font-size: 17px;
    line-height: 2;
    word-break: break-word;
  }

  /* смайл-чип */
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    margin: 0 1px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 22px;
    line-height: 1.2;
    min-width: 30px;
    transition: background .15s, transform .12s, border-color .15s, box-shadow .15s;
    cursor: pointer;
    background: rgba(111,168,255,.14);
    color: var(--accent);
    user-select: none;
  }
  .chip:active { transform: scale(.94); }

  .chip.word {
    font-size: 15px;
    padding: 3px 10px;
    font-weight: 500;
    letter-spacing: .01em;
  }
  .chip.empty-emoji {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
  }
  .chip.empty-emoji::after {
    content: '+';
    font-size: 10px;
    margin-left: 3px;
    opacity: .8;
  }
  .chip.group {
    position: relative;
    padding-right: 22px;
    background: rgba(111,168,255,.22);
  }
  .chip.group::after {
    content: attr(data-count);
    position: absolute;
    right: 3px;
    top: 50%;
    transform: translateY(-50%) translateY(-1px);
    background: var(--accent);
    color: #06111f;
    font-size: 10px;
    font-weight: 700;
    min-width: 15px;
    height: 15px;
    line-height: 15px;
    padding: 0 3px;
    border-radius: 8px;
    text-align: center;
    letter-spacing: 0;
  }
  .chip.selected {
    background: rgba(111,168,255,.45);
    color: #fff;
    box-shadow: 0 0 0 2px rgba(111,168,255,.5);
  }
  .chip.selectable { cursor: pointer; }
  .chip.selectable:active { transform: scale(.94); }

  .raw {
    display: inline;
    vertical-align: middle;
    line-height: inherit;
  }

  /* действия сообщения */
  .msg-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    min-height: 30px;
  }
  .msg-btn {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    transition: background .15s, color .15s;
  }
  .msg-btn:active { background: rgba(255,255,255,.06); color: var(--fg); }
  .msg-btn.primary {
    color: var(--accent);
    background: rgba(111,168,255,.14);
  }
  .msg-btn.primary:active { background: rgba(111,168,255,.28); }
  .msg-btn:disabled { opacity: .35; }

  .feed-empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    padding: 60px 20px;
    white-space: pre-line;
  }

  /* ==== композер ==== */
  .composer {
    flex: none;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px var(--pad) calc(var(--safe-bottom) + 12px);
  }

  .draft {
    display: none;
    flex-wrap: wrap;
    gap: 2px;
    align-items: center;
    padding: 8px 10px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 17px;
    line-height: 2;
    min-height: 42px;
  }
  .draft.visible { display: flex; }

  .composer-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .composer-input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    outline: none;
    font-size: 16px;
    transition: border-color .15s;
  }
  .composer-input:focus { border-color: var(--accent); }

  .send-btn {
    flex: none;
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--accent);
    color: #06111f;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    transition: transform .12s, opacity .15s;
  }
  .send-btn:active { transform: scale(.94); }
  .send-btn:disabled { opacity: .35; }

  /* ==== sheet ==== */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.62);
    opacity: 0; transition: opacity .25s;
  }
  .backdrop.show { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface-2);
    border-radius: 24px 24px 0 0;
    padding: 8px var(--pad) calc(var(--safe-bottom) + 20px);
    transform: translateY(102%);
    transition: transform .28s cubic-bezier(.22, 1, .36, 1);
    max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0,0,0,.55);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    flex: none; width: 40px; height: 4px; border-radius: 2px;
    background: #35354a; margin: 6px auto 14px;
  }
  .sheet-body { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .sheet-title { font-size: 17px; font-weight: 600; margin: 0 0 14px; }
  .sheet-text { font-size: 15px; line-height: 1.5; opacity: .85; margin: 0 0 18px; }

  /* hero карточки символа */
  .sym-hero {
    text-align: center;
    padding: 6px 0 16px;
  }
  .sym-hero .big {
    display: inline-block;
    padding: 8px 22px;
    font-size: 52px;
    line-height: 1.2;
    background: rgba(111,168,255,.14);
    border-radius: 20px;
    font-weight: 600;
    word-break: break-word;
    letter-spacing: 2px;
    min-width: 80px;
  }
  .sym-hero .big.word {
    font-size: 24px;
    letter-spacing: 0;
    padding: 12px 22px;
  }
  .sym-hero .big.empty {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 24px;
    padding: 12px 22px;
  }

  .form-row { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px;
  }
  .text-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 12px 14px; outline: none;
    resize: none; transition: border-color .15s;
  }
  .text-input:focus { border-color: var(--accent); }
  .text-input.emoji-input {
    font-size: 26px;
    letter-spacing: 3px;
    min-height: 56px;
  }

  .block-title {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .07em; margin: 18px 0 10px;
  }

  .chips-line {
    display: flex; flex-wrap: wrap; gap: 6px;
  }

  .mini-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px 6px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 15px;
    transition: background .15s, border-color .15s;
  }
  .mini-chip:active { background: var(--surface-2); border-color: var(--accent); }
  .mini-chip.emoji { font-size: 20px; padding: 4px 10px; }
  .mini-chip .x {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: var(--muted);
    background: rgba(255,255,255,.05);
    transition: background .15s, color .15s;
  }
  .mini-chip .x:active { background: rgba(255,90,90,.2); color: var(--danger); }

  .occ-list { display: flex; flex-direction: column; gap: 6px; }
  .occ-item {
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--fg);
    opacity: .9;
    text-align: left;
    word-break: break-word;
  }
  .occ-item .mark {
    color: var(--accent);
    font-weight: 600;
    background: rgba(111,168,255,.14);
    padding: 1px 6px;
    border-radius: 6px;
  }
  .occ-empty {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    padding: 4px 0;
  }

  .hint {
    font-size: 12px; color: var(--muted);
    margin-top: 6px; line-height: 1.4;
  }

  .btn {
    display: flex; align-items: center; justify-content: center;
    padding: 15px 22px; border-radius: var(--r);
    font-size: 16px; font-weight: 600; width: 100%;
    transition: transform .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: #06111f; }
  .btn-ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .btn-danger { background: rgba(255,90,90,.14); color: var(--danger); border: 1px solid rgba(255,90,90,.3); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  .group-preview {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px; padding: 14px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
    font-size: 24px;
  }
  .group-preview .plus {
    color: var(--muted);
    font-size: 18px;
    margin: 0 2px;
  }

  .space-12 { height: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 96px);
    transform: translate(-50%, 20px); z-index: 500;
    background: #22222f; border: 1px solid var(--border);
    padding: 11px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .22s, transform .22s;
    pointer-events: none; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  /* =========================================================
     КОНСТАНТЫ
     ========================================================= */
  const STORAGE_KEY = 'tvoi_ubezhdeniya_v4';
  const SHEET_ANIM_MS = 300;
  const TOAST_MS = 2200;

  /* =========================================================
     УТИЛИТЫ
     ========================================================= */
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function uid() {
    return 'x_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  }
  function nowIso() { return new Date().toISOString(); }

  function normalizeKey(s) {
    return String(s == null ? '' : s).trim().toLowerCase();
  }

  function isEmojiLike(g) {
    if (!g) return false;
    if (/[\p{L}\p{N}]/u.test(g)) return false;
    if (/^\s+$/u.test(g)) return false;
    // пунктуация — не эмодзи
    if (/^[!"#$%&'()*+,\-.\/:;<=>?@\[\\\]^_`{|}~«»„""…–—]+$/u.test(g) && g.length <= 3) return false;
    return true;
  }

  function splitGraphemes(str) {
    const s = String(str == null ? '' : str);
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter('ru', { granularity: 'grapheme' });
        const out = [];
        for (const piece of seg.segment(s)) out.push(piece.segment);
        return out;
      } catch (e) {}
    }
    return Array.from(s);
  }

  /**
   * Токенизация. Возвращает массив:
   * { type: 'word'|'emoji'|'space'|'punct', text }
   */
  function tokenize(text) {
    const graphemes = splitGraphemes(text);
    const tokens = [];
    let wordBuf = '';
    function flushWord() {
      if (wordBuf) { tokens.push({ type: 'word', text: wordBuf }); wordBuf = ''; }
    }
    for (let i = 0; i < graphemes.length; i++) {
      const g = graphemes[i];
      if (/^\s+$/u.test(g)) {
        flushWord();
        tokens.push({ type: 'space', text: g });
      } else if (/^[\p{L}\p{N}#@_]+$/u.test(g)) {
        wordBuf += g;
      } else if (isEmojiLike(g)) {
        flushWord();
        tokens.push({ type: 'emoji', text: g });
      } else {
        flushWord();
        tokens.push({ type: 'punct', text: g });
      }
    }
    flushWord();
    return tokens;
  }

  /* =========================================================
     ХРАНИЛИЩЕ
     ========================================================= */
  const Store = (function () {
    let state = null;
    let storageOk = true;

    function emptyState() { return { symbols: [], messages: [] }; }

    function read() {
      try { return window.localStorage.getItem(STORAGE_KEY); }
      catch (e) { storageOk = false; return null; }
    }
    function write(v) {
      try { window.localStorage.setItem(STORAGE_KEY, v); }
      catch (e) { storageOk = false; }
    }
    function load() {
      const raw = read();
      if (!raw) { state = emptyState(); return; }
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      if (!parsed || typeof parsed !== 'object') { state = emptyState(); return; }
      state = {
        symbols: Array.isArray(parsed.symbols) ? parsed.symbols : [],
        messages: Array.isArray(parsed.messages) ? parsed.messages : []
      };
    }
    function save() { write(JSON.stringify(state)); }
    function get() { return state; }
    function isOk() { return storageOk; }
    return { load, save, get, isOk };
  })();

  /* =========================================================
     СИМВОЛЫ
     ========================================================= */
  function getSymbol(id) {
    const list = Store.get().symbols;
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function findSymbolByWord(word) {
    const key = normalizeKey(word);
    if (!key) return null;
    const list = Store.get().symbols;
    for (let i = 0; i < list.length; i++) {
      if (normalizeKey(list[i].word) === key) return list[i];
    }
    return null;
  }

  function findSymbolByEmoji(emoji) {
    const e = String(emoji || '').trim();
    if (!e) return null;
    const list = Store.get().symbols;
    for (let i = 0; i < list.length; i++) {
      if (list[i].emoji === e) return list[i];
    }
    return null;
  }

  function createSymbol(opts) {
    const s = {
      id: uid(),
      emoji: String(opts.emoji || '').trim(),
      word: String(opts.word || '').trim(),
      definition: String(opts.definition || ''),
      children: [],
      parents: [],
      created: nowIso()
    };
    Store.get().symbols.push(s);
    return s;
  }

  /**
   * Находит или создаёт символ для токена.
   * Если токен — слово и уже есть символ с таким словом → возвращает его.
   * Если токен — эмодзи и уже есть символ с таким эмодзи → возвращает его.
   * Иначе — создаёт новый с этим полем.
   */
  function resolveTokenSymbol(token) {
    if (token.type === 'word') {
      const byWord = findSymbolByWord(token.text);
      if (byWord) return byWord;
      // на всякий случай — вдруг кто-то ввёл эмодзи как "слово" (не бывает, но)
      const created = createSymbol({ word: token.text });
      return created;
    }
    if (token.type === 'emoji') {
      const byEmoji = findSymbolByEmoji(token.text);
      if (byEmoji) return byEmoji;
      const created = createSymbol({ emoji: token.text });
      return created;
    }
    return null;
  }

  function updateSymbol(id, patch) {
    const s = getSymbol(id);
    if (!s) return null;
    if (patch.emoji !== undefined) s.emoji = String(patch.emoji || '').trim();
    if (patch.word !== undefined) s.word = String(patch.word || '').trim();
    if (patch.definition !== undefined) s.definition = String(patch.definition || '');
    Store.save();
    return s;
  }

  function deleteSymbol(id) {
    // отвязать от родителей и детей
    const s = getSymbol(id);
    if (!s) return;
    s.parents.slice().forEach(function (pid) {
      const p = getSymbol(pid);
      if (p) {
        const i = p.children.indexOf(id);
        if (i !== -1) p.children.splice(i, 1);
      }
    });
    s.children.slice().forEach(function (cid) {
      const c = getSymbol(cid);
      if (c) {
        const i = c.parents.indexOf(id);
        if (i !== -1) c.parents.splice(i, 1);
      }
    });
    // удалить из сообщений
    Store.get().messages.forEach(function (m) {
      m.itemIds = m.itemIds.filter(function (x) { return x !== id; });
    });
    // удалить символ
    const list = Store.get().symbols;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].id === id) list.splice(i, 1);
    }
    // удалить пустые сообщения
    Store.get().messages = Store.get().messages.filter(function (m) { return m.itemIds.length > 0; });
    Store.save();
  }

  function linkChild(parentId, childId) {
    if (!parentId || !childId || parentId === childId) return;
    const p = getSymbol(parentId), c = getSymbol(childId);
    if (!p || !c) return;
    if (p.children.indexOf(childId) === -1) p.children.push(childId);
    if (c.parents.indexOf(parentId) === -1) c.parents.push(parentId);
  }

  function unlinkChild(parentId, childId) {
    const p = getSymbol(parentId), c = getSymbol(childId);
    if (p) {
      const i = p.children.indexOf(childId);
      if (i !== -1) p.children.splice(i, 1);
    }
    if (c) {
      const i = c.parents.indexOf(parentId);
      if (i !== -1) c.parents.splice(i, 1);
    }
  }

  function getChildren(sym) {
    if (!sym) return [];
    return sym.children.map(getSymbol).filter(Boolean);
  }

  function getParents(sym) {
    if (!sym) return [];
    return sym.parents.map(getSymbol).filter(Boolean);
  }

  /* =========================================================
     СООБЩЕНИЯ
     ========================================================= */
  function createMessage(text) {
    const t = String(text || '').trim();
    if (!t) return null;
    const tokens = tokenize(t);
    const itemIds = [];
    tokens.forEach(function (tok) {
      if (tok.type === 'word' || tok.type === 'emoji') {
        const s = resolveTokenSymbol(tok);
        if (s) itemIds.push(s.id);
      }
    });
    if (!itemIds.length) return null;
    const msg = { id: uid(), itemIds: itemIds, created: nowIso() };
    Store.get().messages.push(msg);
    Store.save();
    return msg;
  }

  function getMessage(id) {
    const list = Store.get().messages;
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function deleteMessage(id) {
    const list = Store.get().messages;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].id === id) { list.splice(i, 1); Store.save(); return true; }
    }
    return false;
  }

  /**
   * Собирает сообщение обратно в текст (для отображения в списке «где встречается»).
   */
  function messageToText(msg) {
    if (!msg) return '';
    const parts = [];
    msg.itemIds.forEach(function (id) {
      const s = getSymbol(id);
      if (!s) return;
      parts.push(s.emoji || s.word || '·');
    });
    return parts.join(' ');
  }

  function findOccurrences(symId) {
    const result = [];
    Store.get().messages.forEach(function (m) {
      if (m.itemIds.indexOf(symId) !== -1) result.push(m);
    });
    return result;
  }

  /* =========================================================
     UI: TOAST, SHEET
     ========================================================= */
  let toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) { toastEl = el('div', 'toast'); document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    requestAnimationFrame(function () { toastEl.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, TOAST_MS);
  }

  let sheetZ = 200;
  function openSheet(content) {
    const z = sheetZ; sheetZ += 2;
    const backdrop = el('div', 'backdrop'); backdrop.style.zIndex = String(z);
    const sheet = el('div', 'sheet'); sheet.style.zIndex = String(z + 1);
    sheet.appendChild(el('div', 'sheet-handle'));
    const body = el('div', 'sheet-body'); body.appendChild(content);
    sheet.appendChild(body);
    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);
    requestAnimationFrame(function () {
      backdrop.classList.add('show'); sheet.classList.add('show');
    });
    let closed = false;
    function close() {
      if (closed) return; closed = true;
      backdrop.classList.remove('show'); sheet.classList.remove('show');
      setTimeout(function () { backdrop.remove(); sheet.remove(); }, SHEET_ANIM_MS);
    }
    backdrop.addEventListener('click', close);
    return { close };
  }

  function openConfirm(opts) {
    const form = el('div');
    form.appendChild(el('div', 'sheet-title', opts.title || 'Удалить?'));
    form.appendChild(el('div', 'sheet-text', opts.text || ''));
    const btnRow = el('div', 'btn-row');
    const cancelBtn = el('button', 'btn btn-ghost', 'Отмена');
    const okBtn = el('button', 'btn btn-danger', opts.okText || 'Удалить');
    btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
    form.appendChild(btnRow);
    const sheet = openSheet(form);
    cancelBtn.addEventListener('click', function () { sheet.close(); });
    okBtn.addEventListener('click', function () {
      sheet.close();
      if (typeof opts.onOk === 'function') opts.onOk();
    });
  }

  /* =========================================================
     СОСТОЯНИЕ
     ========================================================= */
  const STATE = {
    selection: {}   // { [messageId]: Set<index> } — присутствие ключа = режим выбора
  };

  /* =========================================================
     КАРТОЧКА СИМВОЛА
     ========================================================= */
  function openSymbolCard(symId) {
    const sym = getSymbol(symId);
    if (!sym) return;

    const form = el('div');

    // hero
    const hero = el('div', 'sym-hero');
    const big = el('span', 'big');
    if (sym.emoji) {
      big.textContent = sym.emoji;
    } else if (sym.word) {
      big.classList.add('word');
      big.textContent = sym.word;
    } else {
      big.classList.add('empty');
      big.textContent = '·';
    }
    hero.appendChild(big);
    form.appendChild(hero);

    // emoji
    const emRow = el('div', 'form-row');
    emRow.appendChild(el('div', 'form-label', 'Смайл'));
    const emInput = document.createElement('input');
    emInput.type = 'text';
    emInput.className = 'text-input emoji-input';
    emInput.placeholder = '😀';
    emInput.autocomplete = 'off';
    emInput.spellcheck = false;
    emInput.value = sym.emoji;
    emRow.appendChild(emInput);
    emRow.appendChild(el('div', 'hint', 'Набери или вставь смайл со своей клавиатуры.'));
    form.appendChild(emRow);

    // word
    const wordRow = el('div', 'form-row');
    wordRow.appendChild(el('div', 'form-label', 'Слово'));
    const wordInput = document.createElement('input');
    wordInput.type = 'text';
    wordInput.className = 'text-input';
    wordInput.placeholder = 'что это значит';
    wordInput.autocomplete = 'off';
    wordInput.value = sym.word;
    wordRow.appendChild(wordInput);
    form.appendChild(wordRow);

    // definition
    const defRow = el('div', 'form-row');
    defRow.appendChild(el('div', 'form-label', 'Описание'));
    const defInput = document.createElement('textarea');
    defInput.className = 'text-input';
    defInput.rows = 3;
    defInput.placeholder = 'необязательно';
    defInput.value = sym.definition;
    defRow.appendChild(defInput);
    form.appendChild(defRow);

    // children
    form.appendChild(el('div', 'block-title', 'Из чего состоит'));
    const childrenLine = el('div', 'chips-line');
    form.appendChild(childrenLine);

    function refreshChildren() {
      childrenLine.textContent = '';
      const kids = getChildren(sym);
      kids.forEach(function (k) {
        const chip = el('button', 'mini-chip' + (k.emoji ? ' emoji' : ''));
        chip.appendChild(el('span', '', k.emoji || k.word || '·'));
        const x = el('span', 'x', '×');
        x.addEventListener('click', function (e) {
          e.stopPropagation();
          unlinkChild(sym.id, k.id);
          Store.save();
          refreshChildren();
          render();
        });
        chip.appendChild(x);
        chip.addEventListener('click', function () {
          sheet.close();
          setTimeout(function () { openSymbolCard(k.id); }, 60);
        });
        childrenLine.appendChild(chip);
      });
      const addBtn = el('button', 'mini-chip');
      addBtn.appendChild(el('span', '', '+ добавить'));
      addBtn.addEventListener('click', function () {
        sheet.close();
        setTimeout(function () { openSymbolPicker(sym.id); }, 60);
      });
      childrenLine.appendChild(addBtn);
    }
    refreshChildren();

    // parents
    const parents = getParents(sym);
    if (parents.length) {
      form.appendChild(el('div', 'block-title', 'Входит в'));
      const pc = el('div', 'chips-line');
      parents.forEach(function (p) {
        const chip = el('button', 'mini-chip' + (p.emoji ? ' emoji' : ''));
        chip.appendChild(el('span', '', p.emoji || p.word || '·'));
        chip.addEventListener('click', function () {
          sheet.close();
          setTimeout(function () { openSymbolCard(p.id); }, 60);
        });
        pc.appendChild(chip);
      });
      form.appendChild(pc);
    }

    // occurrences
    const occ = findOccurrences(sym.id);
    form.appendChild(el('div', 'block-title', 'Где встречается (' + occ.length + ')'));
    if (!occ.length) {
      form.appendChild(el('div', 'occ-empty', 'Пока нигде не встречается.'));
    } else {
      const list = el('div', 'occ-list');
      occ.slice(0, 15).forEach(function (m) {
        const item = el('div', 'occ-item');
        m.itemIds.forEach(function (id, i) {
          if (i > 0) item.appendChild(document.createTextNode(' '));
          const s = getSymbol(id);
          if (!s) return;
          const display = s.emoji || s.word || '·';
          if (s.id === sym.id) {
            item.appendChild(el('span', 'mark', display));
          } else {
            item.appendChild(document.createTextNode(display));
          }
        });
        list.appendChild(item);
      });
      form.appendChild(list);
    }

    // save + delete
    const saveWrap = el('div');
    saveWrap.style.marginTop = '20px';
    const saveBtn = el('button', 'btn btn-primary', 'Сохранить');
    saveBtn.addEventListener('click', function () {
      updateSymbol(sym.id, {
        emoji: emInput.value,
        word: wordInput.value,
        definition: defInput.value
      });
      Store.save();
      sheet.close();
      render();
      toast('Сохранено');
    });
    saveWrap.appendChild(saveBtn);
    form.appendChild(saveWrap);

    const delWrap = el('div');
    delWrap.style.marginTop = '10px';
    const delBtn = el('button', 'btn btn-danger', 'Удалить символ');
    delBtn.addEventListener('click', function () {
      sheet.close();
      openConfirm({
        title: 'Удалить символ?',
        text: '«' + (sym.emoji || sym.word || '·') + '» будет удалён из базы и всех сообщений.',
        okText: 'Удалить',
        onOk: function () { deleteSymbol(sym.id); render(); toast('Удалено'); }
      });
    });
    delWrap.appendChild(delBtn);
    form.appendChild(delWrap);

    const sheet = openSheet(form);
    setTimeout(function () { emInput.focus(); }, 320);
  }

  /* =========================================================
     ПИКЕР СИМВОЛОВ
     ========================================================= */
  function openSymbolPicker(targetSymId) {
    const target = getSymbol(targetSymId);
    if (!target) return;

    const form = el('div');
    form.appendChild(el('div', 'sheet-title', 'Добавить в «' + (target.emoji || target.word || '·') + '»'));

    // Исключаем target и его потомков
    const excluded = new Set([targetSymId]);
    const queue = [targetSymId];
    while (queue.length) {
      const cur = queue.shift();
      const s = getSymbol(cur);
      if (!s) continue;
      s.children.forEach(function (cid) {
        if (!excluded.has(cid)) { excluded.add(cid); queue.push(cid); }
      });
    }

    const all = Store.get().symbols.filter(function (s) { return !excluded.has(s.id); });

    if (!all.length) {
      form.appendChild(el('div', 'occ-empty', 'Нет других символов. Напиши сообщение с ними.'));
    } else {
      const list = el('div', 'chips-line');
      list.style.flexDirection = 'column';
      list.style.gap = '6px';
      all.forEach(function (s) {
        const row = el('button', 'mini-chip');
        row.style.width = '100%';
        row.style.justifyContent = 'flex-start';
        row.style.padding = '12px 14px';
        row.style.borderRadius = '12px';
        const sym = el('span', '', s.emoji || s.word || '·');
        sym.style.fontSize = s.emoji ? '22px' : '15px';
        sym.style.marginRight = '10px';
        row.appendChild(sym);
        if (s.word && s.emoji) {
          row.appendChild(el('span', '', s.word));
          row.lastChild.style.color = 'var(--muted)';
          row.lastChild.style.fontSize = '14px';
        }
        row.addEventListener('click', function () {
          linkChild(targetSymId, s.id);
          Store.save();
          sheet.close();
          render();
          setTimeout(function () { openSymbolCard(targetSymId); }, 60);
        });
        list.appendChild(row);
      });
      form.appendChild(list);
    }

    const sheet = openSheet(form);
  }

  /* =========================================================
     ДИАЛОГ ГРУППЫ
     ========================================================= */
  function openGroupDialog(messageId, indices) {
    const msg = getMessage(messageId);
    if (!msg) return;
    const sorted = indices.slice().sort(function (a, b) { return a - b; });
    const selectedSymbols = sorted.map(function (i) { return getSymbol(msg.itemIds[i]); }).filter(Boolean);

    const form = el('div');
    form.appendChild(el('div', 'sheet-title', 'Новая группа'));

    // preview
    const preview = el('div', 'group-preview');
    selectedSymbols.forEach(function (s, i) {
      if (i > 0) preview.appendChild(el('span', 'plus', '+'));
      preview.appendChild(el('span', '', s.emoji || s.word || '·'));
    });
    preview.appendChild(el('span', 'plus', '→'));
    const resultSpan = el('span', '', '🆕');
    resultSpan.style.opacity = '.5';
    preview.appendChild(resultSpan);
    form.appendChild(preview);

    // emoji
    const emRow = el('div', 'form-row');
    emRow.appendChild(el('div', 'form-label', 'Смайл группы'));
    const emInput = document.createElement('input');
    emInput.type = 'text';
    emInput.className = 'text-input emoji-input';
    emInput.placeholder = '🕺';
    emInput.autocomplete = 'off';
    emInput.spellcheck = false;
    emInput.addEventListener('input', function () {
      resultSpan.textContent = emInput.value.trim() || '🆕';
      resultSpan.style.opacity = emInput.value.trim() ? '1' : '.5';
    });
    emRow.appendChild(emInput);
    form.appendChild(emRow);

    // word
    const wordRow = el('div', 'form-row');
    wordRow.appendChild(el('div', 'form-label', 'Слово / название'));
    const wordInput = document.createElement('input');
    wordInput.type = 'text';
    wordInput.className = 'text-input';
    wordInput.placeholder = 'успешный мужчина';
    wordInput.autocomplete = 'off';
    wordRow.appendChild(wordInput);
    form.appendChild(wordRow);

    // buttons
    const btnRow = el('div', 'btn-row');
    const cancelBtn = el('button', 'btn btn-ghost', 'Отмена');
    const okBtn = el('button', 'btn btn-primary', 'Создать');
    btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
    form.appendChild(btnRow);

    const sheet = openSheet(form);
    setTimeout(function () { emInput.focus(); }, 320);

    cancelBtn.addEventListener('click', function () {
      sheet.close();
      delete STATE.selection[messageId];
      render();
    });

    okBtn.addEventListener('click', function () {
      const emoji = emInput.value.trim();
      const word = wordInput.value.trim();
      if (!emoji && !word) { toast('Нужен смайл или слово'); return; }

      // Создаём группу
      const group = createSymbol({ emoji: emoji, word: word });
      selectedSymbols.forEach(function (s) { linkChild(group.id, s.id); });

      // Заменяем в сообщении
      const insertAt = sorted[0];
      // удаляем выбранные индексы (с конца)
      for (let i = sorted.length - 1; i >= 0; i--) {
        msg.itemIds.splice(sorted[i], 1);
      }
      msg.itemIds.splice(insertAt, 0, group.id);

      Store.save();
      delete STATE.selection[messageId];
      sheet.close();
      render();
      toast('Группа создана');
    });
  }

  /* =========================================================
     РЕНДЕР
     ========================================================= */
  function render() {
    const app = document.getElementById('app');
    app.textContent = '';

    // hdr
    const hdr = el('div', 'hdr');
    const title = el('div', 'hdr-title');
    title.appendChild(document.createTextNode('Твои убеждения'));
    title.appendChild(el('span', 'colon', ':'));
    hdr.appendChild(title);

    const exportBtn = el('button', 'icon-btn', '📤');
    exportBtn.setAttribute('aria-label', 'Экспорт');
    exportBtn.addEventListener('click', exportJson);
    hdr.appendChild(exportBtn);
    app.appendChild(hdr);

    // feed
    const feed = el('div', 'feed');
    const messages = Store.get().messages;

    if (!messages.length) {
      feed.appendChild(el('div', 'feed-empty',
        'Напиши первое сообщение.\n\nКаждое слово превратится в смайл.\nСмайлы можно таскать и объединять в группы.'));
    } else {
      messages.slice().reverse().forEach(function (m) {
        feed.appendChild(buildMessageEl(m));
      });
    }
    app.appendChild(feed);

    // composer
    app.appendChild(buildComposer());
  }

  function buildComposer() {
    const wrap = el('div', 'composer');

    const draft = el('div', 'draft');
    wrap.appendChild(draft);

    const row = el('div', 'composer-row');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'composer-input';
    input.placeholder = 'Напиши сообщение…';
    input.autocomplete = 'off';
    row.appendChild(input);

    const send = el('button', 'send-btn', '→');
    send.setAttribute('aria-label', 'Отправить');
    send.disabled = true;
    row.appendChild(send);
    wrap.appendChild(row);

    function refresh() {
      const v = input.value.trim();
      send.disabled = !v;
      if (!v) {
        draft.classList.remove('visible');
        draft.textContent = '';
        return;
      }
      draft.classList.add('visible');
      draft.textContent = '';
      const tokens = tokenize(input.value);
      tokens.forEach(function (tok) {
        if (tok.type === 'word' || tok.type === 'emoji') {
          const chip = buildPreviewChip(tok);
          draft.appendChild(chip);
        } else {
          draft.appendChild(document.createTextNode(tok.text));
        }
      });
    }

    input.addEventListener('input', refresh);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!send.disabled) send.click();
      }
    });

    send.addEventListener('click', function () {
      const v = input.value.trim();
      if (!v) return;
      createMessage(v);
      input.value = '';
      refresh();
      render();
      const newFeed = document.querySelector('.feed');
      if (newFeed) newFeed.scrollTop = 0;
    });

    return wrap;
  }

  function buildPreviewChip(tok) {
    const chip = el('span', 'chip');
    if (tok.type === 'emoji') {
      const existing = findSymbolByEmoji(tok.text);
      chip.textContent = tok.text;
      if (!existing) {
        chip.classList.add('empty-emoji');
      }
    } else {
      // word
      const existing = findSymbolByWord(tok.text);
      if (existing && existing.emoji) {
        chip.textContent = existing.emoji;
      } else if (existing && !existing.emoji) {
        chip.classList.add('word', 'empty-emoji');
        chip.textContent = existing.word;
      } else {
        chip.classList.add('word', 'empty-emoji');
        chip.textContent = tok.text;
      }
    }
    return chip;
  }

  function buildMessageEl(msg) {
    const wrap = el('div', 'msg');
    const selecting = !!STATE.selection[msg.id];
    if (selecting) wrap.classList.add('selecting');

    const body = el('div', 'msg-body');
    msg.itemIds.forEach(function (symId, idx) {
      const s = getSymbol(symId);
      if (!s) return;
      const chip = buildSymbolChip(s, {
        selectable: selecting,
        selected: selecting && STATE.selection[msg.id].has(idx),
        onTap: function () {
          if (selecting) {
            toggleSelection(msg.id, idx);
            render();
          } else {
            openSymbolCard(s.id);
          }
        }
      });
      body.appendChild(chip);
    });
    wrap.appendChild(body);

    // actions
    const actions = el('div', 'msg-actions');

    if (selecting) {
      const n = STATE.selection[msg.id].size;
      const cancelBtn = el('button', 'msg-btn', 'Отмена');
      cancelBtn.addEventListener('click', function () {
        delete STATE.selection[msg.id];
        render();
      });
      actions.appendChild(cancelBtn);

      const groupBtn = el('button', 'msg-btn primary', 'Объединить (' + n + ')');
      groupBtn.disabled = n < 2;
      groupBtn.addEventListener('click', function () {
        if (n < 2) return;
        const indices = Array.from(STATE.selection[msg.id]);
        openGroupDialog(msg.id, indices);
      });
      actions.appendChild(groupBtn);
    } else {
      if (msg.itemIds.length > 1) {
        const grp = el('button', 'msg-btn', '⊞ Группа');
        grp.addEventListener('click', function () {
          STATE.selection[msg.id] = new Set();
          render();
        });
        actions.appendChild(grp);
      }
      const del = el('button', 'msg-btn', '×');
      del.setAttribute('aria-label', 'Удалить сообщение');
      del.addEventListener('click', function () {
        openConfirm({
          title: 'Удалить сообщение?',
          text: 'Сами символы останутся в базе.',
          okText: 'Удалить',
          onOk: function () { deleteMessage(msg.id); render(); }
        });
      });
      actions.appendChild(del);
    }

    wrap.appendChild(actions);
    return wrap;
  }

  function toggleSelection(msgId, idx) {
    const set = STATE.selection[msgId];
    if (!set) return;
    if (set.has(idx)) set.delete(idx);
    else set.add(idx);
  }

  function buildSymbolChip(sym, opts) {
    const hasChildren = sym.children && sym.children.length > 0;
    const hasEmoji = !!sym.emoji;
    const hasWord = !!sym.word;

    const chip = el('span', 'chip');

    if (hasEmoji) {
      chip.textContent = sym.emoji;
    } else if (hasWord) {
      chip.classList.add('word');
      chip.textContent = sym.word;
    } else {
      chip.classList.add('word', 'empty-emoji');
      chip.textContent = '·';
    }

    if (!hasEmoji && hasWord) chip.classList.add('empty-emoji');

    if (hasChildren) {
      chip.classList.add('group');
      chip.dataset.count = String(sym.children.length);
    }

    if (opts.selectable) chip.classList.add('selectable');
    if (opts.selected) chip.classList.add('selected');

    chip.addEventListener('click', opts.onTap);
    return chip;
  }

  /* =========================================================
     ЭКСПОРТ
     ========================================================= */
  function exportJson() {
    try {
      const data = JSON.stringify(Store.get(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tvoi_ubezhdeniya.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Файл сохранён');
    } catch (e) { toast('Не удалось выгрузить'); }
  }

  /* =========================================================
     СТАРТ
     ========================================================= */
  function init() {
    Store.load();
    if (!Store.isOk()) toast('Хранилище недоступно');
    render();
  }
  init();
})();
</script>
</body>
