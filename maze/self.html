<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>👁:Убеждения</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { height:100%; width:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0a0a0f; color:#e8e8f0; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:600px; margin:0 auto; position:relative; }

  .top-bar { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#14141c; border-bottom:1px solid #262633; flex-shrink:0; }
  .crumbs { flex:1; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; min-width:0; }
  .crumbs::-webkit-scrollbar { display:none; }
  .crumb { flex:none; padding:7px 14px; border-radius:999px; background:#1a1a24; border:1px solid #262633; font-size:14px; color:#e8e8f0; cursor:pointer; transition:.15s; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:inherit; }
  .crumb:active { background:#22222e; }
  .crumb.current { background:rgba(111,168,255,.16); border-color:rgba(111,168,255,.4); color:#6fa8ff; font-weight:600; }
  .crumb-sep { flex:none; color:#6b6b7b; font-size:13px; }
  .icon-btn { width:40px; height:40px; border-radius:12px; border:1px solid #262633; background:#14141c; color:#e8e8f0; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; transition:.15s; flex-shrink:0; font-family:inherit; }
  .icon-btn:active { transform:scale(.94); background:#1e1e2a; }

  .main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 100px; }

  /* ===== дни ===== */
  .day-card { position:relative; background:#14141c; border:1px solid #262633; border-radius:18px; padding:14px; margin-bottom:10px; cursor:pointer; transition:.15s; }
  .day-card:active { background:#1a1a24; border-color:#6fa8ff; }
  .day-date { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#6fa8ff; opacity:.9; margin-bottom:10px; }
  .day-preview { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:26px; line-height:1.2; letter-spacing:1px; min-height:30px; word-break:break-word; }
  .day-preview .empty { color:#6b6b7b; font-size:13px; font-style:italic; letter-spacing:0; }
  .day-meta { margin-top:8px; font-size:12px; color:#6b6b7b; }
  .day-del { position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; background:rgba(255,90,90,.12); border:1px solid rgba(255,90,90,.28); color:#ff8f8f; font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit; }
  .day-del:active { background:rgba(255,90,90,.35); }

  /* ===== редактор ===== */
  .editor-wrap { background:#14141c; border:1px solid #262633; border-radius:16px; padding:12px 14px; margin-bottom:12px; }
  .editor { width:100%; min-height:110px; resize:none; background:transparent; border:none; outline:none; color:#e8e8f0; font-size:17px; line-height:1.7; font-family:inherit; -webkit-user-select:text; user-select:text; padding:0; }
  .editor::placeholder { color:#6b6b7b; }

  .preview-wrap { background:#14141c; border:1px solid #262633; border-radius:16px; padding:14px; margin-bottom:12px; min-height:80px; }
  .preview-label { font-size:11px; color:#6b6b7b; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
  .preview-text { font-size:22px; line-height:2.2; word-break:break-word; white-space:pre-wrap; }
  .preview-text .empty { color:#6b6b7b; font-size:14px; font-style:italic; }

  /* чип */
  .chip { display:inline-flex; align-items:baseline; gap:3px; vertical-align:middle; margin:2px 3px; padding:4px 10px 5px; border-radius:10px; transition:.15s; cursor:pointer; user-select:none; font-size:22px; line-height:1; }
  .chip:active { transform:scale(.95); }
  .chip .word { display:none; font-size:14px; color:#6b6b7b; margin-left:2px; }
  body.words-mode .chip .word { display:inline; }

  .chip.sym { background:rgba(111,168,255,.16); color:#6fa8ff; border:1px solid rgba(111,168,255,.28); }
  .chip.sym.has-word .word { color:#6fa8ff; opacity:.8; }
  .chip.sym.has-word .word::before { content:':'; margin-right:1px; }

  .chip.new { background:rgba(255,180,111,.16); color:#ffb46f; border:1px dashed rgba(255,180,111,.55); }
  .chip.new .word { color:#ffb46f; opacity:.95; display:inline; margin-left:0; }
  .chip.new .q { font-size:16px; font-weight:700; margin-right:3px; opacity:.9; }

  /* ===== нижняя панель ===== */
  .bottom-panel { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:600px; background:#14141c; border-top:1px solid #262633; padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:8px; z-index:50; }
  .bottom-row { display:flex; gap:8px; align-items:center; }
  .bottom-btn { flex:1; height:44px; border-radius:14px; border:1px solid #262633; background:#1a1a24; font-size:14px; font-weight:600; color:#e8e8f0; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; gap:5px; font-family:inherit; }
  .bottom-btn:active { transform:scale(.96); background:#22222e; }
  .bottom-btn.primary { background:#6fa8ff; color:#06111f; border-color:transparent; }
  .bottom-btn.danger { background:rgba(255,90,90,.14); color:#ff8f8f; border-color:rgba(255,90,90,.3); }
  .bottom-btn.on { background:#6fa8ff; color:#06111f; border-color:transparent; }

  /* ===== модалки ===== */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(8px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:#1e1e2a; border:1px solid #262633; border-radius:22px; padding:20px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; }
  .modal h3 { font-size:17px; font-weight:600; color:#e8e8f0; }
  .modal .hint { font-size:12px; color:#6b6b7b; line-height:1.4; }
  .modal .err { color:#ff8f8f; font-size:12px; min-height:16px; }

  .token-preview { display:flex; align-items:center; justify-content:center; gap:10px; padding:16px 0; flex-wrap:wrap; }
  .token-preview .big { font-size:56px; letter-spacing:4px; line-height:1; }
  .token-preview .eq { color:#6b6b7b; font-size:22px; }
  .token-preview .label { color:#e8e8f0; font-size:20px; max-width:200px; text-align:center; word-break:break-word; }

  .emoji-input { padding:14px; border:1px solid #262633; border-radius:14px; font-size:32px; outline:none; background:#14141c; color:#e8e8f0; text-align:center; letter-spacing:6px; min-height:62px; font-family:inherit; }
  .emoji-input:focus { border-color:#6fa8ff; }
  .emoji-input.error { border-color:#ff3b30; animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .text-input { padding:12px 14px; border:1px solid #262633; border-radius:14px; font-size:15px; outline:none; background:#14141c; color:#e8e8f0; font-family:inherit; }
  .text-input:focus { border-color:#6fa8ff; }

  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
  .modal-actions button { padding:10px 18px; border-radius:12px; border:1px solid #262633; background:#14141c; color:#e8e8f0; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .modal-actions button.primary { background:#6fa8ff; color:#06111f; border-color:transparent; }

  .hidden { display:none !important; }

  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 90px); transform:translate(-50%, 20px); z-index:500; background:#22222f; border:1px solid #262633; padding:11px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .22s, transform .22s; pointer-events:none; max-width:86vw; text-align:center; color:#e8e8f0; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }

  .empty-note { text-align:center; color:#6b6b7b; font-size:14px; padding:60px 20px; line-height:1.7; white-space:pre-line; }

  /* словарь */
  .dict-chip { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; background:#14141c; border:1px solid #262633; font-size:22px; cursor:pointer; font-family:inherit; color:#e8e8f0; transition:.15s; }
  .dict-chip:active { background:#22222e; border-color:#6fa8ff; }
  .dict-chip .w { font-size:13px; color:#6fa8ff; }
</style>
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="crumbs" id="crumbs"></div>
    <button class="icon-btn" id="exportBtn" title="Экспорт">📤</button>
  </header>

  <div class="main" id="daysView"></div>

  <div class="main hidden" id="dayView">
    <div class="editor-wrap">
      <textarea id="editor" class="editor" placeholder="Пиши слова или смайлы…"></textarea>
    </div>
    <div class="preview-wrap">
      <div class="preview-label">Предпросмотр</div>
      <div class="preview-text" id="previewText"></div>
    </div>
  </div>

  <div class="bottom-panel" id="bottomPanel">
    <div class="bottom-row" id="rowDays">
      <button class="bottom-btn primary" id="addDayBtn">+ День</button>
      <button class="bottom-btn danger" id="clearBtn" style="flex:0 0 auto; padding:0 20px;">🗑</button>
    </div>
    <div class="bottom-row hidden" id="rowEditor">
      <button class="bottom-btn" id="wordsModeBtn">📝 Слова</button>
      <button class="bottom-btn" id="dictionaryBtn">📖 Словарь</button>
    </div>
  </div>

  <div id="symModal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="symModalTitle">Добавить</h3>
      <div class="token-preview" id="tokenPreview"></div>
      <input id="symWordInput" class="text-input" placeholder="Что это значит" autocomplete="off">
      <input id="symCharInput" class="emoji-input hidden" placeholder="😀" autocomplete="off" spellcheck="false">
      <div class="hint" id="symHint"></div>
      <div class="err" id="symErr"></div>
      <div class="modal-actions">
        <button id="symCancelBtn">Отмена</button>
        <button id="symSaveBtn" class="primary">Добавить</button>
      </div>
    </div>
  </div>

  <div id="dictModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>📖 Словарь</h3>
      <div class="hint">Все символы. Тап — удалить.</div>
      <div id="dictList" style="max-height:50vh; overflow-y:auto; display:flex; flex-wrap:wrap; gap:6px;"></div>
      <div class="modal-actions">
        <button id="dictCloseBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="confirmTitle">Удалить?</h3>
      <div class="hint" id="confirmText"></div>
      <div class="modal-actions">
        <button id="confirmCancelBtn">Отмена</button>
        <button id="confirmOkBtn" class="primary" style="background:rgba(255,90,90,.85); color:#fff;">Удалить</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'ubezhdeniya_v7';
  const TOAST_MS = 2200;
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MAX_NGRAM = 3;

  /* ===== утилиты ===== */
  function uid() { return 'x_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function nowIso() { return new Date().toISOString(); }

  function splitGraphemes(str) {
    const s = String(str == null ? '' : str);
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter('ru', { granularity: 'grapheme' });
        const out = [];
        for (const piece of seg.segment(s)) out.push(piece.segment);
        return out;
      } catch (e) {}
    }
    return Array.from(s);
  }

  function isEmojiGrapheme(g) {
    if (!g) return false;
    if (/^\s+$/u.test(g)) return false;
    if (/[\p{L}\p{N}]/u.test(g)) return false;
    if (/^[!"#$%&'()*+,\-.\/:;<=>?@\[\\\]^_`{|}~«»„""…–—]+$/u.test(g) && g.length <= 3) return false;
    return true;
  }

  function isEmojiOnly(text) {
    const s = String(text == null ? '' : text).trim();
    if (!s) return false;
    const g = splitGraphemes(s);
    for (let i = 0; i < g.length; i++) if (!isEmojiGrapheme(g[i])) return false;
    return true;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getDate()) + ' ' + (MONTHS[d.getMonth()] || '') + ' ' + d.getFullYear() +
      ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /* ===== toast ===== */
  let toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), TOAST_MS);
  }

  /* ===== confirm ===== */
  function askConfirm(title, text, onOk) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    const m = document.getElementById('confirmModal');
    m.classList.remove('hidden');
    const ok = document.getElementById('confirmOkBtn');
    const cancel = document.getElementById('confirmCancelBtn');
    function cleanup() { m.classList.add('hidden'); ok.removeEventListener('click', onOkH); cancel.removeEventListener('click', onCancelH); }
    function onOkH() { cleanup(); onOk(); }
    function onCancelH() { cleanup(); }
    ok.addEventListener('click', onOkH);
    cancel.addEventListener('click', onCancelH);
  }

  /* ===== store ===== */
  const Store = (function () {
    let state = null;
    let ok = true;
    function empty() { return { symbols: [], days: [] }; }
    function read() { try { return localStorage.getItem(STORAGE_KEY); } catch (e) { ok = false; return null; } }
    function write(v) { try { localStorage.setItem(STORAGE_KEY, v); } catch (e) { ok = false; } }
    function load() {
      const raw = read();
      if (!raw) { state = empty(); return; }
      try {
        const p = JSON.parse(raw);
        state = {
          symbols: Array.isArray(p.symbols) ? p.symbols : [],
          days: Array.isArray(p.days) ? p.days : []
        };
      } catch (e) { state = empty(); }
    }
    function save() { write(JSON.stringify(state)); }
    function get() { return state; }
    function isOk() { return ok; }
    return { load, save, get, isOk };
  })();

  /* ===== symbols DB ===== */
  function findByChar(ch) {
    const c = String(ch || '').trim();
    if (!c) return null;
    const list = Store.get().symbols;
    for (let i = 0; i < list.length; i++) if (list[i].char === c) return list[i];
    return null;
  }
  function findByWord(w) {
    const k = String(w || '').trim().toLowerCase();
    if (!k) return null;
    const list = Store.get().symbols;
    for (let i = 0; i < list.length; i++) if ((list[i].word || '').toLowerCase() === k) return list[i];
    return null;
  }
  function getSymbolById(id) {
    return Store.get().symbols.find(s => s.id === id) || null;
  }
  function addSymbol(char, word) {
    char = String(char || '').trim();
    word = String(word || '').trim();
    if (!char) return null;
    const byChar = findByChar(char);
    if (byChar) {
      if (word && !byChar.word) byChar.word = word;
      Store.save();
      return byChar;
    }
    const byWord = word ? findByWord(word) : null;
    if (byWord) {
      byWord.char = char;
      Store.save();
      return byWord;
    }
    const s = { id: uid(), char, word, created: nowIso() };
    Store.get().symbols.push(s);
    Store.save();
    return s;
  }
  function deleteSymbol(id) {
    Store.get().symbols = Store.get().symbols.filter(s => s.id !== id);
    Store.save();
  }

  /* ===== days ===== */
  function createDay() {
    const day = { id: uid(), created: nowIso(), text: '' };
    Store.get().days.unshift(day);
    Store.save();
    return day;
  }
  function getDay(id) { return Store.get().days.find(d => d.id === id) || null; }
  function updateDayText(id, text) {
    const d = getDay(id);
    if (!d) return;
    d.text = text;
    Store.save();
  }
  function deleteDay(id) {
    Store.get().days = Store.get().days.filter(d => d.id !== id);
    Store.save();
  }

  /* ===== tokenize ===== */
  function extractUnits(text) {
    const graphemes = splitGraphemes(text);
    const units = [];
    let wordBuf = '';
    function flush() { if (wordBuf) { units.push({ type: 'word', text: wordBuf }); wordBuf = ''; } }
    for (let i = 0; i < graphemes.length; i++) {
      const g = graphemes[i];
      if (/^\s+$/u.test(g)) { flush(); units.push({ type: 'space', text: g }); }
      else if (/^[\p{L}\p{N}#@_]+$/u.test(g)) wordBuf += g;
      else if (isEmojiGrapheme(g)) { flush(); units.push({ type: 'emoji', text: g }); }
      else { flush(); units.push({ type: 'punct', text: g }); }
    }
    flush();
    return units;
  }

  /**
   * Возвращает токены с полем `type`:
   *  {type:'raw', text}
   *  {type:'new-emoji', char}
   *  {type:'new-word', word}
   *  {type:'existing', symbolId, fallbackText}
   */
  function resolveTokens(text) {
    const units = extractUnits(text);
    const sigIdx = [];
    units.forEach((u, i) => { if (u.type === 'word' || u.type === 'emoji') sigIdx.push(i); });

    const assignments = new Array(sigIdx.length).fill(null);
    let si = 0;

    while (si < sigIdx.length) {
      let handled = false;
      for (let n = MAX_NGRAM; n >= 1; n--) {
        if (si + n > sigIdx.length) continue;
        let ok = true;
        for (let k = sigIdx[si] + 1; k < sigIdx[si + n - 1]; k++) {
          if (units[k].type !== 'space') { ok = false; break; }
        }
        if (!ok) continue;

        const parts = [];
        for (let k = 0; k < n; k++) parts.push(units[sigIdx[si + k]].text);

        if (n > 1) {
          const phrase = parts.join(' ');
          const byPhrase = findByWord(phrase);
          if (byPhrase) {
            assignments[si] = { size: n, out: { type: 'existing', symbolId: byPhrase.id } };
            for (let k = 1; k < n; k++) assignments[si + k] = { skip: true };
            si += n; handled = true; break;
          }
        }

        if (n === 1) {
          const tok = units[sigIdx[si]];
          if (tok.type === 'emoji') {
            const byChar = findByChar(tok.text);
            if (byChar) assignments[si] = { size: 1, out: { type: 'existing', symbolId: byChar.id } };
            else assignments[si] = { size: 1, out: { type: 'new-emoji', char: tok.text } };
          } else {
            const byWord = findByWord(tok.text);
            if (byWord) assignments[si] = { size: 1, out: { type: 'existing', symbolId: byWord.id } };
            else assignments[si] = { size: 1, out: { type: 'new-word', word: tok.text } };
          }
          si += 1; handled = true; break;
        }
      }
      if (!handled) si += 1;
    }

    const tokens = [];
    let i = 0, sc = 0;
    while (i < units.length) {
      const u = units[i];
      if (u.type === 'space' || u.type === 'punct') {
        tokens.push({ type: 'raw', text: u.text });
        i++; continue;
      }
      const a = assignments[sc];
      if (!a) { sc++; i++; continue; }
      if (a.skip) { sc++; i++; continue; }
      const lastSig = sigIdx[sc + a.size - 1];
      let raw = '';
      for (let k = i; k <= lastSig; k++) raw += units[k].text;
      const out = Object.assign({}, a.out);
      out.text = raw;
      tokens.push(out);
      i = lastSig + 1;
      sc += a.size;
    }
    return tokens;
  }

  /* ===== UI refs ===== */
  const daysView = document.getElementById('daysView');
  const dayView = document.getElementById('dayView');
  const editorEl = document.getElementById('editor');
  const previewEl = document.getElementById('previewText');
  const crumbs = document.getElementById('crumbs');
  const rowDays = document.getElementById('rowDays');
  const rowEditor = document.getElementById('rowEditor');
  const wordsModeBtn = document.getElementById('wordsModeBtn');

  /* ===== state ===== */
  const NAV = { dayId: null };
  let wordsMode = false;

  /* ===== render ===== */
  function render() {
    renderCrumbs();
    if (!NAV.dayId) {
      daysView.classList.remove('hidden');
      dayView.classList.add('hidden');
      rowDays.classList.remove('hidden');
      rowEditor.classList.add('hidden');
      renderDays();
    } else {
      daysView.classList.add('hidden');
      dayView.classList.remove('hidden');
      rowDays.classList.add('hidden');
      rowEditor.classList.remove('hidden');
      renderDay();
    }
  }

  function renderCrumbs() {
    crumbs.innerHTML = '';
    const home = document.createElement('button');
    home.className = 'crumb' + (NAV.dayId === null ? ' current' : '');
    home.textContent = NAV.dayId === null ? 'Твои убеждения:' : 'Убеждения';
    home.addEventListener('click', () => { NAV.dayId = null; render(); });
    crumbs.appendChild(home);
    if (NAV.dayId) {
      const d = getDay(NAV.dayId);
      if (d) {
        const sep = document.createElement('span');
        sep.className = 'crumb-sep'; sep.textContent = '/';
        crumbs.appendChild(sep);
        const c = document.createElement('button');
        c.className = 'crumb current';
        c.textContent = formatDate(d.created).split(',')[0];
        crumbs.appendChild(c);
      }
    }
  }

  function renderDays() {
    daysView.innerHTML = '';
    const days = Store.get().days;
    if (!days.length) {
      const n = document.createElement('div');
      n.className = 'empty-note';
      n.textContent = 'Пока пусто.\nНажми «+ День», чтобы начать.';
      daysView.appendChild(n);
      return;
    }
    days.forEach(day => {
      const card = document.createElement('div');
      card.className = 'day-card';

      const dt = document.createElement('div');
      dt.className = 'day-date';
      dt.textContent = formatDate(day.created);
      card.appendChild(dt);

      const prev = document.createElement('div');
      prev.className = 'day-preview';
      if (!day.text || !day.text.trim()) {
        const e = document.createElement('span');
        e.className = 'empty'; e.textContent = 'пусто — открой и напиши';
        prev.appendChild(e);
      } else {
        const tokens = resolveTokens(day.text);
        let shownAny = false;
        tokens.forEach(t => {
          if (t.type === 'existing') {
            const s = getSymbolById(t.symbolId);
            if (s) { const sp = document.createElement('span'); sp.textContent = s.char; prev.appendChild(sp); shownAny = true; }
          } else if (t.type === 'new-emoji') {
            const sp = document.createElement('span'); sp.textContent = t.char; prev.appendChild(sp); shownAny = true;
          } else if (t.type === 'new-word') {
            const sp = document.createElement('span');
            sp.textContent = t.word;
            sp.style.fontSize = '13px'; sp.style.color = '#ffb46f';
            prev.appendChild(sp); shownAny = true;
          }
        });
        if (!shownAny) {
          const e = document.createElement('span');
          e.className = 'empty'; e.textContent = 'пусто';
          prev.appendChild(e);
        }
      }
      card.appendChild(prev);

      const meta = document.createElement('div');
      meta.className = 'day-meta';
      const chars = (day.text || '').replace(/\s+/g, '');
      meta.textContent = chars ? chars.length + ' символов' : '—';
      card.appendChild(meta);

      const del = document.createElement('button');
      del.className = 'day-del'; del.textContent = '×';
      del.addEventListener('click', e => {
        e.stopPropagation();
        askConfirm('Удалить день?', formatDate(day.created), () => {
          deleteDay(day.id); render(); toast('Удалено');
        });
      });
      card.appendChild(del);

      card.addEventListener('click', () => { NAV.dayId = day.id; render(); });
      daysView.appendChild(card);
    });
  }

  function renderDay() {
    const d = getDay(NAV.dayId);
    if (!d) { NAV.dayId = null; render(); return; }
    editorEl.value = d.text || '';
    renderPreview();
  }

  function renderPreview() {
    previewEl.innerHTML = '';
    const text = editorEl.value;
    if (!text.trim()) {
      const e = document.createElement('span');
      e.className = 'empty'; e.textContent = 'Здесь появятся символы…';
      previewEl.appendChild(e);
      return;
    }
    const tokens = resolveTokens(text);
    tokens.forEach(t => previewEl.appendChild(buildTokenEl(t)));
  }

  function buildTokenEl(t) {
    // сырой текст
    if (t.type === 'raw') {
      const span = document.createElement('span');
      span.textContent = t.text;
      return span;
    }

    // новый эмодзи
    if (t.type === 'new-emoji') {
      const chip = document.createElement('span');
      chip.className = 'chip new';
      const ch = document.createElement('span');
      ch.textContent = t.char;
      chip.appendChild(ch);
      const q = document.createElement('span');
      q.className = 'q'; q.textContent = '?';
      chip.appendChild(q);
      chip.title = 'Новый смайл — добавь значение';
      chip.addEventListener('click', () => openSymModal({ kind: 'emoji', char: t.char }));
      return chip;
    }

    // новое слово
    if (t.type === 'new-word') {
      const chip = document.createElement('span');
      chip.className = 'chip new';
      const q = document.createElement('span');
      q.className = 'q'; q.textContent = '?';
      chip.appendChild(q);
      const w = document.createElement('span');
      w.className = 'word'; w.textContent = t.word;
      chip.appendChild(w);
      chip.title = 'Новое слово — добавь смайл';
      chip.addEventListener('click', () => openSymModal({ kind: 'word', word: t.word }));
      return chip;
    }

    // существующий символ
    if (t.type === 'existing') {
      const s = getSymbolById(t.symbolId);
      if (!s) {
        const span = document.createElement('span');
        span.textContent = t.text;
        return span;
      }
      const chip = document.createElement('span');
      chip.className = 'chip sym' + (s.word ? ' has-word' : '');
      const ch = document.createElement('span');
      ch.textContent = s.char;
      chip.appendChild(ch);
      if (s.word) {
        const w = document.createElement('span');
        w.className = 'word'; w.textContent = s.word;
        chip.appendChild(w);
      }
      return chip;
    }

    // fallback
    const span = document.createElement('span');
    span.textContent = t.text || '';
    return span;
  }

  /* ===== editor ===== */
  editorEl.addEventListener('input', () => {
    if (!NAV.dayId) return;
    updateDayText(NAV.dayId, editorEl.value);
    renderPreview();
  });

  /* ===== modal: symbol ===== */
  const symModal = document.getElementById('symModal');
  let symContext = null;

  function openSymModal(ctx) {
    symContext = ctx;
    const err = document.getElementById('symErr');
    err.textContent = '';
    const charIn = document.getElementById('symCharInput');
    const wordIn = document.getElementById('symWordInput');
    const preview = document.getElementById('tokenPreview');
    const title = document.getElementById('symModalTitle');
    const hint = document.getElementById('symHint');

    preview.innerHTML = '';
    charIn.classList.remove('error');

    if (ctx.kind === 'emoji') {
      title.textContent = 'Новый смайл';
      hint.textContent = 'Смайла нет в словаре. Что он значит?';
      charIn.classList.add('hidden');
      wordIn.classList.remove('hidden');
      wordIn.value = '';
      wordIn.placeholder = 'что это значит';
      preview.innerHTML = '<span class="big">' + ctx.char + '</span><span class="eq">=</span><span class="label" id="previewLabel">?</span>';
      const label = preview.querySelector('#previewLabel');
      wordIn.oninput = () => { label.textContent = wordIn.value.trim() || '?'; };
      setTimeout(() => wordIn.focus(), 100);
    } else if (ctx.kind === 'word') {
      title.textContent = 'Новое слово';
      hint.textContent = 'Слова нет в словаре. Какой смайл ему соответствует?';
      charIn.classList.remove('hidden');
      wordIn.classList.add('hidden');
      charIn.value = '';
      preview.innerHTML = '<span class="label">' + ctx.word + '</span><span class="eq">=</span><span class="big" id="previewLabel">?</span>';
      const label = preview.querySelector('#previewLabel');
      charIn.oninput = () => { label.textContent = charIn.value.trim() || '?'; };
      setTimeout(() => charIn.focus(), 100);
    }
    symModal.classList.remove('hidden');
  }

  function saveSym() {
    if (!symContext) return;
    const err = document.getElementById('symErr');
    const charIn = document.getElementById('symCharInput');
    const wordIn = document.getElementById('symWordInput');

    if (symContext.kind === 'emoji') {
      const word = wordIn.value.trim();
      addSymbol(symContext.char, word);
    } else if (symContext.kind === 'word') {
      const char = charIn.value.trim();
      if (!char) { err.textContent = 'Нужен смайл'; charIn.classList.add('error'); setTimeout(() => charIn.classList.remove('error'), 400); return; }
      if (!isEmojiOnly(char)) { err.textContent = 'Только смайлы'; charIn.classList.add('error'); setTimeout(() => charIn.classList.remove('error'), 400); return; }
      addSymbol(char, symContext.word);
    }
    symModal.classList.add('hidden');
    renderPreview();
  }

  document.getElementById('symCancelBtn').addEventListener('click', () => symModal.classList.add('hidden'));
  document.getElementById('symSaveBtn').addEventListener('click', saveSym);
  document.getElementById('symCharInput').addEventListener('input', function () {
    const err = document.getElementById('symErr');
    if (!this.value.trim()) { err.textContent = ''; return; }
    err.textContent = isEmojiOnly(this.value) ? '' : 'Только смайлы';
  });
  document.getElementById('symCharInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveSym(); }
  });
  document.getElementById('symWordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveSym(); }
  });

  /* ===== режим слов ===== */
  wordsModeBtn.addEventListener('click', () => {
    wordsMode = !wordsMode;
    document.body.classList.toggle('words-mode', wordsMode);
    wordsModeBtn.classList.toggle('on', wordsMode);
  });

  /* ===== словарь ===== */
  const dictModal = document.getElementById('dictModal');
  document.getElementById('dictionaryBtn').addEventListener('click', () => {
    const list = document.getElementById('dictList');
    list.innerHTML = '';
    const syms = Store.get().symbols.slice().sort((a, b) => String(b.created).localeCompare(String(a.created)));
    if (!syms.length) {
      const n = document.createElement('div');
      n.style.cssText = 'color:#6b6b7b;font-size:14px;padding:10px 0;';
      n.textContent = 'Словарь пуст. Пиши слова или смайлы в редакторе.';
      list.appendChild(n);
    } else {
      syms.forEach(s => {
        const chip = document.createElement('button');
        chip.className = 'dict-chip';
        chip.textContent = s.char;
        if (s.word) {
          const w = document.createElement('span');
          w.className = 'w'; w.textContent = ':' + s.word;
          chip.appendChild(w);
        }
        chip.addEventListener('click', () => {
          askConfirm('Удалить символ?', s.char + (s.word ? ' : ' + s.word : ''), () => {
            deleteSymbol(s.id);
            dictModal.classList.add('hidden');
            if (NAV.dayId) renderPreview(); else renderDays();
            toast('Удалено');
          });
        });
        list.appendChild(chip);
      });
    }
    dictModal.classList.remove('hidden');
  });
  document.getElementById('dictCloseBtn').addEventListener('click', () => dictModal.classList.add('hidden'));

  /* ===== дни ===== */
  document.getElementById('addDayBtn').addEventListener('click', () => {
    const d = createDay();
    NAV.dayId = d.id;
    render();
    setTimeout(() => editorEl.focus(), 100);
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    askConfirm('Очистить всё?', 'Все дни и все символы будут удалены.', () => {
      Store.get().days = [];
      Store.get().symbols = [];
      NAV.dayId = null;
      Store.save();
      render();
      toast('Очищено');
    });
  });

  /* ===== экспорт ===== */
  document.getElementById('exportBtn').addEventListener('click', () => {
    try {
      const data = JSON.stringify(Store.get(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ubezhdeniya.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Сохранено');
    } catch (e) { toast('Ошибка'); }
  });

  /* ===== старт ===== */
  Store.load();
  if (!Store.isOk()) toast('Хранилище недоступно');
  render();
})();
</script>
</body>
</html>
