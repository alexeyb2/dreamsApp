<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Neuron Cleaner - Puzzle</title>
    <style>
        body {
            background-color: #FDF5E6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #5C4033;
            user-select: none;
        }
        canvas {
            background-color: #FDF5E6;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header {
            margin-bottom: 15px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #8B4513;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.7;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #8B4513;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #A0522D;
        }
        button:active {
            transform: scale(0.95);
        }
        .win-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(253, 245, 230, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            display: none;
            pointer-events: none;
        }
        .win-message h2 {
            margin: 0 0 10px 0;
            color: #8B4513;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="levelTitle">Уровень 1</h1>
        <p>Нажимай на стрелки, чтобы они вылетели.</p>
    </div>

    <canvas id="gameCanvas" width="450" height="450"></canvas>

    <div class="controls">
        <button id="restartBtn">Заново</button>
        <button id="nextBtn" style="display: none;">Следующий уровень</button>
    </div>

    <div id="winMessage" class="win-message">
        <h2>Уровень пройден!</h2>
        <p>Нажми "Следующий уровень"</p>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelTitle = document.getElementById('levelTitle');
    const restartBtn = document.getElementById('restartBtn');
    const nextBtn = document.getElementById('nextBtn');
    const winMessage = document.getElementById('winMessage');

    // --- Настройки ---
    const GRID_SIZE = 45;
    const COLS = 9;
    const ROWS = 9;
    const OFFSET_X = (canvas.width - COLS * GRID_SIZE) / 2;
    const OFFSET_Y = (canvas.height - ROWS * GRID_SIZE) / 2;
    const ARROW_LENGTH = 3 * GRID_SIZE; // Длина стрелки
    const SPEED = 8; // Скорость движения

    let currentLevel = 0;
    let arrows = [];
    let animationId;
    let isGameWon = false;

    // --- Данные уровней (ручной набор) ---
    // Координаты в клетках сетки (x: 0..8, y: 0..8)
    const levels = [
        // Уровень 1: Одна простая стрелка вправо
        [
            { points: [{x: 2, y: 4}, {x: 6, y: 4}], dir: 'right' }
        ],
        // Уровень 2: Две стрелки, одна блокирует другую
        [
            { points: [{x: 2, y: 2}, {x: 6, y: 2}], dir: 'right' },
            { points: [{x: 4, y: 5}, {x: 4, y: 1}], dir: 'up' } // Эта стрелка мешает первой, её нужно нажать первой
        ],
        // Уровень 3: Г-образная стрелка
        [
            { points: [{x: 2, y: 2}, {x: 2, y: 6}, {x: 6, y: 6}], dir: 'right' }
        ],
        // Уровень 4: Две Г-образные стрелки
        [
            { points: [{x: 2, y: 2}, {x: 2, y: 6}, {x: 5, y: 6}], dir: 'right' },
            { points: [{x: 6, y: 1}, {x: 6, y: 5}, {x: 3, y: 5}], dir: 'left' }
        ]
    ];

    // --- Класс Стрелки ---
    class Arrow {
        constructor(data) {
            // Конвертируем координаты сетки в пиксели
            this.points = data.points.map(p => ({
                x: p.x * GRID_SIZE + OFFSET_X + GRID_SIZE / 2,
                y: p.y * GRID_SIZE + OFFSET_Y + GRID_SIZE / 2
            }));
            
            this.segments = [];
            this.totalLength = 0;
            this.traveled = 0;
            this.state = 'idle'; // idle, moving, cleared
            this.isHovered = false;
            
            // Строим сегменты для расчета длины
            for (let i = 0; i < this.points.length - 1; i++) {
                const p1 = this.points[i];
                const p2 = this.points[i + 1];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const length = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                this.segments.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, length, angle });
                this.totalLength += length;
            }
            
            this.headPos = this.getPointAtDistance(0);
        }

        // Получить точку на расстоянии dist от начала
        getPointAtDistance(dist) {
            if (dist <= 0) {
                const seg = this.segments[0];
                return { x: seg.x1, y: seg.y1, angle: seg.angle };
            }
            if (dist >= this.totalLength) {
                const lastSeg = this.segments[this.segments.length - 1];
                const extra = dist - this.totalLength;
                return {
                    x: lastSeg.x2 + Math.cos(lastSeg.angle) * extra,
                    y: lastSeg.y2 + Math.sin(lastSeg.angle) * extra,
                    angle: lastSeg.angle
                };
            }
            
            let currentDist = 0;
            for (let seg of this.segments) {
                if (currentDist + seg.length >= dist) {
                    const t = (dist - currentDist) / seg.length;
                    return {
                        x: seg.x1 + (seg.x2 - seg.x1) * t,
                        y: seg.y1 + (seg.y2 - seg.y1) * t,
                        angle: seg.angle
                    };
                }
                currentDist += seg.length;
            }
        }

        // Получить массив точек для отрисовки тела
        getBodyPoints() {
            const tailDist = this.traveled - ARROW_LENGTH;
            const headDist = this.traveled;
            
            let result = [];
            let startDist = Math.max(0, tailDist);
            let endDist = Math.min(this.totalLength, headDist);

            // Если хвост еще не дошел до конца пути
            if (startDist < endDist) {
                result.push(this.getPointAtDistance(startDist));
                
                let currentDist = 0;
                for (let seg of this.segments) {
                    if (currentDist + seg.length > startDist && currentDist < endDist) {
                        let segStart = Math.max(startDist, currentDist);
                        let segEnd = Math.min(endDist, currentDist + seg.length);
                        
                        let t1 = (segStart - currentDist) / seg.length;
                        let t2 = (segEnd - currentDist) / seg.length;
                        
                        result.push({
                            x: seg.x1 + (seg.x2 - seg.x1) * t1,
                            y: seg.y1 + (seg.y2 - seg.y1) * t1
                        });
                        result.push({
                            x: seg.x1 + (seg.x2 - seg.x1) * t2,
                            y: seg.y1 + (seg.y2 - seg.y1) * t2
                        });
                    }
                    currentDist += seg.length;
                    if (currentDist > endDist) break;
                }
            }

            // Если голова ушла дальше конца пути
            if (headDist > this.totalLength) {
                result.push(this.getPointAtDistance(this.totalLength));
                result.push(this.getPointAtDistance(headDist));
            }

            return result;
        }

        update() {
            if (this.state !== 'moving') return;

            this.traveled += SPEED;
            this.headPos = this.getPointAtDistance(this.traveled);

            // Проверка на вылет за экран
            if (this.headPos.x < -100 || this.headPos.x > canvas.width + 100 ||
                this.headPos.y < -100 || this.headPos.y > canvas.height + 100) {
                this.state = 'cleared';
                return;
            }

            // Проверка столкновений с другими стрелками
            for (let other of arrows) {
                if (other === this || other.state === 'cleared') continue;
                
                // Проверяем, не попала ли голова в тело другой стрелки
                const dist = this.pointToArrowDistance(this.headPos, other);
                if (dist < 12) {
                    // Столкновение! Откатываем назад
                    this.traveled -= SPEED;
                    this.headPos = this.getPointAtDistance(this.traveled);
                    this.state = 'idle';
                    break;
                }
            }
        }

        pointToArrowDistance(pt, otherArrow) {
            let minDist = Infinity;
            for (let seg of otherArrow.segments) {
                const dist = this.pointToSegmentDistance(pt.x, pt.y, seg.x1, seg.y1, seg.x2, seg.y2);
                if (dist < minDist) minDist = dist;
            }
            return minDist;
        }

        pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            const dot = A * C + B * D;
            const len_sq = C * C + D * D;
            let param = -1;
            if (len_sq != 0) param = dot / len_sq;
            let xx, yy;
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }
            const dx = px - xx;
            const dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        draw() {
            if (this.state === 'cleared') return;

            const bodyPoints = this.getBodyPoints();
            if (bodyPoints.length < 2) return;

            // Рисуем тело
            ctx.beginPath();
            ctx.strokeStyle = this.isHovered ? '#A0522D' : '#8B4513';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.moveTo(bodyPoints[0].x, bodyPoints[0].y);
            for (let i = 1; i < bodyPoints.length; i++) {
                ctx.lineTo(bodyPoints[i].x, bodyPoints[i].y);
            }
            ctx.stroke();

            // Рисуем голову (стрелку)
            if (this.state === 'idle' || this.state === 'moving') {
                this.drawArrowHead(this.headPos.x, this.headPos.y, this.headPos.angle);
            }
        }

        drawArrowHead(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-18, -10);
            ctx.lineTo(-18, 10);
            ctx.closePath();
            ctx.fillStyle = this.isHovered ? '#A0522D' : '#8B4513';
            ctx.fill();
            ctx.restore();
        }

        isClicked(mx, my) {
            if (this.state !== 'idle') return false;
            const dist = Math.hypot(mx - this.headPos.x, my - this.headPos.y);
            return dist < 30;
        }

        checkHover(mx, my) {
            if (this.state !== 'idle') return false;
            const dist = Math.hypot(mx - this.headPos.x, my - this.headPos.y);
            this.isHovered = dist < 30;
            return this.isHovered;
        }
    }

    // --- Игровой цикл и логика ---

    function initLevel(index) {
        currentLevel = index;
        levelTitle.textContent = `Уровень ${index + 1}`;
        
        // Создаем стрелки из данных уровня
        arrows = levels[index].map(data => new Arrow(data));
        
        isGameWon = false;
        winMessage.style.display = 'none';
        nextBtn.style.display = 'none';
        
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < COLS; i++) {
            for (let j = 0; j < ROWS; j++) {
                const x = i * GRID_SIZE + OFFSET_X + GRID_SIZE / 2;
                const y = j * GRID_SIZE + OFFSET_Y + GRID_SIZE / 2;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#D2B48C';
                ctx.fill();
            }
        }
    }

    function checkWin() {
        const allCleared = arrows.every(a => a.state === 'cleared');
        if (allCleared && !isGameWon) {
            isGameWon = true;
            winMessage.style.display = 'block';
            
            // Если есть следующий уровень, показываем кнопку
            if (currentLevel < levels.length - 1) {
                nextBtn.style.display = 'inline-block';
            } else {
                levelTitle.textContent = 'Все уровни пройдены!';
            }
        }
    }

    function gameLoop() {
        drawGrid();
        
        arrows.forEach(a => {
            a.update();
            a.draw();
        });

        checkWin();
        animationId = requestAnimationFrame(gameLoop);
    }

    // --- Управление ---

    canvas.addEventListener('mousemove', (e) => {
        if (isGameWon) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let cursorChanged = false;
        arrows.forEach(a => {
            if (a.checkHover(mx, my)) cursorChanged = true;
        });
        canvas.style.cursor = cursorChanged ? 'pointer' : 'crosshair';
    });

    canvas.addEventListener('mousedown', (e) => {
        if (isGameWon) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Ищем стрелку, по которой кликнули (с конца массива, чтобы верхние были в приоритете)
        for (let i = arrows.length - 1; i >= 0; i--) {
            const arrow = arrows[i];
            if (arrow.isClicked(mx, my)) {
                arrow.state = 'moving';
                break;
            }
        }
    });

    // Кнопки
    restartBtn.addEventListener('click', () => {
        initLevel(currentLevel);
    });

    nextBtn.addEventListener('click', () => {
        if (currentLevel < levels.length - 1) {
            initLevel(currentLevel + 1);
        }
    });

    // Запуск первого уровня
    initLevel(0);

</script>
</body>
</html>
