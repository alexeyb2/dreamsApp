<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FDF5E6">
<title>Arrow Labyrinth</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0;
        height: 100%;
        overflow: hidden;
        background: #FDF5E6;
        color: #5C4033;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none; -webkit-user-select: none;
        touch-action: none; overscroll-behavior: none;
        position: fixed; inset: 0;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

    #topbar {
        position: fixed; top: 0; left: 0; right: 0;
        padding: 8px 12px;
        padding-top: calc(8px + env(safe-area-inset-top));
        display: flex; align-items: center; gap: 8px;
        z-index: 10; pointer-events: none;
    }
    #topbar .side {
        display: flex; gap: 6px; pointer-events: auto;
    }
    #topbar .side.right { margin-left: auto; }
    #topbar .center {
        flex: 1; text-align: center; pointer-events: none;
    }
    #levelLabel {
        font-size: 17px; font-weight: 700; color: #8B4513;
        letter-spacing: 0.5px;
    }
    #levelSub {
        font-size: 10px; font-weight: 700; color: #7B68EE;
        letter-spacing: 2px; text-transform: uppercase;
        margin-top: 1px;
    }
    #levelSub.easy { color: #27AE60; }
    #levelSub.medium { color: #E67E22; }
    #levelSub.hard { color: #8E44AD; }

    .icon-btn {
        background: rgba(139, 69, 19, 0.08);
        border: none;
        width: 40px; height: 40px;
        border-radius: 50%;
        color: #8B4513; font-size: 18px;
        cursor: pointer; font-family: inherit;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s;
        padding: 0;
    }
    .icon-btn:active { background: rgba(139, 69, 19, 0.2); }

    #hint {
        position: fixed;
        top: calc(58px + env(safe-area-inset-top));
        left: 50%; transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(139, 69, 19, 0.15);
        border-radius: 20px;
        padding: 8px 18px;
        font-size: 13px; font-weight: 600; color: #8B4513;
        box-shadow: 0 4px 16px rgba(139, 69, 19, 0.12);
        z-index: 9; pointer-events: none;
        white-space: nowrap;
        transition: opacity 0.3s;
    }
    #hint.hidden { opacity: 0; }

    #bottom {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 12px 18px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        text-align: center;
        z-index: 9; pointer-events: none;
    }
    #progressWrap {
        width: 200px; height: 3px;
        background: rgba(139, 69, 19, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin: 0 auto;
    }
    #progressBar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #A0522D, #8B4513);
        transition: width 0.15s linear;
    }

    .overlay {
        position: fixed; inset: 0;
        background: rgba(253, 245, 230, 0.96);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        z-index: 30;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 24px; text-align: center;
        transition: opacity 0.25s;
        overflow-y: auto;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { margin: 0 0 8px 0; font-size: 24px; color: #8B4513; }
    .stars { font-size: 40px; letter-spacing: 8px; margin: 12px 0; }
    .stat { font-size: 14px; color: rgba(92, 64, 51, 0.75); margin: 4px 0; }

    .btn {
        background: linear-gradient(135deg, #A0522D, #8B4513);
        color: white; border: none;
        padding: 13px 28px; border-radius: 14px;
        font-size: 15px; font-weight: 600;
        cursor: pointer; font-family: inherit;
        box-shadow: 0 6px 16px rgba(139, 69, 19, 0.25);
        transition: transform 0.12s;
        margin: 4px;
    }
    .btn:active { transform: scale(0.95); }
    .btn-outline {
        background: transparent; color: #8B4513;
        border: 2px solid #8B4513; box-shadow: none;
    }

    #levelGrid {
        display: grid; grid-template-columns: repeat(5, 1fr);
        gap: 10px; width: 100%; max-width: 340px;
        margin: 16px 0;
    }
    .level-cell {
        aspect-ratio: 1;
        display: flex; align-items: center; justify-content: center;
        background: rgba(139, 69, 19, 0.08);
        border-radius: 12px;
        font-weight: 700; font-size: 16px;
        color: #8B4513; cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.15s;
        position: relative;
    }
    .level-cell.locked { opacity: 0.3; cursor: not-allowed; }
    .level-cell.current {
        border-color: #8B4513;
        background: rgba(139, 69, 19, 0.15);
    }
    .level-cell:active:not(.locked) { transform: scale(0.94); }
    .level-cell .stars-mini {
        position: absolute; bottom: 3px;
        font-size: 8px; color: #F39C12; letter-spacing: 1px;
    }

    #loader {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 15px; color: #8B4513;
        text-align: center;
        z-index: 50;
    }
    #loader.hidden { display: none; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="topbar">
    <div class="side">
        <button id="homeBtn" class="icon-btn" aria-label="Домой">←</button>
    </div>
    <div class="center">
        <div id="levelLabel">Уровень 1</div>
        <div id="levelSub" class="easy">EASY</div>
    </div>
    <div class="side right">
        <button id="hintBtn" class="icon-btn" aria-label="Подсказка">💡</button>
        <button id="menuBtn" class="icon-btn" aria-label="Меню">⚙</button>
    </div>
</div>

<div id="hint" class="hidden"></div>

<div id="bottom">
    <div id="progressWrap"><div id="progressBar"></div></div>
</div>

<!-- ПОБЕДА -->
<div id="winOverlay" class="overlay hidden">
    <h2>Уровень пройден!</h2>
    <div id="stars" class="stars">⭐⭐⭐</div>
    <div class="stat" id="winMoves"></div>
    <div class="stat" id="winTime"></div>
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center;">
        <button id="winRestartBtn" class="btn btn-outline">Заново</button>
        <button id="nextBtn" class="btn">Дальше →</button>
    </div>
</div>

<!-- МЕНЮ -->
<div id="menuOverlay" class="overlay hidden">
    <h2>Уровни</h2>
    <div id="levelGrid"></div>
    <button id="closeMenuBtn" class="btn btn-outline">Закрыть</button>
</div>

<div id="loader">Загрузка…</div>

<script>
(() => {
'use strict';

// =====================================================
//  КОНСТАНТЫ
// =====================================================
const LS_KEY = 'arrow-labyrinth-v1';
const MAX_LEVELS_IN_MENU = 60;

const COLORS = {
    bg:    '#FDF5E6',
    dot:   '#E8D5B7',
    arrow: '#8B4513',
    arrowHover: '#A0522D',
    arrowHint: '#E67E22',
    arrowBlocked: '#C0392B',
};

// =====================================================
//  DOM
// =====================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const levelLabel = document.getElementById('levelLabel');
const levelSub = document.getElementById('levelSub');
const hintEl = document.getElementById('hint');
const progressBar = document.getElementById('progressBar');
const winOverlay = document.getElementById('winOverlay');
const menuOverlay = document.getElementById('menuOverlay');
const levelGrid = document.getElementById('levelGrid');
const starsEl = document.getElementById('stars');
const winMoves = document.getElementById('winMoves');
const winTime = document.getElementById('winTime');
const loader = document.getElementById('loader');

const homeBtn = document.getElementById('homeBtn');
const menuBtn = document.getElementById('menuBtn');
const hintBtn = document.getElementById('hintBtn');
const closeMenuBtn = document.getElementById('closeMenuBtn');
const winRestartBtn = document.getElementById('winRestartBtn');
const nextBtn = document.getElementById('nextBtn');

// =====================================================
//  TELEGRAM
// =====================================================
const tg = window.Telegram?.WebApp;
function tgInit() {
    if (!tg) return;
    try { tg.ready(); } catch(e) {}
    try { tg.expand(); } catch(e) {}
    try { tg.setHeaderColor('#FDF5E6'); } catch(e) {}
    try { tg.setBackgroundColor('#FDF5E6'); } catch(e) {}
    try { tg.disableVerticalSwipes?.(); } catch(e) {}
    try { tg.requestFullscreen?.(); } catch(e) {}
    try {
        tg.onEvent?.('viewportChanged', () => setTimeout(resize, 60));
        tg.onEvent?.('fullscreenChanged', () => setTimeout(resize, 60));
    } catch(e) {}
}
function haptic(type = 'light') {
    if (!tg?.HapticFeedback) return;
    try {
        if (type === 'light')   tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium')  tg.HapticFeedback.impactOccurred('medium');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
    } catch(e) {}
}

// =====================================================
//  СОСТОЯНИЕ
// =====================================================
let W = 0, H = 0, DPR = 1;
let cellSize = 32;
let camera = { x: 0, y: 0 };
let level = { num: 1, cols: 14, rows: 20, arrows: [] };
let progress = {};       // { levelNum: { stars, moves, timeMs } }
let currentLevelNum = 1;
let isWon = false;
let levelStartTime = 0;
let movesCount = 0;
let particles = [];
let lastHintTime = 0;

// Указатель
const pointer = {
    down: false,
    startX: 0, startY: 0,
    lastX: 0, lastY: 0,
    moved: false,
    downTime: 0,
    clickId: null,
};

// =====================================================
//  PRNG
// =====================================================
function mulberry32(seed) {
    return function() {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = seed;
        t = Math.imul(t ^ (t >>> 15), 1 | t);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// =====================================================
//  РАЗМЕР
// =====================================================
function resize() {
    const vv = window.visualViewport;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
    H = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recalcCellSize();
    centerCamera();
}

function recalcCellSize() {
    // На мобильном стараемся уместить уровень на экране
    // Минимум: 26px, максимум: 42px
    const padding = 20;
    const availW = W - padding * 2;
    const availH = H - 140 - padding; // 140 - top + bottom UI
    const cw = availW / level.cols;
    const ch = availH / level.rows;
    cellSize = Math.max(22, Math.min(cw, ch, 44));
}

function centerCamera() {
    const gridW = level.cols * cellSize;
    const gridH = level.rows * cellSize;

    if (gridW <= W) {
        camera.x = -(W - gridW) / 2;
    } else {
        camera.x = -(gridW - W) / 2;
    }

    // сдвигаем вниз на топбар + небольшой отступ
    const topOffset = 100;
    const bottomOffset = 70;
    const availH = H - topOffset - bottomOffset;
    if (gridH <= availH) {
        camera.y = topOffset - (availH - gridH) / 2;
    } else {
        camera.y = topOffset;
    }
}

// =====================================================
//  УТИЛИТЫ
// =====================================================
function cellToPixel(cx, cy) {
    return {
        px: cx * cellSize + camera.x,
        py: cy * cellSize + camera.y,
    };
}

function pixelToCell(px, py) {
    return {
        cx: (px - camera.x) / cellSize,
        cy: (py - camera.y) / cellSize,
    };
}

// =====================================================
//  ГЕНЕРАЦИЯ УРОВНЯ
// =====================================================

// Спецификация уровня — сложность растёт с номером
function levelSpec(n) {
    if (n === 1)  return { cols: 10, rows: 14, arrows: 5,  maxLen: 3, turns: 0 };
    if (n === 2)  return { cols: 10, rows: 14, arrows: 8,  maxLen: 3, turns: 1 };
    if (n === 3)  return { cols: 12, rows: 16, arrows: 12, maxLen: 4, turns: 1 };
    if (n === 4)  return { cols: 12, rows: 16, arrows: 16, maxLen: 4, turns: 1 };
    if (n === 5)  return { cols: 12, rows: 18, arrows: 20, maxLen: 5, turns: 1 };
    if (n <= 8)   return { cols: 13, rows: 19, arrows: 22 + (n - 5) * 2, maxLen: 5, turns: 1 };
    if (n <= 12)  return { cols: 14, rows: 20, arrows: 28 + (n - 8) * 2, maxLen: 6, turns: 2 };
    if (n <= 20)  return { cols: 15, rows: 22, arrows: 34 + (n - 12), maxLen: 7, turns: 2 };
    if (n <= 30)  return { cols: 16, rows: 24, arrows: 42 + (n - 20), maxLen: 8, turns: 2 };
    return           { cols: 18, rows: 26, arrows: Math.min(70, 52 + (n - 30)), maxLen: 8, turns: 2 };
}

function difficultyOf(n) {
    if (n <= 4)  return 'easy';
    if (n <= 12) return 'medium';
    return 'hard';
}

// Пробуем разместить одну случайную стрелку
function tryRandomArrow(rand, spec, occupied) {
    // стартовая клетка — свободная
    for (let tries = 0; tries < 20; tries++) {
        const sx = Math.floor(rand() * spec.cols);
        const sy = Math.floor(rand() * spec.rows);
        if (occupied.has(sx + ',' + sy)) continue;

        const points = [[sx, sy]];
        let cx = sx, cy = sy;
        let lastDir = null;
        const segCount = 1 + Math.floor(rand() * 2); // 1-2 сегмента
        let ok = true;

        for (let s = 0; s < segCount; s++) {
            const len = 2 + Math.floor(rand() * (spec.maxLen - 1)); // 2..maxLen
            let dir;
            if (lastDir === null) {
                // первое направление — любое
                const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                dir = dirs[Math.floor(rand() * 4)];
            } else {
                // поворот на 90° или продолжение
                if (spec.turns >= 1 && rand() < 0.7) {
                    // поворот
                    const perps = lastDir[0] !== 0 ? [[0,1],[0,-1]] : [[1,0],[-1,0]];
                    dir = perps[Math.floor(rand() * 2)];
                } else {
                    dir = lastDir;
                }
            }

            for (let i = 0; i < len; i++) {
                cx += dir[0];
                cy += dir[1];
                if (cx < 0 || cx >= spec.cols || cy < 0 || cy >= spec.rows) { ok = false; break; }
                if (occupied.has(cx + ',' + cy)) { ok = false; break; }
                points.push([cx, cy]);
            }
            if (!ok) break;
            lastDir = dir;
        }

        if (!ok) continue;
        if (points.length < 3) continue;
        return points;
    }
    return null;
}

// Проверка что путь от наконечника свободен (для новых стрелок)
function flightClearFromPoints(points, occupied, spec) {
    const last = points[points.length - 1];
    const prev = points[points.length - 2];
    const dx = last[0] - prev[0];
    const dy = last[1] - prev[1];
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;

    // идём от последней клетки
    let cx = last[0], cy = last[1];
    for (let step = 0; step < 200; step++) {
        cx += ux;
        cy += uy;
        const rx = Math.round(cx);
        const ry = Math.round(cy);
        if (rx < 0 || rx >= spec.cols || ry < 0 || ry >= spec.rows) return true;
        // проверяем все клетки вокруг текущей позиции (стрелка имеет толщину)
        for (let ox = -1; ox <= 1; ox++) {
            for (let oy = -1; oy <= 1; oy++) {
                if (occupied.has((rx + ox) + ',' + (ry + oy))) {
                    return false;
                }
            }
        }
    }
    return true;
}

function generateLevel(n) {
    const spec = levelSpec(n);
    const seed = n * 7919 + 12345;

    for (let attempt = 0; attempt < 40; attempt++) {
        const rand = mulberry32(seed + attempt * 1000);
        const arrows = [];
        const occupied = new Set();

        let placed = 0;
        for (let k = spec.arrows; k >= 1; k--) {
            let ok = false;
            for (let tryA = 0; tryA < 80; tryA++) {
                const points = tryRandomArrow(rand, spec, occupied);
                if (!points) continue;
                // Проверяем что путь от наконечника свободен
                if (!flightClearFromPoints(points, occupied, spec)) continue;
                arrows.push(points);
                for (const p of points) occupied.add(p[0] + ',' + p[1]);
                placed++;
                ok = true;
                break;
            }
            if (!ok) break;
        }

        if (placed >= Math.max(3, Math.floor(spec.arrows * 0.75))) {
            // разворачиваем: последняя размещённая — первая в решении
            return {
                num: n,
                cols: spec.cols,
                rows: spec.rows,
                arrows: arrows.reverse().map(pts => ({
                    points: pts,
                    state: 'idle',
                    offset: { x: 0, y: 0 },
                    hintUntil: 0,
                })),
            };
        }
    }

    // Fallback — простой уровень
    return {
        num: n,
        cols: 9,
        rows: 12,
        arrows: [
            { points: [[1,1],[1,4]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
            { points: [[4,1],[4,4]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
            { points: [[1,6],[4,6]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
        ],
    };
}

// =====================================================
//  ПРОВЕРКА КЛИКАБЕЛЬНОСТИ
// =====================================================
function headPosition(arrow) {
    const p = arrow.points[arrow.points.length - 1];
    return { cx: p[0], cy: p[1] };
}

function flightDirection(arrow) {
    const pts = arrow.points;
    const last = pts[pts.length - 1];
    const prev = pts[pts.length - 2];
    const dx = last[0] - prev[0];
    const dy = last[1] - prev[1];
    const len = Math.hypot(dx, dy) || 1;
    return { ux: dx / len, uy: dy / len };
}

function isClickable(arrow) {
    if (arrow.state !== 'idle') return false;
    const head = headPosition(arrow);
    const { ux, uy } = flightDirection(arrow);

    // строим карту занятости от других стрелок
    const occupied = new Set();
    for (const other of level.arrows) {
        if (other === arrow) continue;
        if (other.state === 'cleared') continue;
        for (const p of other.points) occupied.add(p[0] + ',' + p[1]);
    }

    let cx = head.cx, cy = head.cy;
    for (let step = 0; step < 300; step++) {
        cx += ux;
        cy += uy;
        const rx = Math.round(cx);
        const ry = Math.round(cy);
        if (rx < 0 || rx >= level.cols || ry < 0 || ry >= level.rows) return true;
        // проверяем окрестность для более точной коллизии
        for (let ox = -1; ox <= 1; ox++) {
            for (let oy = -1; oy <= 1; oy++) {
                if (occupied.has((rx + ox) + ',' + (ry + oy))) return false;
            }
        }
    }
    return false;
}

function countClickable() {
    return level.arrows.filter(a => a.state === 'idle' && isClickable(a)).length;
}

// =====================================================
//  ЧАСТИЦЫ
// =====================================================
function spawnParticles(px, py, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3.5;
        particles.push({
            x: px, y: py,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 1, decay: 0.02 + Math.random() * 0.02,
            size: 1.5 + Math.random() * 2,
            color,
        });
    }
}

// =====================================================
//  ОБНОВЛЕНИЕ
// =====================================================
function updateArrows(dt) {
    const speed = cellSize * 0.35;

    for (const arrow of level.arrows) {
        if (arrow.state !== 'moving') continue;

        const { ux, uy } = flightDirection(arrow);
        arrow.offset.x += ux * speed;
        arrow.offset.y += uy * speed;

        // Голова стрелки в пикселях
        const head = headPosition(arrow);
        const { px, py } = cellToPixel(head.cx, head.cy);
        const hp = { x: px + arrow.offset.x, y: py + arrow.offset.y };

        // Партиклы
        if (Math.random() < 0.5) {
            particles.push({
                x: hp.x, y: hp.y,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                life: 1, decay: 0.03, size: 1.5,
                color: COLORS.arrow,
            });
        }

        // Улетела за экран?
        if (hp.x < -100 || hp.x > W + 100 || hp.y < -100 || hp.y > H + 100) {
            arrow.state = 'cleared';
            spawnParticles(hp.x, hp.y, COLORS.arrow, 12);
        }
    }

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// =====================================================
//  ОТРИСОВКА
// =====================================================
function draw() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // Сетка точек
    const gridW = level.cols * cellSize;
    const gridH = level.rows * cellSize;
    ctx.fillStyle = COLORS.dot;
    for (let i = 0; i <= level.cols; i++) {
        for (let j = 0; j <= level.rows; j++) {
            const x = i * cellSize + camera.x;
            const y = j * cellSize + camera.y;
            if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
            ctx.beginPath();
            ctx.arc(x, y, 1.6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Стрелки
    for (const arrow of level.arrows) {
        if (arrow.state === 'cleared') continue;
        drawArrow(arrow);
    }

    // Частицы
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Прогресс
    const total = level.arrows.length;
    const cleared = level.arrows.filter(a => a.state === 'cleared').length;
    progressBar.style.width = ((cleared / total) * 100).toFixed(1) + '%';
}

function drawArrow(arrow) {
    const pts = arrow.points;
    const now = Date.now();

    // Определяем цвет
    let color = COLORS.arrow;
    if (arrow.hintUntil > now) color = COLORS.arrowHint;

    // Строим путь в пикселях
    const pixelPts = pts.map(p => {
        const { px, py } = cellToPixel(p[0], p[1]);
        return { x: px + arrow.offset.x, y: py + arrow.offset.y };
    });

    // Пульсация для кликабельных
    let lineWidth = Math.max(4, cellSize * 0.18);
    let alpha = 1;
    if (arrow.state === 'idle') {
        const clickable = isClickable(arrow);
        if (clickable) {
            const pulse = 0.85 + 0.15 * Math.sin(now * 0.004 + arrow.points.length);
            alpha = pulse;
        } else {
            alpha = 0.55;
        }
    }

    ctx.globalAlpha = alpha;

    // Линия
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
    for (let i = 1; i < pixelPts.length; i++) {
        ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
    }
    ctx.stroke();

    // Наконечник
    const last = pixelPts[pixelPts.length - 1];
    const prev = pixelPts[pixelPts.length - 2];
    const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
    const headSize = Math.max(7, cellSize * 0.32);

    ctx.save();
    ctx.translate(last.x, last.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-headSize, -headSize * 0.55);
    ctx.lineTo(-headSize, headSize * 0.55);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();

    // Кольцо пульсации
    if (arrow.state === 'idle' && isClickable(arrow) && arrow.hintUntil <= now) {
        const r = headSize * 1.7 + 3 * Math.sin(now * 0.004);
        ctx.strokeStyle = 'rgba(160, 82, 45, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(last.x, last.y, r, 0, Math.PI * 2);
        ctx.stroke();
    }
    if (arrow.hintUntil > now) {
        const r = headSize * 2 + 5 * Math.sin(now * 0.01);
        ctx.strokeStyle = 'rgba(230, 126, 34, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(last.x, last.y, r, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.globalAlpha = 1;
}

// =====================================================
//  ЦИКЛ
// =====================================================
let lastFrameTime = 0;
function loop(t) {
    const dt = Math.min(50, t - lastFrameTime) / 1000;
    lastFrameTime = t;

    updateArrows(dt);
    draw();

    // Проверка победы
    if (!isWon && level.arrows.every(a => a.state === 'cleared')) {
        onWin();
    }

    // Обновляем подсказку вверху
    const clickable = countClickable();
    if (!isWon) {
        if (clickable > 0) {
            hintEl.textContent = clickable === 1
                ? '1 стрелка может двигаться'
                : `${clickable} стрелок могут двигаться`;
            hintEl.classList.remove('hidden');
        } else {
            hintEl.textContent = 'Застряли? Попробуйте перезапустить';
            hintEl.classList.remove('hidden');
        }
    }

    requestAnimationFrame(loop);
}

// =====================================================
//  ИГРА
// =====================================================
function startLevel(n) {
    currentLevelNum = n;
    level = generateLevel(n);
    isWon = false;
    movesCount = 0;
    levelStartTime = Date.now();
    particles = [];
    winOverlay.classList.add('hidden');

    levelLabel.textContent = 'Уровень ' + n;
    const diff = difficultyOf(n);
    levelSub.textContent = diff.toUpperCase();
    levelSub.className = diff;

    resize();
    hintEl.classList.remove('hidden');
}

function onWin() {
    isWon = true;
    hintEl.classList.add('hidden');
    const timeMs = Date.now() - levelStartTime;
    const timeSec = (timeMs / 1000).toFixed(1);

    // Пар: количество стрелок
    const par = level.arrows.length;
    let stars = 3;
    if (movesCount > par) stars = movesCount > par + 2 ? 1 : 2;

    starsEl.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    winMoves.textContent = `Ходов: ${movesCount} (минимум: ${par})`;
    winTime.textContent = `Время: ${timeSec} сек`;
    winOverlay.classList.remove('hidden');

    haptic('success');

    // Сохраняем прогресс
    const prev = progress[n] || { stars: 0, moves: 0, timeMs: 0 };
    if (stars > prev.stars || (stars === prev.stars && movesCount < prev.moves)) {
        progress[n] = { stars, moves: movesCount, timeMs };
        saveProgress();
    }
}

function saveProgress() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch(e) {}
}
function loadProgress() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e) { return {}; }
}

// =====================================================
//  ВВОД
// =====================================================
function getPointerPos(e) {
    const r = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    return {
        x: clientX - r.left,
        y: clientY - r.top,
    };
}

function onDown(e) {
    if (e.cancelable) e.preventDefault();
    if (isWon) return;

    const p = getPointerPos(e);
    pointer.down = true;
    pointer.startX = p.x;
    pointer.startY = p.y;
    pointer.lastX = p.x;
    pointer.lastY = p.y;
    pointer.moved = false;
    pointer.downTime = Date.now();
}

function onMove(e) {
    if (!pointer.down) return;
    if (e.cancelable) e.preventDefault();

    const p = getPointerPos(e);
    const dx = p.x - pointer.lastX;
    const dy = p.y - pointer.lastY;

    const totalDx = Math.abs(p.x - pointer.startX);
    const totalDy = Math.abs(p.y - pointer.startY);
    if (totalDx + totalDy > 8) pointer.moved = true;

    if (pointer.moved) {
        camera.x += dx;
        camera.y += dy;
    }

    pointer.lastX = p.x;
    pointer.lastY = p.y;
}

function onUp(e) {
    if (!pointer.down) return;
    pointer.down = false;

    // Если это был не drag, а клик — обрабатываем
    const dt = Date.now() - pointer.downTime;
    if (!pointer.moved && dt < 400) {
        handleClick(pointer.startX, pointer.startY);
    }
}

function handleClick(px, py) {
    if (isWon) return;

    // Ищем стрелку, у которой наконечник ближайший к клику
    let best = null;
    let bestDist = Infinity;
    const hitRadius = Math.max(20, cellSize * 0.9);

    for (const arrow of level.arrows) {
        if (arrow.state !== 'idle') continue;
        const head = headPosition(arrow);
        const { px: hpx, py: hpy } = cellToPixel(head.cx, head.cy);
        const d = Math.hypot(hpx - px, hpy - py);
        if (d < hitRadius && d < bestDist) {
            bestDist = d;
            best = arrow;
        }
    }

    if (!best) return;

    if (isClickable(best)) {
        best.state = 'moving';
        movesCount++;
        haptic('light');
        // Частицы старта
        const head = headPosition(best);
        const { px: hpx, py: hpy } = cellToPixel(head.cx, head.cy);
        spawnParticles(hpx, hpy, COLORS.arrowHint, 10);
    } else {
        haptic('error');
        // Показать что стрелка заблокирована
        const head = headPosition(best);
        const { px: hpx, py: hpy } = cellToPixel(head.cx, head.cy);
        spawnParticles(hpx, hpy, COLORS.arrowBlocked, 6);
        // Мигание
        best.hintUntil = Date.now() + 400;
    }
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });

// =====================================================
//  МЕНЮ
// =====================================================
function buildLevelGrid() {
    levelGrid.innerHTML = '';
    const maxLevels = MAX_LEVELS_IN_MENU;
    for (let n = 1; n <= maxLevels; n++) {
        const cell = document.createElement('div');
        cell.className = 'level-cell';
        cell.textContent = String(n);

        const info = progress[n] || {};
        if (n > 1) {
            const prev = progress[n - 1];
            if (!prev || prev.stars === 0) cell.classList.add('locked');
        }
        if (n === currentLevelNum) cell.classList.add('current');
        if (info.stars > 0) {
            const sm = document.createElement('div');
            sm.className = 'stars-mini';
            sm.textContent = '★'.repeat(info.stars);
            cell.appendChild(sm);
        }
        cell.addEventListener('click', () => {
            if (cell.classList.contains('locked')) return;
            menuOverlay.classList.add('hidden');
            startLevel(n);
        });
        levelGrid.appendChild(cell);
    }
}

// =====================================================
//  КНОПКИ
// =====================================================
homeBtn.addEventListener('click', () => {
    // Возврат на splash если есть, иначе ничего
    if (confirm('Выйти в главное меню?')) {
        try { location.href = 'index.html'; } catch(e) {}
    }
});

menuBtn.addEventListener('click', () => {
    buildLevelGrid();
    menuOverlay.classList.remove('hidden');
});

closeMenuBtn.addEventListener('click', () => menuOverlay.classList.add('hidden'));

hintBtn.addEventListener('click', () => {
    if (isWon) return;
    const now = Date.now();
    // Подсветить 1-2 кликабельные стрелки
    const clickable = level.arrows.filter(a => a.state === 'idle' && isClickable(a));
    clickable.slice(0, 2).forEach(a => {
        a.hintUntil = now + 2500;
    });
    haptic('light');
});

winRestartBtn.addEventListener('click', () => startLevel(currentLevelNum));

nextBtn.addEventListener('click', () => {
    startLevel(currentLevelNum + 1);
});

// =====================================================
//  РЕСАЙЗ
// =====================================================
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
}

// =====================================================
//  СТАРТ
// =====================================================
function boot() {
    tgInit();
    progress = loadProgress();

    // Стартуем с последнего пройденного +1
    let startNum = 1;
    for (let n = 1; n < 100; n++) {
        if (progress[n] && progress[n].stars > 0) startNum = n + 1;
        else break;
    }

    resize();
    startLevel(startNum);
    loader.classList.add('hidden');
    requestAnimationFrame(loop);
}

boot();

})();
</script>
