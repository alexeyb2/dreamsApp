<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FDF5E6">
<title>Arrow Labyrinth</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0;
        height: 100%; width: 100%;
        overflow: hidden;
        background: #FDF5E6;
        color: #5C4033;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none; -webkit-user-select: none;
        touch-action: none; overscroll-behavior: none;
        position: fixed; inset: 0;
    }
    #c {
        display: block; position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; touch-action: none;
    }
    #topbar {
        position: fixed; top: 0; left: 0; right: 0;
        padding: 8px 12px;
        padding-top: calc(8px + env(safe-area-inset-top));
        display: flex; align-items: center; gap: 8px;
        z-index: 10; pointer-events: none;
    }
    #topbar .side { display: flex; gap: 6px; pointer-events: auto; }
    #topbar .side.right { margin-left: auto; }
    #topbar .center { flex: 1; text-align: center; pointer-events: none; }
    #levelLabel { font-size: 17px; font-weight: 700; color: #8B4513; letter-spacing: 0.5px; }
    #levelSub { font-size: 10px; font-weight: 700; color: #7B68EE; letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
    #levelSub.easy { color: #27AE60; }
    #levelSub.medium { color: #E67E22; }
    #levelSub.hard { color: #8E44AD; }
    .icon-btn {
        background: rgba(139, 69, 19, 0.08);
        border: none; width: 40px; height: 40px;
        border-radius: 50%; color: #8B4513; font-size: 18px;
        cursor: pointer; font-family: inherit;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s; padding: 0;
    }
    .icon-btn:active { background: rgba(139, 69, 19, 0.2); }
    #hint {
        position: fixed;
        top: calc(58px + env(safe-area-inset-top));
        left: 50%; transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(139, 69, 19, 0.15);
        border-radius: 20px; padding: 8px 18px;
        font-size: 13px; font-weight: 600; color: #8B4513;
        box-shadow: 0 4px 16px rgba(139, 69, 19, 0.12);
        z-index: 9; pointer-events: none;
        white-space: nowrap; transition: opacity 0.3s;
    }
    #hint.hidden { opacity: 0; }
    #bottom {
        position: fixed; bottom: 0; left: 0; right: 0;
        padding: 12px 18px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        text-align: center; z-index: 9; pointer-events: none;
    }
    #progressWrap {
        width: 200px; height: 3px;
        background: rgba(139, 69, 19, 0.1);
        border-radius: 3px; overflow: hidden; margin: 0 auto;
    }
    #progressBar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #A0522D, #8B4513);
        transition: width 0.15s linear;
    }
    .overlay {
        position: fixed; inset: 0;
        background: rgba(253, 245, 230, 0.96);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        z-index: 30; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 24px; text-align: center;
        transition: opacity 0.25s; overflow-y: auto;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { margin: 0 0 8px 0; font-size: 24px; color: #8B4513; }
    .stars { font-size: 40px; letter-spacing: 8px; margin: 12px 0; }
    .stat { font-size: 14px; color: rgba(92, 64, 51, 0.75); margin: 4px 0; }
    .btn {
        background: linear-gradient(135deg, #A0522D, #8B4513);
        color: white; border: none; padding: 13px 28px;
        border-radius: 14px; font-size: 15px; font-weight: 600;
        cursor: pointer; font-family: inherit;
        box-shadow: 0 6px 16px rgba(139, 69, 19, 0.25);
        transition: transform 0.12s; margin: 4px;
    }
    .btn:active { transform: scale(0.95); }
    .btn-outline {
        background: transparent; color: #8B4513;
        border: 2px solid #8B4513; box-shadow: none;
    }
    #levelGrid {
        display: grid; grid-template-columns: repeat(5, 1fr);
        gap: 10px; width: 100%; max-width: 340px; margin: 16px 0;
    }
    .level-cell {
        aspect-ratio: 1;
        display: flex; align-items: center; justify-content: center;
        background: rgba(139, 69, 19, 0.08);
        border-radius: 12px; font-weight: 700; font-size: 16px;
        color: #8B4513; cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.15s; position: relative;
    }
    .level-cell.locked { opacity: 0.3; cursor: not-allowed; }
    .level-cell.current { border-color: #8B4513; background: rgba(139, 69, 19, 0.15); }
    .level-cell:active:not(.locked) { transform: scale(0.94); }
    .level-cell .stars-mini {
        position: absolute; bottom: 3px;
        font-size: 8px; color: #F39C12; letter-spacing: 1px;
    }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="topbar">
    <div class="side">
        <button id="homeBtn" class="icon-btn">←</button>
    </div>
    <div class="center">
        <div id="levelLabel">Уровень 1</div>
        <div id="levelSub" class="easy">EASY</div>
    </div>
    <div class="side right">
        <button id="hintBtn" class="icon-btn">💡</button>
        <button id="menuBtn" class="icon-btn">⚙</button>
    </div>
</div>

<div id="hint" class="hidden"></div>

<div id="bottom">
    <div id="progressWrap"><div id="progressBar"></div></div>
</div>

<div id="winOverlay" class="overlay hidden">
    <h2>Уровень пройден!</h2>
    <div id="stars" class="stars">⭐⭐⭐</div>
    <div class="stat" id="winMoves"></div>
    <div class="stat" id="winTime"></div>
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center;">
        <button id="winRestartBtn" class="btn btn-outline">Заново</button>
        <button id="nextBtn" class="btn">Дальше →</button>
    </div>
</div>

<div id="menuOverlay" class="overlay hidden">
    <h2>Уровни</h2>
    <div id="levelGrid"></div>
    <button id="closeMenuBtn" class="btn btn-outline">Закрыть</button>
</div>

<script>
(() => {
'use strict';

const LS_KEY = 'arrow-labyrinth-v2';

// Цвета
const COL = {
    bg: '#FDF5E6',
    dot: '#D9C4A5',
    arrow: '#8B4513',
    hover: '#A0522D',
    hint: '#E67E22',
    blocked: '#C0392B',
};

// =====================================================
//  DOM
// =====================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const levelLabel = document.getElementById('levelLabel');
const levelSub = document.getElementById('levelSub');
const hintEl = document.getElementById('hint');
const progressBar = document.getElementById('progressBar');
const winOverlay = document.getElementById('winOverlay');
const menuOverlay = document.getElementById('menuOverlay');
const levelGrid = document.getElementById('levelGrid');
const starsEl = document.getElementById('stars');
const winMovesEl = document.getElementById('winMoves');
const winTimeEl = document.getElementById('winTime');
const homeBtn = document.getElementById('homeBtn');
const menuBtn = document.getElementById('menuBtn');
const hintBtn = document.getElementById('hintBtn');
const closeMenuBtn = document.getElementById('closeMenuBtn');
const winRestartBtn = document.getElementById('winRestartBtn');
const nextBtn = document.getElementById('nextBtn');

// =====================================================
//  Состояние
// =====================================================
let W = 0, H = 0, DPR = 1;
let cellSize = 32;
let camera = { x: 0, y: 0 };
let level = { num: 1, cols: 9, rows: 12, arrows: [] };
let progress = {};
let currentLevelNum = 1;
let isWon = false;
let movesCount = 0;
let levelStartTime = 0;
let particles = [];

const pointer = {
    active: false,
    startX: 0, startY: 0,
    lastX: 0, lastY: 0,
    moved: false,
    downAt: 0,
};

// =====================================================
//  Telegram
// =====================================================
const tg = window.Telegram?.WebApp;
function tgInit() {
    if (!tg) return;
    try { tg.ready(); } catch(e){}
    try { tg.expand(); } catch(e){}
    try { tg.setHeaderColor('#FDF5E6'); } catch(e){}
    try { tg.setBackgroundColor('#FDF5E6'); } catch(e){}
    try { tg.disableVerticalSwipes?.(); } catch(e){}
    try { tg.requestFullscreen?.(); } catch(e){}
    try {
        tg.onEvent?.('viewportChanged', () => setTimeout(resize, 60));
        tg.onEvent?.('fullscreenChanged', () => setTimeout(resize, 60));
    } catch(e){}
}
function haptic(type = 'light') {
    if (!tg?.HapticFeedback) return;
    try {
        if (type === 'light')   tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium')  tg.HapticFeedback.impactOccurred('medium');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
    } catch(e){}
}

// =====================================================
//  PRNG
// =====================================================
function mulberry32(seed) {
    return function() {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = seed;
        t = Math.imul(t ^ (t >>> 15), 1 | t);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// =====================================================
//  Размер
// =====================================================
function resize() {
    const vv = window.visualViewport;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
    H = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recalcCell();
    centerCamera();
}

function recalcCell() {
    const padTop = 100;
    const padBottom = 80;
    const availW = W - 30;
    const availH = H - padTop - padBottom;
    const cw = availW / level.cols;
    const ch = availH / level.rows;
    cellSize = Math.max(18, Math.min(cw, ch, 48));
}

function centerCamera() {
    const gridW = level.cols * cellSize;
    const gridH = level.rows * cellSize;

    if (gridW <= W - 20) {
        camera.x = (W - gridW) / 2;
    } else {
        camera.x = 10;
    }

    const topOffset = 100;
    const availH = H - topOffset - 80;
    if (gridH <= availH) {
        camera.y = topOffset + (availH - gridH) / 2;
    } else {
        camera.y = topOffset;
    }
}

// =====================================================
//  Пиксели <-> клетки
// =====================================================
function cellToPixel(cx, cy) {
    return { x: cx * cellSize + camera.x, y: cy * cellSize + camera.y };
}

// =====================================================
//  Спецификация уровня
// =====================================================
function levelSpec(n) {
    if (n <= 2)   return { cols: 9,  rows: 12, arrows: 4 + n,       maxSegs: 2, minSeg: 2, maxSeg: 3 };
    if (n <= 4)   return { cols: 10, rows: 13, arrows: 7 + (n - 2), maxSegs: 2, minSeg: 2, maxSeg: 3 };
    if (n <= 6)   return { cols: 11, rows: 15, arrows: 10 + (n - 4) * 2, maxSegs: 2, minSeg: 2, maxSeg: 4 };
    if (n <= 10)  return { cols: 12, rows: 16, arrows: 14 + (n - 6) * 2, maxSegs: 3, minSeg: 2, maxSeg: 4 };
    if (n <= 16)  return { cols: 13, rows: 18, arrows: 22 + (n - 10),    maxSegs: 3, minSeg: 2, maxSeg: 5 };
    if (n <= 24)  return { cols: 14, rows: 20, arrows: 28 + (n - 16),    maxSegs: 3, minSeg: 2, maxSeg: 5 };
    if (n <= 34)  return { cols: 15, rows: 22, arrows: 36 + (n - 24),    maxSegs: 3, minSeg: 2, maxSeg: 6 };
    return          { cols: 16, rows: 24, arrows: Math.min(56, 46 + (n - 34)), maxSegs: 3, minSeg: 2, maxSeg: 6 };
}

function difficultyOf(n) {
    if (n <= 4)  return 'easy';
    if (n <= 14) return 'medium';
    return 'hard';
}

// =====================================================
//  Ручные уровни (надёжные)
// =====================================================
function handLevel(n) {
    // Level 1 — 5 простых стрелок, все сразу кликабельны
    if (n === 1) return {
        cols: 10, rows: 14,
        arrows: [
            [[2,2],[2,5]],
            [[5,2],[5,5]],
            [[8,2],[8,5]],
            [[2,8],[5,8]],
            [[2,11],[5,11]],
        ],
    };
    // Level 2 — 7 стрелок, посложнее
    if (n === 2) return {
        cols: 10, rows: 14,
        arrows: [
            [[2,2],[2,6]],
            [[5,2],[5,5]],
            [[8,2],[8,6]],
            [[2,9],[5,9]],
            [[7,9],[7,12]],
            [[2,12],[5,12]],
            [[8,9],[8,12]],
        ],
    };
    // Level 3 — 9 стрелок с поворотами
    if (n === 3) return {
        cols: 11, rows: 15,
        arrows: [
            [[2,2],[2,6],[5,6]],
            [[5,2],[5,5]],
            [[8,2],[8,6]],
            [[10,2],[10,6]],
            [[2,9],[2,13],[5,13]],
            [[7,9],[7,12]],
            [[5,10],[8,10]],
            [[8,8],[10,8]],
            [[2,14],[5,14]],
        ],
    };
    return null;
}

// =====================================================
//  Генератор уровней
// =====================================================
function tryPlaceArrow(rand, spec, occupied) {
    for (let attempt = 0; attempt < 50; attempt++) {
        const sx = Math.floor(rand() * spec.cols);
        const sy = Math.floor(rand() * spec.rows);
        if (occupied.has(sx + ',' + sy)) continue;

        const path = [[sx, sy]];
        let cx = sx, cy = sy;
        let lastDir = null;
        let ok = true;

        const numSegs = 1 + Math.floor(rand() * spec.maxSegs);
        for (let s = 0; s < numSegs; s++) {
            let dir;
            if (lastDir === null) {
                const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                dir = dirs[Math.floor(rand() * 4)];
            } else {
                // поворот 90°
                const perps = lastDir[0] !== 0 ? [[0,1],[0,-1]] : [[1,0],[-1,0]];
                dir = perps[Math.floor(rand() * 2)];
            }
            const segLen = spec.minSeg + Math.floor(rand() * (spec.maxSeg - spec.minSeg + 1));

            for (let i = 0; i < segLen; i++) {
                cx += dir[0];
                cy += dir[1];
                if (cx < 0 || cx >= spec.cols || cy < 0 || cy >= spec.rows) { ok = false; break; }
                if (occupied.has(cx + ',' + cy)) { ok = false; break; }
                path.push([cx, cy]);
            }
            if (!ok) break;
            lastDir = dir;
        }

        if (!ok) continue;
        if (path.length < 3) continue;
        if (!flightClear(path, occupied, spec)) continue;

        return path;
    }
    return null;
}

function flightClear(path, occupied, spec) {
    const last = path[path.length - 1];
    const prev = path[path.length - 2];
    const dx = last[0] - prev[0];
    const dy = last[1] - prev[1];

    // Идём от головы наружу
    for (let step = 1; step < 200; step++) {
        const rx = last[0] + dx * step;
        const ry = last[1] + dy * step;
        if (rx < 0 || rx >= spec.cols || ry < 0 || ry >= spec.rows) return true;
        // Проверяем окрестность 3×3
        for (let ox = -1; ox <= 1; ox++) {
            for (let oy = -1; oy <= 1; oy++) {
                if (occupied.has((rx + ox) + ',' + (ry + oy))) return false;
            }
        }
    }
    return true;
}

function generateLevel(n) {
    // Сначала пробуем ручной уровень
    const hand = handLevel(n);
    if (hand) {
        return {
            num: n,
            cols: hand.cols,
            rows: hand.rows,
            arrows: hand.arrows.map(pts => ({
                points: pts.map(p => [p[0], p[1]]),
                state: 'idle',
                offset: { x: 0, y: 0 },
                hintUntil: 0,
            })),
        };
    }

    // Генерация
    const spec = levelSpec(n);
    const minArrows = Math.max(3, Math.floor(spec.arrows * 0.75));

    for (let attempt = 0; attempt < 50; attempt++) {
        const rand = mulberry32(n * 7919 + attempt * 1013);
        const occupied = new Set();
        const arrows = [];

        for (let k = 0; k < spec.arrows; k++) {
            const path = tryPlaceArrow(rand, spec, occupied);
            if (!path) break;
            for (const [x, y] of path) occupied.add(x + ',' + y);
            arrows.push(path);
        }

        if (arrows.length >= minArrows) {
            // Разворачиваем: последняя размещённая кликается первой
            arrows.reverse();
            return {
                num: n,
                cols: spec.cols,
                rows: spec.rows,
                arrows: arrows.map(pts => ({
                    points: pts,
                    state: 'idle',
                    offset: { x: 0, y: 0 },
                    hintUntil: 0,
                })),
            };
        }
    }

    // Гарантированный fallback — простая сетка 5 стрелок
    return {
        num: n,
        cols: 10, rows: 14,
        arrows: [
            { points: [[2,2],[2,5]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
            { points: [[5,2],[5,5]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
            { points: [[8,2],[8,5]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
            { points: [[2,8],[5,8]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
            { points: [[2,11],[5,11]], state: 'idle', offset:{x:0,y:0}, hintUntil: 0 },
        ],
    };
}

// =====================================================
//  Логика стрелок
// =====================================================
function headPos(arrow) {
    const p = arrow.points[arrow.points.length - 1];
    return { cx: p[0], cy: p[1] };
}

function flightDir(arrow) {
    const pts = arrow.points;
    const last = pts[pts.length - 1];
    const prev = pts[pts.length - 2];
    const dx = last[0] - prev[0];
    const dy = last[1] - prev[1];
    const len = Math.hypot(dx, dy) || 1;
    return { ux: dx / len, uy: dy / len, dx, dy };
}

function isClickable(arrow) {
    if (arrow.state !== 'idle') return false;
    const head = headPos(arrow);
    const { dx, dy } = flightDir(arrow);

    // карта занятости
    const occupied = new Set();
    for (const other of level.arrows) {
        if (other === arrow) continue;
        if (other.state === 'cleared') continue;
        for (const p of other.points) occupied.add(p[0] + ',' + p[1]);
    }

    // идём от головы наружу
    for (let step = 1; step < 300; step++) {
        const rx = head.cx + dx * step;
        const ry = head.cy + dy * step;
        if (rx < 0 || rx >= level.cols || ry < 0 || ry >= level.rows) return true;
        for (let ox = -1; ox <= 1; ox++) {
            for (let oy = -1; oy <= 1; oy++) {
                if (occupied.has((rx + ox) + ',' + (ry + oy))) return false;
            }
        }
    }
    return false;
}

function countClickable() {
    let c = 0;
    for (const a of level.arrows) {
        if (a.state === 'idle' && isClickable(a)) c++;
    }
    return c;
}

// =====================================================
//  Частицы
// =====================================================
function spawnParticles(px, py, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({
            x: px, y: py,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 1, decay: 0.02 + Math.random() * 0.02,
            size: 1.5 + Math.random() * 2,
            color,
        });
    }
}

// =====================================================
//  Update
// =====================================================
function updateArrows(dt) {
    const speed = cellSize * 0.5;

    for (const arrow of level.arrows) {
        if (arrow.state !== 'moving') continue;

        const { dx, dy } = flightDir(arrow);
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len;
        const uy = dy / len;

        arrow.offset.x += ux * speed * dt * 60;
        arrow.offset.y += uy * speed * dt * 60;

        const head = headPos(arrow);
        const { x: hx, y: hy } = cellToPixel(head.cx, head.cy);
        const hpx = hx + arrow.offset.x;
        const hpy = hy + arrow.offset.y;

        // Партиклы
        if (Math.random() < 0.4) {
            particles.push({
                x: hpx, y: hpy,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                life: 1, decay: 0.03, size: 1.5,
                color: COL.arrow,
            });
        }

        // Улетела?
        if (hpx < -100 || hpx > W + 100 || hpy < -100 || hpy > H + 100) {
            arrow.state = 'cleared';
            spawnParticles(hpx, hpy, COL.arrow, 12);
        }
    }

    // частицы
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// =====================================================
//  Draw
// =====================================================
function draw() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    // Сетка точек
    ctx.fillStyle = COL.dot;
    for (let i = 0; i <= level.cols; i++) {
        for (let j = 0; j <= level.rows; j++) {
            const { x, y } = cellToPixel(i, j);
            if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
            ctx.beginPath();
            ctx.arc(x, y, 1.4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Стрелки
    for (const arrow of level.arrows) {
        if (arrow.state === 'cleared') continue;
        drawArrow(arrow);
    }

    // Частицы
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Прогресс
    const total = level.arrows.length;
    const cleared = level.arrows.filter(a => a.state === 'cleared').length;
    if (total > 0) {
        progressBar.style.width = ((cleared / total) * 100).toFixed(1) + '%';
    }
}

function drawArrow(arrow) {
    const pts = arrow.points;
    const now = Date.now();

    const pixelPts = pts.map(p => {
        const { x, y } = cellToPixel(p[0], p[1]);
        return { x: x + arrow.offset.x, y: y + arrow.offset.y };
    });

    const clickable = arrow.state === 'idle' && isClickable(arrow);
    let color = COL.arrow;
    if (arrow.hintUntil > now) color = COL.hint;

    let alpha = 1;
    let lineWidth = Math.max(4, cellSize * 0.18);
    if (arrow.state === 'idle') {
        if (clickable) {
            const pulse = 0.85 + 0.15 * Math.sin(now * 0.004);
            alpha = pulse;
        } else {
            alpha = 0.5;
        }
    }
    ctx.globalAlpha = alpha;

    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
    for (let i = 1; i < pixelPts.length; i++) {
        ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
    }
    ctx.stroke();

    // Наконечник
    const last = pixelPts[pixelPts.length - 1];
    const prev = pixelPts[pixelPts.length - 2];
    const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
    const headSize = Math.max(7, cellSize * 0.36);

    ctx.save();
    ctx.translate(last.x, last.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-headSize, -headSize * 0.55);
    ctx.lineTo(-headSize, headSize * 0.55);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();

    // Кольцо доступности
    if (clickable && arrow.hintUntil <= now) {
        const r = headSize * 1.8 + 3 * Math.sin(now * 0.004);
        ctx.strokeStyle = 'rgba(160, 82, 45, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(last.x, last.y, r, 0, Math.PI * 2);
        ctx.stroke();
    }
    if (arrow.hintUntil > now) {
        const r = headSize * 2 + 5 * Math.sin(now * 0.01);
        ctx.strokeStyle = 'rgba(230, 126, 34, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(last.x, last.y, r, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.globalAlpha = 1;
}

// =====================================================
//  Loop
// =====================================================
let lastT = 0;
function loop(t) {
    const dt = Math.min(50, t - lastT) / 1000;
    lastT = t;

    updateArrows(dt);
    draw();

    if (!isWon && level.arrows.length > 0 && level.arrows.every(a => a.state === 'cleared')) {
        onWin();
    }

    // Подсказка
    if (!isWon) {
        const c = countClickable();
        if (c > 0) {
            hintEl.textContent = c === 1 ? '1 стрелка может двигаться' : `${c} стрелок могут двигаться`;
            hintEl.classList.remove('hidden');
        } else {
            hintEl.textContent = 'Застряли? Попробуйте перезапустить';
            hintEl.classList.remove('hidden');
        }
    }

    requestAnimationFrame(loop);
}

// =====================================================
//  Старт уровня
// =====================================================
function startLevel(n) {
    currentLevelNum = n;
    level = generateLevel(n);
    isWon = false;
    movesCount = 0;
    levelStartTime = Date.now();
    particles = [];
    winOverlay.classList.add('hidden');

    levelLabel.textContent = 'Уровень ' + n;
    const diff = difficultyOf(n);
    levelSub.textContent = diff.toUpperCase();
    levelSub.className = diff;

    resize();
    hintEl.classList.remove('hidden');

    console.log('[Level ' + n + '] size:', level.cols + 'x' + level.rows, 'arrows:', level.arrows.length);
}

function onWin() {
    isWon = true;
    hintEl.classList.add('hidden');
    const timeMs = Date.now() - levelStartTime;
    const timeSec = (timeMs / 1000).toFixed(1);

    const par = level.arrows.length;
    let stars = 3;
    if (movesCount > par) stars = movesCount > par + 2 ? 1 : 2;

    starsEl.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    winMovesEl.textContent = `Ходов: ${movesCount} (минимум: ${par})`;
    winTimeEl.textContent = `Время: ${timeSec} сек`;
    winOverlay.classList.remove('hidden');

    haptic('success');

    const prev = progress[n] || { stars: 0, moves: 0 };
    if (stars > prev.stars || (stars === prev.stars && movesCount < prev.moves)) {
        progress[n] = { stars, moves: movesCount };
        saveProgress();
    }
}

function saveProgress() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch(e){}
}
function loadProgress() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e) { return {}; }
}

// =====================================================
//  Ввод
// =====================================================
function getPointer(e) {
    const r = canvas.getBoundingClientRect();
    let cx, cy;
    if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: cx - r.left, y: cy - r.top };
}

function onDown(e) {
    if (e.cancelable) e.preventDefault();
    if (isWon) return;
    const p = getPointer(e);
    pointer.active = true;
    pointer.startX = p.x;
    pointer.startY = p.y;
    pointer.lastX = p.x;
    pointer.lastY = p.y;
    pointer.moved = false;
    pointer.downAt = Date.now();
}

function onMove(e) {
    if (!pointer.active) return;
    if (e.cancelable) e.preventDefault();
    const p = getPointer(e);
    const dx = p.x - pointer.lastX;
    const dy = p.y - pointer.lastY;
    if (Math.abs(p.x - pointer.startX) + Math.abs(p.y - pointer.startY) > 10) {
        pointer.moved = true;
    }
    if (pointer.moved) {
        camera.x += dx;
        camera.y += dy;
    }
    pointer.lastX = p.x;
    pointer.lastY = p.y;
}

function onUp(e) {
    if (!pointer.active) return;
    pointer.active = false;
    const dt = Date.now() - pointer.downAt;
    if (!pointer.moved && dt < 500) {
        handleClick(pointer.startX, pointer.startY);
    }
}

function handleClick(px, py) {
    if (isWon) return;
    const hitR = Math.max(22, cellSize * 0.9);
    let best = null, bestD = Infinity;

    for (const arrow of level.arrows) {
        if (arrow.state !== 'idle') continue;
        const h = headPos(arrow);
        const { x, y } = cellToPixel(h.cx, h.cy);
        const d = Math.hypot(x - px, y - py);
        if (d < hitR && d < bestD) { bestD = d; best = arrow; }
    }

    if (!best) return;

    const h = headPos(best);
    const { x: hx, y: hy } = cellToPixel(h.cx, h.cy);

    if (isClickable(best)) {
        best.state = 'moving';
        movesCount++;
        haptic('light');
        spawnParticles(hx, hy, COL.hint, 8);
    } else {
        haptic('error');
        spawnParticles(hx, hy, COL.blocked, 6);
        best.hintUntil = Date.now() + 400;
    }
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });

// =====================================================
//  Меню
// =====================================================
function buildLevelGrid() {
    levelGrid.innerHTML = '';
    for (let n = 1; n <= 60; n++) {
        const cell = document.createElement('div');
        cell.className = 'level-cell';
        cell.textContent = String(n);
        const info = progress[n] || {};
        if (n > 1) {
            const prev = progress[n - 1];
            if (!prev || prev.stars === 0) cell.classList.add('locked');
        }
        if (n === currentLevelNum) cell.classList.add('current');
        if (info.stars > 0) {
            const sm = document.createElement('div');
            sm.className = 'stars-mini';
            sm.textContent = '★'.repeat(info.stars);
            cell.appendChild(sm);
        }
        cell.addEventListener('click', () => {
            if (cell.classList.contains('locked')) return;
            menuOverlay.classList.add('hidden');
            startLevel(n);
        });
        levelGrid.appendChild(cell);
    }
}

homeBtn.addEventListener('click', () => {
    if (confirm('Выйти в главное меню?')) location.href = 'index.html';
});
menuBtn.addEventListener('click', () => {
    buildLevelGrid();
    menuOverlay.classList.remove('hidden');
});
closeMenuBtn.addEventListener('click', () => menuOverlay.classList.add('hidden'));
hintBtn.addEventListener('click', () => {
    if (isWon) return;
    const now = Date.now();
    const clickable = level.arrows.filter(a => a.state === 'idle' && isClickable(a));
    clickable.slice(0, 2).forEach(a => { a.hintUntil = now + 2500; });
    haptic('light');
});
winRestartBtn.addEventListener('click', () => startLevel(currentLevelNum));
nextBtn.addEventListener('click', () => startLevel(currentLevelNum + 1));

// =====================================================
//  Resize
// =====================================================
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// =====================================================
//  Boot
// =====================================================
function boot() {
    tgInit();
    progress = loadProgress();

    let startNum = 1;
    for (let n = 1; n < 100; n++) {
        if (progress[n] && progress[n].stars > 0) startNum = n + 1;
        else break;
    }

    resize();
    startLevel(startNum);
    requestAnimationFrame(loop);
}

boot();

})();
</script>
