<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Меркаба — Мобильная версия</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(ellipse at center, #1a1a3e, #0d0d1a);
            overflow: hidden;
            color: #fff;
            touch-action: none;
        }
        #controls {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 36, .92);
            padding: 12px 14px;
            border-radius: 14px;
            z-index: 100;
            width: min(92vw, 420px);
            border: 1px solid rgba(255, 255, 255, .15);
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, .5);
            font-size: 12px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }
        .slider-row label {
            color: #aaa;
            font-size: 12px;
            min-width: 60px;
            white-space: nowrap;
        }
        .slider-row input[type=range] {
            flex: 1;
            accent-color: #6c5ce7;
            height: 18px;
        }
        .slider-row .value {
            color: #fff;
            font-size: 13px;
            min-width: 40px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 4px;
            padding: 6px;
            background: rgba(255, 255, 255, .05);
            border-radius: 8px;
        }
        .checkbox-row input[type=checkbox] {
            accent-color: #6c5ce7;
            width: 16px;
            height: 16px;
        }
        .checkbox-row label {
            color: #bbb;
            font-size: 12px;
            cursor: pointer;
        }
        #advanced {
            display: none;
            border-top: 1px solid rgba(255, 255, 255, .15);
            padding-top: 8px;
            margin-top: 8px;
        }
        #advanced.visible {
            display: block;
        }
        #gearBtn, #exportBtn {
            position: fixed;
            top: 10px;
            background: rgba(18, 18, 36, .8);
            border: 1px solid rgba(255, 255, 255, .3);
            color: #fff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 16px;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: background 0.3s;
        }
        #gearBtn {
            left: 10px;
        }
        #exportBtn {
            right: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            border: none;
            border-radius: 10px;
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(108, 92, 231, .4);
        }
        #gearBtn:hover, #exportBtn:hover {
            background: rgba(108, 92, 231, .5);
        }
        #info {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(18, 18, 36, .7);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 10px;
            color: #888;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(4px);
            pointer-events: none;
            text-align: center;
        }
        canvas {
            display: block;
        }
        @media (max-width: 600px) {
            #controls {
                padding: 10px;
                font-size: 11px;
            }
            .slider-row {
                gap: 6px;
            }
            .slider-row label {
                min-width: 55px;
            }
            .checkbox-row {
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <button id="exportBtn">📋 JSON</button>
    <button id="gearBtn">⚙️</button>
    <div id="info">🖱️ / 👆 — вращение, панорама, зум</div>

    <div id="controls">
        <div class="slider-row">
            <label>🔻 Верх:</label>
            <input type="range" id="topAngle" min="0" max="360" value="0" step="1">
            <span class="value" id="topAngleValue">0°</span>
        </div>
        <div class="slider-row">
            <label>🔺 Низ:</label>
            <input type="range" id="bottomAngle" min="0" max="360" value="0" step="1">
            <span class="value" id="bottomAngleValue">0°</span>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="linkCheckbox">
            <label for="linkCheckbox">🔗 Связь (+180°)</label>
        </div>
        <div id="advanced">
            <div class="slider-row">
                <label>🔻 Наклон:</label>
                <input type="range" id="topTilt" min="0" max="1.5" step="0.01" value="0.3">
                <span class="value" id="topTiltValue">0.30</span>
            </div>
            <div class="slider-row">
                <label>🔺 Наклон:</label>
                <input type="range" id="bottomTilt" min="0" max="1.5" step="0.01" value="0.3">
                <span class="value" id="bottomTiltValue">0.30</span>
            </div>
            <div class="slider-row">
                <label>🔻 Высота:</label>
                <input type="range" id="topHeight" min="0.5" max="4" step="0.05" value="2">
                <span class="value" id="topHeightValue">2.0</span>
            </div>
            <div class="slider-row">
                <label>🔺 Высота:</label>
                <input type="range" id="bottomHeight" min="0.5" max="4" step="0.05" value="2">
                <span class="value" id="bottomHeightValue">2.0</span>
            </div>
            <div class="slider-row">
                <label>📏 Радиус:</label>
                <input type="range" id="radius" min="0.3" max="3" step="0.05" value="1.8">
                <span class="value" id="radiusValue">1.8</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="MerkabaMath.js"></script>
    <script>
        // === Три.js сцена ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(4, 2.8, 5); // камера ближе — тетраэдры крупнее
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Орбитальный контроллер (поддержка touch)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.15;
        controls.minDistance = 1.5;
        controls.maxDistance = 15;
        controls.target.set(0, 0, 0);

        // Свет
        scene.add(new THREE.AmbientLight(0x8888cc, 0.8));
        const light1 = new THREE.DirectionalLight(0xffffff, 0.9);
        light1.position.set(5, 8, 6);
        scene.add(light1);
        const light2 = new THREE.DirectionalLight(0x4488ff, 0.35);
        light2.position.set(-4, -2, -3);
        scene.add(light2);
        const light3 = new THREE.PointLight(0xff8844, 0.5, 15);
        light3.position.set(0, 3, 0);
        scene.add(light3);

        // Сетка
        const grid = new THREE.GridHelper(8, 12, 0x444466, 0x333355);
        grid.position.y = -0.01;
        scene.add(grid);

        // === Группы тетраэдров ===
        const bottomGroup = new THREE.Group();
        const topGroup = new THREE.Group();
        scene.add(bottomGroup);
        scene.add(topGroup);

        // === Математика (класс MerkabaMath) ===
        const math = new MerkabaMath();

        // === Утилиты ===
        function createArrow(from, to, color) {
            const group = new THREE.Group();
            const dir = new THREE.Vector3().subVectors(to, from);
            const len = dir.length();
            if (len < 0.01) return group;
            const coneGeo = new THREE.ConeGeometry(0.05, len * 0.8, 8);
            const coneMat = new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.75, emissive: color, emissiveIntensity: 0.3 });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
            cone.position.copy(mid);
            const dirNorm = dir.clone().normalize();
            const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm);
            cone.quaternion.copy(quat);
            group.add(cone);
            const lineGeo = new THREE.BufferGeometry().setFromPoints([from, to]);
            const lineMat = new THREE.LineBasicMaterial({ color, linewidth: 1 });
            group.add(new THREE.Line(lineGeo, lineMat));
            return group;
        }

        function createLabel(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.fillStyle = color || '#fff';
            ctx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 8;
            ctx.fillText(text, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: texture, depthTest: true, sizeAttenuation: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(0.55, 0.55, 0.55);
            return sprite;
        }

        // === Обновление тетраэдров ===
        function updateTetrahedrons() {
            // Очистка групп
            while (bottomGroup.children.length) bottomGroup.remove(bottomGroup.children[0]);
            while (topGroup.children.length) topGroup.remove(topGroup.children[0]);

            const bottom = math.getBottomTetrahedron();
            const top = math.getTopTetrahedron();

            // Нижний
            const bEdgePts = [
                bottom.apex, bottom.baseVerts[0],
                bottom.apex, bottom.baseVerts[1],
                bottom.apex, bottom.baseVerts[2],
                bottom.baseVerts[0], bottom.baseVerts[1],
                bottom.baseVerts[1], bottom.baseVerts[2],
                bottom.baseVerts[2], bottom.baseVerts[0]
            ];
            const bLine = new THREE.LineSegments(
                new THREE.BufferGeometry().setFromPoints(bEdgePts),
                new THREE.LineBasicMaterial({ color: 0x44aaff, linewidth: 2 })
            );
            bottomGroup.add(bLine);

            const bFaceGeo = new THREE.BufferGeometry();
            bFaceGeo.setAttribute('position', new THREE.Float32BufferAttribute([
                bottom.baseVerts[0].x, bottom.baseVerts[0].y, bottom.baseVerts[0].z,
                bottom.baseVerts[1].x, bottom.baseVerts[1].y, bottom.baseVerts[1].z,
                bottom.baseVerts[2].x, bottom.baseVerts[2].y, bottom.baseVerts[2].z
            ], 3));
            bFaceGeo.setIndex([0, 1, 2]);
            bFaceGeo.computeVertexNormals();
            const bFace = new THREE.Mesh(bFaceGeo, new THREE.MeshBasicMaterial({
                color: 0x44aaff, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false
            }));
            bottomGroup.add(bFace);

            bottomGroup.add(createArrow(bottom.apex, bottom.baseCenter, 0xffaa33));

            const bLabels = [
                { text: '👁️', pos: bottom.apex, color: '#ffffff' },
                { text: '🟦', pos: bottom.baseVerts[0], color: '#4488ff' },
                { text: '🟥', pos: bottom.baseVerts[1], color: '#ff4444' },
                { text: '🟩', pos: bottom.baseVerts[2], color: '#44ff44' }
            ];
            for (const lb of bLabels) {
                const s = createLabel(lb.text, lb.color);
                s.position.copy(lb.pos);
                s.position.y += 0.35;
                bottomGroup.add(s);
            }
            const bApexSphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 12, 12),
                new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5 })
            );
            bApexSphere.position.copy(bottom.apex);
            bottomGroup.add(bApexSphere);

            // Верхний
            const tEdgePts = [
                top.apex, top.baseVerts[0],
                top.apex, top.baseVerts[1],
                top.apex, top.baseVerts[2],
                top.baseVerts[0], top.baseVerts[1],
                top.baseVerts[1], top.baseVerts[2],
                top.baseVerts[2], top.baseVerts[0]
            ];
            const tLine = new THREE.LineSegments(
                new THREE.BufferGeometry().setFromPoints(tEdgePts),
                new THREE.LineBasicMaterial({ color: 0xff44aa, linewidth: 2 })
            );
            topGroup.add(tLine);

            const tFaceGeo = new THREE.BufferGeometry();
            tFaceGeo.setAttribute('position', new THREE.Float32BufferAttribute([
                top.baseVerts[0].x, top.baseVerts[0].y, top.baseVerts[0].z,
                top.baseVerts[1].x, top.baseVerts[1].y, top.baseVerts[1].z,
                top.baseVerts[2].x, top.baseVerts[2].y, top.baseVerts[2].z
            ], 3));
            tFaceGeo.setIndex([0, 1, 2]);
            tFaceGeo.computeVertexNormals();
            const tFace = new THREE.Mesh(tFaceGeo, new THREE.MeshBasicMaterial({
                color: 0xff44aa, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false
            }));
            topGroup.add(tFace);

            topGroup.add(createArrow(top.apex, top.baseCenter, 0x00ffaa));

            const tLabels = [
                { text: '🟪', pos: top.apex, color: '#cc88ff' },
                { text: '🔴', pos: top.baseVerts[0], color: '#ff2222' },
                { text: '🔵', pos: top.baseVerts[1], color: '#2222ff' },
                { text: '🟢', pos: top.baseVerts[2], color: '#22ff22' }
            ];
            for (const lb of tLabels) {
                const s = createLabel(lb.text, lb.color);
                s.position.copy(lb.pos);
                s.position.y += 0.35;
                topGroup.add(s);
            }
            const tApexSphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 12, 12),
                new THREE.MeshPhongMaterial({ color: 0xcc88ff, emissive: 0xcc88ff, emissiveIntensity: 0.5 })
            );
            tApexSphere.position.copy(top.apex);
            topGroup.add(tApexSphere);
        }

        // === Связывание UI ===
        const topAngleInput = document.getElementById('topAngle');
        const bottomAngleInput = document.getElementById('bottomAngle');
        const topAngleValue = document.getElementById('topAngleValue');
        const bottomAngleValue = document.getElementById('bottomAngleValue');
        const linkCheckbox = document.getElementById('linkCheckbox');
        const topTiltInput = document.getElementById('topTilt');
        const bottomTiltInput = document.getElementById('bottomTilt');
        const topHeightInput = document.getElementById('topHeight');
        const bottomHeightInput = document.getElementById('bottomHeight');
        const radiusInput = document.getElementById('radius');
        const gearBtn = document.getElementById('gearBtn');
        const advancedDiv = document.getElementById('advanced');
        const exportBtn = document.getElementById('exportBtn');

        function updateUI() {
            topAngleValue.textContent = Math.round(math.topAngle) + '°';
            bottomAngleValue.textContent = Math.round(math.bottomAngle) + '°';
            topTiltValue.textContent = math.topTilt.toFixed(2);
            bottomTiltValue.textContent = math.bottomTilt.toFixed(2);
            topHeightValue.textContent = math.topHeight.toFixed(1);
            bottomHeightValue.textContent = math.bottomHeight.toFixed(1);
            radiusValue.textContent = math.radius.toFixed(1);

            topAngleInput.value = math.topAngle;
            bottomAngleInput.value = math.bottomAngle;
            topTiltInput.value = math.topTilt;
            bottomTiltInput.value = math.bottomTilt;
            topHeightInput.value = math.topHeight;
            bottomHeightInput.value = math.bottomHeight;
            radiusInput.value = math.radius;
            linkCheckbox.checked = math.linkRotation;
        }

        topAngleInput.addEventListener('input', function() {
            math.topAngle = parseFloat(this.value);
            if (math.linkRotation) {
                math.bottomAngle = (math.topAngle + 180) % 360;
                bottomAngleInput.value = math.bottomAngle;
            }
            updateUI();
            updateTetrahedrons();
        });

        bottomAngleInput.addEventListener('input', function() {
            math.bottomAngle = parseFloat(this.value);
            updateUI();
            updateTetrahedrons();
        });

        linkCheckbox.addEventListener('change', function() {
            math.linkRotation = this.checked;
            if (this.checked) {
                math.bottomAngle = (math.topAngle + 180) % 360;
                bottomAngleInput.value = math.bottomAngle;
                bottomAngleValue.textContent = Math.round(math.bottomAngle) + '°';
            }
            updateTetrahedrons();
        });

        topTiltInput.addEventListener('input', function() {
            math.topTilt = parseFloat(this.value);
            updateUI();
            updateTetrahedrons();
        });
        bottomTiltInput.addEventListener('input', function() {
            math.bottomTilt = parseFloat(this.value);
            updateUI();
            updateTetrahedrons();
        });
        topHeightInput.addEventListener('input', function() {
            math.topHeight = parseFloat(this.value);
            updateUI();
            updateTetrahedrons();
        });
        bottomHeightInput.addEventListener('input', function() {
            math.bottomHeight = parseFloat(this.value);
            updateUI();
            updateTetrahedrons();
        });
        radiusInput.addEventListener('input', function() {
            math.radius = parseFloat(this.value);
            updateUI();
            updateTetrahedrons();
        });

        gearBtn.addEventListener('click', function() {
            advancedDiv.classList.toggle('visible');
        });

        exportBtn.addEventListener('click', function() {
            const data = math.getJSON();
            const str = JSON.stringify(data, null, 2);
            if (navigator.clipboard) {
                navigator.clipboard.writeText(str).then(() => showToast('✅ JSON скопирован!'));
            } else {
                fallbackCopy(str);
            }
        });

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('✅ JSON скопирован!');
            } catch (e) {
                showToast('❌ Ошибка копирования');
            }
            document.body.removeChild(ta);
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(30,30,60,.9);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:opacity .3s;pointer-events:none;backdrop-filter:blur(8px);';
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
            setTimeout(() => document.body.removeChild(toast), 2500);
        }

        // === Анимация ===
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // === Resize ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === Инициализация ===
        updateTetrahedrons();
        updateUI();
        animate();
    </script>
</body>
</html>
