<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меркаба • Рост и Радиус</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #0a0a1a; }
        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #ccc;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            border: 1px solid #333;
            backdrop-filter: blur(4px);
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,40,0.85);
            backdrop-filter: blur(6px);
            color: white;
            padding: 18px 28px;
            border-radius: 14px;
            border: 1px solid #444;
            display: flex;
            flex-wrap: wrap;
            gap: 18px 30px;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            max-width: 90%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        #controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #ddd;
        }
        #controls input[type="range"] {
            width: 150px;
            background: #222;
            accent-color: #66aaff;
            cursor: pointer;
        }
        #controls .value {
            min-width: 45px;
            text-align: center;
            font-weight: bold;
            color: #fff;
        }
        .checkbox-group {
            display: flex;
            gap: 16px;
        }
        .checkbox-group label {
            font-size: 14px;
            gap: 4px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #66aaff;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            #controls {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
                width: 92%;
                bottom: 15px;
            }
            #controls label {
                width: 100%;
                justify-content: space-between;
            }
            .checkbox-group {
                width: 100%;
                justify-content: space-around;
            }
        }
        #coords {
            position: absolute;
            bottom: 110px;
            left: 20px;
            color: #aaa;
            font-size: 13px;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
            max-height: 240px;
            overflow-y: auto;
            white-space: pre;
            line-height: 1.6;
            border: 1px solid #333;
            min-width: 200px;
        }
        @media (max-width: 600px) {
            #coords { display: none; }
        }
    </style>
</head>
<body>
    <div id="info">🟡 Меркаба • 👁️ = макушка • основание на земле</div>
    <div id="coords"></div>

    <div id="controls">
        <label>Рост (см) <input type="range" id="heightSlider" min="50" max="250" value="175" step="1" />
            <span class="value" id="heightValue">175</span>
        </label>
        <label>Радиус (см) <input type="range" id="radiusSlider" min="20" max="120" value="80" step="1" />
            <span class="value" id="radiusValue">80</span>
        </label>
        <div class="checkbox-group">
            <label><input type="checkbox" id="showDiag" checked /> диагонали</label>
            <label><input type="checkbox" id="showLabels" checked /> подписи</label>
            <label><input type="checkbox" id="showGrid" checked /> сетка</label>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(4, 2.5, 5);
        camera.lookAt(0, 0.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.8, 0);
        controls.update();

        // --- Свет ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 3, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, -1, -2);
        scene.add(backLight);

        // --- Группа для Меркабы ---
        let merkabaGroup = new THREE.Group();
        scene.add(merkabaGroup);

        // --- Элементы управления ---
        const heightSlider = document.getElementById('heightSlider');
        const radiusSlider = document.getElementById('radiusSlider');
        const heightValue = document.getElementById('heightValue');
        const radiusValue = document.getElementById('radiusValue');
        const showDiag = document.getElementById('showDiag');
        const showLabels = document.getElementById('showLabels');
        const showGrid = document.getElementById('showGrid');
        const coordsDiv = document.getElementById('coords');

        // --- Обновление координат ---
        function updateCoords(pts) {
            let text = 'Координаты (см):\n';
            for (const [key, vec] of Object.entries(pts)) {
                text += `${key}: (${vec.x.toFixed(1)}, ${vec.y.toFixed(1)}, ${vec.z.toFixed(1)})\n`;
            }
            coordsDiv.textContent = text;
        }

        // --- Построение Меркабы ---
        function buildMerkaba() {
            const heightCm = parseFloat(heightSlider.value);
            const radiusCm = parseFloat(radiusSlider.value);
            heightValue.textContent = heightCm;
            radiusValue.textContent = radiusCm;

            // Переводим в метры
            const H = heightCm / 100; // рост (от земли до 👁️)
            const R = radiusCm / 100; // радиус основания

            // Параметры Меркабы: классические соотношения
            // В классической Меркабе: h = √3, l = √2, d = 1
            // Мы фиксируем эти соотношения, чтобы получить правильную форму.
            // Тогда расстояние от центра до основания d = l / √2 = 1.
            // Но мы можем масштабировать всю фигуру, сохраняя пропорции.
            // Поэтому вычислим масштаб так, чтобы 👁️ оказалась на высоте H.
            // В модели: нижнее основание на земле (y=0), верхняя вершина на высоте H.
            // Расстояние от нижнего основания до верхней вершины = h + d.
            // Примем h = √3, d = 1 (как в классике), но мы можем варьировать h?
            // Для простоты оставим h = √3, d = 1, и тогда масштаб = H / (√3 + 1).
            // Однако радиус основания при этом будет равен l * масштаб, где l = √2.
            // Но мы хотим, чтобы радиус был независимым параметром.
            // Поэтому мы будем вычислять масштаб из радиуса: масштаб = R / √2.
            // Тогда H будет зависеть от масштаба и соотношения h/d.
            // Чтобы рост был независимым, мы будем масштабировать отдельно по вертикали?
            // Это нарушит симметрию.
            // Лучше оставить классическую Меркабу с фиксированными пропорциями,
            // но позволить менять масштаб и радиус, тогда рост будет автоматически вычисляться.
            // Однако пользователь хочет задавать рост и радиус независимо.
            // Тогда мы должны позволить деформировать Меркабу, меняя h и l.
            // В предыдущей версии мы уже ввели h и l как параметры.
            // Упростим: будем считать, что h и l связаны с ростом и радиусом.
            // Пусть h = H / scale, где scale — некоторый коэффициент.
            // Но проще оставить два параметра: рост и радиус, и вычислять h и l из них.
            // Например, можно задать h = H / (1 + l/√2)? Это слишком сложно.
            // Вернёмся к предыдущей модели с h и l, но сделаем их производными от роста и радиуса.
            // Пусть d = l / √2 (как в классике), тогда h = √3 * d = √3 * l / √2.
            // Тогда H = h + d = d*(√3 + 1) = (l/√2)*(√3+1).
            // Отсюда l = H * √2 / (√3+1).
            // Но тогда радиус не будет независимым.
            // Чтобы сделать радиус независимым, мы можем разрешить деформацию.
            // Я предлагаю оставить h и l как параметры, но по умолчанию они связаны с ростом и радиусом.
            // Для простоты сейчас сделаем так: пользователь задаёт рост и радиус, а мы вычисляем h и l из них,
            // сохраняя соотношение h/d = √3.
            // Тогда d = l/√2, h = √3 * d = √3 * l / √2.
            // Тогда H = h + d = d*(√3+1) = (l/√2)*(√3+1) => l = H * √2 / (√3+1).
            // Радиус R = l (по определению). Но тогда радиус не независим.
            // Чтобы сделать радиус независимым, нужно изменить соотношение h/d.
            // Мы можем ввести параметр k = h/d, тогда H = d*(k+1) => d = H/(k+1), l = d*√2, R = l.
            // Тогда R = H * √2 / (k+1) => k = H*√2/R - 1.
            // Это даёт нам возможность задавать H и R, а k вычисляется.
            // Тогда h = k*d, d = H/(k+1).
            // Это и будет наша модель.

            const sqrt2 = Math.sqrt(2);
            const sqrt3 = Math.sqrt(3);
            // Вычисляем k = h/d
            let k = (H * sqrt2) / R - 1;
            if (k < 0.1) k = 0.1; // ограничиваем, чтобы не было вырождения
            const d = H / (k + 1);
            const h = k * d;
            const l = d * sqrt2; // это и есть радиус основания

            // Масштаб: 1 условная единица = d (но d уже в метрах)
            const scale = d; // d — расстояние от центра до основания в метрах

            // Координаты вершин (основание на земле y=0)
            // Треугольник основания: центр в (0, 0, 0) на земле, но с учётом смещения?
            // Мы помещаем центр треугольника в (0, 0, 0) и потом сдвигаем.
            // У нас нижнее основание должно быть на земле, т.е. y=0.
            // Но центр треугольника находится на высоте d над землёй?
            // Нет, в классической модели центр находится на расстоянии d от основания.
            // Если основание на земле, то центр на высоте d.
            // Значит, все точки нужно сдвинуть так, чтобы основание было на y=0.
            // Мы можем вычислить координаты вершин в локальной системе, где центр в (0,0,0),
            // а затем сдвинуть их по y на -d, чтобы основание оказалось на земле.

            const halfL = l / 2;
            const sqrt3halfL = sqrt3 * halfL;

            // Локальные координаты (центр в 0,0,0)
            const local = {
                '🟦': new THREE.Vector3(-sqrt3halfL, 0,  halfL),
                '🟥': new THREE.Vector3( sqrt3halfL, 0,  halfL),
                '🟩': new THREE.Vector3( 0,          0, -l),
                '🔴': new THREE.Vector3( sqrt3halfL, 0, -halfL),
                '🔵': new THREE.Vector3(-sqrt3halfL, 0, -halfL),
                '🟢': new THREE.Vector3( 0,          0,  l),
                '👁️': new THREE.Vector3( 0,          h,  0),
                '🟪': new THREE.Vector3( 0,         -h,  0)
            };

            // Сдвиг по y: чтобы нижнее основание (🟦🟥🟩) было на y=0
            // В локальных координатах эти точки имеют y=0, поэтому сдвиг не нужен?
            // Но центр у нас (0,0,0), а основание на y=0, значит центр уже на земле?
            // Нет, центр должен быть на высоте d над землёй.
            // Поэтому мы сдвигаем все точки вверх на d, чтобы центр оказался на высоте d.
            // Тогда нижнее основание окажется на y=0.
            // В локальных координатах нижнее основание y=0, верхнее основание y=0 тоже (т.к. оно тоже в плоскости основания).
            // Но в классической Меркабе верхнее основание находится на высоте 2d.
            // Значит, мы должны поднять верхнее основание на 2d относительно центра.
            // В локальных координатах оно тоже y=0, поэтому нужно сдвинуть его вверх на 2d.
            // Переделаем: локальные координаты с учётом расстояния от центра до оснований.
            // Пусть нижнее основание на y = -d, верхнее на y = +d, а вершины на y = ±h.
            // Тогда сдвиг на +d поставит нижнее основание на y=0.

            const local2 = {
                '🟦': new THREE.Vector3(-sqrt3halfL, -d,  halfL),
                '🟥': new THREE.Vector3( sqrt3halfL, -d,  halfL),
                '🟩': new THREE.Vector3( 0,          -d, -l),
                '🔴': new THREE.Vector3( sqrt3halfL,  d, -halfL),
                '🔵': new THREE.Vector3(-sqrt3halfL,  d, -halfL),
                '🟢': new THREE.Vector3( 0,           d,  l),
                '👁️': new THREE.Vector3( 0,          h,  0),
                '🟪': new THREE.Vector3( 0,         -h,  0)
            };

            // Теперь сдвигаем все точки вверх на d, чтобы нижнее основание было на y=0
            const pts = {};
            for (const [key, vec] of Object.entries(local2)) {
                pts[key] = vec.clone().add(new THREE.Vector3(0, d, 0));
            }

            // Цвета для точек
            const colors = {
                '🟦': 0x3399ff,
                '🟥': 0xff5533,
                '🟩': 0x66ff66,
                '🔴': 0xff3333,
                '🔵': 0x33ccff,
                '🟢': 0x66ff99,
                '👁️': 0xff66ff,
                '🟪': 0x9966ff
            };

            // Очищаем группу
            while (merkabaGroup.children.length) {
                merkabaGroup.remove(merkabaGroup.children[0]);
            }

            const sphereRadius = 0.04 * (d + h) / 1.5; // автоматический размер сфер
            const sphereGeom = new THREE.SphereGeometry(sphereRadius, 16, 16);

            // --- Вершины и подписи ---
            const labelGroup = new THREE.Group();
            for (const [key, vec] of Object.entries(pts)) {
                const color = colors[key] || 0xffffff;
                const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
                const sphere = new THREE.Mesh(sphereGeom, mat);
                sphere.position.copy(vec);
                merkabaGroup.add(sphere);

                // Подпись CSS2D
                const div = document.createElement('div');
                div.textContent = key;
                div.style.color = '#fff';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                div.style.background = 'rgba(0,0,0,0.6)';
                div.style.padding = '2px 8px';
                div.style.borderRadius = '12px';
                div.style.border = '1px solid rgba(255,255,255,0.2)';
                div.style.backdropFilter = 'blur(2px)';
                const label = new CSS2DObject(div);
                label.position.copy(vec.clone().add(new THREE.Vector3(0.08, 0.08, 0.08)));
                labelGroup.add(label);
            }
            merkabaGroup.add(labelGroup);

            // --- Вспомогательная функция добавления линии ---
            function addLine(p1, p2, color, opacity = 0.6, dashed = false) {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                let mat;
                if (dashed) {
                    mat = new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 0.04, gapSize: 0.03 });
                } else {
                    mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
                }
                const line = new THREE.Line(geom, mat);
                if (dashed) line.computeLineDistances();
                return line;
            }

            // --- Рёбра тетраэдров ---
            const edgeGroup = new THREE.Group();
            const topV = pts['👁️'];
            const topBase = [pts['🟦'], pts['🟥'], pts['🟩']];
            topBase.forEach(p => edgeGroup.add(addLine(topV, p, 0x66ccff, 0.8)));
            edgeGroup.add(addLine(topBase[0], topBase[1], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[1], topBase[2], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[2], topBase[0], 0x66ccff, 0.4));

            const bottomV = pts['🟪'];
            const bottomBase = [pts['🔴'], pts['🔵'], pts['🟢']];
            bottomBase.forEach(p => edgeGroup.add(addLine(bottomV, p, 0xff8866, 0.8)));
            edgeGroup.add(addLine(bottomBase[0], bottomBase[1], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[1], bottomBase[2], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[2], bottomBase[0], 0xff8866, 0.4));
            merkabaGroup.add(edgeGroup);

            // --- Диагонали (оси) ---
            const diagGroup = new THREE.Group();
            const diagonals = [
                [pts['🟦'], pts['🔴']],
                [pts['🟥'], pts['🔵']],
                [pts['🟩'], pts['🟢']],
                [pts['👁️'], pts['🟪']]
            ];
            diagonals.forEach(([p1, p2]) => {
                diagGroup.add(addLine(p1, p2, 0xffdd44, 0.25));
            });
            merkabaGroup.add(diagGroup);

            // --- Сфера радиуса (для визуализации) ---
            let maxR = 0;
            for (const vec of Object.values(pts)) {
                const r = vec.length();
                if (r > maxR) maxR = r;
            }
            const sphereWire = new THREE.Mesh(
                new THREE.SphereGeometry(maxR, 32, 16),
                new THREE.MeshBasicMaterial({ wireframe: true, color: 0x446688, transparent: true, opacity: 0.08 })
            );
            merkabaGroup.add(sphereWire);

            // --- Сетка земли (уровень y=0) ---
            const gridHelper = new THREE.GridHelper(3 * maxR, 12, 0x445566, 0x223344);
            gridHelper.position.y = 0;
            gridHelper.visible = showGrid.checked;
            merkabaGroup.add(gridHelper);

            // --- Сохраняем ссылки для управления видимостью ---
            merkabaGroup.userData.diagGroup = diagGroup;
            merkabaGroup.userData.labelGroup = labelGroup;
            merkabaGroup.userData.gridHelper = gridHelper;

            // Применяем состояние чекбоксов
            updateVisibility();

            // Обновляем координаты на экране
            updateCoords(pts);
        }

        function updateVisibility() {
            const showDiagChecked = showDiag.checked;
            const showLabelsChecked = showLabels.checked;
            const showGridChecked = showGrid.checked;
            if (merkabaGroup.userData.diagGroup) {
                merkabaGroup.userData.diagGroup.visible = showDiagChecked;
            }
            if (merkabaGroup.userData.labelGroup) {
                merkabaGroup.userData.labelGroup.visible = showLabelsChecked;
            }
            if (merkabaGroup.userData.gridHelper) {
                merkabaGroup.userData.gridHelper.visible = showGridChecked;
            }
        }

        // --- Обработчики событий ---
        function rebuild() {
            buildMerkaba();
        }

        heightSlider.addEventListener('input', rebuild);
        radiusSlider.addEventListener('input', rebuild);
        showDiag.addEventListener('change', updateVisibility);
        showLabels.addEventListener('change', updateVisibility);
        showGrid.addEventListener('change', updateVisibility);

        // --- Построить по умолчанию ---
        buildMerkaba();

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // --- Адаптация размера ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // --- Вспомогательные оси ---
        const axesHelper = new THREE.AxesHelper(1);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.2;
        scene.add(axesHelper);

        console.log('Меркаба с параметрами: рост и радиус.');
    </script>
</body>
</html>
