<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меркаба v5.1 — Исправленная ось Z</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0d0d1a; color: #fff; }
        #panel {
            position: absolute; top: 20px; right: 20px; width: 260px;
            background: rgba(20, 20, 30, 0.95); padding: 20px; border-radius: 12px;
            backdrop-filter: blur(4px); border: 1px solid #444; max-height: 90vh; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }
        .slider-group { display: flex; flex-direction: column; gap: 2px; }
        .slider-group label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
        .slider-group input { width: 100%; cursor: pointer; }
        #coords-table { margin-top: 10px; font-size: 11px; border-top: 1px solid #333; padding-top: 10px; }
        .coord-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #222; }
        .coord-row span { color: #ffd700; }
        .coord-row .vals { color: #88ccff; }
        #canvas-container { width: 100vw; height: 100vh; }
        @media (max-width: 800px) {
            #panel { width: 220px; right: 10px; top: 10px; padding: 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="panel">
        <h3 style="margin:0 0 5px 0; text-align:center;">Параметры тела (см)</h3>
        
        <div class="slider-group">
            <label>Центр ➔ Пах/Плечи (a): <span id="val_a">25</span></label>
            <input type="range" id="input_a" min="0" max="50" value="25" step="0.5">
        </div>
        <div class="slider-group">
            <label>Центр ➔ Вершины (h): <span id="val_h">75</span></label>
            <input type="range" id="input_h" min="0" max="130" value="75" step="0.5">
        </div>

        <div style="font-size:12px; color:#aaa; text-align:center;">
            Радиус основания (R): <span style="color:#0f0;" id="val_R">0</span> см
        </div>

        <div id="coords-table">
            <div style="font-weight:bold; margin-bottom:5px;">Координаты точек (X, Y, Z):</div>
            <div id="coord-list"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(120, 70, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        let mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const colorMap = {
            '🟡': 0xFFD700, '🟣': 0x9D4EDD, '🟪': 0xFF00FF, '🟦': 0x3A86FF,
            '🟥': 0xFF0000, '🟩': 0x38B000, '🔴': 0xFF5400, '🔵': 0x00BBF9,
            '🟢': 0x00F5D4
        };

        function createPoint(pos, color, labelText) {
            const geo = new THREE.SphereGeometry(2.5, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pos[0], pos[1], pos[2]);
            mainGroup.add(mesh);

            const div = document.createElement('div');
            div.textContent = labelText;
            div.style.color = '#fff';
            div.style.background = 'rgba(0,0,0,0.7)';
            div.style.padding = '2px 6px';
            div.style.borderRadius = '4px';
            div.style.fontSize = '12px';
            div.style.border = '1px solid ' + (typeof color === 'number' ? '#'+color.toString(16).padStart(6, '0') : '#fff');
            div.style.pointerEvents = 'none';
            const label = new CSS2DObject(div);
            label.position.set(pos[0], pos[1] + 6, pos[2]);
            mainGroup.add(label);
        }

        function createLine(p1, p2, color, dashed = false, opacity = 1.0) {
            const points = [
                new THREE.Vector3(p1[0], p1[1], p1[2]),
                new THREE.Vector3(p2[0], p2[1], p2[2])
            ];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            let mat;
            if(dashed) {
                mat = new THREE.LineDashedMaterial({ color: color, dashSize: 3, gapSize: 3, transparent: true, opacity: opacity });
            } else {
                mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
            }
            const line = new THREE.Line(geo, mat);
            if(dashed) line.computeLineDistances();
            mainGroup.add(line);
        }

        function updateModel() {
            while(mainGroup.children.length > 0) mainGroup.remove(mainGroup.children[0]);

            const a = parseFloat(document.getElementById('input_a').value);
            const h = parseFloat(document.getElementById('input_h').value);

            document.getElementById('val_a').textContent = a;
            document.getElementById('val_h').textContent = h;

            const R = (h + a) / Math.sqrt(3);
            document.getElementById('val_R').textContent = R.toFixed(1);

            // ИСПРАВЛЕННАЯ ОСЬ Z: -R = спереди (ближе к камере), +R = сзади (дальше от камеры)
            const pts = {
                center: [0, 0, 0],
                top: [0, h, 0],         // 🟣
                bottom: [0, -h, 0],     // 🟪
                
                // Нижнее основание (уровень паха, Y = -a)
                ub1: [-R * Math.sqrt(3)/2, -a, R/2],    // 🟦 Вода (сзади-слева)
                ub2: [R * Math.sqrt(3)/2, -a, R/2],     // 🟥 Металл (сзади-справа)
                ub3: [0, -a, -R],                       // 🟩 Земля (спереди, перед пахом) — ЗНАК МИНУС!
                
                // Верхнее основание (уровень плеч, Y = +a)
                lb1: [R * Math.sqrt(3)/2, a, -R/2],     // 🔴 Огонь (спереди-справа) — ЗНАК МИНУС!
                lb2: [-R * Math.sqrt(3)/2, a, -R/2],    // 🔵 Дерево (спереди-слева) — ЗНАК МИНУС!
                lb3: [0, a, R]                          // 🟢 Воздух (сзади, за плечами) — ЗНАК ПЛЮС!
            };

            // Каркас верхнего тетраэдра (Дух)
            createLine(pts.top, pts.ub1, 0x8888FF, false, 0.4);
            createLine(pts.top, pts.ub2, 0x8888FF, false, 0.4);
            createLine(pts.top, pts.ub3, 0x8888FF, false, 0.4);
            createLine(pts.ub1, pts.ub2, 0x8888FF, false, 0.2);
            createLine(pts.ub2, pts.ub3, 0x8888FF, false, 0.2);
            createLine(pts.ub3, pts.ub1, 0x8888FF, false, 0.2);

            // Каркас нижнего тетраэдра (Тело)
            createLine(pts.bottom, pts.lb1, 0xFF8888, false, 0.4);
            createLine(pts.bottom, pts.lb2, 0xFF8888, false, 0.4);
            createLine(pts.bottom, pts.lb3, 0xFF8888, false, 0.4);
            createLine(pts.lb1, pts.lb2, 0xFF8888, false, 0.2);
            createLine(pts.lb2, pts.lb3, 0xFF8888, false, 0.2);
            createLine(pts.lb3, pts.lb1, 0xFF8888, false, 0.2);

            // Главные диагонали (Оси баланса)
            createLine(pts.ub1, pts.lb1, 0xFFAA00, true, 0.9); 
            createLine(pts.ub2, pts.lb2, 0xFFAA00, true, 0.9); 
            createLine(pts.ub3, pts.lb3, 0xFFAA00, true, 0.9); 
            createLine(pts.top, pts.bottom, 0xFFAA00, true, 0.9); 

            // Точки с подписями
            createPoint(pts.center, colorMap['🟡'], '🟡 Бинду');
            createPoint(pts.top, colorMap['🟣'], '🟣 Дух');
            createPoint(pts.bottom, colorMap['🟪'], '🟪 Тело');
            createPoint(pts.ub1, colorMap['🟦'], '🟦 Вода');
            createPoint(pts.ub2, colorMap['🟥'], '🟥 Металл');
            createPoint(pts.ub3, colorMap['🟩'], '🟩 Земля');
            createPoint(pts.lb1, colorMap['🔴'], '🔴 Огонь');
            createPoint(pts.lb2, colorMap['🔵'], '🔵 Дерево');
            createPoint(pts.lb3, colorMap['🟢'], '🟢 Воздух');

            // Таблица координат с исправленными знаками Z
            const coordsHTML = `
                <div class="coord-row"><span>🟡 Бинду</span> <span class="vals">0, 0, 0</span></div>
                <div class="coord-row"><span>🟣 Дух</span> <span class="vals">0, ${h}, 0</span></div>
                <div class="coord-row"><span>🟪 Тело</span> <span class="vals">0, -${h}, 0</span></div>
                <div class="coord-row"><span>🟩 Земля</span> <span class="vals">0, -${a}, -${R.toFixed(1)}</span></div>
                <div class="coord-row"><span>🟢 Воздух</span> <span class="vals">0, +${a}, +${R.toFixed(1)}</span></div>
                <div class="coord-row"><span>🟦 Вода</span> <span class="vals">-${(R * Math.sqrt(3)/2).toFixed(1)}, -${a}, +${(R/2).toFixed(1)}</span></div>
                <div class="coord-row"><span>🟥 Металл</span> <span class="vals">+${(R * Math.sqrt(3)/2).toFixed(1)}, -${a}, +${(R/2).toFixed(1)}</span></div>
                <div class="coord-row"><span>🔴 Огонь</span> <span class="vals">+${(R * Math.sqrt(3)/2).toFixed(1)}, +${a}, -${(R/2).toFixed(1)}</span></div>
                <div class="coord-row"><span>🔵 Дерево</span> <span class="vals">-${(R * Math.sqrt(3)/2).toFixed(1)}, +${a}, -${(R/2).toFixed(1)}</span></div>
            `;
            document.getElementById('coord-list').innerHTML = coordsHTML;
        }

        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', updateModel);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        updateModel();
        animate();

        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });
    </script>
</body>
</html>
