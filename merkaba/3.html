<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Меркаба • Вращение</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #0a0a1a; }
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,40,0.9); backdrop-filter: blur(8px);
            color: white; padding: 15px 20px; border-radius: 16px;
            border: 1px solid #444; display: flex; flex-direction: column; gap: 10px;
            z-index: 10; max-width: 95%; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
        label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #ddd; }
        input[type="range"] { width: 120px; accent-color: #66aaff; cursor: pointer; }
        .value { min-width: 35px; text-align: center; font-weight: bold; color: #fff; }
        #advanced {
            display: none; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid #444;
        }
        #coords {
            position: absolute; bottom: 140px; left: 10px; color: #aaa; font-size: 12px;
            background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px;
            pointer-events: none; font-family: monospace; max-height: 200px; overflow-y: auto;
            white-space: pre; border: 1px solid #333;
        }
        @media (max-width: 600px) { #coords { display: none; } }
        #exportBtn, #toggleBtn, #settingsBtn {
            position: fixed; top: 10px; right: 10px; z-index: 20;
            background: #22aa66; color: #fff; border: none; padding: 10px 14px;
            border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        #toggleBtn { right: 110px; background: #333; }
        #settingsBtn { right: 210px; background: #444; }
        #toggleBtn:hover { background: #444; }
        #exportBtn:hover { background: #2ecc71; }
        #settingsBtn:hover { background: #555; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <button id="exportBtn">📤 Экспорт JSON</button>
    <button id="toggleBtn" title="Скрыть/показать панель">⚙️</button>
    <button id="settingsBtn" title="Дополнительные настройки">🎛️</button>

    <div id="controls">
        <!-- Основные слайдеры вращения -->
        <div class="row">
            <label>🔻 Угол <input type="range" id="topAngle" min="0" max="360" value="0" step="1" /><span class="value" id="valTopAngle">0</span></label>
            <label>🔺 Угол <input type="range" id="bottomAngle" min="0" max="360" value="180" step="1" /><span class="value" id="valBottomAngle">180</span></label>
            <label><input type="checkbox" id="linkRotation" checked /> связь</label>
        </div>

        <!-- Дополнительные настройки (скрыты) -->
        <div id="advanced">
            <div class="row">
                <label>🔻 Наклон <input type="range" id="topTilt" min="0" max="100" value="20" step="1" /><span class="value" id="valTopTilt">20</span></label>
                <label>🔻 Высота <input type="range" id="topY" min="150" max="250" value="180" step="1" /><span class="value" id="valTopY">180</span></label>
            </div>
            <div class="row">
                <label>🔺 Наклон <input type="range" id="bottomTilt" min="0" max="100" value="20" step="1" /><span class="value" id="valBottomTilt">20</span></label>
                <label>🔺 Высота <input type="range" id="bottomY" min="50" max="150" value="130" step="1" /><span class="value" id="valBottomY">130</span></label>
            </div>
            <div class="row">
                <label>⭕ Радиус <input type="range" id="radius" min="10" max="120" value="35" step="1" /><span class="value" id="valRadius">35</span></label>
            </div>
        </div>
    </div>

    <div id="coords"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { MerkabaMath } from './MerkabaMath.js';

        // СЦЕНА
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(5, 2.5, 5);
        camera.lookAt(0, 0.9, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.9, 0);

        scene.add(new THREE.AmbientLight(0x404060));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 3, 4);
        scene.add(dirLight);

        // ГРУППЫ
        let mainGroup = new THREE.Group();
        scene.add(mainGroup);
        let bodyGroup = new THREE.Group(); // для тела (опционально)
        scene.add(bodyGroup);

        // ВИЗУАЛИЗАТОР
        class MerkabaVisual {
            constructor() { this.group = mainGroup; }
            render(pointsData, options) {
                while(this.group.children.length > 0) {
                    const child = this.group.children[0];
                    if (child.isMesh) { child.geometry.dispose(); child.material.dispose(); }
                    this.group.remove(child);
                }
                labelRenderer.domElement.innerHTML = '';

                const vecPts = {};
                for (const [key, coord] of Object.entries(pointsData)) {
                    vecPts[key] = new THREE.Vector3(coord.x, coord.y, coord.z);
                }
                const colors = { '🟦': 0x3399ff, '🟥': 0xff5533, '🟩': 0x66ff66, '🔴': 0xff3333, '🔵': 0x33ccff, '🟢': 0x66ff99, '👁️': 0xff66ff, '🟪': 0x9966ff };

                const createTriangle = (p1, p2, p3, color, op) => {
                    const g = new THREE.BufferGeometry();
                    const v = new Float32Array([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z]);
                    g.setAttribute('position', new THREE.BufferAttribute(v, 3));
                    g.setIndex([0, 1, 2]);
                    g.computeVertexNormals();
                    const m = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: op });
                    return new THREE.Mesh(g, m);
                };

                this.group.add(createTriangle(vecPts['🟦'], vecPts['🟥'], vecPts['🟩'], 0x66aaff, 0.25));
                this.group.add(createTriangle(vecPts['🔴'], vecPts['🔵'], vecPts['🟢'], 0xff8866, 0.25));

                const sphereGeom = new THREE.SphereGeometry(0.04, 16, 16);
                for (const [key, vec] of Object.entries(vecPts)) {
                    const mat = new THREE.MeshStandardMaterial({ color: colors[key], emissive: colors[key], emissiveIntensity: 0.2 });
                    const sphere = new THREE.Mesh(sphereGeom, mat);
                    sphere.position.copy(vec);
                    this.group.add(sphere);

                    if (options.showLabels) {
                        const div = document.createElement('div');
                        div.textContent = key;
                        div.style.color = '#fff';
                        div.style.fontSize = '14px';
                        div.style.fontWeight = 'bold';
                        div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                        div.style.background = 'rgba(0,0,0,0.6)';
                        div.style.padding = '2px 8px';
                        div.style.borderRadius = '12px';
                        div.style.border = '1px solid rgba(255,255,255,0.2)';
                        const label = new CSS2DObject(div);
                        label.position.copy(vec.clone().add(new THREE.Vector3(0.08, 0.08, 0.08)));
                        this.group.add(label);
                    }
                }

                const addLine = (p1, p2, color, op) => {
                    const g = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                    const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: op });
                    return new THREE.Line(g, m);
                };

                const topV = vecPts['👁️'];
                const topBase = [vecPts['🟦'], vecPts['🟥'], vecPts['🟩']];
                topBase.forEach(p => this.group.add(addLine(topV, p, 0x66ccff, 0.8)));
                this.group.add(addLine(topBase[0], topBase[1], 0x66ccff, 0.9));
                this.group.add(addLine(topBase[1], topBase[2], 0x66ccff, 0.9));
                this.group.add(addLine(topBase[2], topBase[0], 0x66ccff, 0.9));

                const bottomV = vecPts['🟪'];
                const bottomBase = [vecPts['🔴'], vecPts['🔵'], vecPts['🟢']];
                bottomBase.forEach(p => this.group.add(addLine(bottomV, p, 0xff8866, 0.8)));
                this.group.add(addLine(bottomBase[0], bottomBase[1], 0xff8866, 0.9));
                this.group.add(addLine(bottomBase[1], bottomBase[2], 0xff8866, 0.9));
                this.group.add(addLine(bottomBase[2], bottomBase[0], 0xff8866, 0.9));

                if (options.showDiag) {
                    const diag = [
                        [vecPts['🟦'], vecPts['🔴']],
                        [vecPts['🟥'], vecPts['🔵']],
                        [vecPts['🟩'], vecPts['🟢']],
                        [vecPts['👁️'], vecPts['🟪']]
                    ];
                    diag.forEach(([p1, p2]) => this.group.add(addLine(p1, p2, 0xffdd44, 0.3)));
                }
            }
        }
        const visualizer = new MerkabaVisual();

        // УПРАВЛЕНИЕ
        const topAngle = document.getElementById('topAngle');
        const bottomAngle = document.getElementById('bottomAngle');
        const linkRotation = document.getElementById('linkRotation');
        const topTilt = document.getElementById('topTilt');
        const bottomTilt = document.getElementById('bottomTilt');
        const topY = document.getElementById('topY');
        const bottomY = document.getElementById('bottomY');
        const radiusInput = document.getElementById('radius');
        const coordsDiv = document.getElementById('coords');

        // Функция для получения направления (стрелка) по углу
        function getDirection(deg) {
            const dirs = ['⬆️', '↗️', '➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️'];
            return dirs[Math.round(deg / 45) % 8];
        }

        // ЭКСПОРТ JSON (включая координаты точек)
        function exportJSON() {
            // Вычисляем текущие параметры
            const params = getParams();
            const data = {
                top: {
                    angle: parseFloat(topAngle.value),
                    tilt: parseFloat(topTilt.value),
                    height: parseFloat(topY.value)
                },
                bottom: {
                    angle: parseFloat(bottomAngle.value),
                    tilt: parseFloat(bottomTilt.value),
                    height: parseFloat(bottomY.value)
                },
                radius: parseFloat(radiusInput.value),
                linkRotation: linkRotation.checked,
                points: params.points // добавляем координаты всех точек
            };
            navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => alert('JSON скопирован!'));
        }

        // Параметры для построения
        function getParams() {
            let aTop = parseFloat(topAngle.value);
            let tiltTop = parseFloat(topTilt.value) / 100;
            let yTop = parseFloat(topY.value) / 100;
            let aBottom = parseFloat(bottomAngle.value);
            let tiltBottom = parseFloat(bottomTilt.value) / 100;
            let yBottom = parseFloat(bottomY.value) / 100;
            let r = parseFloat(radiusInput.value) / 100;

            if (linkRotation.checked) {
                aBottom = (aTop + 180) % 360;
                bottomAngle.value = aBottom;
                document.getElementById('valBottomAngle').textContent = aBottom;
            }

            const shiftX = (angle, tilt) => Math.sin(angle * Math.PI / 180) * tilt * 0.5;
            const shiftZ = (angle, tilt) => Math.cos(angle * Math.PI / 180) * tilt * 0.5;

            const bottomVertex = { x: 0, y: yBottom, z: 0 };
            const topVertex = { x: 0, y: yTop, z: 0 };

            const bottomBase = {
                x: bottomVertex.x - shiftX(aBottom, tiltBottom),
                y: bottomVertex.y - 0.6,
                z: bottomVertex.z - shiftZ(aBottom, tiltBottom)
            };

            const topBase = {
                x: topVertex.x + shiftX(aTop, tiltTop),
                y: topVertex.y + 0.6,
                z: topVertex.z + shiftZ(aTop, tiltTop)
            };

            const math = new MerkabaMath(bottomVertex, bottomBase, topVertex, topBase, r);
            const points = math.getPoints();

            return { points, aTop, tiltTop, yTop, aBottom, tiltBottom, yBottom, r };
        }

        // ПЕРЕСТРОЙКА
        function rebuild() {
            const params = getParams();
            const points = params.points;

            visualizer.render(points, { showDiag: true, showLabels: true });

            let text = 'Координаты (м):\n';
            for (const [key, v] of Object.entries(points)) {
                text += `${key}: (${v.x.toFixed(2)}, ${v.y.toFixed(2)}, ${v.z.toFixed(2)})\n`;
            }
            coordsDiv.textContent = text;
        }

        // Слушатели
        [topAngle, bottomAngle, linkRotation, topTilt, bottomTilt, topY, bottomY, radiusInput].forEach(el => {
            el.addEventListener('input', () => {
                document.getElementById('valTopAngle').textContent = topAngle.value;
                document.getElementById('valBottomAngle').textContent = bottomAngle.value;
                document.getElementById('valTopTilt').textContent = topTilt.value;
                document.getElementById('valBottomTilt').textContent = bottomTilt.value;
                document.getElementById('valTopY').textContent = topY.value;
                document.getElementById('valBottomY').textContent = bottomY.value;
                document.getElementById('valRadius').textContent = radiusInput.value;
                rebuild();
            });
        });

        // Кнопки
        document.getElementById('exportBtn').addEventListener('click', exportJSON);
        document.getElementById('toggleBtn').addEventListener('click', () => {
            document.getElementById('controls').classList.toggle('hidden');
        });
        document.getElementById('settingsBtn').addEventListener('click', () => {
            const advanced = document.getElementById('advanced');
            advanced.style.display = advanced.style.display === 'none' ? 'block' : 'none';
        });

        // Инициализация
        rebuild();

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
