<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Меркаба • Исправленный центр + Скрытие UI</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #0a0a1a; }
        
        #info {
            position: absolute; top: 12px; left: 12px;
            color: #ccc; background: rgba(0,0,0,0.7);
            padding: 8px 14px; border-radius: 8px;
            font-size: 14px; z-index: 10; border: 1px solid #333;
            pointer-events: none; transition: opacity 0.3s ease;
        }
        #controls {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,40,0.85); backdrop-filter: blur(6px);
            color: white; padding: 18px 28px; border-radius: 14px;
            border: 1px solid #444; display: flex; flex-wrap: wrap;
            gap: 18px 30px; justify-content: center; align-items: center;
            z-index: 10; pointer-events: auto; max-width: 92%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #controls label {
            display: flex; align-items: center; gap: 8px; font-size: 15px; color: #ddd;
        }
        #controls input[type="range"] {
            width: 120px; background: #222; accent-color: #66aaff; cursor: pointer;
        }
        #controls .value {
            min-width: 50px; text-align: center; font-weight: bold; color: #fff;
        }
        .checkbox-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .checkbox-group label { font-size: 14px; gap: 4px; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #66aaff; cursor: pointer; }
        #coords {
            position: absolute; bottom: 110px; left: 20px;
            color: #aaa; font-size: 13px; background: rgba(0,0,0,0.7);
            padding: 8px 14px; border-radius: 8px; pointer-events: none; z-index: 10;
            font-family: monospace; max-height: 240px; overflow-y: auto;
            white-space: pre; line-height: 1.6; border: 1px solid #333; min-width: 200px;
            transition: opacity 0.3s ease;
        }
        
        /* Кнопка скрытия интерфейса */
        #toggleBtn {
            position: absolute; bottom: 25px; right: 20px;
            background: rgba(255,255,255,0.1); color: #aaa;
            border: 1px solid #555; border-radius: 50%;
            width: 40px; height: 40px; font-size: 20px;
            cursor: pointer; z-index: 20;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; user-select: none;
        }
        #toggleBtn:hover { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ui-hidden #controls { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px); }
        .ui-hidden #coords { opacity: 0; }
        .ui-hidden #info { opacity: 0; }

        @media (max-width: 700px) {
            #controls { flex-direction: column; gap: 12px; padding: 15px 20px; width: 92%; bottom: 15px; }
            #controls label { width: 100%; justify-content: space-between; }
            .checkbox-group { width: 100%; justify-content: space-around; }
            #coords { display: none; } /* На телефоне координаты всё же лучше скрыть */
        }
        @media (max-width: 600px) { #coords { display: none; } }
    </style>
</head>
<body>
    <div id="info">🟡 Меркаба • Исправленный центр</div>
    <div id="coords"></div>

    <button id="toggleBtn">👁</button>

    <div id="controls">
        <label>📏 Рост (см) <input type="range" id="heightSlider" min="100" max="220" value="180" step="1" />
            <span class="value" id="heightValue">180</span>
        </label>
        <label>👁️ Высота (см) <input type="range" id="eyeSlider" min="0" max="220" value="175" step="1" />
            <span class="value" id="eyeValue">175</span>
        </label>
        <label>📐 Основание (см) <input type="range" id="baseSlider" min="0" max="220" value="130" step="1" />
            <span class="value" id="baseValue">130</span>
        </label>
        <label>⭕ Радиус (см) <input type="range" id="radiusSlider" min="20" max="120" value="80" step="1" />
            <span class="value" id="radiusValue">80</span>
        </label>
        <div class="checkbox-group">
            <label><input type="checkbox" id="autoRadius" checked /> авто-радиус</label>
            <label><input type="checkbox" id="showDiag" checked /> диагонали</label>
            <label><input type="checkbox" id="showLabels" checked /> подписи</label>
            <label><input type="checkbox" id="showGrid" checked /> сетка</label>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ==========================================
        // КЛАСС 1: ЧИСТАЯ МАТЕМАТИКА (ВЫДАЕТ JSON)
        // ==========================================
        class MerkabaMath {
            constructor(h, l, baseY = 0) {
                this.h = h;
                this.l = l;
                this.baseY = baseY;
            }

            getPoints() {
                const d = this.l / Math.sqrt(2);
                const sqrt3 = Math.sqrt(3);
                const halfL = this.l / 2;
                const sqrt3halfL = sqrt3 * halfL;

                // ИСПРАВЛЕНА КООРДИНАТА ТОЧКИ 🟪 (по твоей формуле)
                return {
                    '🟦': { x: -sqrt3halfL, y: 0 + this.baseY, z: halfL },
                    '🟥': { x:  sqrt3halfL, y: 0 + this.baseY, z: halfL },
                    '🟩': { x: 0, y: 0 + this.baseY, z: -this.l },
                    
                    '🔴': { x:  sqrt3halfL, y: 2*d + this.baseY, z: -halfL },
                    '🔵': { x: -sqrt3halfL, y: 2*d + this.baseY, z: -halfL },
                    '🟢': { x: 0, y: 2*d + this.baseY, z: this.l },
                    
                    '👁️': { x: 0, y: this.h + this.baseY, z: 0 },
                    '🟪': { x: 0, y: (2*d - this.h) + this.baseY, z: 0 } 
                };
            }
        }

        // ==========================================
        // КЛАСС 2: ВИЗУАЛИЗАЦИЯ (СТРОИТ ПО JSON)
        // ==========================================
        class MerkabaVisual {
            constructor(scene, labelRenderer) {
                this.scene = scene;
                this.labelRenderer = labelRenderer;
                this.group = new THREE.Group();
                this.scene.add(this.group);
            }

            render(pointsData, colors, options) {
                // 1. ПОЛНАЯ ОЧИСТКА ОТ СТАРЫХ ЭЛЕМЕНТОВ (убирает шлейфы)
                this.labelRenderer.domElement.innerHTML = '';
                while(this.group.children.length > 0) {
                    const child = this.group.children[0];
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                    this.group.remove(child);
                }

                // 2. ПОДГОТОВКА ЦВЕТОВ
                const colorMap = {
                    '🟦': 0x3399ff, '🟥': 0xff5533, '🟩': 0x66ff66,
                    '🔴': 0xff3333, '🔵': 0x33ccff, '🟢': 0x66ff99,
                    '👁️': 0xff66ff, '🟪': 0x9966ff
                };
                const mergeColors = { ...colorMap, ...(colors || {}) };

                // 3. СТРОИМ КАРКАС
                const vecPts = {};
                for (const [key, coord] of Object.entries(pointsData)) {
                    vecPts[key] = new THREE.Vector3(coord.x, coord.y, coord.z);
                }

                let maxR = 0;
                const sphereGeom = new THREE.SphereGeometry(0.04, 16, 16);
                const labelGroup = new THREE.Group();

                for (const [key, vec] of Object.entries(vecPts)) {
                    const color = mergeColors[key] || 0xffffff;
                    const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
                    const sphere = new THREE.Mesh(sphereGeom, mat);
                    sphere.position.copy(vec);
                    this.group.add(sphere);

                    const r = vec.length();
                    if (r > maxR) maxR = r;

                    if (options.showLabels) {
                        const div = document.createElement('div');
                        div.textContent = key;
                        div.style.color = '#fff';
                        div.style.fontSize = '14px';
                        div.style.fontWeight = 'bold';
                        div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                        div.style.background = 'rgba(0,0,0,0.6)';
                        div.style.padding = '2px 8px';
                        div.style.borderRadius = '12px';
                        div.style.border = '1px solid rgba(255,255,255,0.2)';
                        const label = new CSS2DObject(div);
                        label.position.copy(vec.clone().add(new THREE.Vector3(0.08, 0.08, 0.08)));
                        labelGroup.add(label);
                    }
                }
                this.group.add(labelGroup);

                // Линии тетраэдров
                const edgeGroup = new THREE.Group();
                const topV = vecPts['👁️'];
                const topBase = [vecPts['🟦'], vecPts['🟥'], vecPts['🟩']];
                topBase.forEach(p => edgeGroup.add(this._createLine(topV, p, 0x66ccff, 0.8)));
                edgeGroup.add(this._createLine(topBase[0], topBase[1], 0x66ccff, 0.4));
                edgeGroup.add(this._createLine(topBase[1], topBase[2], 0x66ccff, 0.4));
                edgeGroup.add(this._createLine(topBase[2], topBase[0], 0x66ccff, 0.4));

                const bottomV = vecPts['🟪'];
                const bottomBase = [vecPts['🔴'], vecPts['🔵'], vecPts['🟢']];
                bottomBase.forEach(p => edgeGroup.add(this._createLine(bottomV, p, 0xff8866, 0.8)));
                edgeGroup.add(this._createLine(bottomBase[0], bottomBase[1], 0xff8866, 0.4));
                edgeGroup.add(this._createLine(bottomBase[1], bottomBase[2], 0xff8866, 0.4));
                edgeGroup.add(this._createLine(bottomBase[2], bottomBase[0], 0xff8866, 0.4));
                this.group.add(edgeGroup);

                // Диагонали
                if (options.showDiag) {
                    const diagGroup = new THREE.Group();
                    const diagonals = [
                        [vecPts['🟦'], vecPts['🔴']],
                        [vecPts['🟥'], vecPts['🔵']],
                        [vecPts['🟩'], vecPts['🟢']],
                        [vecPts['👁️'], vecPts['🟪']]
                    ];
                    diagonals.forEach(([p1, p2]) => {
                        diagGroup.add(this._createLine(p1, p2, 0xffdd44, 0.3));
                    });
                    this.group.add(diagGroup);
                }

                // Сфера ориентира
                const sphereWire = new THREE.Mesh(
                    new THREE.SphereGeometry(maxR, 32, 16),
                    new THREE.MeshBasicMaterial({ wireframe: true, color: 0x446688, transparent: true, opacity: 0.08 })
                );
                this.group.add(sphereWire);

                // Сетка
                if (options.showGrid) {
                    const gridHelper = new THREE.GridHelper(3 * maxR, 12, 0x445566, 0x223344);
                    gridHelper.position.y = pointsData['🟦'].y;
                    this.group.add(gridHelper);
                }
            }

            _createLine(p1, p2, color, opacity) {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
                return new THREE.Line(geom, mat);
            }
        }

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ СЦЕНЫ
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(5, 2.5, 5);
        camera.lookAt(0, 0.9, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.9, 0);
        controls.update();

        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 3, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, -1, -2);
        scene.add(backLight);

        const bodyGroup = new THREE.Group();
        scene.add(bodyGroup);

        // Элементы управления
        const heightSlider = document.getElementById('heightSlider');
        const eyeSlider = document.getElementById('eyeSlider');
        const baseSlider = document.getElementById('baseSlider');
        const radiusSlider = document.getElementById('radiusSlider');
        
        const heightValue = document.getElementById('heightValue');
        const eyeValue = document.getElementById('eyeValue');
        const baseValue = document.getElementById('baseValue');
        const radiusValue = document.getElementById('radiusValue');
        
        const autoRadiusCheck = document.getElementById('autoRadius');
        const showDiag = document.getElementById('showDiag');
        const showLabels = document.getElementById('showLabels');
        const showGrid = document.getElementById('showGrid');
        const coordsDiv = document.getElementById('coords');

        let radiusManuallyChanged = false;
        const visualizer = new MerkabaVisual(scene, labelRenderer);

        // ==========================================
        // ФУНКЦИИ ОБНОВЛЕНИЯ
        // ==========================================
        function updateBody() {
            while(bodyGroup.children.length > 0) {
                const child = bodyGroup.children[0];
                bodyGroup.remove(child);
            }

            const heightCm = parseFloat(heightSlider.value);
            heightValue.textContent = heightCm;
            const h = heightCm / 100;

            const levels = [
                { name: 'стопы', y: 0 },
                { name: 'колени', y: 0.25 * h },
                { name: 'таз', y: 0.5 * h },
                { name: 'плечи', y: 0.75 * h },
                { name: 'макушка', y: h }
            ];

            for (const level of levels) {
                const geo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-1.2, level.y, 0),
                    new THREE.Vector3(1.2, level.y, 0)
                ]);
                const mat = new THREE.LineBasicMaterial({ color: 0x44aa88, transparent: true, opacity: 0.2 });
                const line = new THREE.Line(geo, mat);
                bodyGroup.add(line);

                const div = document.createElement('div');
                div.textContent = level.name;
                div.style.color = '#666';
                div.style.fontSize = '10px';
                div.style.background = 'rgba(0,0,0,0.5)';
                div.style.padding = '2px 6px';
                div.style.borderRadius = '4px';
                const label = new CSS2DObject(div);
                label.position.set(-1.35, level.y, 0);
                bodyGroup.add(label);
            }
        }

        function rebuild() {
            const heightCm = parseFloat(heightSlider.value);
            const eyeCm = parseFloat(eyeSlider.value);
            const baseCm = parseFloat(baseSlider.value);
            let radiusCm = parseFloat(radiusSlider.value);

            eyeValue.textContent = eyeCm;
            baseValue.textContent = baseCm;
            radiusValue.textContent = radiusCm;
            heightValue.textContent = heightCm;

            const hMeters = (eyeCm - baseCm) / 100;
            const baseY = baseCm / 100;

            if (hMeters <= 0) {
                baseSlider.value = eyeCm - 10;
                rebuild();
                return;
            }

            if (autoRadiusCheck.checked && !radiusManuallyChanged) {
                const sqrt2 = Math.sqrt(2);
                const sqrt3 = Math.sqrt(3);
                const lMeters = hMeters * sqrt2 / (sqrt3 + 1);
                radiusCm = lMeters * 100;
                radiusSlider.value = radiusCm;
                radiusValue.textContent = radiusCm.toFixed(1);
            }

            const lMeters = radiusCm / 100;
            const math = new MerkabaMath(hMeters, lMeters, baseY);
            const points = math.getPoints();

            const options = {
                showDiag: showDiag.checked,
                showLabels: showLabels.checked,
                showGrid: showGrid.checked
            };
            visualizer.render(points, {}, options);

            let text = 'Координаты точек (см) относительно тела:\n';
            for (const [key, vec] of Object.entries(points)) {
                text += `${key}: (${(vec.x*100).toFixed(1)}, ${(vec.y*100).toFixed(1)}, ${(vec.z*100).toFixed(1)})\n`;
            }
            coordsDiv.textContent = text;
        }

        // Обработчики
        heightSlider.addEventListener('input', () => { updateBody(); rebuild(); });
        eyeSlider.addEventListener('input', () => { if (autoRadiusCheck.checked) radiusManuallyChanged = false; rebuild(); });
        baseSlider.addEventListener('input', () => { if (autoRadiusCheck.checked) radiusManuallyChanged = false; rebuild(); });
        radiusSlider.addEventListener('input', () => { radiusManuallyChanged = true; rebuild(); });
        
        autoRadiusCheck.addEventListener('change', () => {
            radiusManuallyChanged = !autoRadiusCheck.checked;
            rebuild();
        });

        showDiag.addEventListener('change', rebuild);
        showLabels.addEventListener('change', rebuild);
        showGrid.addEventListener('change', rebuild);

        // Кнопка скрытия интерфейса
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('ui-hidden');
            toggleBtn.textContent = document.body.classList.contains('ui-hidden') ? '⚙️' : '👁';
        });

        // Первый запуск
        updateBody();
        rebuild();

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });
    </script>
</body>
</html>
