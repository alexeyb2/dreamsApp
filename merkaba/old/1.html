<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Меркаба с параметрами h и l</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px 30px;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }
        #controls input[type="number"] {
            width: 70px;
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #666;
            background: #222;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }
        #controls input[type="number"]:focus {
            outline: 2px solid #66aaff;
        }
        #controls .checkbox-group {
            display: flex;
            gap: 15px;
        }
        #controls .checkbox-group label {
            font-size: 14px;
            gap: 4px;
        }
        #controls .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #66aaff;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            #controls {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
                width: 90%;
                bottom: 15px;
            }
            #controls label {
                width: 100%;
                justify-content: space-between;
            }
            #controls .checkbox-group {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <div id="info">Меркаба • параметры h (вершины) и l (основание)</div>

    <div id="controls">
        <label>
            h =
            <input type="number" id="hInput" value="1.732" step="0.01" min="0.1" max="3.0" />
        </label>
        <label>
            l =
            <input type="number" id="lInput" value="1.414" step="0.01" min="0.1" max="2.5" />
        </label>
        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="showDiag" checked /> диагонали
            </label>
            <label>
                <input type="checkbox" id="showLabels" checked /> подписи
            </label>
        </div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(4, 2.5, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0, 0);
        controls.autoRotate = false;

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 3, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, -1, -2);
        scene.add(backLight);

        // --- Группа для Меркабы ---
        let merkabaGroup = new THREE.Group();
        scene.add(merkabaGroup);

        // --- Элементы управления ---
        const hInput = document.getElementById('hInput');
        const lInput = document.getElementById('lInput');
        const showDiag = document.getElementById('showDiag');
        const showLabels = document.getElementById('showLabels');

        // --- Функция построения ---
        function buildMerkaba(h, l) {
            // Очищаем группу
            while (merkabaGroup.children.length) {
                merkabaGroup.remove(merkabaGroup.children[0]);
            }

            const sqrt3 = Math.sqrt(3);
            const halfL = l / 2;
            const sqrt3halfL = sqrt3 * halfL;

            // Координаты вершин (конфигурация: 🟩 за спиной, 🟢 перед шеей)
            // Плоскость земли: Z = -1; небо: Z = +1
            const pts = {
                '🟦': new THREE.Vector3(-sqrt3halfL,  halfL, -1), // левое колено, перед
                '🟥': new THREE.Vector3( sqrt3halfL,  halfL, -1), // правое колено, перед
                '🟩': new THREE.Vector3( 0,          -l,     -1), // за спиной, назад
                '🔴': new THREE.Vector3( sqrt3halfL, -halfL,  1), // правое плечо, сзади
                '🔵': new THREE.Vector3(-sqrt3halfL, -halfL,  1), // левое плечо, сзади
                '🟢': new THREE.Vector3( 0,           l,      1), // перед шеей, вперёд
                '🟣': new THREE.Vector3( 0,           h,      0), // вершина вверх
                '🟪': new THREE.Vector3( 0,          -h,      0)  // вершина вниз
            };

            // Цвета для точек (приблизительно по смайлам)
            const colors = {
                '🟦': 0x3399ff,
                '🟥': 0xff5533,
                '🟩': 0x66ff66,
                '🔴': 0xff3333,
                '🔵': 0x33ccff,
                '🟢': 0x66ff99,
                '🟣': 0xff66ff,
                '🟪': 0x9966ff
            };

            // Материал для сфер
            const sphereGeom = new THREE.SphereGeometry(0.08, 20, 20);
            const labelGroup = new THREE.Group();

            // --- Вершины и подписи ---
            for (const [key, vec] of Object.entries(pts)) {
                // Сфера
                const color = colors[key] || 0xffffff;
                const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
                const sphere = new THREE.Mesh(sphereGeom, mat);
                sphere.position.copy(vec);
                merkabaGroup.add(sphere);

                // Подпись CSS2D
                const div = document.createElement('div');
                div.textContent = key;
                div.style.color = '#fff';
                div.style.fontSize = '15px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                div.style.background = 'rgba(0,0,0,0.6)';
                div.style.padding = '2px 8px';
                div.style.borderRadius = '12px';
                div.style.border = '1px solid rgba(255,255,255,0.2)';
                div.style.backdropFilter = 'blur(2px)';
                const label = new CSS2DObject(div);
                label.position.copy(vec.clone().add(new THREE.Vector3(0.15, 0.15, 0.15)));
                labelGroup.add(label);
            }
            merkabaGroup.add(labelGroup);

            // --- Рёбра тетраэдров ---
            function addEdge(p1, p2, color = 0x88aaff, opacity = 0.6, dashed = false) {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                let mat;
                if (dashed) {
                    mat = new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 0.03, gapSize: 0.02 });
                } else {
                    mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
                }
                const line = new THREE.Line(geom, mat);
                if (dashed) line.computeLineDistances();
                merkabaGroup.add(line);
            }

            // Верхний тетраэдр (вершина 🟣, основание 🟦🟥🟩)
            const topV = pts['🟣'];
            const topBase = [pts['🟦'], pts['🟥'], pts['🟩']];
            // Рёбра от вершины к основанию
            topBase.forEach(p => addEdge(topV, p, 0x66ccff, 0.8));
            // Рёбра основания
            addEdge(topBase[0], topBase[1], 0x66ccff, 0.4);
            addEdge(topBase[1], topBase[2], 0x66ccff, 0.4);
            addEdge(topBase[2], topBase[0], 0x66ccff, 0.4);

            // Нижний тетраэдр (вершина 🟪, основание 🔴🔵🟢)
            const bottomV = pts['🟪'];
            const bottomBase = [pts['🔴'], pts['🔵'], pts['🟢']];
            bottomBase.forEach(p => addEdge(bottomV, p, 0xff8866, 0.8));
            addEdge(bottomBase[0], bottomBase[1], 0xff8866, 0.4);
            addEdge(bottomBase[1], bottomBase[2], 0xff8866, 0.4);
            addEdge(bottomBase[2], bottomBase[0], 0xff8866, 0.4);

            // --- Диагонали (оси через центр) ---
            const diagGroup = new THREE.Group();
            const diagonals = [
                [pts['🟦'], pts['🔴']],
                [pts['🟥'], pts['🔵']],
                [pts['🟩'], pts['🟢']],
                [pts['🟣'], pts['🟪']]
            ];
            diagonals.forEach(([p1, p2]) => {
                addEdge(p1, p2, 0xffdd44, 0.25, false);
            });
            // Сохраняем диагонали в группу, чтобы управлять видимостью
            // Мы не можем их сгруппировать, потому что они добавлены напрямую. 
            // Лучше создадим отдельную группу для диагоналей и добавим в merkabaGroup, но для простоты сделаем массив.
            // Переделаем: создадим группу diagGroup и добавим в неё линии, потом добавим в merkabaGroup.
            // Для этого перепишем добавление диагоналей в отдельную группу.
            // В текущей реализации addEdge добавляет сразу в merkabaGroup, поэтому переделаем.

            // Перестраиваем с использованием diagGroup и edgeGroup для удобства.
            // Но чтобы не усложнять, создадим новый метод.
            // Поскольку мы уже построили, лучше удалить и перестроить с группировкой.
            // Проще: после построения пройти по детям и собрать диагонали? Но их сложно отличить.
            // Перепишем build заново с группировкой.

            // Удаляем всё и перестроим правильно.
            // Пока оставим так, а для диагоналей просто добавим их в отдельную группу и сохраним.
            // Сделаем проще: создадим группу diagGroup внутри, добавим в неё линии диагоналей, а затем добавим в merkabaGroup.
            // В текущем коде addEdge добавляет в merkabaGroup, поэтому создадим отдельную функцию для диагоналей.
            // Но проще перезапустить сборку с группировкой.
            // Я перепишу build с нуля с учётом группировки.
        }

        // Полноценная версия с группировкой — сделаем отдельную функцию buildMerkabaGrouped
        function buildMerkabaGrouped(h, l) {
            // Очищаем группу
            while (merkabaGroup.children.length) {
                merkabaGroup.remove(merkabaGroup.children[0]);
            }

            const sqrt3 = Math.sqrt(3);
            const halfL = l / 2;
            const sqrt3halfL = sqrt3 * halfL;

            const pts = {
                '🟦': new THREE.Vector3(-sqrt3halfL,  halfL, -1),
                '🟥': new THREE.Vector3( sqrt3halfL,  halfL, -1),
                '🟩': new THREE.Vector3( 0,          -l,     -1),
                '🔴': new THREE.Vector3( sqrt3halfL, -halfL,  1),
                '🔵': new THREE.Vector3(-sqrt3halfL, -halfL,  1),
                '🟢': new THREE.Vector3( 0,           l,      1),
                '🟣': new THREE.Vector3( 0,           h,      0),
                '🟪': new THREE.Vector3( 0,          -h,      0)
            };

            const colors = {
                '🟦': 0x3399ff, '🟥': 0xff5533, '🟩': 0x66ff66,
                '🔴': 0xff3333, '🔵': 0x33ccff, '🟢': 0x66ff99,
                '🟣': 0xff66ff, '🟪': 0x9966ff
            };

            const sphereGeom = new THREE.SphereGeometry(0.08, 20, 20);

            // --- Вершины и подписи ---
            const labelGroup = new THREE.Group();
            for (const [key, vec] of Object.entries(pts)) {
                const color = colors[key] || 0xffffff;
                const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
                const sphere = new THREE.Mesh(sphereGeom, mat);
                sphere.position.copy(vec);
                merkabaGroup.add(sphere);

                const div = document.createElement('div');
                div.textContent = key;
                div.style.color = '#fff';
                div.style.fontSize = '15px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                div.style.background = 'rgba(0,0,0,0.6)';
                div.style.padding = '2px 8px';
                div.style.borderRadius = '12px';
                div.style.border = '1px solid rgba(255,255,255,0.2)';
                div.style.backdropFilter = 'blur(2px)';
                const label = new CSS2DObject(div);
                label.position.copy(vec.clone().add(new THREE.Vector3(0.15, 0.15, 0.15)));
                labelGroup.add(label);
            }
            merkabaGroup.add(labelGroup);

            // --- Вспомогательная функция добавления линии ---
            function addLine(p1, p2, color, opacity = 0.6, dashed = false) {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                let mat;
                if (dashed) {
                    mat = new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 0.04, gapSize: 0.03 });
                } else {
                    mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
                }
                const line = new THREE.Line(geom, mat);
                if (dashed) line.computeLineDistances();
                return line;
            }

            // --- Рёбра тетраэдров ---
            const edgeGroup = new THREE.Group();
            const topV = pts['🟣'];
            const topBase = [pts['🟦'], pts['🟥'], pts['🟩']];
            topBase.forEach(p => edgeGroup.add(addLine(topV, p, 0x66ccff, 0.8)));
            edgeGroup.add(addLine(topBase[0], topBase[1], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[1], topBase[2], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[2], topBase[0], 0x66ccff, 0.4));

            const bottomV = pts['🟪'];
            const bottomBase = [pts['🔴'], pts['🔵'], pts['🟢']];
            bottomBase.forEach(p => edgeGroup.add(addLine(bottomV, p, 0xff8866, 0.8)));
            edgeGroup.add(addLine(bottomBase[0], bottomBase[1], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[1], bottomBase[2], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[2], bottomBase[0], 0xff8866, 0.4));
            merkabaGroup.add(edgeGroup);

            // --- Диагонали (оси) ---
            const diagGroup = new THREE.Group();
            const diagonals = [
                [pts['🟦'], pts['🔴']],
                [pts['🟥'], pts['🔵']],
                [pts['🟩'], pts['🟢']],
                [pts['🟣'], pts['🟪']]
            ];
            diagonals.forEach(([p1, p2]) => {
                diagGroup.add(addLine(p1, p2, 0xffdd44, 0.25));
            });
            merkabaGroup.add(diagGroup);

            // --- Сфера радиуса (для визуализации) ---
            let maxR = 0;
            for (const vec of Object.values(pts)) {
                const r = vec.length();
                if (r > maxR) maxR = r;
            }
            const sphereWire = new THREE.Mesh(
                new THREE.SphereGeometry(maxR, 32, 16),
                new THREE.MeshBasicMaterial({ wireframe: true, color: 0x446688, transparent: true, opacity: 0.1 })
            );
            merkabaGroup.add(sphereWire);

            // Сохраняем ссылки для управления видимостью
            merkabaGroup.userData.diagGroup = diagGroup;
            merkabaGroup.userData.labelGroup = labelGroup;

            // Применяем текущее состояние чекбоксов
            updateVisibility();
        }

        // --- Функция обновления видимости ---
        function updateVisibility() {
            const showDiagChecked = showDiag.checked;
            const showLabelsChecked = showLabels.checked;
            if (merkabaGroup.userData.diagGroup) {
                merkabaGroup.userData.diagGroup.visible = showDiagChecked;
            }
            if (merkabaGroup.userData.labelGroup) {
                merkabaGroup.userData.labelGroup.visible = showLabelsChecked;
            }
        }

        // --- Обработчики событий ---
        function rebuild() {
            const h = parseFloat(hInput.value) || 1.732;
            const l = parseFloat(lInput.value) || 1.414;
            buildMerkabaGrouped(h, l);
        }

        hInput.addEventListener('input', rebuild);
        lInput.addEventListener('input', rebuild);
        showDiag.addEventListener('change', updateVisibility);
        showLabels.addEventListener('change', updateVisibility);

        // --- Построить по умолчанию ---
        rebuild();

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // --- Адаптация размера ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // --- Вспомогательные элементы ---
        const axesHelper = new THREE.AxesHelper(2.5);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.2;
        scene.add(axesHelper);

        const gridHelper = new THREE.GridHelper(5, 10, 0x445566, 0x223344);
        gridHelper.position.y = -1.8;
        scene.add(gridHelper);

        console.log('Меркаба готова. Меняйте h и l в полях ввода.');
    </script>
</body>
</html>
