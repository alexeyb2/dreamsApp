<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Меркаба • привязка к телу</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #0a0a1a; }
        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #ccc;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            border: 1px solid #333;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,40,0.85);
            backdrop-filter: blur(6px);
            color: white;
            padding: 18px 28px;
            border-radius: 14px;
            border: 1px solid #444;
            display: flex;
            flex-wrap: wrap;
            gap: 18px 30px;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            max-width: 92%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        #controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #ddd;
        }
        #controls input[type="range"] {
            width: 120px;
            background: #222;
            accent-color: #66aaff;
            cursor: pointer;
        }
        #controls .value {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #fff;
        }
        .checkbox-group {
            display: flex;
            gap: 16px;
        }
        .checkbox-group label {
            font-size: 14px;
            gap: 4px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #66aaff;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            #controls {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
                width: 92%;
                bottom: 15px;
            }
            #controls label {
                width: 100%;
                justify-content: space-between;
            }
            .checkbox-group {
                width: 100%;
                justify-content: space-around;
            }
        }
        #coords {
            position: absolute;
            bottom: 110px;
            left: 20px;
            color: #aaa;
            font-size: 13px;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
            max-height: 240px;
            overflow-y: auto;
            white-space: pre;
            line-height: 1.6;
            border: 1px solid #333;
            min-width: 200px;
        }
        @media (max-width: 600px) {
            #coords { display: none; }
        }
    </style>
</head>
<body>
    <div id="info">🟡 Меркаба • 👁️ и основание на теле</div>
    <div id="coords"></div>

    <div id="controls">
        <label>👁️ высота (см) <input type="range" id="eyeSlider" min="50" max="250" value="175" step="1" />
            <span class="value" id="eyeValue">175</span>
        </label>
        <label>Основание (см) <input type="range" id="baseSlider" min="0" max="200" value="0" step="1" />
            <span class="value" id="baseValue">0</span>
        </label>
        <label>Радиус (см) <input type="range" id="radiusSlider" min="20" max="120" value="80" step="1" />
            <span class="value" id="radiusValue">80</span>
        </label>
        <div class="checkbox-group">
            <label><input type="checkbox" id="showDiag" checked /> диагонали</label>
            <label><input type="checkbox" id="showLabels" checked /> подписи</label>
            <label><input type="checkbox" id="showGrid" checked /> сетка</label>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(5, 2.5, 5);
        camera.lookAt(0, 0.9, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.9, 0);
        controls.update();

        // --- Свет ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 3, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, -1, -2);
        scene.add(backLight);

        // --- Группа для всей сцены (будет заменяться) ---
        let mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // --- Элементы управления ---
        const eyeSlider = document.getElementById('eyeSlider');
        const baseSlider = document.getElementById('baseSlider');
        const radiusSlider = document.getElementById('radiusSlider');
        const eyeValue = document.getElementById('eyeValue');
        const baseValue = document.getElementById('baseValue');
        const radiusValue = document.getElementById('radiusValue');
        const showDiag = document.getElementById('showDiag');
        const showLabels = document.getElementById('showLabels');
        const showGrid = document.getElementById('showGrid');
        const coordsDiv = document.getElementById('coords');

        // --- Построение скелета (вертикальные ориентиры) ---
        function buildSkeleton() {
            const group = new THREE.Group();

            // Основная линия тела (0–200 см)
            const points = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 2, 0)
            ];
            const geomLine = new THREE.BufferGeometry().setFromPoints(points);
            const matLine = new THREE.LineBasicMaterial({ color: 0x445566, transparent: true, opacity: 0.3 });
            const line = new THREE.Line(geomLine, matLine);
            group.add(line);

            // Горизонтальные метки на ключевых уровнях (см)
            const levels = [0, 50, 100, 140, 170];
            const names = ['стопы', 'колени', 'таз', 'плечи', 'макушка'];
            for (let i = 0; i < levels.length; i++) {
                const y = levels[i] / 100;
                const pts = [
                    new THREE.Vector3(-0.15, y, 0),
                    new THREE.Vector3(0.15, y, 0)
                ];
                const g = new THREE.BufferGeometry().setFromPoints(pts);
                const m = new THREE.LineBasicMaterial({ color: 0x6688aa, transparent: true, opacity: 0.2 });
                const l = new THREE.Line(g, m);
                group.add(l);
                // Подпись уровня
                const div = document.createElement('div');
                div.textContent = `${names[i]} (${levels[i]} см)`;
                div.style.color = '#6688aa';
                div.style.fontSize = '10px';
                div.style.background = 'rgba(0,0,0,0.4)';
                div.style.padding = '2px 6px';
                div.style.borderRadius = '4px';
                const label = new CSS2DObject(div);
                label.position.set(-0.3, y, 0);
                group.add(label);
            }
            return group;
        }

        // --- Функция обновления координат ---
        function updateCoords(pts) {
            let text = 'Координаты (см):\n';
            for (const [key, vec] of Object.entries(pts)) {
                text += `${key}: (${(vec.x*100).toFixed(1)}, ${(vec.y*100).toFixed(1)}, ${(vec.z*100).toFixed(1)})\n`;
            }
            coordsDiv.textContent = text;
        }

        // --- Построение Меркабы ---
        function buildMerkaba() {
            // Удаляем старую группу
            scene.remove(mainGroup);
            // Создаём новую
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // Считываем параметры (в см)
            const eyeHeight = parseFloat(eyeSlider.value);
            const baseHeight = parseFloat(baseSlider.value);
            const radius = parseFloat(radiusSlider.value);
            eyeValue.textContent = eyeHeight;
            baseValue.textContent = baseHeight;
            radiusValue.textContent = radius;

            // Коррекция: основание должно быть ниже 👁️
            if (baseHeight >= eyeHeight) {
                baseSlider.value = eyeHeight - 10;
                // рекурсивный вызов с новыми значениями
                buildMerkaba();
                return;
            }

            // Расчёт размеров
            const H = (eyeHeight - baseHeight) / 100; // расстояние от основания до 👁️ (м)
            const R = radius / 100; // радиус основания (м)

            // Геометрия Меркабы с сохранением пропорций h/d = √3
            const sqrt3 = Math.sqrt(3);
            const sqrt2 = Math.sqrt(2);
            const d = H / (sqrt3 + 1);
            const h = H * sqrt3 / (sqrt3 + 1);

            // Масштабирование горизонтальных координат так, чтобы радиус стал R
            const l0 = sqrt2 * d; // классический радиус
            const scale = R / l0;

            // Вершины (в локальной системе, центр в (0,0,0))
            // Затем сдвигаем так, чтобы нижнее основание было на baseHeight/100
            const halfR = R / 2;
            const sqrt3halfR = sqrt3 * halfR;
            const shiftY = baseHeight / 100 + d;

            const pts = {};
            pts['🟦'] = new THREE.Vector3(-sqrt3halfR, -d + shiftY,  halfR);
            pts['🟥'] = new THREE.Vector3( sqrt3halfR, -d + shiftY,  halfR);
            pts['🟩'] = new THREE.Vector3( 0,           -d + shiftY, -R);
            pts['🔴'] = new THREE.Vector3( sqrt3halfR,  d + shiftY, -halfR);
            pts['🔵'] = new THREE.Vector3(-sqrt3halfR,  d + shiftY, -halfR);
            pts['🟢'] = new THREE.Vector3( 0,            d + shiftY,  R);
            pts['👁️'] = new THREE.Vector3( 0,            h + shiftY,  0);
            pts['🟪'] = new THREE.Vector3( 0,           -h + shiftY,  0);

            const colors = {
                '🟦': 0x3399ff,
                '🟥': 0xff5533,
                '🟩': 0x66ff66,
                '🔴': 0xff3333,
                '🔵': 0x33ccff,
                '🟢': 0x66ff99,
                '👁️': 0xff66ff,
                '🟪': 0x9966ff
            };

            // --- Добавляем скелет ---
            const skeleton = buildSkeleton();
            mainGroup.add(skeleton);

            // --- Вершины и подписи ---
            const sphereRadius = 0.04 * (h + d) / 1.5;
            const sphereGeom = new THREE.SphereGeometry(sphereRadius, 16, 16);
            const labelGroup = new THREE.Group();

            for (const [key, vec] of Object.entries(pts)) {
                const color = colors[key] || 0xffffff;
                const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
                const sphere = new THREE.Mesh(sphereGeom, mat);
                sphere.position.copy(vec);
                mainGroup.add(sphere);

                // Подпись
                const div = document.createElement('div');
                div.textContent = key;
                div.style.color = '#fff';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                div.style.background = 'rgba(0,0,0,0.6)';
                div.style.padding = '2px 8px';
                div.style.borderRadius = '12px';
                div.style.border = '1px solid rgba(255,255,255,0.2)';
                const label = new CSS2DObject(div);
                label.position.copy(vec.clone().add(new THREE.Vector3(0.08, 0.08, 0.08)));
                labelGroup.add(label);
            }
            mainGroup.add(labelGroup);

            // --- Рёбра ---
            function addLine(p1, p2, color, opacity = 0.6) {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
                return new THREE.Line(geom, mat);
            }

            const edgeGroup = new THREE.Group();
            const topV = pts['👁️'];
            const topBase = [pts['🟦'], pts['🟥'], pts['🟩']];
            topBase.forEach(p => edgeGroup.add(addLine(topV, p, 0x66ccff, 0.8)));
            edgeGroup.add(addLine(topBase[0], topBase[1], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[1], topBase[2], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[2], topBase[0], 0x66ccff, 0.4));

            const bottomV = pts['🟪'];
            const bottomBase = [pts['🔴'], pts['🔵'], pts['🟢']];
            bottomBase.forEach(p => edgeGroup.add(addLine(bottomV, p, 0xff8866, 0.8)));
            edgeGroup.add(addLine(bottomBase[0], bottomBase[1], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[1], bottomBase[2], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[2], bottomBase[0], 0xff8866, 0.4));
            mainGroup.add(edgeGroup);

            // --- Диагонали ---
            const diagGroup = new THREE.Group();
            const diagonals = [
                [pts['🟦'], pts['🔴']],
                [pts['🟥'], pts['🔵']],
                [pts['🟩'], pts['🟢']],
                [pts['👁️'], pts['🟪']]
            ];
            diagonals.forEach(([p1, p2]) => {
                diagGroup.add(addLine(p1, p2, 0xffdd44, 0.25));
            });
            mainGroup.add(diagGroup);

            // --- Сфера радиуса (для ориентира) ---
            let maxR = 0;
            for (const vec of Object.values(pts)) {
                const r = vec.length();
                if (r > maxR) maxR = r;
            }
            const sphereWire = new THREE.Mesh(
                new THREE.SphereGeometry(maxR, 32, 16),
                new THREE.MeshBasicMaterial({ wireframe: true, color: 0x446688, transparent: true, opacity: 0.08 })
            );
            mainGroup.add(sphereWire);

            // --- Сетка на уровне основания ---
            const gridHelper = new THREE.GridHelper(3 * maxR, 12, 0x445566, 0x223344);
            gridHelper.position.y = baseHeight / 100;
            gridHelper.visible = showGrid.checked;
            mainGroup.add(gridHelper);

            // --- Сохраняем ссылки для управления видимостью ---
            mainGroup.userData.diagGroup = diagGroup;
            mainGroup.userData.labelGroup = labelGroup;
            mainGroup.userData.gridHelper = gridHelper;

            // Применяем состояние чекбоксов
            updateVisibility();

            // Обновляем координаты
            updateCoords(pts);
        }

        function updateVisibility() {
            const showDiagChecked = showDiag.checked;
            const showLabelsChecked = showLabels.checked;
            const showGridChecked = showGrid.checked;
            if (mainGroup.userData.diagGroup) {
                mainGroup.userData.diagGroup.visible = showDiagChecked;
            }
            if (mainGroup.userData.labelGroup) {
                mainGroup.userData.labelGroup.visible = showLabelsChecked;
            }
            if (mainGroup.userData.gridHelper) {
                mainGroup.userData.gridHelper.visible = showGridChecked;
            }
        }

        // --- Обработчики событий ---
        function rebuild() {
            buildMerkaba();
        }

        eyeSlider.addEventListener('input', rebuild);
        baseSlider.addEventListener('input', rebuild);
        radiusSlider.addEventListener('input', rebuild);
        showDiag.addEventListener('change', updateVisibility);
        showLabels.addEventListener('change', updateVisibility);
        showGrid.addEventListener('change', updateVisibility);

        // --- Первоначальная постройка ---
        buildMerkaba();

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // --- Адаптация размера окна ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // --- Вспомогательные оси ---
        const axesHelper = new THREE.AxesHelper(1);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.2;
        scene.add(axesHelper);
    </script>
</body>
</html>
