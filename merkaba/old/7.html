<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Меркаба • классы и привязка к телу</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #0a0a1a; }
        #info {
            position: absolute; top: 12px; left: 12px;
            color: #ccc; background: rgba(0,0,0,0.7);
            padding: 8px 14px; border-radius: 8px;
            font-size: 14px; z-index: 10;
            border: 1px solid #333;
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,40,0.85); backdrop-filter: blur(6px);
            color: white; padding: 18px 28px; border-radius: 14px;
            border: 1px solid #444;
            display: flex; flex-wrap: wrap;
            gap: 18px 30px; justify-content: center; align-items: center;
            z-index: 10; pointer-events: auto;
            max-width: 92%; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        #controls label {
            display: flex; align-items: center; gap: 8px;
            font-size: 15px; color: #ddd;
        }
        #controls input[type="range"] {
            width: 120px; background: #222; accent-color: #66aaff; cursor: pointer;
        }
        #controls .value {
            min-width: 50px; text-align: center; font-weight: bold; color: #fff;
        }
        #controls .checkbox-group {
            display: flex; gap: 16px;
        }
        #controls .checkbox-group label {
            font-size: 14px; gap: 4px;
        }
        #controls .checkbox-group input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: #66aaff; cursor: pointer;
        }
        @media (max-width: 700px) {
            #controls { flex-direction: column; gap: 12px; padding: 15px 20px; width: 92%; bottom: 15px; }
            #controls label { width: 100%; justify-content: space-between; }
            .checkbox-group { width: 100%; justify-content: space-around; }
        }
        #coords {
            position: absolute; bottom: 110px; left: 20px;
            color: #aaa; font-size: 13px;
            background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 8px;
            pointer-events: none; z-index: 10;
            font-family: monospace; max-height: 240px; overflow-y: auto;
            white-space: pre; line-height: 1.6; border: 1px solid #333; min-width: 200px;
        }
        @media (max-width: 600px) { #coords { display: none; } }
    </style>
</head>
<body>
    <div id="info">🟡 Меркаба • классы и привязка к телу</div>
    <div id="coords"></div>

    <div id="controls">
        <label>👁️ высота (см) <input type="range" id="eyeSlider" min="50" max="250" value="175" step="1" />
            <span class="value" id="eyeValue">175</span>
        </label>
        <label>Основание (см) <input type="range" id="baseSlider" min="0" max="200" value="0" step="1" />
            <span class="value" id="baseValue">0</span>
        </label>
        <label>Радиус (см) <input type="range" id="radiusSlider" min="20" max="120" value="80" step="1" />
            <span class="value" id="radiusValue">80</span>
        </label>
        <div class="checkbox-group">
            <label><input type="checkbox" id="autoRadius" checked /> авто-радиус</label>
            <label><input type="checkbox" id="showDiag" checked /> диагонали</label>
            <label><input type="checkbox" id="showLabels" checked /> подписи</label>
            <label><input type="checkbox" id="showGrid" checked /> сетка</label>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- КЛАСС MERKABA ----------
        class Merkaba {
            /**
             * @param {number} h - расстояние от 👁️ до плоскости основания (в метрах)
             * @param {number} l - радиус описанной окружности основания (в метрах)
             */
            constructor(h, l) {
                this.h = h;
                this.l = l;
                this.updatePoints();
            }

            updatePoints() {
                // Классическое соотношение: основание на y = -d, 👁️ на y = h (относительно центра?)
                // Мы будем строить в локальной системе, где основание лежит в плоскости y=0,
                // а 👁️ находится на высоте h над основанием.
                // Тогда центр Меркабы будет на высоте d над основанием.
                // d вычисляется из l: d = l / sqrt(2)
                const d = this.l / Math.sqrt(2);
                // Высота вершины над центром: h_center = h - d
                const hCenter = this.h - d;
                // Если hCenter отрицательное, значит 👁️ ниже центра – такое не должно быть
                // в классике h > d, но мы разрешаем любые значения, просто строим.
                const sqrt3 = Math.sqrt(3);
                const halfL = this.l / 2;
                const sqrt3halfL = sqrt3 * halfL;

                // Точки в локальной системе: основание на y = 0, центр на y = d, вершина на y = h
                this.points = {
                    '🟦': new THREE.Vector3(-sqrt3halfL, 0,  halfL),
                    '🟥': new THREE.Vector3( sqrt3halfL, 0,  halfL),
                    '🟩': new THREE.Vector3( 0,          0, -this.l),
                    '🔴': new THREE.Vector3( sqrt3halfL, 2*d, -halfL),
                    '🔵': new THREE.Vector3(-sqrt3halfL, 2*d, -halfL),
                    '🟢': new THREE.Vector3( 0,          2*d,  this.l),
                    '👁️': new THREE.Vector3( 0,          this.h,  0),
                    '🟪': new THREE.Vector3( 0,          -hCenter, 0)  // нижняя вершина
                };
                // Проверим, что нижняя вершина не выше основания (если h большое, то hCenter > 0)
                // Если hCenter отрицательное, то 🟪 будет ниже основания.
            }

            // Получить координаты всех точек (объект с ключами)
            getPoints() {
                return this.points;
            }

            // Получить координаты точки по имени
            getPoint(name) {
                return this.points[name] || null;
            }
        }

        // ---------- КЛАСС BODY (скелет) ----------
        class Body {
            constructor(height) {
                this.height = height; // в метрах
                // Пропорции (приблизительные)
                this.levels = {
                    стопы: 0,
                    колени: 0.25 * height,
                    таз: 0.5 * height,
                    плечи: 0.75 * height,
                    макушка: height
                };
            }

            getLevel(name) {
                return this.levels[name] || 0;
            }

            // Получить координаты точки в мировом пространстве (например, на оси Y)
            getPointOnBody(levelName, offsetX = 0, offsetZ = 0) {
                const y = this.getLevel(levelName);
                return new THREE.Vector3(offsetX, y, offsetZ);
            }
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(5, 2.5, 5);
        camera.lookAt(0, 0.9, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.9, 0);
        controls.update();

        // ---------- СВЕТ ----------
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 3, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, -1, -2);
        scene.add(backLight);

        // ---------- ГРУППЫ ----------
        let mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ---------- ЭЛЕМЕНТЫ УПРАВЛЕНИЯ ----------
        const eyeSlider = document.getElementById('eyeSlider');
        const baseSlider = document.getElementById('baseSlider');
        const radiusSlider = document.getElementById('radiusSlider');
        const eyeValue = document.getElementById('eyeValue');
        const baseValue = document.getElementById('baseValue');
        const radiusValue = document.getElementById('radiusValue');
        const autoRadiusCheck = document.getElementById('autoRadius');
        const showDiag = document.getElementById('showDiag');
        const showLabels = document.getElementById('showLabels');
        const showGrid = document.getElementById('showGrid');
        const coordsDiv = document.getElementById('coords');

        // Состояние ручного изменения радиуса
        let radiusManuallyChanged = false;

        // ---------- ФУНКЦИИ ПОСТРОЕНИЯ ----------
        function buildMerkaba() {
            // Удаляем старую группу
            scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // Получаем параметры (в см)
            const eyeCm = parseFloat(eyeSlider.value);
            const baseCm = parseFloat(baseSlider.value);
            let radiusCm = parseFloat(radiusSlider.value);
            eyeValue.textContent = eyeCm;
            baseValue.textContent = baseCm;
            radiusValue.textContent = radiusCm;

            // Вычисляем h (расстояние от основания до 👁️) в метрах
            const h = (eyeCm - baseCm) / 100;
            if (h <= 0) {
                // если основание выше или равно глазу, корректируем
                baseSlider.value = eyeCm - 10;
                buildMerkaba();
                return;
            }

            // Авто-радиус: если включено и не было ручного изменения, пересчитываем l из h
            if (autoRadiusCheck.checked && !radiusManuallyChanged) {
                const sqrt2 = Math.sqrt(2);
                const sqrt3 = Math.sqrt(3);
                // Классическое соотношение: l = h * sqrt(2) / (sqrt(3) + 1)
                const l = h * sqrt2 / (sqrt3 + 1);
                radiusCm = l * 100; // переводим в см
                radiusSlider.value = radiusCm;
                radiusValue.textContent = radiusCm.toFixed(1);
            }

            const l = radiusCm / 100; // радиус в метрах

            // Создаём экземпляр Меркабы
            const merkaba = new Merkaba(h, l);
            const pts = merkaba.getPoints();

            // Цвета для точек
            const colors = {
                '🟦': 0x3399ff,
                '🟥': 0xff5533,
                '🟩': 0x66ff66,
                '🔴': 0xff3333,
                '🔵': 0x33ccff,
                '🟢': 0x66ff99,
                '👁️': 0xff66ff,
                '🟪': 0x9966ff
            };

            // Мы будем размещать Меркабу так, чтобы основание (🟦🟥🟩) было на высоте baseCm/100,
            // а 👁️ на высоте eyeCm/100.
            // Для этого мы сдвигаем все точки по Y на baseCm/100 (потому что основание у нас в локальной системе на y=0)
            const shiftY = baseCm / 100;

            // Создаём копии точек сдвинутые
            const worldPts = {};
            for (const [key, vec] of Object.entries(pts)) {
                worldPts[key] = vec.clone().add(new THREE.Vector3(0, shiftY, 0));
            }

            // ---------- ВИЗУАЛИЗАЦИЯ ----------
            const sphereRadius = 0.04 * (h + l) / 1.5;
            const sphereGeom = new THREE.SphereGeometry(sphereRadius, 16, 16);
            const labelGroup = new THREE.Group();

            // Вершины и подписи
            for (const [key, vec] of Object.entries(worldPts)) {
                const color = colors[key] || 0xffffff;
                const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
                const sphere = new THREE.Mesh(sphereGeom, mat);
                sphere.position.copy(vec);
                mainGroup.add(sphere);

                // Подпись
                const div = document.createElement('div');
                div.textContent = key;
                div.style.color = '#fff';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.9)';
                div.style.background = 'rgba(0,0,0,0.6)';
                div.style.padding = '2px 8px';
                div.style.borderRadius = '12px';
                div.style.border = '1px solid rgba(255,255,255,0.2)';
                const label = new CSS2DObject(div);
                label.position.copy(vec.clone().add(new THREE.Vector3(0.08, 0.08, 0.08)));
                labelGroup.add(label);
            }
            mainGroup.add(labelGroup);

            // Рёбра тетраэдров
            function addLine(p1, p2, color, opacity = 0.6) {
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
                return new THREE.Line(geom, mat);
            }

            const edgeGroup = new THREE.Group();
            const topV = worldPts['👁️'];
            const topBase = [worldPts['🟦'], worldPts['🟥'], worldPts['🟩']];
            topBase.forEach(p => edgeGroup.add(addLine(topV, p, 0x66ccff, 0.8)));
            edgeGroup.add(addLine(topBase[0], topBase[1], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[1], topBase[2], 0x66ccff, 0.4));
            edgeGroup.add(addLine(topBase[2], topBase[0], 0x66ccff, 0.4));

            const bottomV = worldPts['🟪'];
            const bottomBase = [worldPts['🔴'], worldPts['🔵'], worldPts['🟢']];
            bottomBase.forEach(p => edgeGroup.add(addLine(bottomV, p, 0xff8866, 0.8)));
            edgeGroup.add(addLine(bottomBase[0], bottomBase[1], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[1], bottomBase[2], 0xff8866, 0.4));
            edgeGroup.add(addLine(bottomBase[2], bottomBase[0], 0xff8866, 0.4));
            mainGroup.add(edgeGroup);

            // Диагонали
            const diagGroup = new THREE.Group();
            const diagonals = [
                [worldPts['🟦'], worldPts['🔴']],
                [worldPts['🟥'], worldPts['🔵']],
                [worldPts['🟩'], worldPts['🟢']],
                [worldPts['👁️'], worldPts['🟪']]
            ];
            diagonals.forEach(([p1, p2]) => {
                diagGroup.add(addLine(p1, p2, 0xffdd44, 0.25));
            });
            mainGroup.add(diagGroup);

            // Сфера радиуса (ориентир)
            let maxR = 0;
            for (const vec of Object.values(worldPts)) {
                const r = vec.length();
                if (r > maxR) maxR = r;
            }
            const sphereWire = new THREE.Mesh(
                new THREE.SphereGeometry(maxR, 32, 16),
                new THREE.MeshBasicMaterial({ wireframe: true, color: 0x446688, transparent: true, opacity: 0.08 })
            );
            mainGroup.add(sphereWire);

            // Сетка на уровне основания
            const gridHelper = new THREE.GridHelper(3 * maxR, 12, 0x445566, 0x223344);
            gridHelper.position.y = baseCm / 100;
            gridHelper.visible = showGrid.checked;
            mainGroup.add(gridHelper);

            // Сохраняем ссылки для управления видимостью
            mainGroup.userData.diagGroup = diagGroup;
            mainGroup.userData.labelGroup = labelGroup;
            mainGroup.userData.gridHelper = gridHelper;

            // Обновляем видимость
            updateVisibility();

            // Выводим координаты точек (в см)
            let text = 'Координаты точек (см):\n';
            for (const [key, vec] of Object.entries(worldPts)) {
                text += `${key}: (${(vec.x*100).toFixed(1)}, ${(vec.y*100).toFixed(1)}, ${(vec.z*100).toFixed(1)})\n`;
            }
            coordsDiv.textContent = text;

            // Сохраняем текущие параметры для авто-радиуса
            window._lastH = h;
            window._lastL = l;
        }

        function updateVisibility() {
            const showDiagChecked = showDiag.checked;
            const showLabelsChecked = showLabels.checked;
            const showGridChecked = showGrid.checked;
            if (mainGroup.userData.diagGroup) {
                mainGroup.userData.diagGroup.visible = showDiagChecked;
            }
            if (mainGroup.userData.labelGroup) {
                mainGroup.userData.labelGroup.visible = showLabelsChecked;
            }
            if (mainGroup.userData.gridHelper) {
                mainGroup.userData.gridHelper.visible = showGridChecked;
            }
        }

        // ---------- ОБРАБОТЧИКИ СОБЫТИЙ ----------
        function rebuild() {
            buildMerkaba();
        }

        // Обработчики для ползунков с учётом ручного изменения радиуса
        eyeSlider.addEventListener('input', () => {
            if (autoRadiusCheck.checked) {
                // если авто-радиус включён, сбрасываем флаг ручного изменения, чтобы радиус пересчитался
                radiusManuallyChanged = false;
            }
            rebuild();
        });

        baseSlider.addEventListener('input', () => {
            if (autoRadiusCheck.checked) {
                radiusManuallyChanged = false;
            }
            rebuild();
        });

        radiusSlider.addEventListener('input', () => {
            radiusManuallyChanged = true; // пользователь вручную меняет радиус
            rebuild();
        });

        autoRadiusCheck.addEventListener('change', () => {
            if (autoRadiusCheck.checked) {
                radiusManuallyChanged = false;
            } else {
                radiusManuallyChanged = true;
            }
            rebuild();
        });

        showDiag.addEventListener('change', updateVisibility);
        showLabels.addEventListener('change', updateVisibility);
        showGrid.addEventListener('change', updateVisibility);

        // Первоначальная постройка
        buildMerkaba();

        // ---------- АНИМАЦИЯ ----------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // ---------- АДАПТАЦИЯ РАЗМЕРА ----------
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // Вспомогательные оси
        const axesHelper = new THREE.AxesHelper(1);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.2;
        scene.add(axesHelper);
    </script>
</body>
</html>
