<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меркаба с параметром t</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 10;
            pointer-events: auto;
        }
        #controls label {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #controls input[type="range"] {
            width: 200px;
            cursor: pointer;
        }
        #controls span {
            min-width: 40px;
            text-align: center;
            font-weight: bold;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 600px) {
            #controls { flex-direction: column; gap: 10px; width: 90%; padding: 15px; }
            #controls input[type="range"] { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="info">Меркаба • параметр t (ось Y)</div>
    <div id="controls">
        <label>
            t = 
            <input type="range" id="tSlider" min="0.5" max="2.5" step="0.01" value="1.5">
            <span id="tValue">1.50</span>
        </label>
        <label>
            <input type="checkbox" id="showDiagonals" checked> диагонали
        </label>
        <label>
            <input type="checkbox" id="showLabels" checked> подписи
        </label>
    </div>

    <!-- Подключаем Three.js и OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Инициализация сцены ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4, 3, 5);
        camera.lookAt(0, 0, 0);

        // Рендерер WebGL
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // Рендерер для CSS2D (подписи)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // чтобы клики проходили сквозь
        document.body.appendChild(labelRenderer.domElement);

        // Орбит контрол
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, -0.5, -1);
        scene.add(backLight);

        // --- Группа для всех объектов Меркабы (будем пересоздавать при изменении t) ---
        let merkabaGroup = new THREE.Group();
        scene.add(merkabaGroup);

        // --- Функция построения Меркабы по параметру t ---
        function buildMerkaba(t) {
            // Очищаем группу
            while(merkabaGroup.children.length > 0) {
                merkabaGroup.remove(merkabaGroup.children[0]);
            }

            // 1. Определяем координаты вершин (все точки)
            // Кубические вершины (радиус sqrt(3) ≈ 1.732)
            const sqrt3 = Math.sqrt(3);
            // Но мы используем координаты из модели: 🟦, 🟥, 🔴, 🔵 — ±1
            // 🟩 и 🟢 имеют x=0, y=±1, z=∓1
            // 🟣 и 🟪 имеют x=0, y=±t, z=0
            const pts = {
                '🟦': new THREE.Vector3(-1, -1, -1),
                '🟥': new THREE.Vector3( 1, -1, -1),
                '🔴': new THREE.Vector3( 1,  1,  1),
                '🔵': new THREE.Vector3(-1,  1,  1),
                '🟩': new THREE.Vector3( 0,  1, -1),
                '🟢': new THREE.Vector3( 0, -1,  1),
                '🟣': new THREE.Vector3( 0,  t,  0),
                '🟪': new THREE.Vector3( 0, -t,  0)
            };

            // Список всех точек для отрисовки сфер
            const pointEntries = Object.entries(pts);
            
            // Цвета для точек (приблизительно по смайлам)
            const colors = {
                '🟦': 0x3399ff, // синий
                '🟥': 0xff5533, // красный
                '🔴': 0xff3333, // ярко-красный
                '🔵': 0x33ccff, // голубой
                '🟩': 0x66ff66, // зелёный
                '🟢': 0x66ff99, // светло-зелёный
                '🟣': 0xff66ff, // розовый/фиолетовый
                '🟪': 0x9966ff  // фиолетовый
            };

            // Материал для точек (сфер)
            const sphereGeom = new THREE.SphereGeometry(0.08, 16, 16);

            // --- Рисуем вершины и подписи ---
            const labelGroup = new THREE.Group();
            for (const [key, vec] of pointEntries) {
                // Сфера
                const color = colors[key] || 0xffffff;
                const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.3 });
                const sphere = new THREE.Mesh(sphereGeom, mat);
                sphere.position.copy(vec);
                merkabaGroup.add(sphere);

                // Подпись (CSS2D)
                const div = document.createElement('div');
                div.textContent = key;
                div.style.color = '#fff';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.8)';
                div.style.background = 'rgba(0,0,0,0.5)';
                div.style.padding = '2px 6px';
                div.style.borderRadius = '12px';
                div.style.border = '1px solid rgba(255,255,255,0.3)';
                div.style.pointerEvents = 'none';
                const label = new CSS2DObject(div);
                label.position.copy(vec.clone().add(new THREE.Vector3(0.15, 0.15, 0.15)));
                labelGroup.add(label);
            }
            merkabaGroup.add(labelGroup);

            // --- Рёбра тетраэдров ---
            // Верхний тетраэдр: вершина 🟣, основание 🟦, 🟥, 🟩
            const topV = pts['🟣'];
            const topBase = [pts['🟦'], pts['🟥'], pts['🟩']];
            // Нижний тетраэдр: вершина 🟪, основание 🔴, 🔵, 🟢
            const bottomV = pts['🟪'];
            const bottomBase = [pts['🔴'], pts['🔵'], pts['🟢']];

            // Функция добавления ребра
            function addEdge(p1, p2, color = 0x88aaff, opacity = 0.6) {
                const points = [p1, p2];
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
                const line = new THREE.Line(geom, mat);
                merkabaGroup.add(line);
            }

            // Рёбра верхнего тетраэдра (вершина к основанию)
            addEdge(topV, topBase[0], 0x66ccff);
            addEdge(topV, topBase[1], 0x66ccff);
            addEdge(topV, topBase[2], 0x66ccff);
            // Рёбра основания
            addEdge(topBase[0], topBase[1], 0x66ccff, 0.4);
            addEdge(topBase[1], topBase[2], 0x66ccff, 0.4);
            addEdge(topBase[2], topBase[0], 0x66ccff, 0.4);

            // Рёбра нижнего тетраэдра (вершина к основанию)
            addEdge(bottomV, bottomBase[0], 0xff8866);
            addEdge(bottomV, bottomBase[1], 0xff8866);
            addEdge(bottomV, bottomBase[2], 0xff8866);
            // Рёбра основания
            addEdge(bottomBase[0], bottomBase[1], 0xff8866, 0.4);
            addEdge(bottomBase[1], bottomBase[2], 0xff8866, 0.4);
            addEdge(bottomBase[2], bottomBase[0], 0xff8866, 0.4);

            // --- Диагонали (оси) ---
            const diagonals = [
                [pts['🟦'], pts['🔴']],
                [pts['🟥'], pts['🔵']],
                [pts['🟩'], pts['🟢']],
                [pts['🟣'], pts['🟪']]
            ];
            const diagGroup = new THREE.Group();
            for (const [p1, p2] of diagonals) {
                const points = [p1, p2];
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.3 });
                const line = new THREE.Line(geom, mat);
                diagGroup.add(line);
            }
            merkabaGroup.add(diagGroup);

            // --- Сфера для визуализации радиуса (опционально) ---
            // Радиус = max расстояние от центра до точек
            let maxR = 0;
            for (const vec of Object.values(pts)) {
                const r = vec.length();
                if (r > maxR) maxR = r;
            }
            const sphereWireframe = new THREE.Mesh(
                new THREE.SphereGeometry(maxR, 32, 16),
                new THREE.MeshBasicMaterial({ wireframe: true, color: 0x446688, transparent: true, opacity: 0.1 })
            );
            merkabaGroup.add(sphereWireframe);

            // --- Сохраняем ссылку на группу диагоналей для переключения видимости ---
            merkabaGroup.userData.diagGroup = diagGroup;
            merkabaGroup.userData.labelGroup = labelGroup;

            // Обновляем отображение в зависимости от чекбоксов
            updateVisibility();
        }

        // --- Функция обновления видимости элементов ---
        function updateVisibility() {
            const showDiag = document.getElementById('showDiagonals').checked;
            const showLabels = document.getElementById('showLabels').checked;
            if (merkabaGroup.userData.diagGroup) {
                merkabaGroup.userData.diagGroup.visible = showDiag;
            }
            if (merkabaGroup.userData.labelGroup) {
                merkabaGroup.userData.labelGroup.visible = showLabels;
            }
        }

        // --- Обработчики событий ---
        const tSlider = document.getElementById('tSlider');
        const tValue = document.getElementById('tValue');
        tSlider.addEventListener('input', () => {
            const t = parseFloat(tSlider.value);
            tValue.textContent = t.toFixed(2);
            buildMerkaba(t);
        });

        document.getElementById('showDiagonals').addEventListener('change', updateVisibility);
        document.getElementById('showLabels').addEventListener('change', updateVisibility);

        // --- Построить при загрузке ---
        buildMerkaba(1.5);

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // --- Адаптация размера ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // --- Добавляем оси для ориентира (необязательно) ---
        const axesHelper = new THREE.AxesHelper(2);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.3;
        scene.add(axesHelper);

        // Сетка на земле (по желанию)
        const gridHelper = new THREE.GridHelper(5, 10, 0x445566, 0x223344);
        gridHelper.position.y = -1.8;
        scene.add(gridHelper);

        console.log('Меркаба запущена. Меняйте параметр t!');
    </script>
</body>
</html>
