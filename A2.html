<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Найди всех — бесконечная игра</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2a4a 0%, #0b0f1a 70%);
    color: #e8eefc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .game { width: min(94vw, 640px); }

  /* ---------- HUD ---------- */
  .hud { display: flex; gap: 8px; margin-bottom: 12px; }

  .stat {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .stat .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #7f8db0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat .value { font-size: 19px; font-weight: 700; transition: color .2s; }
  .stat .value.low { color: #f87171; }

  .task {
    text-align: center;
    font-size: 16px;
    color: #c7d3ee;
    margin-bottom: 10px;
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .task .target-badge {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(109,139,255,.5));
  }

  .bar {
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    transition: width .1s linear, background .3s;
  }
  .bar-fill.low { background: linear-gradient(90deg, #f87171, #fb923c); }

  /* ---------- Поле ---------- */
  .board {
    --gap: 5px;
    --cols: 4;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);
    width: 100%;
  }

  .cell {
    aspect-ratio: 1;
    padding: 0;
    border: none;
    border-radius: 11px;
    background: rgba(255,255,255,0.05);
    font-family: inherit;
    font-size: calc((min(94vw, 640px) - (var(--cols) - 1) * var(--gap)) / var(--cols) * 0.62);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, background .2s, box-shadow .2s, opacity .3s;
    animation: cellAppear .35s ease backwards;
  }

  @keyframes cellAppear {
    from { opacity: 0; transform: scale(.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  .cell:hover { background: rgba(255,255,255,0.12); transform: scale(1.06); }
  .cell:active { transform: scale(0.94); }

  .cell.found {
    background: rgba(74, 222, 128, 0.22);
    box-shadow: inset 0 0 0 2px #4ade80;
    opacity: .45;
    cursor: default;
    transform: none;
    animation: popFound .35s ease;
  }
  @keyframes popFound {
    0% { transform: scale(1); }
    45% { transform: scale(1.25); background: rgba(74,222,128,.5); }
    100% { transform: scale(1); }
  }

  .cell.wrong {
    background: rgba(248, 113, 113, 0.32);
    animation: cellShake .35s ease;
  }
  @keyframes cellShake {
    0%, 100% { transform: translateX(0) scale(1); }
    25% { transform: translateX(-4px) scale(1.02); }
    75% { transform: translateX(4px) scale(1.02); }
  }

  .board.shake { animation: boardShake .3s ease; }
  @keyframes boardShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ---------- Оверлей ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(6, 10, 20, 0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 30px 26px;
    text-align: center;
    border-radius: 24px;
    background: linear-gradient(160deg, #1b2540, #121a2e);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: translateY(12px) scale(.97);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .overlay.show .card { transform: none; }

  .card .emoji { font-size: 58px; line-height: 1; display: block; }
  .card h1 { font-size: 22px; margin: 14px 0 8px; }
  .card p { color: #a8b6d4; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
  .card .best { color: #fbbf24; font-weight: 600; }

  .btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    padding: 13px 30px;
    border-radius: 999px;
    background: linear-gradient(135deg, #6d8bff, #8b5cf6);
    box-shadow: 0 8px 24px rgba(109,139,255,.4);
    transition: transform .15s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(109,139,255,.55); }
  .btn:active { transform: translateY(0) scale(.98); }
</style>
</head>
<body>

<div class="game">
  <header class="hud">
    <div class="stat"><span class="label">Уровень</span><span class="value" id="level">1</span></div>
    <div class="stat"><span class="label">Найдено</span><span class="value"><span id="found">0</span>/<span id="total">0</span></span></div>
    <div class="stat"><span class="label">Время</span><span class="value" id="time">45</span></div>
  </header>

  <div class="task" id="task">
    <span id="task-text">Найди всех кошек</span>
    <span class="target-badge" id="task-emoji">🐱</span>
  </div>
  <div class="bar"><div class="bar-fill" id="bar"></div></div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <span class="emoji" id="ov-emoji">🐱</span>
    <h1 id="ov-title">Найди всех кошек</h1>
    <p id="ov-text">Нажимай на нужные emoji как можно быстрее! За ошибку — минус 3 секунды. Уровни бесконечны.</p>
    <button class="btn" id="ov-btn">Начать игру</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     ПУЛЫ EMOJI
     EASY — для самых первых уровней (сильно различаются)
     HARD — для остальных (похожие, нужно всматриваться)
  ========================================================= */
  const EASY_GROUPS = [
    { target: '🐱', others: ['🐶'], task: 'Найди всех кошек' },
    { target: '🐸', others: ['🐢'], task: 'Найди всех лягушек' },
    { target: '🌸', others: ['🌺'], task: 'Найди сакуру' }
  ];

  const HARD_GROUPS = [
    { target: '🐭', others: ['🐹'],                    task: 'Найди всех мышек' },
    { target: '⭐', others: ['🌟'],                    task: 'Найди звёзды' },
    { target: '🍎', others: ['🍅'],                    task: 'Найди яблоки' },
    { target: '🦋', others: ['🐝'],                    task: 'Найди бабочек' },
    { target: '🐱', others: ['🐈'],                    task: 'Найди мордочки кошек' },
    { target: '😺', others: ['😸', '😹'],              task: 'Найди улыбающихся котов' },
    { target: '🔵', others: ['🔷', '🔹'],              task: 'Найди синие круги' },
    { target: '🟢', others: ['🟩', '✅'],              task: 'Найди зелёные круги' },
    { target: '❤️', others: ['💙', '💚'],              task: 'Найди красные сердца' },
    { target: '🐶', others: ['🐕', '🐩'],              task: 'Найди мордочки собак' },
    { target: '🌻', others: ['🌼', '🌷'],              task: 'Найди подсолнухи' },
    { target: '🐥', others: ['🐤', '🐣'],              task: 'Найди жёлтых цыплят' },
    { target: '🟡', others: ['🟨', '🌟'],              task: 'Найди жёлтые круги' },
    { target: '🌕', others: ['🌝', '🌚'],              task: 'Найди полную луну' },
    { target: '🐺', others: ['🦊', '🐕'],              task: 'Найди волков' },
    { target: '🦁', others: ['🐯', '🐱'],              task: 'Найди львов' }
  ];

  const WRONG_PENALTY = 3;   // секунд за промах
  const TICK_MS = 100;
  const MAX_COLS = 8;
  const MIN_TIME = 18;

  /* ---------- DOM ---------- */
  const boardEl  = document.getElementById('board');
  const levelEl  = document.getElementById('level');
  const foundEl  = document.getElementById('found');
  const totalEl  = document.getElementById('total');
  const timeEl   = document.getElementById('time');
  const barEl    = document.getElementById('bar');
  const taskText = document.getElementById('task-text');
  const taskEmoji= document.getElementById('task-emoji');
  const overlay  = document.getElementById('overlay');
  const ovEmoji  = document.getElementById('ov-emoji');
  const ovTitle  = document.getElementById('ov-title');
  const ovText   = document.getElementById('ov-text');
  const ovBtn    = document.getElementById('ov-btn');

  /* ---------- Состояние ---------- */
  const state = {
    level: 1,
    found: 0,
    needed: 0,
    timeLeft: 0,
    maxTime: 0,
    timer: null,
    playing: false,
    action: null,
    cfg: null,
    best: parseInt(localStorage.getItem('findAll.best') || '0', 10) || 0
  };

  /* =========================================================
     ГЕНЕРАЦИЯ УРОВНЯ
  ========================================================= */
  function getLevelConfig(level) {
    // Сетка растёт каждые 3 уровня: 4, 4, 4, 5, 5, 5, 6...
    const cols = Math.min(4 + Math.floor((level - 1) / 3), MAX_COLS);
    const total = cols * cols;

    // Целей всё больше, но с разумным потолком
    const rawTargets = 3 + Math.floor((level - 1) / 2);
    const capTargets = Math.min(12, Math.max(4, Math.floor(total * 0.28)));
    const targets = Math.min(rawTargets, capTargets, total - 2);

    // Время уменьшается, но не меньше MIN_TIME
    const time = Math.max(MIN_TIME, 46 - (level - 1) * 1.5);

    // Выбор группы emoji
    let group;
    if (level === 1)      group = EASY_GROUPS[0];
    else if (level === 2) group = EASY_GROUPS[1];
    else if (level === 3) group = EASY_GROUPS[2];
    else                  group = HARD_GROUPS[Math.floor(Math.random() * HARD_GROUPS.length)];

    return {
      cols,
      total,
      targets,
      time,
      target: group.target,
      others: group.others,
      task: group.task
    };
  }

  /* ---------- Оверлей ---------- */
  function showOverlay(emoji, title, text, btnLabel, action) {
    ovEmoji.textContent = emoji;
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    ovBtn.textContent = btnLabel;
    state.action = action;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  ovBtn.addEventListener('click', () => {
    const fn = state.action;
    state.action = null;
    if (fn) fn();
  });

  /* =========================================================
     ИГРА
  ========================================================= */
  function startGame() {
    state.level = 1;
    startLevel();
  }

  function startLevel() {
    const cfg = getLevelConfig(state.level);
    state.cfg = cfg;

    state.found = 0;
    state.needed = cfg.targets;
    state.timeLeft = cfg.time;
    state.maxTime = cfg.time;
    state.playing = true;

    levelEl.textContent = state.level;
    totalEl.textContent = cfg.targets;
    foundEl.textContent = '0';
    taskText.textContent = cfg.task;
    taskEmoji.textContent = cfg.target;

    updateTimeUI();
    buildBoard(cfg);
    hideOverlay();

    clearInterval(state.timer);
    state.timer = setInterval(tick, TICK_MS);
  }

  function buildBoard(cfg) {
    boardEl.style.setProperty('--cols', cfg.cols);
    boardEl.innerHTML = '';

    // уникальные индексы для целей
    const targetIdx = new Set();
    while (targetIdx.size < cfg.targets) {
      targetIdx.add(Math.floor(Math.random() * cfg.total));
    }

    const frag = document.createDocumentFragment();
    // небольшая задержка анимации появления для "волны"
    let delay = 0;

    for (let i = 0; i < cfg.total; i++) {
      const isTarget = targetIdx.has(i);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      btn.dataset.target = isTarget ? '1' : '0';
      btn.textContent = isTarget
        ? cfg.target
        : cfg.others[Math.floor(Math.random() * cfg.others.length)];

      btn.style.animationDelay = Math.min(delay, 400) + 'ms';
      delay += 8;

      btn.addEventListener('click', () => onCellClick(btn));
      frag.appendChild(btn);
    }

    boardEl.appendChild(frag);
  }

  function onCellClick(btn) {
    if (!state.playing) return;
    if (btn.classList.contains('found')) return;

    if (btn.dataset.target === '1') {
      btn.classList.add('found');
      state.found++;
      foundEl.textContent = state.found;

      if (state.found >= state.needed) levelComplete();
    } else {
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 400);

      boardEl.classList.add('shake');
      setTimeout(() => boardEl.classList.remove('shake'), 300);

      state.timeLeft = Math.max(0, state.timeLeft - WRONG_PENALTY);
      updateTimeUI();

      if (state.timeLeft <= 0) gameOver();
    }
  }

  /* ---------- Таймер ---------- */
  function tick() {
    if (!state.playing) return;

    state.timeLeft = Math.max(0, state.timeLeft - TICK_MS / 1000);
    updateTimeUI();

    if (state.timeLeft <= 0) gameOver();
  }

  function updateTimeUI() {
    const secs = Math.ceil(state.timeLeft);
    timeEl.textContent = secs;

    const pct = Math.max(0, (state.timeLeft / state.maxTime) * 100);
    barEl.style.width = pct + '%';

    const low = state.timeLeft <= 10;
    barEl.classList.toggle('low', low);
    timeEl.classList.toggle('low', low);
  }

  /* ---------- Итоги ---------- */
  function levelComplete() {
    state.playing = false;
    clearInterval(state.timer);

    // обновляем рекорд
    const newRecord = state.level > state.best;
    if (newRecord) {
      state.best = state.level;
      localStorage.setItem('findAll.best', String(state.best));
    }

    const cfg = getLevelConfig(state.level + 1);

    showOverlay(
      '🎉',
      `Уровень ${state.level} пройден!`,
      `Найдено ${state.found} из ${state.needed}.` +
      (newRecord ? ` <span class="best">🏆 Новый рекорд!</span>` : ` Рекорд: ${state.best}.`) +
      `<br>Дальше: ${cfg.task} ${cfg.target} (${cfg.cols}×${cfg.cols}, ${cfg.targets} шт.)`,
      'Следующий уровень →',
      () => { state.level++; startLevel(); }
    );
  }

  function gameOver() {
    if (!state.playing) return;
    state.playing = false;
    clearInterval(state.timer);

    const newRecord = state.level > state.best;
    if (newRecord) {
      state.best = state.level;
      localStorage.setItem('findAll.best', String(state.best));
    }

    showOverlay(
      '⏰',
      'Время вышло!',
      `Дошёл до уровня <b>${state.level}</b>. Найдено ${state.found} из ${state.needed}.` +
      (newRecord
        ? ` <span class="best">🏆 Новый рекорд!</span>`
        : ` Лучший результат: <span class="best">${state.best}</span>.`),
      'Начать заново',
      startGame
    );
  }

  /* ---------- Стартовый экран ---------- */
  showOverlay(
    '🐱',
    'Найди всех — бесконечная игра',
    'На поле спрятаны нужные emoji, среди похожих. Нажимай на них как можно быстрее!<br>' +
    'За ошибку — минус 3 секунды. Уровни генерируются бесконечно и становятся сложнее.' +
    (state.best ? `<br>Твой рекорд: <span class="best">${state.best}</span>` : ''),
    'Начать игру',
    startGame
  );
})();
</script>
</body>
</html>
