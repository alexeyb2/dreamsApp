<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  /* модалки */

    padding:8px 12px;font-size:14px;}
  .modal .row{background:#14141e;border:1px solid #334;border-radius:10px;
    padding:10px;display:flex;gap:8px;align-items:center;font-size:14px;}
  .modal .row.current{border-color:#a67cff;background:#241a3a;}
  .modal .row input[type=text]{background:#0a0a14;color:#eee;border:1px solid #334;
    border-radius:6px;padding:6px 8px;font-size:14px;flex:1;min-width:0;}
  .modal .row input[type=color]{width:36px;height:36px;border:none;background:transparent;
    padding:0;border-radius:6px;}

  #jsonbar{position:fixed;top:0;left:0;right:0;z-index:31;display:none;

  #jsonbar.show{display:flex;}
  #jsonbar button{background:#223;color:#eef;border:1px solid #445;border-radius:8px;
    padding:8px 12px;font-size:13px;}
  #jsonbar button.acc{background:#3a5a3a;border-color:#6a6;}
  #jsonbar button.warn{background:#5a3a3a;border-color:#a66;}
  #json{position:fixed;top:0;left:0;right:0;bottom:80px;background:#08080c;color:#9f9;
    font-family:ui-monospace,monospace;font-size:11px;padding:44px 8px 8px;z-index:30;
    display:none;overflow:auto;border:none;resize:none;width:100%;outline:none;}
  #json.show{display:block;}

<body>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

/* ================= three.js ================= */
const threeScene = new THREE.Scene();
threeScene.background = new THREE.Color(0x0a0a0f);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(7, 6, 10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.minDistance = 2; controls.maxDistance = 60;

threeScene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(6,10,7); threeScene.add(d1);
const d2 = new THREE.DirectionalLight(0x6688ff, 0.55); d2.position.set(-5,-3,-6); threeScene.add(d2);

const grid = new THREE.GridHelper(40, 40, 0x223344, 0x111822);
grid.material.opacity = 0.5; grid.material.transparent = true; threeScene.add(grid);
threeScene.add(new THREE.AxesHelper(3));

/* ================= состояние ================= */
const state = {
  scenes: [],           // {id, name, points:[], shapes:[], group, nextLocalId}
  currentSceneId: null,
  nextSceneId: 1,
  selectedPoints: new Set(),
  selectedShapes: new Set(),
  paused: false,
  currentAxis: new THREE.Vector3(1,0,0),
  axisName: 'X'
};
const cs = () => state.scenes.find(s => s.id === state.currentSceneId);
const getPoint = id => { const s = cs(); return s ? s.points.find(p => p.id === id) : null; };
const getShape = id => { const s = cs(); return s ? s.shapes.find(x => x.id === id) : null; };

function newScene(name){
  const group = new THREE.Group();
  threeScene.add(group);
  group.visible = false;
  const s = {
    id: state.nextSceneId++,
    name: name || ('сцена-' + (state.scenes.length + 1)),
    points: [], shapes: [], group, nextLocalId: 1
  };
  state.scenes.push(s);
  return s;
}

function switchScene(id){
  const cur = cs();
  if (cur) cur.group.visible = false;
  state.currentSceneId = id;
  const s = cs();
  if (s) s.group.visible = true;
  state.selectedPoints.clear();
  state.selectedShapes.clear();
  refreshSelection();
  refreshSceneBtn();
  save();
}

function deleteScene(id){
  const idx = state.scenes.findIndex(s => s.id === id);
  if (idx < 0) return;
  if (state.scenes.length === 1) return hud('нельзя удалить последнюю');
  if (!confirm('Удалить сцену "' + state.scenes[idx].name + '"?')) return;
  const s = state.scenes[idx];
  threeScene.remove(s.group);
  s.group.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  state.scenes.splice(idx, 1);
  if (state.currentSceneId === id){
    switchScene(state.scenes[0].id);
  }
  refreshSceneList();
  save();
}

/* ================= роли точек ================= */
function getPointRoles(pid){
  const roles = new Set();
  const s = cs(); if (!s) return null;
  for (const sh of s.shapes){
    if (sh.type === 'sphere' || sh.type === 'circle'){
      if (sh.pointIds[0] === pid) roles.add('center');
      if (sh.pointIds[1] === pid) roles.add('radius');
    }
  }
  if (roles.has('center')) return 'center';
  if (roles.has('radius')) return 'radius';
  return null;
}

/* ================= точки ================= */
const POINT_GEO_NORMAL = new THREE.SphereGeometry(0.16, 20, 16);
const POINT_GEO_CENTER = new THREE.SphereGeometry(0.24, 22, 18);
const POINT_GEO_RADIUS = new THREE.SphereGeometry(0.18, 20, 16);
const RING_GEO = new THREE.TorusGeometry(0.42, 0.028, 8, 32);

function makePointMat(role, sel=false){
  let color = 0xff8800, emissive = 0x552200, ei = 0.7;
  if (role === 'center'){ color = 0xffcc22; emissive = 0xaa7700; ei = 1.1; }
  else if (role === 'radius'){ color = 0x22ddff; emissive = 0x006688; ei = 1.1; }
  if (sel){ color = 0xffffff; emissive = 0x666699; ei = 1.4; }
  return new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity: ei, metalness: 0.35, roughness: 0.3
  });
}

function addPoint(x=null, y=null, z=null){
  const s = cs(); if (!s) return;
  if (x===null){
    x = (Math.random()-0.5)*2; y = (Math.random()-0.5)*2; z = (Math.random()-0.5)*2;
  }
  const mesh = new THREE.Mesh(POINT_GEO_NORMAL, makePointMat(null));
  mesh.position.set(x, y, z);
  const localId = s.nextLocalId++;
  mesh.userData.pointId = localId;
  s.group.add(mesh);
  s.points.push({ id: localId, mesh });
  return s.points[s.points.length-1];
}

function refreshPointVisuals(){
  const s = cs(); if (!s) return;
  for (const p of s.points){
    const role = getPointRoles(p.id);
    const sel = state.selectedPoints.has(p.id);
    let geo = POINT_GEO_NORMAL;
    if (role === 'center') geo = POINT_GEO_CENTER;
    else if (role === 'radius') geo = POINT_GEO_RADIUS;
    if (p.mesh.geometry !== geo) p.mesh.geometry = geo;
    p.mesh.material.dispose();
    p.mesh.material = makePointMat(role, sel);
    if (role === 'center'){
      if (!p._ring){
        p._ring = new THREE.Mesh(RING_GEO,
          new THREE.MeshBasicMaterial({color:0xffcc22, transparent:true, opacity:0.65}));
        s.group.add(p._ring);
      }
      p._ring.visible = true;
      p._ring.position.copy(p.mesh.position);
      p._ring.lookAt(camera.position);
    } else if (p._ring){
      p._ring.visible = false;
    }
  }
}

/* ================= фигуры ================= */
const SHAPE_COLORS = [0x66aaff, 0xff7788, 0x88ff99, 0xffaa66, 0xbb77ff, 0x66dddd, 0xffee66];

function centroidOf(pts){
  const c = new THREE.Vector3();
  pts.forEach(p => c.add(p));
  return c.divideScalar(pts.length);
}

function buildShapeMesh(shape){
  const pts = shape.pointIds.map(id => getPoint(id).mesh.position);
  const centroid = centroidOf(pts);
  const local = pts.map(p => p.clone().sub(centroid));
  const color = shape.color;
  let mesh = null;

  if (shape.type === 'line'){
    const g = new THREE.BufferGeometry().setFromPoints(local);
    mesh = new THREE.Line(g, new THREE.LineBasicMaterial({color:0x66ccff}));
  } else if (shape.type === 'circle'){
    const r = pts[0].distanceTo(pts[1]);
    mesh = new THREE.Mesh(new THREE.CircleGeometry(r, 64),
      new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide, transparent:true,
        opacity:0.45, roughness:0.4}));
  } else if (shape.type === 'sphere'){
    const r = pts[0].distanceTo(pts[1]);
    mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24),
      new THREE.MeshStandardMaterial({color, transparent:true,
        opacity:0.30, roughness:0.3, metalness:0.35}));
    mesh.position.copy(pts[0]).sub(centroid);
  } else if (shape.type === 'triangle'){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(
      local.flatMap(v=>[v.x,v.y,v.z]), 3));
    g.setIndex([0,1,2]); g.computeVertexNormals();
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide,
      transparent:true, opacity:0.6, roughness:0.4}));
  } else if (shape.type === 'tetra' || shape.type === 'convex'){
    let g;
    try { g = new ConvexGeometry(local); }
    catch(e){ g = new THREE.BufferGeometry(); }
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide,
      transparent:true, opacity:0.55, flatShading:true, roughness:0.4}));
  } else if (shape.type === 'cube'){
    const sx = Math.max(Math.abs(pts[0].x-pts[1].x),0.2);
    const sy = Math.max(Math.abs(pts[0].y-pts[1].y),0.2);
    const sz = Math.max(Math.abs(pts[0].z-pts[1].z),0.2);
    mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),
      new THREE.MeshStandardMaterial({color, transparent:true,
        opacity:0.4, roughness:0.3, metalness:0.4}));
  }
  if (!mesh) return null;

  const group = new THREE.Group();
  group.position.copy(centroid);
  group.add(mesh);
  group.userData.shapeId = shape.id;
  mesh.userData.shapeId = shape.id;
  shape._innerMesh = mesh;
  return group;
}

function rebuildShape(shape){
  const s = cs(); if (!s) return;
  if (shape.mesh){
    s.group.remove(shape.mesh);
    shape.mesh.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  }
  shape.mesh = buildShapeMesh(shape);
  if (shape.mesh) s.group.add(shape.mesh);
}

function buildShape(type, pointIds){
  const s = cs(); if (!s) return;
  const shape = {
    id: s.nextLocalId++,
    name: type + '-' + s.shapes.length,
    type, pointIds: [...pointIds],
    locked: false,
    color: SHAPE_COLORS[s.shapes.length % SHAPE_COLORS.length],
    mesh: null, pendulum: null
  };
  s.shapes.push(shape);
  rebuildShape(shape);
  refreshPointVisuals();
  return shape;
}

/* ================= маятник ================= */
function togglePendulum(shapeId){
  const s = cs(); if (!s) return;
  const shape = getShape(shapeId);
  if (!shape) return;
  if (shape.pendulum){
    shape.pendulum = null;
    shape.locked = false;
    if (shape._anchorMark) shape._anchorMark.visible = false;
    hud('маятник снят · ' + shape.name);
    return;
  }
  const pts = shape.pointIds.map(id => getPoint(id).mesh.position);
  const anchor = centroidOf(pts);
  const baseOffsets = {};
  shape.pointIds.forEach(id => {
    const p = getPoint(id);
    baseOffsets[id] = p.mesh.position.clone().sub(anchor);
  });
  shape.pendulum = {
    anchor: anchor.clone(),
    baseOffsets,
    groupOffset: shape.mesh.position.clone().sub(anchor),
    axis: state.currentAxis.clone(),
    amplitude: 0.75, speed: 1.2, phase: 0
  };
  shape.locked = true;
  if (!shape._anchorMark){
    const g = new THREE.Group();
    const m = new THREE.MeshBasicMaterial({color:0xbb66ff});
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.5,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.5), m));
    shape._anchorMark = g;
    s.group.add(g);
  }
  shape._anchorMark.position.copy(anchor);
  shape._anchorMark.visible = true;
  state.paused = false;
  if (playBtn){ playBtn.textContent = '⏸'; playBtn.classList.remove('paused'); }
  hud('маятник привязан · ' + shape.name + ' · ось ' + state.axisName);
}

function setAxisForSelected(v, name){
  state.currentAxis.set(v[0],v[1],v[2]);
  state.axisName = name;
  let count = 0;
  state.selectedShapes.forEach(id => {
    const sh = getShape(id);
    if (sh && sh.pendulum){ sh.pendulum.axis.copy(state.currentAxis); count++; }
  });
  refreshAxisButtons();
  hud(count ? `ось ${name} применена (${count})` : `текущая ось: ${name}`);
}
function flipPhase(){
  let n = 0;
  state.selectedShapes.forEach(id => {
    const sh = getShape(id);
    if (sh && sh.pendulum){ sh.pendulum.phase = (sh.pendulum.phase===0)?Math.PI:0; n++; }
  });
  hud(n ? `фаза инвертирована (${n})` : 'нет маятников');
}

/* ================= выделение ================= */
function togglePoint(id){
  if (state.selectedPoints.has(id)) state.selectedPoints.delete(id);
  else state.selectedPoints.add(id);
  refreshSelection();
}
function toggleShape(id){
  if (state.selectedShapes.has(id)) state.selectedShapes.delete(id);
  else state.selectedShapes.add(id);
  refreshSelection();
}
function clearSelection(){
  state.selectedPoints.clear();
  state.selectedShapes.clear();
  refreshSelection();
}
function refreshSelection(){
  refreshPointVisuals();
  const s = cs(); if (!s) return;
  s.shapes.forEach(sh => {
    if (!sh._innerMesh || !sh._innerMesh.material) return;
    const sel = state.selectedShapes.has(sh.id);
    const m = sh._innerMesh.material;
    if ('emissive' in m){
      m.emissive = new THREE.Color(sel ? 0x554477 : 0x000000);
      m.emissiveIntensity = sel ? 0.9 : 0;
    }
  });
  hud();
}

/* ================= drag ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragOffset = new THREE.Vector3();
let dragging = null, pointerDown = null;

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const s = cs(); if (!s) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(s.points.map(p=>p.mesh), false);
  pointerDown = {x:e.clientX, y:e.clientY, moved:false};

  if (hits.length){
    const p = s.points.find(pp => pp.mesh === hits[0].object);
    dragging = p;
    controls.enabled = false;
    const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
    dragPlane.setFromNormalAndCoplanarPoint(camDir, p.mesh.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, hit);
    dragOffset.subVectors(p.mesh.position, hit);
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  if (pointerDown && !pointerDown.moved){
    const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
    if (dx*dx + dy*dy > 36) pointerDown.moved = true;
  }
  if (dragging){
    const s = cs(); if (!s) return;
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, hit)){
      const newPos = hit.add(dragOffset);
      const delta = newPos.clone().sub(dragging.mesh.position);
      const role = getPointRoles(dragging.id);

      if (role === 'center'){
        for (const sh of s.shapes){
          if ((sh.type==='sphere'||sh.type==='circle') && sh.pointIds[0]===dragging.id && !sh.pendulum){
            for (let i=1; i<sh.pointIds.length; i++){
              const p2 = getPoint(sh.pointIds[i]);
              if (p2) p2.mesh.position.add(delta);
            }
          }
        }
      }
      dragging.mesh.position.copy(newPos);
      s.shapes.forEach(sh => {
        if (sh.pendulum) return;
        if (sh.pointIds.includes(dragging.id)) rebuildShape(sh);
      });
      refreshPointVisuals();
      s.shapes.forEach(sh => {
        if (sh._anchorMark && sh.pendulum) sh._anchorMark.position.copy(sh.pendulum.anchor);
      });
    }
  }
});

function endDrag(e){
  const s = cs();
  if (dragging){
    if (pointerDown && !pointerDown.moved) togglePoint(dragging.id);
    dragging = null; controls.enabled = true;
  } else if (pointerDown && !pointerDown.moved && s){
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    const shapes = s.shapes.filter(x=>x.mesh).map(x=>x.mesh);
    const hits = raycaster.intersectObjects(shapes, true);
    if (hits.length){
      let obj = hits[0].object;
      while (obj && obj.userData.shapeId == null) obj = obj.parent;
      if (obj) toggleShape(obj.userData.shapeId);
    } else clearSelection();
  }
  pointerDown = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= UI ================= */
const ui = document.getElementById('ui');
const axisButtons = {};

function btn(label, fn, cls){

const ROLES = {
  line: ['a','b'], circle: ['center','edge'], sphere: ['center','radius'],
  triangle: ['a','b','c'], tetra: ['p1','p2','p3','p4'],
  cube: ['corner1','corner2'], convex: null
};
function roleFor(type, i){
  if (type === 'convex') return 'p'+(i+1);
  const r = ROLES[type];
  return r ? (r[i] || ('p'+(i+1))) : 'p'+(i+1);
}

/* ================= JSON ================= */
const jsonEl = document.getElementById('json');
const jsonbar = document.getElementById('jsonbar');

function serializeScene(s){
  const usedIds = new Set();
  const shapes = s.shapes.map(sh => {
    sh.pointIds.forEach(id => usedIds.add(id));
    const points = sh.pointIds.map((id, i) => {
      const p = s.points.find(x => x.id === id);
      return {
        role: roleFor(sh.type, i),
        id: p.id,
        x: +p.mesh.position.x.toFixed(4),
        y: +p.mesh.position.y.toFixed(4),
        z: +p.mesh.position.z.toFixed(4)
      };
    });
    return {
      id: sh.id, name: sh.name, type: sh.type,
      color: '#' + sh.color.toString(16).padStart(6,'0'),
      locked: !!sh.locked, points,
      pendulum: sh.pendulum ? {
        axis: sh.pendulum.axis.toArray().map(v => +v.toFixed(2)),
        amplitude: +sh.pendulum.amplitude.toFixed(3),
        speed: +sh.pendulum.speed.toFixed(3),
        phase: +sh.pendulum.phase.toFixed(3)
      } : null
    };
  });
  const freePoints = s.points
    .filter(p => !usedIds.has(p.id))
    .map(p => ({
      id: p.id,
      x: +p.mesh.position.x.toFixed(4),
      y: +p.mesh.position.y.toFixed(4),
      z: +p.mesh.position.z.toFixed(4)
    }));
  return { name: s.name, shapes, freePoints };
}

function serializeAll(){
  return {
    v: 3, type: 'all',
    current: state.currentSceneId,
    scenes: state.scenes.map(s => ({
      id: s.id,
      ...serializeScene(s)
    }))
  };
}

function serializeCurrentScene(){
  const s = cs();
  return { v: 3, type: 'scene', ...serializeScene(s) };
}

function deserializeSceneInto(target, data){
  if (data.v === 1 || data.v === 2){
    data = migrateV1toV2(data);
  }
  // очистить target
  for (const p of target.points){
    target.group.remove(p.mesh);
    if (p._ring) target.group.remove(p._ring);
  }
  for (const sh of target.shapes){
    if (sh.mesh) target.group.remove(sh.mesh);
    if (sh._anchorMark) target.group.remove(sh._anchorMark);
  }
  target.points = []; target.shapes = [];
  target.nextLocalId = 1;
  if (data.name) target.name = data.name;

  // точки из фигур
  (data.shapes || []).forEach(sd => {
    const colorInt = typeof sd.color === 'string'
      ? parseInt(sd.color.replace('#',''), 16) : (sd.color || 0x66aaff);
    const pointIds = [];
    (sd.points || []).forEach(pd => {
      const mesh = new THREE.Mesh(POINT_GEO_NORMAL, makePointMat(null));
      mesh.position.set(pd.x, pd.y, pd.z);
      mesh.userData.pointId = pd.id;
      target.group.add(mesh);
      target.points.push({ id: pd.id, mesh });
      pointIds.push(pd.id);
      target.nextLocalId = Math.max(target.nextLocalId, pd.id + 1);
    });
    const shape = {
      id: sd.id, name: sd.name, type: sd.type,
      pointIds, locked: !!sd.locked,
      color: colorInt, mesh: null, pendulum: null
    };
    target.shapes.push(shape);
    target.nextLocalId = Math.max(target.nextLocalId, sd.id + 1);
  });

  // свободные точки
  (data.freePoints || []).forEach(pd => {
    const mesh = new THREE.Mesh(POINT_GEO_NORMAL, makePointMat(null));
    mesh.position.set(pd.x, pd.y, pd.z);
    mesh.userData.pointId = pd.id;
    target.group.add(mesh);
    target.points.push({ id: pd.id, mesh });
    target.nextLocalId = Math.max(target.nextLocalId, pd.id + 1);
  });

  // строим меши фигур
  const oldCurrent = state.currentSceneId;
  state.currentSceneId = target.id;
  target.shapes.forEach(sh => rebuildShape(sh));

  // маятники
  (data.shapes || []).forEach(sd => {
    if (!sd.pendulum) return;
    const sh = target.shapes.find(x => x.id === sd.id);
    if (!sh) return;
    const pts = sh.pointIds.map(id => getPoint(id).mesh.position);
    const anchor = centroidOf(pts);
    const baseOffsets = {};
    sh.pointIds.forEach(id => {
      const p = getPoint(id);
      baseOffsets[id] = p.mesh.position.clone().sub(anchor);
    });
    sh.pendulum = {
      anchor, baseOffsets,
      groupOffset: sh.mesh.position.clone().sub(anchor),
      axis: new THREE.Vector3(...(sd.pendulum.axis || [1,0,0])),
      amplitude: sd.pendulum.amplitude ?? 0.75,
      speed: sd.pendulum.speed ?? 1.2,
      phase: sd.pendulum.phase ?? 0
    };
    sh.locked = true;
    const g = new THREE.Group();
    const m = new THREE.MeshBasicMaterial({color:0xbb66ff});
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.5,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.5), m));
    g.position.copy(anchor);
    sh._anchorMark = g;
    target.group.add(g);
  });

  state.currentSceneId = oldCurrent;
  refreshPointVisuals();
}

function migrateV1toV2(data){
  const used = new Set();
  const shapes = (data.shapes || []).map(s => {
    const pts = (s.pointIds || []).map(id => {
      const p = (data.points || []).find(x => x.id === id);
      if (!p) return null;
      used.add(id);
      return { id: p.id, x: p.x, y: p.y, z: p.z };
    }).filter(Boolean);
    return {
      id: s.id, name: s.name, type: s.type,
      color: '#' + (s.color || 0x66aaff).toString(16).padStart(6,'0'),
      locked: !!s.locked, points: pts, pendulum: null
    };
  });
  const freePoints = (data.points || [])
    .filter(p => !used.has(p.id))
    .map(p => ({ id: p.id, x: p.x, y: p.y, z: p.z }));
  return { name: data.name, shapes, freePoints };
}

function deserializeAll(data){
  // очистить
  state.scenes.forEach(s => {
    threeScene.remove(s.group);
    s.group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  });
  state.scenes = [];
  state.nextSceneId = 1;
  state.selectedPoints.clear();
  state.selectedShapes.clear();

  (data.scenes || []).forEach(sd => {
    const s = newScene(sd.name || ('сцена-' + state.scenes.length));
    deserializeSceneInto(s, sd);
    s.id = sd.id || s.id;
    state.nextSceneId = Math.max(state.nextSceneId, s.id + 1);
  });
  if (!state.scenes.length) newScene();
  const cur = data.current && state.scenes.find(x => x.id === data.current);
  switchScene(cur ? cur.id : state.scenes[0].id);
  refreshSceneBtn();
}

function showJSON(exporting, mode){

    jsonEl.value = '';
    jsonEl.placeholder = 'Вставь JSON сцены или всех сцен...';
  }
  jsonEl.classList.add('show');
  jsonbar.classList.add('show');
}

document.getElementById('applyJson').onclick = () => {
  const txt = jsonEl.value.trim();
  if (!txt) return hud('пусто');
  try {
    const data = JSON.parse(txt);
    if (data.type === 'all' || (data.scenes && Array.isArray(data.scenes))){
      deserializeAll(data);
    } else {
      deserializeSceneInto(cs(), data);
      refreshSceneBtn();
      refreshSelection();
    }
    hud('загружено');
  } catch(e){ hud('ошибка: ' + e.message); }
};
document.getElementById('closeJson').onclick = () => {
  jsonEl.classList.remove('show');
  jsonbar.classList.remove('show');
};

/* ================= HUD ================= */
const hudEl = document.getElementById('hud');
let hudMsg = '';
function hud(msg){
  if (msg) hudMsg = msg;
  const s = cs();
  const sceneName = s ? s.name : '—';
  const shapeList = s ? s.shapes.map(sh => {
    const tag = sh.pendulum ? '🎯' : (sh.locked ? '🔒' : '·');
    return `${tag}${sh.name}`;
  }).join('  ') : '';
  hudEl.textContent =
    `🎬 ${sceneName}  ·  точек:${s?s.points.length:0}  фигур:${s?s.shapes.length:0}  ось:${state.axisName}` +
    (state.paused ? '  ПАУЗА' : '') + '\n' +
    (shapeList ? shapeList + '\n' : '') +
    `выд: точки ${state.selectedPoints.size}, фигуры ${state.selectedShapes.size}` +
    (hudMsg ? '\n' + hudMsg : '');
}

/* ================= сохранение ================= */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem('forma.v4', JSON.stringify(serializeAll())); } catch(e){}
  }, 400);
}
function load(){
  try {
    const raw = localStorage.getItem('forma.v4');
    if (raw){
      deserializeAll(JSON.parse(raw));
      return;
    }
    // миграция v2
    const old = localStorage.getItem('forma.v2');
    if (old){
      const s = newScene('сцена-1');
      deserializeSceneInto(s, JSON.parse(old));
      switchScene(s.id);
      return;
    }
  } catch(e){}
  // первая сцена
  const s = newScene('сцена-1');
  switchScene(s.id);
}

/* ================= анимация ================= */
const clock = new THREE.Clock();
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();

function animate(){
  const t = clock.getElapsedTime();
  for (const s of state.scenes){
    if (!s.group.visible) continue;
    for (const sh of s.shapes){
      const pl = sh.pendulum;
      if (!pl || !sh.mesh) continue;
      const angle = state.paused ? 0 : Math.sin(t * pl.speed + pl.phase) * pl.amplitude;
      tmpQ.setFromAxisAngle(pl.axis, angle);
      tmpV.copy(pl.groupOffset).applyQuaternion(tmpQ);
      sh.mesh.position.copy(pl.anchor).add(tmpV);
      sh.mesh.quaternion.copy(tmpQ);
      for (const pid of sh.pointIds){
        const p = s.points.find(x => x.id === pid);
        if (!p) continue;
        tmpV.copy(pl.baseOffsets[pid]).applyQuaternion(tmpQ);
        p.mesh.position.copy(pl.anchor).add(tmpV);
        if (p._ring) p._ring.position.copy(p.mesh.position);
      }
    }
    for (const p of s.points){
      if (p._ring && p._ring.visible) p._ring.lookAt(camera.position);
    }
  }
  controls.update();
  renderer.render(threeScene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

load();
refreshSceneBtn();
hud('готов · 🎬 сцены · 📋 фигуры');
animate();
</script>
