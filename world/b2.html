<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>марионетка · вага</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.5;
    font-family:ui-monospace,monospace;max-width:80%;pointer-events:none;color:#8cf;}
  #err{position:fixed;top:8px;left:8px;right:8px;font-size:12px;
    background:rgba(80,10,10,.95);padding:10px;border-radius:8px;z-index:20;
    font-family:ui-monospace,monospace;color:#fdd;display:none;white-space:pre-wrap;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:6px;
    display:flex;flex-wrap:wrap;gap:4px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.2));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:8px;
    padding:9px 12px;font-size:13px;touch-action:manipulation;font-weight:bold;}
  #ui button:active{background:#2a2a4a;}
  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;}
  #ui button.reset{background:#3a2a1a;border-color:#a86;color:#ffe;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">загружаю тело…</div>
<div id="hud">старт</div>
<div id="err"></div>
<div id="ui"></div>

<script>
  window.__hud = function(m){
    var el = document.getElementById('hud');
    if (el) el.textContent = m;
  };
  window.__err = function(m){
    var el = document.getElementById('err');
    if (el){ el.style.display = 'block'; el.textContent += m + '\n'; }
    console.error(m);
  };
  window.addEventListener('error', function(e){
    window.__err('error: ' + (e.message || e));
  });
  window.addEventListener('unhandledrejection', function(e){
    window.__err('reject: ' + (e.reason && e.reason.message || e.reason));
  });
</script>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

try {

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 12, 50);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(4.5, 2.6, 5.5);
camera.lookAt(0, 1.4, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1.4, 0);
controls.minDistance = 0.5;
controls.maxDistance = 30;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
var keyL = new THREE.DirectionalLight(0xffffff, 1.3);
keyL.position.set(4, 7, 5); scene.add(keyL);
var fillL = new THREE.DirectionalLight(0x6688ff, 0.6);
fillL.position.set(-4, 2, -5); scene.add(fillL);

/* ================= пол ================= */
var grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.55;
grid.material.transparent = true;
scene.add(grid);

/* ================= вага (крест кукловода) =================
   Классическая марионеточная вага:
   - вертикальный главный брус
   - верхний горизонтальный крест поперёк (плечи)
   - нижний горизонтальный крест поперёк (для рук/ног)
   - ручка сверху, за неё кукловод держит вагу
============================================================ */
var VAGA_Y_TOP     = 3.10;  // верх ваги (ручка)
var VAGA_Y_MAIN    = 2.70;  // главный горизонтальный крест
var VAGA_Y_LOW     = 2.00;  // нижний горизонтальный крест
var VAGA_Y_BOTTOM  = 1.60;  // низ вертикального бруса

var VAGA_X_HALF    = 1.15;  // полудлина главного креста
var VAGA_X_LOW     = 0.85;  // полудлина нижнего креста

/* точки крепления нитей на ваге */
var STRING_POINTS = [
  { key:'голова',   bone:'head',         pos:new THREE.Vector3( 0.00, VAGA_Y_TOP - 0.05, 0), color:0xffcc44 },
  { key:'шея',      bone:'neck',         pos:new THREE.Vector3( 0.00, VAGA_Y_MAIN - 0.15, 0), color:0xffaa44 },
  { key:'плечо Л',  bone:'leftarm',      pos:new THREE.Vector3(-VAGA_X_HALF, VAGA_Y_MAIN, 0), color:0x88ff88 },
  { key:'плечо П',  bone:'rightarm',     pos:new THREE.Vector3( VAGA_X_HALF, VAGA_Y_MAIN, 0), color:0x88ff88 },
  { key:'локоть Л', bone:'leftforearm',  pos:new THREE.Vector3(-VAGA_X_LOW,  VAGA_Y_LOW,  0), color:0x66ffaa },
  { key:'локоть П', bone:'rightforearm', pos:new THREE.Vector3( VAGA_X_LOW,  VAGA_Y_LOW,  0), color:0x66ffaa },
  { key:'бедро Л',  bone:'leftupleg',    pos:new THREE.Vector3(-VAGA_X_LOW * 0.7, VAGA_Y_BOTTOM, 0), color:0xcc88ff },
  { key:'бедро П',  bone:'rightupleg',   pos:new THREE.Vector3( VAGA_X_LOW * 0.7, VAGA_Y_BOTTOM, 0), color:0xcc88ff }
];

/* ================= состояние ================= */
var state = {
  model: null,
  bones: {},
  boneList: [],
  skeletonHelper: null,
  strings: [],
  vagaLines: [],
  vagaHandle: null,
  vagaOffset: new THREE.Vector3(0, 0, 0),
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  dragMode: 'string',   // 'string' | 'vaga'
  pointerDown: null,
  showStrings: true,
  showVaga: true,
  showSkeleton: false
};

var K_STRENGTH = 1.0;

/* ================= хелперы ================= */
function getBoneWorld(bone){
  if (!bone) return null;
  bone.updateWorldMatrix(true, false);
  var v = new THREE.Vector3();
  bone.getWorldPosition(v);
  return v;
}

function makeLabel(text, color){
  var c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  var ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 26px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  var tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(0.42, 0.10, 1);
  return sp;
}

function makeSegment(a, b, color, opacity){
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
    a.x, a.y, a.z, b.x, b.y, b.z
  ], 3));
  var m = new THREE.LineBasicMaterial({
    color: color,
    transparent: true,
    opacity: opacity || 0.9
  });
  return new THREE.Line(g, m);
}

/* ================= AIM кость → точка крепления ================= */
function aimBone(bone, target, k){
  if (!bone.userData.restQuat) return;
  bone.quaternion.copy(bone.userData.restQuat);
  bone.updateWorldMatrix(true, false);

  var bonePos = new THREE.Vector3();
  bone.getWorldPosition(bonePos);

  var worldQuat = new THREE.Quaternion();
  bone.getWorldQuaternion(worldQuat);

  var yAxis = new THREE.Vector3(0, 1, 0).applyQuaternion(worldQuat).normalize();

  var toTarget = target.clone().sub(bonePos);
  if (toTarget.lengthSq() < 1e-8) return;
  toTarget.normalize();

  var kk = Math.max(0, Math.min(1.5, k));
  var dir = yAxis.clone().lerp(toTarget, kk).normalize();

  var dq = new THREE.Quaternion().setFromUnitVectors(yAxis, dir);
  var newWorldQuat = dq.clone().multiply(worldQuat);

  var parentQ = new THREE.Quaternion();
  if (bone.parent) bone.parent.getWorldQuaternion(parentQ);
  bone.quaternion.copy(parentQ.clone().invert().multiply(newWorldQuat));
  bone.updateWorldMatrix(true, false);
}

/* ================= вага: построить крест ================= */
function buildVaga(){
  for (var i = 0; i < state.vagaLines.length; i++){
    scene.remove(state.vagaLines[i]);
  }
  state.vagaLines = [];

  var col = 0xaaaaaa;
  var colDim = 0x666677;

  // вертикальный главный брус
  var mainLine = makeSegment(
    new THREE.Vector3(0, VAGA_Y_TOP, 0),
    new THREE.Vector3(0, VAGA_Y_BOTTOM, 0),
    col, 0.85
  );
  state.vagaLines.push(mainLine);
  scene.add(mainLine);

  // верхний горизонтальный крест (плечи)
  var topCross = makeSegment(
    new THREE.Vector3(-VAGA_X_HALF, VAGA_Y_MAIN, 0),
    new THREE.Vector3( VAGA_X_HALF, VAGA_Y_MAIN, 0),
    col, 0.85
  );
  state.vagaLines.push(topCross);
  scene.add(topCross);

  // нижний горизонтальный крест (руки/ноги)
  var lowCross = makeSegment(
    new THREE.Vector3(-VAGA_X_LOW, VAGA_Y_LOW, 0),
    new THREE.Vector3( VAGA_X_LOW, VAGA_Y_LOW, 0),
    col, 0.7
  );
  state.vagaLines.push(lowCross);
  scene.add(lowCross);

  // самый нижний крест (бёдра)
  var botCross = makeSegment(
    new THREE.Vector3(-VAGA_X_LOW * 0.7, VAGA_Y_BOTTOM, 0),
    new THREE.Vector3( VAGA_X_LOW * 0.7, VAGA_Y_BOTTOM, 0),
    colDim, 0.6
  );
  state.vagaLines.push(botCross);
  scene.add(botCross);

  // рёбра между крестами (для жёсткости визуальной)
  state.vagaLines.push(scene.add(makeSegment(
    new THREE.Vector3(-VAGA_X_HALF, VAGA_Y_MAIN, 0),
    new THREE.Vector3(-VAGA_X_LOW, VAGA_Y_LOW, 0), colDim, 0.5)));
  state.vagaLines.push(scene.add(makeSegment(
    new THREE.Vector3( VAGA_X_HALF, VAGA_Y_MAIN, 0),
    new THREE.Vector3( VAGA_X_LOW, VAGA_Y_LOW, 0), colDim, 0.5)));
  state.vagaLines.push(scene.add(makeSegment(
    new THREE.Vector3(-VAGA_X_LOW, VAGA_Y_LOW, 0),
    new THREE.Vector3(-VAGA_X_LOW * 0.7, VAGA_Y_BOTTOM, 0), colDim, 0.5)));
  state.vagaLines.push(scene.add(makeSegment(
    new THREE.Vector3( VAGA_X_LOW, VAGA_Y_LOW, 0),
    new THREE.Vector3( VAGA_X_LOW * 0.7, VAGA_Y_BOTTOM, 0), colDim, 0.5)));

  // ручка ваги — большой шар сверху
  state.vagaHandle = new THREE.Mesh(
    new THREE.SphereGeometry(0.14, 24, 18),
    new THREE.MeshStandardMaterial({
      color: 0xffcc44, emissive: 0xffaa00, emissiveIntensity: 1.2,
      transparent: true, opacity: 0.95
    })
  );
  state.vagaHandle.position.set(0, VAGA_Y_TOP, 0);
  state.vagaHandle.userData.isVagaHandle = true;
  state.vagaHandle.renderOrder = 6;
  // большая невидимая сфера
  var hit = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 8, 6),
    new THREE.MeshBasicMaterial({visible: false})
  );
  state.vagaHandle.add(hit);
  scene.add(state.vagaHandle);

  // подпись
  var lbl = makeLabel('ВАГА', '#ffcc44');
  lbl.position.set(0, VAGA_Y_TOP + 0.25, 0);
  scene.add(lbl);
  state.vagaLines.push(lbl);
}

/* ================= нити от ваги к костям ================= */
function buildStrings(){
  for (var i = 0; i < state.strings.length; i++){
    scene.remove(state.strings[i].mesh);
    scene.remove(state.strings[i].line);
    scene.remove(state.strings[i].label);
  }
  state.strings = [];

  for (var i = 0; i < STRING_POINTS.length; i++){
    var spec = STRING_POINTS[i];
    var bone = state.bones[spec.bone];
    if (!bone) continue;

    // точка крепления нити на ваге
    var mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.075, 20, 14),
      new THREE.MeshStandardMaterial({
        color: spec.color,
        emissive: spec.color,
        emissiveIntensity: 1.0,
        transparent: true,
        opacity: 0.95
      })
    );
    mesh.position.copy(spec.pos);
    mesh.userData.isString = true;
    mesh.userData.stringIdx = i;
    mesh.renderOrder = 5;
    var hit = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 8, 6),
      new THREE.MeshBasicMaterial({visible: false})
    );
    hit.userData.isHit = true;
    mesh.add(hit);
    scene.add(mesh);

    // нить
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    var line = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: spec.color,
      transparent: true,
      opacity: 0.65
    }));
    scene.add(line);

    // подпись
    var label = makeLabel(spec.key, '#88ccff');
    scene.add(label);

    state.strings.push({
      mesh: mesh,
      line: line,
      label: label,
      bone: bone,
      restPos: spec.pos.clone(),
      key: spec.key,
      color: spec.color
    });
  }
}

/* ================= обновление ================= */
function updateAll(){
  if (!state.model) return;

  // 1. Сброс костей в rest
  for (var i = 0; i < state.boneList.length; i++){
    var b = state.boneList[i];
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    if (b.userData.restPos) b.position.copy(b.userData.restPos);
  }
  state.model.updateMatrixWorld(true);

  // 2. Смещение hips вслед за вагой
  var hips = state.bones['hips'] || state.bones['pelvis'];
  if (hips && hips.userData.restPos){
    hips.position.x = hips.userData.restPos.x + state.vagaOffset.x;
    hips.position.y = hips.userData.restPos.y + state.vagaOffset.y;
    hips.position.z = hips.userData.restPos.z + state.vagaOffset.z;
  }
  state.model.updateMatrixWorld(true);

  // 3. AIM костей к точкам крепления
  var list = [];
  for (var i = 0; i < state.strings.length; i++){
    var s = state.strings[i];
    if (!s.bone) continue;
    var d = 0, p = s.bone.parent;
    while (p){ d++; p = p.parent; }
    list.push({ s: s, depth: d });
  }
  list.sort(function(a, b){ return a.depth - b.depth; });
  for (var i = 0; i < list.length; i++){
    var s = list[i].s;
    aimBone(s.bone, s.mesh.position, K_STRENGTH);
  }
  state.model.updateMatrixWorld(true);

  // 4. Обновить нити, подписи, вагу
  var off = state.vagaOffset;

  // ручка ваги
  if (state.vagaHandle){
    state.vagaHandle.position.set(0 + off.x, VAGA_Y_TOP + off.y, 0 + off.z);
  }

  // точки крепления нитей — на ваге (с учётом смещения)
  for (var i = 0; i < state.strings.length; i++){
    var s = state.strings[i];
    // если эту точку тянут — она уже сдвинута; иначе применить offset ваги
    if (state.dragging !== s.mesh){
      s.mesh.position.set(
        s.restPos.x + off.x,
        s.restPos.y + off.y,
        s.restPos.z + off.z
      );
    }
    var bonePos = getBoneWorld(s.bone);
    if (!bonePos){ s.line.visible = false; continue; }

    var arr = s.line.geometry.attributes.position.array;
    arr[0] = s.mesh.position.x;
    arr[1] = s.mesh.position.y;
    arr[2] = s.mesh.position.z;
    arr[3] = bonePos.x;
    arr[4] = bonePos.y;
    arr[5] = bonePos.z;
    s.line.geometry.attributes.position.needsUpdate = true;
    s.line.visible = state.showStrings;

    s.label.position.copy(s.mesh.position);
    s.label.position.y += 0.14;
    s.label.visible = state.showStrings;
    s.mesh.visible = state.showStrings;
  }

  // линии ваги — смещаются с offset
  for (var i = 0; i < state.vagaLines.length; i++){
    var ln = state.vagaLines[i];
    if (ln.userData && ln.userData.isVagaHandle) continue;
    if (ln.isSprite){ ln.visible = state.showVaga; continue; }
    // перестроить геометрию линий ваги со смещением
    // проще: сдвинуть позицию всего объекта через .position
    ln.position.copy(off);
    ln.visible = state.showVaga;
  }
  if (state.vagaHandle) state.vagaHandle.visible = state.showVaga;
}

/* ================= сборка по загрузке модели ================= */
function startScene(){
  buildVaga();
  buildStrings();
  updateAll();
  document.getElementById('load').classList.add('hidden');
  window.__hud('готов · тащи ручку ваги или точки крепления');
  refreshUI();
}

/* ================= загрузка Xbot ================= */
var loader = new GLTFLoader();
var MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, function(gltf){
  window.__hud('модель получена · собираю');

  var model = gltf.scene;
  model.traverse(function(o){
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.82;
    }
  });
  scene.add(model);
  state.model = model;

  var skinned = [];
  model.traverse(function(o){ if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    var helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    helper.visible = false;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  var boneList = [];
  model.traverse(function(o){
    if (o.isBone){
      boneList.push(o);
      o.userData.restQuat = o.quaternion.clone();
      o.userData.restPos = o.position.clone();
      var name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;

  var need = ['head','neck','leftarm','rightarm','leftforearm','rightforearm',
              'leftupleg','rightupleg'];
  var found = [], missing = [];
  for (var i = 0; i < need.length; i++){
    if (state.bones[need[i]]) found.push(need[i]);
    else missing.push(need[i]);
  }
  window.__hud('кости: ' + found.length + '/' + need.length +
    (missing.length ? '\nнет: ' + missing.join(', ') : ''));

  startScene();
}, undefined, function(err){
  window.__err('модель не загрузилась: ' + (err && err.message ? err.message : err));
  document.getElementById('load').textContent = 'ошибка загрузки';
});

/* ================= управление ================= */
var raycaster = new THREE.Raycaster();
var pointer = new THREE.Vector2();

function setPointer(x, y){
  var r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
}

function findHandleAt(x, y){
  setPointer(x, y);
  raycaster.setFromCamera(pointer, camera);

  // сначала ручка ваги
  if (state.vagaHandle && state.vagaHandle.visible){
    var hh = raycaster.intersectObject(state.vagaHandle, true);
    if (hh.length){
      var o = hh[0].object;
      while (o && !o.userData.isVagaHandle) o = o.parent;
      if (o) return { obj: o, mode: 'vaga' };
    }
  }
  // затем точки крепления нитей
  var meshes = [];
  for (var i = 0; i < state.strings.length; i++){
    if (state.strings[i].mesh.visible) meshes.push(state.strings[i].mesh);
  }
  var hits = raycaster.intersectObjects(meshes, true);
  if (hits.length){
    var obj = hits[0].object;
    while (obj && !obj.userData.isString) obj = obj.parent;
    if (obj) return { obj: obj, mode: 'string' };
  }
  return null;
}

renderer.domElement.addEventListener('pointerdown', function(e){
  if (e.target !== renderer.domElement) return;
  var r = findHandleAt(e.clientX, e.clientY);
  state.pointerDown = {x: e.clientX, y: e.clientY, moved: false};

  if (r){
    state.dragging = r.obj;
    state.dragMode = r.mode;
    controls.enabled = false;

    var camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, r.obj.position);

    var hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(r.obj.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', function(e){
  if (state.pointerDown && !state.pointerDown.moved){
    var dx0 = e.clientX - state.pointerDown.x;
    var dy0 = e.clientY - state.pointerDown.y;
    if (dx0 * dx0 + dy0 * dy0 > 25) state.pointerDown.moved = true;
  }
  if (!state.dragging) return;

  setPointer(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  var hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(state.dragPlane, hit)) return;

  var newPos = hit.add(state.dragOffset);

  if (state.dragMode === 'vaga'){
    // двигаем всю вагу — записываем offset относительно реста
    var baseX = 0, baseY = VAGA_Y_TOP, baseZ = 0;
    state.vagaOffset.set(newPos.x - baseX, newPos.y - baseY, newPos.z - baseZ);
  } else {
    // двигаем конкретную точку крепления — она отвязана от ваги
    state.dragging.position.copy(newPos);
  }
  updateAll();
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    state.dragging = null;
    controls.enabled = true;
  }
  state.pointerDown = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= сброс ================= */
function resetAll(){
  state.vagaOffset.set(0, 0, 0);
  for (var i = 0; i < state.strings.length; i++){
    var s = state.strings[i];
    s.mesh.position.copy(s.restPos);
  }
  for (var i = 0; i < state.boneList.length; i++){
    var b = state.boneList[i];
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    if (b.userData.restPos) b.position.copy(b.userData.restPos);
  }
  state.model.updateMatrixWorld(true);
  updateAll();
}

/* ================= UI ================= */
var ui = document.getElementById('ui');
function btn(label, fn, cls){
  var b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

var btnStrings = btn('🪢 нити', function(){
  state.showStrings = !state.showStrings;
  updateAll();
  refreshUI();
}, 'on');

var btnVaga = btn('✝ вага', function(){
  state.showVaga = !state.showVaga;
  updateAll();
  refreshUI();
}, 'on');

var btnSkel = btn('🦴 скелет', function(){
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
});

var btnStrong = btn('💪 сильно', function(){
  K_STRENGTH = 1.4; updateAll(); refreshUI();
});

var btnSoft = btn('🪶 мягко', function(){
  K_STRENGTH = 0.7; updateAll(); refreshUI();
});

btn('⟲ сброс', resetAll, 'reset');

btn('🎥 вид', function(){
  camera.position.set(4.5, 2.6, 5.5);
  controls.target.set(0, 1.4, 0);
  controls.update();
});

function refreshUI(){
  btnStrings.classList.toggle('on', state.showStrings);
  btnVaga.classList.toggle('on', state.showVaga);
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnStrong.classList.toggle('on', K_STRENGTH === 1.4);
  btnSoft.classList.toggle('on', K_STRENGTH === 0.7);
}

/* ================= анимация ================= */
function animate(){
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', function(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
window.__hud('загружаю Xbot…');
animate();

} catch(e){
  window.__err('FATAL: ' + (e && e.message ? e.message : e) +
    '\n' + (e && e.stack ? e.stack : ''));
}
</script>
