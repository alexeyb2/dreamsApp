<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>v2.1 · ноги · лимиты суставов</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.5;
    font-family:ui-monospace,monospace;color:#8cf;max-width:80%;pointer-events:none;
    white-space:pre-wrap;}
  #err{position:fixed;top:8px;left:8px;right:8px;font-size:12px;
    background:rgba(80,10,10,.95);padding:10px;border-radius:8px;z-index:20;
    font-family:ui-monospace,monospace;color:#fdd;display:none;white-space:pre-wrap;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:6px;
    display:flex;flex-wrap:wrap;gap:4px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.2));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:8px;
    padding:9px 12px;font-size:13px;touch-action:manipulation;font-weight:bold;}
  #ui button:active{background:#2a2a4a;}
  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;}
  #ui button.reset{background:#3a2a1a;border-color:#a86;color:#ffe;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;text-align:center;
    padding:20px;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">v2.1 · загружаю Xbot…</div>
<div id="hud">v2.1 · старт</div>
<div id="err"></div>
<div id="ui"></div>

<script>
  window.__hud = function(m){
    var el = document.getElementById('hud');
    if (el) el.textContent = 'v2.1 · ' + m;
  };
  window.__err = function(m){
    var el = document.getElementById('err');
    if (el){ el.style.display = 'block'; el.textContent += m + '\n'; }
    console.error(m);
  };
  window.addEventListener('error', function(e){ window.__err('error: ' + (e.message || e)); });
  window.addEventListener('unhandledrejection', function(e){
    window.__err('reject: ' + (e.reason && e.reason.message || e.reason));
  });
</script>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

try {

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 12, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(3.0, 1.8, 4.0);
camera.lookAt(0, 0.9, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 0.9, 0);
controls.minDistance = 0.5;
controls.maxDistance = 20;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const keyL = new THREE.DirectionalLight(0xffffff, 1.3);
keyL.position.set(4, 8, 5); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x6688ff, 0.55);
fillL.position.set(-4, 2, -5); scene.add(fillL);

/* ================= пол ================= */
const grid = new THREE.GridHelper(16, 32, 0x334455, 0x151a22);
grid.material.opacity = 0.55;
grid.material.transparent = true;
scene.add(grid);

/* ================= состояние ================= */
const state = {
  model: null,
  bones: {},
  boneList: [],
  skeletonHelper: null,
  chainL: null,
  chainR: null,
  footTargetL: new THREE.Vector3(-0.15, 0.1, 0.0),
  footTargetR: new THREE.Vector3( 0.15, 0.1, 0.0),
  markL: null,
  markR: null,
  lineL: null,
  lineR: null,
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDown: null,
  showSkeleton: false,
  showLimits: true
};

/* ================= ЛИМИТЫ СУСТАВОВ =================
   min/max в радианах, применяются к локальному Euler.

   Xbot (mixamo) в rest — T-поза, ноги прямые.
   - Колено (leftleg/rightleg): гнётся ТОЛЬКО назад.
     В локальных координатах Xbot это rotationX.
     Знак подобран эмпирически: [0, 1.6] — сгиб назад.
   - Бедро (leftupleg/rightupleg): более свободно.
     X: [-1.3, 1.3] — вперёд/назад
     Y: [-0.5, 0.5] — поворот
     Z: [-0.5, 0.5] — в стороны
   - Стопа (foot): небольшой диапазон.
==================================================== */
const JOINT_LIMITS = {
  leftupleg:  { x: [-1.3, 1.3], y: [-0.5, 0.5], z: [-0.5, 0.5] },
  rightupleg: { x: [-1.3, 1.3], y: [-0.5, 0.5], z: [-0.5, 0.5] },
  leftleg:    { x: [0, 1.6],    y: [-0.15, 0.15], z: [-0.15, 0.15] },
  rightleg:   { x: [0, 1.6],    y: [-0.15, 0.15], z: [-0.15, 0.15] },
  leftfoot:   { x: [-0.6, 0.6], y: [-0.3, 0.3], z: [-0.3, 0.3] },
  rightfoot:  { x: [-0.6, 0.6], y: [-0.3, 0.3], z: [-0.3, 0.3] }
};

/* ================= helpers ================= */
function bone(name){
  return state.bones[name.toLowerCase()] || null;
}

/* ================= ОГРАНИЧЕНИЕ EULER =================
   Разбираем локальный кватернион в Euler XYZ,
   ограничиваем каждый угол min/max, собираем обратно.
====================================================== */
const tmpEuler = new THREE.Euler();

function clampJoint(b){
  const name = b.name.replace(/^mixamorig:?/i, '').toLowerCase();
  const lim = JOINT_LIMITS[name];
  if (!lim) return;

  tmpEuler.setFromQuaternion(b.quaternion, 'XYZ');
  tmpEuler.x = Math.max(lim.x[0], Math.min(lim.x[1], tmpEuler.x));
  tmpEuler.y = Math.max(lim.y[0], Math.min(lim.y[1], tmpEuler.y));
  tmpEuler.z = Math.max(lim.z[0], Math.min(lim.z[1], tmpEuler.z));
  b.quaternion.setFromEuler(tmpEuler);
}

/* ================= CCD IK с лимитами =================
   После каждого поворота кости вызываем clampJoint.
====================================================== */
function ccdIK(chain, target, iterations){
  if (!chain || chain.length < 2) return;

  const endBone = chain[chain.length - 1];
  const endWorld = new THREE.Vector3();

  for (let it = 0; it < iterations; it++){
    for (let i = chain.length - 2; i >= 0; i--){
      const b = chain[i];
      b.updateWorldMatrix(true, false);

      const bonePos = new THREE.Vector3();
      b.getWorldPosition(bonePos);

      endBone.updateWorldMatrix(true, false);
      endBone.getWorldPosition(endWorld);

      const toEnd = endWorld.clone().sub(bonePos);
      const toTarget = target.clone().sub(bonePos);
      if (toEnd.lengthSq() < 1e-8 || toTarget.lengthSq() < 1e-8) continue;
      toEnd.normalize();
      toTarget.normalize();

      const dot = Math.max(-1, Math.min(1, toEnd.dot(toTarget)));
      const angle = Math.acos(dot);
      if (angle < 1e-4) continue;

      const axis = new THREE.Vector3().crossVectors(toEnd, toTarget);
      if (axis.lengthSq() < 1e-8) continue;
      axis.normalize();

      const dq = new THREE.Quaternion().setFromAxisAngle(axis, angle);

      const boneWorldQ = new THREE.Quaternion();
      b.getWorldQuaternion(boneWorldQ);
      const newWorldQ = dq.clone().multiply(boneWorldQ);

      const parentQ = new THREE.Quaternion();
      if (b.parent) b.parent.getWorldQuaternion(parentQ);
      b.quaternion.copy(parentQ.clone().invert().multiply(newWorldQ));

      // === ЛИМИТ ===
      clampJoint(b);

      b.updateWorldMatrix(true, true);
    }
  }
}

/* ================= построить ноги ================= */
function buildLegs(){
  const lUp = bone('leftupleg');
  const lLeg = bone('leftleg');
  const lFoot = bone('leftfoot');
  const rUp = bone('rightupleg');
  const rLeg = bone('rightleg');
  const rFoot = bone('rightfoot');

  state.chainL = [lUp, lLeg, lFoot].filter(Boolean);
  state.chainR = [rUp, rLeg, rFoot].filter(Boolean);

  // маркеры-цели
  function mkMark(color){
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 18, 14),
      new THREE.MeshStandardMaterial({
        color: color, emissive: color, emissiveIntensity: 1.2,
        transparent: true, opacity: 0.95
      }));
    m.renderOrder = 5;
    const hit = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 8, 6),
      new THREE.MeshBasicMaterial({visible: false}));
    hit.userData.isMarkHit = true;
    m.add(hit);
    scene.add(m);
    return m;
  }

  state.markL = mkMark(0x88ccff);
  state.markR = mkMark(0xff88cc);

  const wpL = new THREE.Vector3();
  if (lFoot){ lFoot.updateWorldMatrix(true, false); lFoot.getWorldPosition(wpL); }
  state.footTargetL.copy(wpL);
  state.markL.position.copy(wpL);
  state.markL.userData.side = 'L';

  const wpR = new THREE.Vector3();
  if (rFoot){ rFoot.updateWorldMatrix(true, false); rFoot.getWorldPosition(wpR); }
  state.footTargetR.copy(wpR);
  state.markR.position.copy(wpR);
  state.markR.userData.side = 'R';

  const lineGeo = () => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    return g;
  };
  state.lineL = new THREE.Line(lineGeo(),
    new THREE.LineBasicMaterial({color: 0x88ccff, transparent: true, opacity: 0.6}));
  state.lineR = new THREE.Line(lineGeo(),
    new THREE.LineBasicMaterial({color: 0xff88cc, transparent: true, opacity: 0.6}));
  scene.add(state.lineL);
  scene.add(state.lineR);
}

/* ================= обновить ================= */
function updateAll(){
  if (!state.model) return;

  // сброс ног в rest
  if (state.chainL){
    for (const b of state.chainL){
      if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    }
  }
  if (state.chainR){
    for (const b of state.chainR){
      if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    }
  }
  state.model.updateMatrixWorld(true);

  // IK
  if (state.chainL && state.chainL.length >= 2){
    ccdIK(state.chainL, state.footTargetL, 8);
  }
  if (state.chainR && state.chainR.length >= 2){
    ccdIK(state.chainR, state.footTargetR, 8);
  }
  state.model.updateMatrixWorld(true);

  // нити
  const vagaTop = new THREE.Vector3(0, 2.2, 0);
  if (state.lineL){
    const a = state.lineL.geometry.attributes.position.array;
    a[0] = state.markL.position.x; a[1] = state.markL.position.y; a[2] = state.markL.position.z;
    a[3] = vagaTop.x; a[4] = vagaTop.y; a[5] = vagaTop.z;
    state.lineL.geometry.attributes.position.needsUpdate = true;
  }
  if (state.lineR){
    const a = state.lineR.geometry.attributes.position.array;
    a[0] = state.markR.position.x; a[1] = state.markR.position.y; a[2] = state.markR.position.z;
    a[3] = vagaTop.x; a[4] = vagaTop.y; a[5] = vagaTop.z;
    state.lineR.geometry.attributes.position.needsUpdate = true;
  }
}

/* ================= загрузка ================= */
const loader = new GLTFLoader();
loader.load('https://threejs.org/examples/models/gltf/Xbot.glb',
  function(gltf){
    window.__hud('модель получена');

    const model = gltf.scene;
    model.traverse(function(o){
      if (o.isMesh && o.material){
        o.material.transparent = true;
        o.material.opacity = 0.88;
      }
    });
    scene.add(model);
    state.model = model;

    const skinned = [];
    model.traverse(function(o){ if (o.isSkinnedMesh) skinned.push(o); });
    if (skinned.length){
      const helper = new THREE.SkeletonHelper(model);
      helper.material.depthTest = false;
      helper.renderOrder = 1;
      helper.visible = false;
      scene.add(helper);
      state.skeletonHelper = helper;
    }

    const boneList = [];
    model.traverse(function(o){
      if (o.isBone){
        boneList.push(o);
        o.userData.restQuat = o.quaternion.clone();
        o.userData.restPos = o.position.clone();
        const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
        state.bones[name] = o;
      }
    });
    state.boneList = boneList;
    model.updateMatrixWorld(true);

    buildLegs();
    updateAll();

    document.getElementById('load').classList.add('hidden');
    window.__hud('готов · тяни шары · колено не гнётся вперёд');
  },
  undefined,
  function(err){
    window.__err('модель: ' + (err && err.message ? err.message : err));
    document.getElementById('load').textContent = 'ошибка загрузки';
  }
);

/* ================= управление ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(x, y){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
}

function findMarkerAt(x, y){
  setPointer(x, y);
  raycaster.setFromCamera(pointer, camera);
  const meshes = [state.markL, state.markR].filter(Boolean);
  const hits = raycaster.intersectObjects(meshes, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o && !o.userData.side) o = o.parent;
  return o;
}

renderer.domElement.addEventListener('pointerdown', function(e){
  if (e.target !== renderer.domElement) return;
  const m = findMarkerAt(e.clientX, e.clientY);
  state.pointerDown = {x: e.clientX, y: e.clientY, moved: false};
  if (m){
    state.dragging = m;
    controls.enabled = false;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, m.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(m.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', function(e){
  if (state.pointerDown && !state.pointerDown.moved){
    const dx = e.clientX - state.pointerDown.x;
    const dy = e.clientY - state.pointerDown.y;
    if (dx*dx + dy*dy > 25) state.pointerDown.moved = true;
  }
  if (!state.dragging) return;
  setPointer(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(state.dragPlane, hit)) return;
  const np = hit.add(state.dragOffset);
  state.dragging.position.copy(np);

  if (state.dragging.userData.side === 'L'){
    state.footTargetL.copy(np);
  } else {
    state.footTargetR.copy(np);
  }
  updateAll();
  e.preventDefault();
}, {passive: false});

function endDrag(){
  if (state.dragging){ state.dragging = null; controls.enabled = true; }
  state.pointerDown = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= сброс ================= */
function resetAll(){
  const lFoot = bone('leftfoot');
  const rFoot = bone('rightfoot');
  if (lFoot){
    lFoot.updateWorldMatrix(true, false);
    const wp = new THREE.Vector3();
    lFoot.getWorldPosition(wp);
    state.footTargetL.copy(wp);
    state.markL.position.copy(wp);
  }
  if (rFoot){
    rFoot.updateWorldMatrix(true, false);
    const wp = new THREE.Vector3();
    rFoot.getWorldPosition(wp);
    state.footTargetR.copy(wp);
    state.markR.position.copy(wp);
  }
  updateAll();
}

/* ================= UI ================= */
const ui = document.getElementById('ui');
function mkBtn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

mkBtn('⟲ сброс', resetAll, 'reset');

mkBtn('🦴 скелет', function(){
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
});

mkBtn('🎥 вид', function(){
  camera.position.set(3.0, 1.8, 4.0);
  controls.target.set(0, 0.9, 0);
  controls.update();
});

/* ================= анимация ================= */
function animate(){
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', function(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();

} catch(e){
  window.__err('FATAL: ' + (e && e.message ? e.message : e) +
    '\n' + (e && e.stack ? e.stack : ''));
}
</script>
</body>
