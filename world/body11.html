<body>
<div id="load">загружаю тело…</div>

<button id="openPanel">⚙</button>

<div id="panel">

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 8, 35);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(3.0, 1.9, 3.8);
camera.lookAt(0, 0.9, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1;
controls.target.set(0, 0.9, 0);
controls.minDistance = 0.4; controls.maxDistance = 20;

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(4, 7, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.7);
fill.position.set(-4, 2, -5); scene.add(fill);

const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.55; grid.material.transparent = true;
scene.add(grid);
scene.add(new THREE.AxesHelper(0.8));

/* ================= чакры ================= */
const CHAKRAS = [
  { label:'копчик',     bone:['hips','pelvis'] },
  { label:'сакральн',   bone:['spine'] },
  { label:'сплетение',  bone:['spine1'] },
  { label:'сердце',     bone:['spine2','chest'] },
  { label:'горло',      bone:['neck'] },
  { label:'3-й глаз',   bone:['head'] },
  { label:'макушка',    bone:['headtop_end'] }
];

/* ================= привязки костей =================
   Дефолт: руки — на верхние ручки, ноги — на нижние.
================================================ */
const BONE_OPTIONS = ['нет', 'head', 'neck', 'spine2', 'spine1', 'spine',
  'leftShoulder', 'rightShoulder', 'leftArm', 'rightArm',
  'leftForeArm', 'rightForeArm', 'leftHand', 'rightHand',
  'leftUpLeg', 'rightUpLeg', 'leftLeg', 'rightLeg',
  'leftFoot', 'rightFoot'];

// aim=true: кость направляется ОТ КОРНЯ на ручку (луч через локоть/колено)
// aim=false: кость получает дельту (просто смещение)
const AIM_BONES = new Set(['leftarm','rightarm','leftforearm','rightforearm',
  'leftupleg','rightupleg','leftleg','rightleg',
  'leftshoulder','rightshoulder','head','neck']);

// индекс привязки для каждой из 8 ручек
let bondIdx = [1, 8, 9, 3, 5, 14, 15, 4];
// 0 верх apex → head
// 1 зел1 → leftArm
// 2 зел2 → rightArm
// 3 зел3 → spine2
// 4 низ apex → spine
// 5 фиол1 → leftUpLeg
// 6 фиол2 → rightUpLeg
// 7 фиол3 → spine1

let K_STRENGTH = 1.0;

/* ================= состояние ================= */
const state = {
  model: null,
  skeletonHelper: null,
  bones: {},
  boneList: [],
  centerIdx: 0,
  centerWorld: new THREE.Vector3(0, 0.95, 0),
  r: 0.6,
  userHeight: 1.8,
  upperTetra: null,
  lowerTetra: null,
  sphere: null,
  sphereWire: null,
  handles: [],
  handleLabels: [],
  handleRestPos: [],
  raysHips: [],
  raysBones: [],
  showSkeleton: true,
  showMerkaba: true,
  showSphere: true,
  showFaces: true,
  showEdges: true,
  showRays: true,
  showBoneRays: true,
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.4,
  breathAmp: 0.04,
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDownInfo: null,
  isRegular: true
};

/* ================= математика ================= */
function computeIdealMerkaba(C, r){
  const Rb = 2 * Math.sqrt(2) * r;
  const R = 3 * r;
  const upper = [];
  upper.push(new THREE.Vector3(C.x, C.y + R, C.z));
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 + Math.PI / 2;
    upper.push(new THREE.Vector3(C.x + Rb*Math.cos(a), C.y - r, C.z + Rb*Math.sin(a)));
  }
  const lower = [];
  lower.push(new THREE.Vector3(C.x, C.y - R, C.z));
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 + Math.PI / 2 + Math.PI / 3;
    lower.push(new THREE.Vector3(C.x + Rb*Math.cos(a), C.y + r, C.z + Rb*Math.sin(a)));
  }
  return { upper, lower };
}

function findBoneWorld(names){
  for (const n of names){
    const b = state.bones[n.toLowerCase()];
    if (b){
      b.updateWorldMatrix(true, false);
      const v = new THREE.Vector3();
      b.getWorldPosition(v);
      return v;
    }
  }
  return null;
}

/* ================= объекты ================= */
function makeTetraObj(color){
  const group = new THREE.Group();
  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  faceGeo.setIndex([0,1,2, 0,2,3, 0,3,1, 1,3,2]);
  const faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: 0.09, side: THREE.DoubleSide,
    emissive: color, emissiveIntensity: 0.3, depthWrite: false
  }));
  group.add(faceMesh);
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.95
  }));
  group.add(edgeLines);
  return { group, faceMesh, edgeLines };
}

const HIT_GEO = new THREE.SphereGeometry(0.24, 8, 6);
const HIT_MAT = new THREE.MeshBasicMaterial({visible: false});

function makeLabel(text, color='#ffd766', size=26){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(0.34, 0.085, 1);
  return sp;
}

function buildMerkaba(){
  const C = state.centerWorld.clone();
  const { upper, lower } = computeIdealMerkaba(C, state.r);
  state.handleRestPos = [...upper, ...lower].map(v => v.clone());

  const baseColors = [0xffcc44, 0x88ff88, 0x88ff88, 0x88ff88,
                      0xff66aa, 0xcc88ff, 0xcc88ff, 0xcc88ff];

  for (let i = 0; i < 8; i++){
    const isApex = (i === 0 || i === 4);
    const pos = state.handleRestPos[i];
    const mat = new THREE.MeshStandardMaterial({
      color: baseColors[i], emissive: baseColors[i], emissiveIntensity: 0.9,
      transparent: true, opacity: 0.95
    });
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(isApex ? 0.085 : 0.065, 22, 16), mat);
    mesh.position.copy(pos);
    mesh.userData.isHandle = true;
    mesh.userData.handleIndex = i;
    mesh.userData.baseColor = new THREE.Color(baseColors[i]);
    mesh.renderOrder = 4;
    mesh.add(new THREE.Mesh(HIT_GEO, HIT_MAT));
    scene.add(mesh);
    state.handles.push(mesh);

    const lbl = makeLabel('');
    scene.add(lbl);
    state.handleLabels.push(lbl);
  }

  state.upperTetra = makeTetraObj(0x66aaff);
  scene.add(state.upperTetra.group);
  state.lowerTetra = makeTetraObj(0xff77cc);
  scene.add(state.lowerTetra.group);

  state.sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({
      color: 0xffaa44, transparent: true, opacity: 0.20,
      emissive: 0xff6600, emissiveIntensity: 0.6,
      depthWrite: false, side: THREE.DoubleSide
    }));
  scene.add(state.sphere);
  state.sphereWire = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({
      color: 0xffdd88, transparent: true, opacity: 0.20,
      wireframe: true, depthWrite: false
    }));
  scene.add(state.sphereWire);

  for (let i = 0; i < 8; i++){
    const g1 = new THREE.BufferGeometry();
    g1.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const l1 = new THREE.Line(g1, new THREE.LineBasicMaterial({
      color: i < 4 ? 0xffcc88 : 0xff88cc, transparent: true, opacity: 0.55
    }));
    scene.add(l1);
    state.raysHips.push(l1);

    const g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const l2 = new THREE.Line(g2, new THREE.LineBasicMaterial({
      color: 0x00ffcc, transparent: true, opacity: 0.9
    }));
    scene.add(l2);
    state.raysBones.push(l2);
  }

  updateBondLabels();
  buildChakraButtons();
  updateAll();
}

function updateBondLabels(){
  const el = document.getElementById('bonds');
  const names = ['▲зол', 'з1', 'з2', 'з3', '▼роз', 'ф1', 'ф2', 'ф3'];
  let html = '';
  for (let i = 0; i < 8; i++){
    html += `${names[i]} → <b>${BONE_OPTIONS[bondIdx[i]]}</b><br>`;
  }
  el.innerHTML = html;
}

/* ================= чакры ================= */
function buildChakraButtons(){
  const row = document.getElementById('chakraRow');
  row.innerHTML = '';
  CHAKRAS.forEach((ch, i) => {
    const b = document.createElement('button');
    b.textContent = ch.label;
    b.classList.toggle('on', i === state.centerIdx);
    b.onclick = () => setCenter(i);
    row.appendChild(b);
  });
}

function setCenter(idx){
  state.centerIdx = idx;
  const pos = findBoneWorld(CHAKRAS[idx].bone);
  if (pos) state.centerWorld.copy(pos);
  document.querySelectorAll('#chakraRow button').forEach((b, i) => {
    b.classList.toggle('on', i === idx);
  });
  resetToRegular();
  hud('центр: ' + CHAKRAS[idx].label + ' · y=' + state.centerWorld.y.toFixed(2));
}

/* ================= AIM — кость от корня на ручку =================
   Работает как «луч из центра»: начало кости (корень) остаётся на
   месте, а её ось Y направляется на цель (ручку). Для конечностей —
   это и есть «копчик → колено → ручка».
================================================================== */
function aimBoneAtRoot(bone, targetWorld, k){
  if (!bone.userData.restQuat) return;
  bone.quaternion.copy(bone.userData.restQuat);
  bone.updateWorldMatrix(true, false);

  const boneWorldPos = new THREE.Vector3();
  bone.getWorldPosition(boneWorldPos);

  const worldQuat = new THREE.Quaternion();
  bone.getWorldQuaternion(worldQuat);
  const yAxis = new THREE.Vector3(0,1,0).applyQuaternion(worldQuat).normalize();

  const toTarget = targetWorld.clone().sub(boneWorldPos);
  if (toTarget.lengthSq() < 1e-8) return;
  toTarget.normalize();

  // смешивание: k=0 → rest, k=1 → полный aim
  const kk = Math.max(0, Math.min(1.5, k));
  const blended = yAxis.clone().lerp(toTarget, kk).normalize();

  const q = new THREE.Quaternion().setFromUnitVectors(yAxis, blended);
  const newWorldQuat = q.multiply(worldQuat);

  const pq = new THREE.Quaternion();
  if (bone.parent) bone.parent.getWorldQuaternion(pq);
  bone.quaternion.copy(pq.clone().invert().multiply(newWorldQuat));
  bone.updateWorldMatrix(true, false);
}

/* ================= обновление ================= */
function updateTetraMesh(t, verts){
  const pos = [];
  const faces = [[0,1,2],[0,2,3],[0,3,1],[1,2,3]];
  for (const f of faces)
    for (const i of f) pos.push(verts[i].x, verts[i].y, verts[i].z);
  t.faceMesh.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(pos, 3));
  t.faceMesh.geometry.computeVertexNormals();
  const edges = [[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]];
  const ep = [];
  for (const [a,b] of edges){
    ep.push(verts[a].x, verts[a].y, verts[a].z);
    ep.push(verts[b].x, verts[b].y, verts[b].z);
  }
  t.edgeLines.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(ep, 3));
}

function getDepth(obj){
  let d = 0, p = obj.parent;
  while (p){ d++; p = p.parent; }
  return d;
}

function updateAll(){
  if (state.handles.length < 8) return;

  // 1. Сбросить ВСЕ кости в rest (один раз)
  for (const b of state.boneList){
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
  }
  state.model.updateMatrixWorld(true);

  // 2. Собрать управляемые кости и их дельты
  const controlled = [];
  for (let i = 0; i < 8; i++){
    const bn = BONE_OPTIONS[bondIdx[i]];
    if (bn === 'нет') continue;
    const bone = state.bones[bn.toLowerCase()];
    if (!bone) continue;
    const delta = state.handles[i].position.clone().sub(state.handleRestPos[i]);
    controlled.push({
      bone, boneName: bn.toLowerCase(), delta,
      depth: getDepth(bone), handleIdx: i
    });
  }

  // 3. Сортировать по глубине (родители первыми)
  controlled.sort((a,b) => a.depth - b.depth);

  // 4. Применять по очереди, обновляя мир после каждой
  for (const c of controlled){
    if (AIM_BONES.has(c.boneName)){
      // AIM: кость смотрит от корня на ручку
      aimBoneAtRoot(c.bone, state.handles[c.handleIdx].position, K_STRENGTH);
    } else {
      // DELTA: мягкое смещение от rest
      c.bone.quaternion.copy(c.bone.userData.restQuat);
      c.bone.updateWorldMatrix(true, false);
      if (c.delta.lengthSq() > 1e-8){
        const rq = c.bone.userData.restWorldQuat;
        const restDir = new THREE.Vector3(0,1,0).applyQuaternion(rq).normalize();
        const targetDir = restDir.clone().addScaledVector(c.delta, K_STRENGTH);
        if (targetDir.lengthSq() > 1e-8){
          targetDir.normalize();
          const dq = new THREE.Quaternion().setFromUnitVectors(restDir, targetDir);
          const newWorld = dq.clone().multiply(rq);
          const pq = new THREE.Quaternion();
          if (c.bone.parent) c.bone.parent.getWorldQuaternion(pq);
          c.bone.quaternion.copy(pq.clone().invert().multiply(newWorld));
        }
      }
      c.bone.updateWorldMatrix(true, true);
    }
  }

  // 5. Тетраэдры
  const upper = state.handles.slice(0,4).map(h => h.position.clone());
  const lower = state.handles.slice(4,8).map(h => h.position.clone());
  updateTetraMesh(state.upperTetra, upper);
  updateTetraMesh(state.lowerTetra, lower);

  // 6. Сфера
  let r = state.r;
  if (state.breathing) r += Math.sin(state.breathPhase) * state.breathAmp;
  state.sphere.position.copy(state.centerWorld);
  state.sphere.scale.setScalar(r);
  state.sphereWire.position.copy(state.centerWorld);
  state.sphereWire.scale.setScalar(r);

  // 7. Лучи + подписи + цвет ручки по натяжению
  for (let i = 0; i < 8; i++){
    const v = state.handles[i].position;
    const aH = state.raysHips[i].geometry.attributes.position.array;
    aH[0] = v.x; aH[1] = v.y; aH[2] = v.z;
    aH[3] = state.centerWorld.x;
    aH[4] = state.centerWorld.y;
    aH[5] = state.centerWorld.z;
    state.raysHips[i].geometry.attributes.position.needsUpdate = true;
    state.raysHips[i].visible = state.showRays;

    const bn = BONE_OPTIONS[bondIdx[i]].toLowerCase();
    const bone = bn !== 'нет' ? state.bones[bn] : null;
    if (bone){
      const bp = new THREE.Vector3();
      bone.getWorldPosition(bp);
      const aB = state.raysBones[i].geometry.attributes.position.array;
      aB[0] = v.x; aB[1] = v.y; aB[2] = v.z;
      aB[3] = bp.x; aB[4] = bp.y; aB[5] = bp.z;
      state.raysBones[i].geometry.attributes.position.needsUpdate = true;
      state.raysBones[i].visible = state.showBoneRays;
    } else {
      state.raysBones[i].visible = false;
    }

    // расстояние до центра
    const dist = v.distanceTo(state.centerWorld);
    const lbl = state.handleLabels[i];
    if (lbl){
      lbl.position.set(v.x, v.y - 0.14, v.z);
      updateLabelText(lbl, dist.toFixed(2) + ' м');
      lbl.visible = state.showMerkaba;
    }

    // цвет ручки: близко к rest — родной, далеко — красный
    const delta = v.distanceTo(state.handleRestPos[i]);
    const t = Math.min(delta / (state.r * 1.5), 1); // 0..1
    const h = state.handles[i];
    const base = h.userData.baseColor;
    const red = new THREE.Color(0xff3333);
    const col = base.clone().lerp(red, t);
    h.material.color.copy(col);
    h.material.emissive.copy(col);
  }

  // 8. Видимость
  state.upperTetra.group.visible = state.showMerkaba;
  state.lowerTetra.group.visible = state.showMerkaba;
  state.upperTetra.faceMesh.visible = state.showFaces;
  state.lowerTetra.faceMesh.visible = state.showFaces;
  state.upperTetra.edgeLines.visible = state.showEdges;
  state.lowerTetra.edgeLines.visible = state.showEdges;
  state.sphere.visible = state.showSphere;
  state.sphereWire.visible = state.showSphere;
  for (const h of state.handles) h.visible = state.showMerkaba;

  // 9. Цифры
  const R = 3 * state.r;
  const a = 2 * Math.sqrt(6) * state.r;
  document.getElementById('rVal').textContent = state.r.toFixed(2) + ' м';
  document.getElementById('RVal').textContent = R.toFixed(2) + ' м';
  document.getElementById('edgeVal').textContent = a.toFixed(2) + ' м';
  document.getElementById('hVal').textContent = (4*state.r).toFixed(2) + ' м';
}

function updateLabelText(sprite, text){
  if (sprite.userData.text === text) return;
  sprite.userData.text = text;
  sprite.material.map.dispose();
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffd766';
  ctx.font = 'bold 30px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  sprite.material.map = tex;
  sprite.material.needsUpdate = true;
}

/* ================= reset ================= */
function resetToRegular(){
  const C = state.centerWorld.clone();
  const { upper, lower } = computeIdealMerkaba(C, state.r);
  state.handleRestPos = [...upper, ...lower].map(v => v.clone());
  for (let i = 0; i < 8; i++){
    state.handles[i].position.copy(state.handleRestPos[i]);
  }
  for (const b of state.boneList){
    if (b.userData.restQuat){
      b.quaternion.copy(b.userData.restQuat);
      b.updateWorldMatrix(true, false);
    }
  }
  state.isRegular = true;
  updateStateInfo();
  updateAll();
}

function updateStateInfo(){
  const el = document.getElementById('stateInfo');
  if (state.isRegular){ el.textContent = 'правильная'; el.classList.remove('deformed'); }
  else { el.textContent = 'деформирована'; el.classList.add('deformed'); }
}

/* ================= панель ================= */
const panelEl = document.getElementById('panel');
const openPanelBtn = document.getElementById('openPanel');
document.getElementById('closePanel').onclick = () => {
  panelEl.classList.add('hidden'); openPanelBtn.classList.add('show');
};
openPanelBtn.onclick = () => {
  panelEl.classList.remove('hidden'); openPanelBtn.classList.remove('show');
};

const slider = document.getElementById('radiusSlider');
const heightInput = document.getElementById('heightInput');
const strengthSlider = document.getElementById('strengthSlider');

slider.addEventListener('input', () => {
  state.r = parseFloat(slider.value);
  resetToRegular();
});

strengthSlider.addEventListener('input', () => {
  K_STRENGTH = parseFloat(strengthSlider.value);
  document.getElementById('kVal').textContent = K_STRENGTH.toFixed(2);
  updateAll();
});

document.getElementById('heightApply').onclick = () => {
  const h = parseFloat(heightInput.value);
  if (!isFinite(h) || h < 0.5) return;
  state.userHeight = h;
  state.r = h / 3;
  slider.value = state.r.toFixed(2);
  resetToRegular();
  hud('рост ' + h.toFixed(2) + ' → r = ' + state.r.toFixed(2));
};

/* ================= drag ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(x, y){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
}

function findHandleAt(x, y){
  setPointer(x, y);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.handles, true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !obj.userData.isHandle) obj = obj.parent;
  return obj;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const h = findHandleAt(e.clientX, e.clientY);
  state.pointerDownInfo = {x: e.clientX, y: e.clientY, moved: false};

  if (h){
    state.dragging = h;
    controls.enabled = false;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, h.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(h.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', e => {
  if (state.pointerDownInfo && !state.pointerDownInfo.moved){
    const dx = e.clientX - state.pointerDownInfo.x;
    const dy = e.clientY - state.pointerDownInfo.y;
    if (dx*dx + dy*dy > 25) state.pointerDownInfo.moved = true;
  }
  if (!state.dragging) return;
  setPointer(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(state.dragPlane, hit)){
    state.dragging.position.copy(hit.add(state.dragOffset));
    state.isRegular = false;
    updateStateInfo();
    updateAll();
  }
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    if (state.pointerDownInfo && !state.pointerDownInfo.moved){
      const i = state.dragging.userData.handleIndex;
      bondIdx[i] = (bondIdx[i] + 1) % BONE_OPTIONS.length;
      updateBondLabels();
      hud('ручка ' + i + ' → ' + BONE_OPTIONS[bondIdx[i]]);
    }
    state.dragging = null;
    controls.enabled = true;
  }
  state.pointerDownInfo = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= загрузка ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.72;
    }
  });
  scene.add(model);
  state.model = model;

  const skinned = [];
  model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  const boneList = [];
  model.traverse(o => {
    if (o.isBone){
      boneList.push(o);
      o.userData.restQuat = o.quaternion.clone();
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;
  model.updateMatrixWorld(true);
  for (const b of boneList){
    const wq = new THREE.Quaternion();
    b.getWorldQuaternion(wq);
    b.userData.restWorldQuat = wq;
  }

  const startPos = findBoneWorld(CHAKRAS[0].bone);
  if (startPos) state.centerWorld.copy(startPos);

  state.r = state.userHeight / 3;
  slider.value = state.r;

  buildMerkaba();
  document.getElementById('load').classList.add('hidden');
  hud('центр: ' + CHAKRAS[state.centerIdx].label + ' · r=' + state.r.toFixed(2));
  refreshUI();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'ошибка: ' + err.message;
});

/* ================= UI ================= */
const ui = document.getElementById('ui');
function btn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}
let btnSkel, btnMerk, btnSph, btnFaces, btnEdges, btnRays, btnBoneRays, btnBreath;

btnSkel = btn('🦴 скелет', () => {
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
}, 'on');
btnMerk = btn('🔷 меркаба', () => { state.showMerkaba = !state.showMerkaba; updateAll(); refreshUI(); }, 'on');
btnSph = btn('⚪ сфера', () => { state.showSphere = !state.showSphere; updateAll(); refreshUI(); }, 'on');
btnFaces = btn('🔹 грани', () => { state.showFaces = !state.showFaces; updateAll(); refreshUI(); }, 'on');
btnEdges = btn('📐 рёбра', () => { state.showEdges = !state.showEdges; updateAll(); refreshUI(); }, 'on');
btnRays = btn('📡 к центру', () => { state.showRays = !state.showRays; updateAll(); refreshUI(); }, 'on');
btnBoneRays = btn('🧲 к костям', () => { state.showBoneRays = !state.showBoneRays; updateAll(); refreshUI(); }, 'on');
btnBreath = btn('🌬 дыхание', () => { state.breathing = !state.breathing; refreshUI(); }, 'breath');

btn('⟲ правильно', resetToRegular, 'reset');
btn('🎥 вид', () => {
  camera.position.set(3.0, 1.9, 3.8);
  controls.target.set(0, 0.9, 0);
  controls.update();
});

function refreshUI(){
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnMerk.classList.toggle('on', state.showMerkaba);
  btnSph.classList.toggle('on', state.showSphere);
  btnFaces.classList.toggle('on', state.showFaces);
  btnEdges.classList.toggle('on', state.showEdges);
  btnRays.classList.toggle('on', state.showRays);
  btnBoneRays.classList.toggle('on', state.showBoneRays);
  btnBreath.classList.toggle('off', state.breathing);
  btnBreath.textContent = state.breathing ? '⏸ дыхание' : '🌬 дыхание';
}

const hudEl = document.getElementById('hud');
function hud(m){ hudEl.textContent = m; }

/* ================= анимация ================= */
const clock = new THREE.Clock();
function animate(){
  const dt = clock.getDelta();
  if (state.breathing){
    state.breathPhase += dt * state.breathSpeed * Math.PI * 2;
    let r = state.r + Math.sin(state.breathPhase) * state.breathAmp;
    state.sphere.scale.setScalar(r);
    state.sphereWire.scale.setScalar(r);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
updateStateInfo();
hud('загружаю Xbot…');
animate();
</script>
