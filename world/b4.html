<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);

    font-family:ui-monospace,monospace;color:#fdd;display:none;white-space:pre-wrap;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:6px;

<body>
<div id="load">загружаю тело…</div>
<div id="hud">старт</div>
<div id="err"></div>
<div id="ui"></div>

<script>
  window.__hud = function(m){
    var el = document.getElementById('hud');
    if (el) el.textContent = m;
  };
  window.__err = function(m){
    var el = document.getElementById('err');
    if (el){ el.style.display = 'block'; el.textContent += m + '\n'; }
    console.error(m);
  };
  window.addEventListener('error', function(e){
    window.__err('error: ' + (e.message || e));
  });
  window.addEventListener('unhandledrejection', function(e){
    window.__err('reject: ' + (e.reason && e.reason.message || e.reason));
  });
</script>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

try {

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 15, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(4.5, 2.8, 6.0);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1.5, 0);
controls.minDistance = 0.5;
controls.maxDistance = 30;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const keyL = new THREE.DirectionalLight(0xffffff, 1.3);
keyL.position.set(4, 7, 5); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x6688ff, 0.6);
fillL.position.set(-4, 2, -5); scene.add(fillL);

/* ================= пол ================= */
const grid = new THREE.GridHelper(24, 48, 0x334455, 0x151a22);
grid.material.opacity = 0.55;
grid.material.transparent = true;
scene.add(grid);

/* ================= ВАГА X =================
   Классическая марионеточная вага — X-образный крест.
   Верхние концы — руки (плечо + предплечье).
   Нижние концы — ноги (бедро + голень).
   Центр — голова.
============================================ */
const VAGA_Y = 2.60;
const VAGA_SIZE = 1.05;
const VAGA_REST = new THREE.Vector3(0, VAGA_Y, 0);

// 9 нитей: 4 конца X + центр
const STRING_SPECS = [
  // верхний-левый конец X — левая рука (плечо + предплечье)
  { key:'плечо Л',  bone:'leftarm',      local:new THREE.Vector3(-VAGA_SIZE, 0.15, -VAGA_SIZE), color:0x88ff88 },
  { key:'локоть Л', bone:'leftforearm',  local:new THREE.Vector3(-VAGA_SIZE-0.35, -0.1, -VAGA_SIZE-0.35), color:0x66ffaa },
  // верхний-правый конец X — правая рука
  { key:'плечо П',  bone:'rightarm',     local:new THREE.Vector3( VAGA_SIZE, 0.15, -VAGA_SIZE), color:0x88ff88 },
  { key:'локоть П', bone:'rightforearm', local:new THREE.Vector3( VAGA_SIZE+0.35, -0.1, -VAGA_SIZE-0.35), color:0x66ffaa },
  // нижний-левый конец X — левая нога (бедро + голень)
  { key:'бедро Л',  bone:'leftupleg',    local:new THREE.Vector3(-VAGA_SIZE, -0.15,  VAGA_SIZE), color:0xcc88ff },
  { key:'колено Л', bone:'leftleg',      local:new THREE.Vector3(-VAGA_SIZE-0.35, -0.4,  VAGA_SIZE+0.35), color:0xaa66ff },
  // нижний-правый конец X — правая нога
  { key:'бедро П',  bone:'rightupleg',   local:new THREE.Vector3( VAGA_SIZE, -0.15,  VAGA_SIZE), color:0xcc88ff },
  { key:'колено П', bone:'rightleg',     local:new THREE.Vector3( VAGA_SIZE+0.35, -0.4,  VAGA_SIZE+0.35), color:0xaa66ff },
  // центр — голова
  { key:'голова',   bone:'head',         local:new THREE.Vector3(0, 0.45, 0), color:0xffcc44 }
];

const state = {
  model: null,
  bones: {},
  boneList: [],
  skeletonHelper: null,
  // вага
  vagaCenter: VAGA_REST.clone(),
  vagaVisual: null,
  vagaHandle: null,
  vagaLabel: null,
  // нити
  strings: [],
  // drag
  dragging: null,
  dragMode: null,          // 'vaga' | 'string'
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDown: null,
  // видимость
  showStrings: true,
  showVaga: true,
  showSkeleton: false
};

let K_STRENGTH = 0.75;     // базовая сила притяжения
const MAX_ANGLE = Math.PI * 0.55; // ~100° — ограничение выкручивания

/* ================= helpers ================= */
function getBoneWorld(bone){
  if (!bone) return null;
  bone.updateWorldMatrix(true, false);
  const v = new THREE.Vector3();
  bone.getWorldPosition(v);
  return v;
}

function makeLabel(text, color){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 24px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(0.42, 0.10, 1);
  return sp;
}

/* ================= вага X ================= */
function buildVaga(){
  if (state.vagaVisual) scene.remove(state.vagaVisual);
  const g = new THREE.Group();
  scene.add(g);
  state.vagaVisual = g;

  const S = VAGA_SIZE;
  const mat = new THREE.LineBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.85 });
  const matDim = new THREE.LineBasicMaterial({ color: 0x888899, transparent: true, opacity: 0.55 });

  // X-крест: два диагональных бруса в горизонтальной плоскости
  // брус 1: (-S, 0, -S) → (S, 0, S)
  g.add(makeLine(new THREE.Vector3(-S, 0.15, -S), new THREE.Vector3(S, 0.15, S), mat));
  // брус 2: (-S, 0, S) → (S, 0, -S)
  g.add(makeLine(new THREE.Vector3(-S, 0.15, S), new THREE.Vector3(S, 0.15, -S), mat));

  // нижние брусы для ног (чуть ниже)
  g.add(makeLine(new THREE.Vector3(-S-0.35, -0.35, S+0.35), new THREE.Vector3(S+0.35, -0.35, S+0.35), matDim));
  // перемычки от верхних концов к нижним
  g.add(makeLine(new THREE.Vector3(-S, 0.15, -S), new THREE.Vector3(-S-0.35, -0.35, S+0.35), matDim));
  g.add(makeLine(new THREE.Vector3( S, 0.15, -S), new THREE.Vector3( S+0.35, -0.35, S+0.35), matDim));

  // вертикальная стойка к ручке
  g.add(makeLine(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.55, 0), mat));

  // ручка — жёлтый шар в центре
  state.vagaHandle = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 24, 18),
    new THREE.MeshStandardMaterial({
      color: 0xffcc44, emissive: 0xffaa00, emissiveIntensity: 1.2,
      transparent: true, opacity: 0.95
    }));
  state.vagaHandle.userData.isVagaHandle = true;
  state.vagaHandle.renderOrder = 6;
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(0.36, 8, 6),
    new THREE.MeshBasicMaterial({visible: false}));
  hit.userData.isHit = true;
  state.vagaHandle.add(hit);
  scene.add(state.vagaHandle);

  state.vagaLabel = makeLabel('ВАГА', '#ffcc44');
  scene.add(state.vagaLabel);
}

function makeLine(a, b, mat){
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  return new THREE.Line(geo, mat);
}

/* ================= нити ================= */
function buildStrings(){
  for (const s of state.strings){
    scene.remove(s.mesh); scene.remove(s.line); scene.remove(s.label);
  }
  state.strings = [];

  for (let i = 0; i < STRING_SPECS.length; i++){
    const spec = STRING_SPECS[i];
    const bone = state.bones[spec.bone];
    if (!bone) continue;

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.075, 20, 14),
      new THREE.MeshStandardMaterial({
        color: spec.color, emissive: spec.color, emissiveIntensity: 1.0,
        transparent: true, opacity: 0.95
      }));
    mesh.userData.isString = true;
    mesh.userData.stringIdx = i;
    mesh.renderOrder = 5;
    const hit = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 8, 6),
      new THREE.MeshBasicMaterial({visible: false}));
    hit.userData.isHit = true;
    mesh.add(hit);
    scene.add(mesh);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: spec.color, transparent: true, opacity: 0.75
    }));
    scene.add(line);

    const label = makeLabel(spec.key, '#88ccff');
    scene.add(label);

    state.strings.push({
      mesh, line, label, bone,
      local: spec.local.clone(),
      offset: new THREE.Vector3(0, 0, 0),   // смещение от ваги (тянул пальцем)
      key: spec.key, color: spec.color
    });
  }
}

/* ================= позиция нити ================= */
function stringWorldPos(s){
  return new THREE.Vector3(
    state.vagaCenter.x + s.local.x + s.offset.x,
    state.vagaCenter.y + s.local.y + s.offset.y,
    state.vagaCenter.z + s.local.z + s.offset.z
  );
}

/* ================= AIM с ограничением ================= */
function aimBone(bone, target, k){
  if (!bone.userData.restQuat) return;
  bone.quaternion.copy(bone.userData.restQuat);
  bone.updateWorldMatrix(true, false);

  const bonePos = new THREE.Vector3();
  bone.getWorldPosition(bonePos);
  const worldQuat = new THREE.Quaternion();
  bone.getWorldQuaternion(worldQuat);
  const yAxis = new THREE.Vector3(0,1,0).applyQuaternion(worldQuat).normalize();

  const toTarget = target.clone().sub(bonePos);
  if (toTarget.lengthSq() < 1e-8) return;
  toTarget.normalize();

  const kk = Math.max(0, Math.min(1.2, k));
  const dir = yAxis.clone().lerp(toTarget, kk).normalize();

  const dq = new THREE.Quaternion().setFromUnitVectors(yAxis, dir);

  // ограничение угла — не даём кости выкрутиться больше MAX_ANGLE
  let angle = 2 * Math.acos(Math.abs(dq.w));
  if (angle > MAX_ANGLE){
    const axis = new THREE.Vector3(dq.x, dq.y, dq.z).normalize();
    dq.setFromAxisAngle(axis, MAX_ANGLE);
  }

  const newWorldQuat = dq.clone().multiply(worldQuat);
  const parentQ = new THREE.Quaternion();
  if (bone.parent) bone.parent.getWorldQuaternion(parentQ);
  bone.quaternion.copy(parentQ.clone().invert().multiply(newWorldQuat));
  bone.updateWorldMatrix(true, false);
}

/* ================= update ================= */
function updateAll(){
  if (!state.model) return;

  // 1. Все кости в rest
  for (const b of state.boneList){
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    if (b.userData.restPos) b.position.copy(b.userData.restPos);
  }
  state.model.updateMatrixWorld(true);

  // 2. Горизонтальное смещение hips от движения ваги
  const hips = state.bones['hips'] || state.bones['pelvis'];
  if (hips && hips.userData.restPos){
    const dx = state.vagaCenter.x - VAGA_REST.x;
    const dz = state.vagaCenter.z - VAGA_REST.z;
    hips.position.x = hips.userData.restPos.x + dx;
    hips.position.z = hips.userData.restPos.z + dz;
  }
  state.model.updateMatrixWorld(true);

  // 3. AIM по иерархии
  const list = [];
  for (const s of state.strings){
    if (!s.bone) continue;
    let d = 0, p = s.bone.parent;
    while (p){ d++; p = p.parent; }
    list.push({ s, depth: d });
  }
  list.sort((a,b) => a.depth - b.depth);
  for (const item of list){
    aimBone(item.s.bone, stringWorldPos(item.s), K_STRENGTH);
  }
  state.model.updateMatrixWorld(true);

  // 4. Обновить визуал нитей и ваги
  const off = new THREE.Vector3().subVectors(state.vagaCenter, VAGA_REST);

  if (state.vagaVisual) state.vagaVisual.position.copy(off);
  if (state.vagaHandle) state.vagaHandle.position.copy(state.vagaCenter);
  if (state.vagaLabel){
    state.vagaLabel.position.set(state.vagaCenter.x, state.vagaCenter.y + 0.42, state.vagaCenter.z);
    state.vagaLabel.visible = state.showVaga;
  }
  if (state.vagaVisual){
    for (const child of state.vagaVisual.children) child.visible = state.showVaga;
  }
  if (state.vagaHandle) state.vagaHandle.visible = state.showVaga;

  for (const s of state.strings){
    const wpos = stringWorldPos(s);
    s.mesh.position.copy(wpos);
    const bp = getBoneWorld(s.bone);
    if (!bp){ s.line.visible = false; continue; }
    const a = s.line.geometry.attributes.position.array;
    a[0] = wpos.x; a[1] = wpos.y; a[2] = wpos.z;
    a[3] = bp.x;   a[4] = bp.y;   a[5] = bp.z;
    s.line.geometry.attributes.position.needsUpdate = true;
    s.line.visible = state.showStrings;
    s.label.position.set(wpos.x, wpos.y + 0.15, wpos.z);
    s.label.visible = state.showStrings;
    s.mesh.visible = state.showStrings;
  }
}

/* ================= загрузка ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, function(gltf){
  window.__hud('модель получена');

  const model = gltf.scene;
  model.traverse(function(o){
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.82;
    }
  });
  scene.add(model);
  state.model = model;

  const skinned = [];
  model.traverse(function(o){ if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    helper.visible = false;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  const boneList = [];
  model.traverse(function(o){
    if (o.isBone){
      boneList.push(o);
      o.userData.restQuat = o.quaternion.clone();
      o.userData.restPos = o.position.clone();
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;

  buildVaga();
  buildStrings();
  updateAll();

  document.getElementById('load').classList.add('hidden');
  window.__hud('готов · тяни ручку ваги или нити');
  refreshUI();
}, undefined, function(err){
  window.__err('модель: ' + (err && err.message ? err.message : err));
  document.getElementById('load').textContent = 'ошибка загрузки';
});

/* ================= управление ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(x, y){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
}

function findHandleAt(x, y){
  setPointer(x, y);
  raycaster.setFromCamera(pointer, camera);

  if (state.vagaHandle && state.vagaHandle.visible){
    const hh = raycaster.intersectObject(state.vagaHandle, true);
    if (hh.length){
      let o = hh[0].object;
      while (o && !o.userData.isVagaHandle) o = o.parent;
      if (o) return { obj: o, mode: 'vaga' };
    }
  }

  const meshes = [];
  for (const s of state.strings) if (s.mesh.visible) meshes.push(s.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  if (hits.length){
    let obj = hits[0].object;
    while (obj && !obj.userData.isString) obj = obj.parent;
    if (obj) return { obj, mode: 'string' };
  }
  return null;
}

renderer.domElement.addEventListener('pointerdown', function(e){
  if (e.target !== renderer.domElement) return;
  const r = findHandleAt(e.clientX, e.clientY);
  state.pointerDown = {x: e.clientX, y: e.clientY, moved: false};

  if (r){
    state.dragging = r.obj;
    state.dragMode = r.mode;
    controls.enabled = false;

    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, r.obj.position);

    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(r.obj.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', function(e){
  if (state.pointerDown && !state.pointerDown.moved){
    const dx = e.clientX - state.pointerDown.x;
    const dy = e.clientY - state.pointerDown.y;
    if (dx*dx + dy*dy > 25) state.pointerDown.moved = true;
  }
  if (!state.dragging) return;

  setPointer(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(state.dragPlane, hit)) return;
  const newPos = hit.add(state.dragOffset);

  if (state.dragMode === 'vaga'){
    state.vagaCenter.copy(newPos);
  } else {
    const idx = state.dragging.userData.stringIdx;
    const s = state.strings[idx];
    if (s){
      const base = new THREE.Vector3().copy(state.vagaCenter).add(s.local);
      s.offset.subVectors(newPos, base);
    }
  }
  updateAll();
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    state.dragging = null;
    controls.enabled = true;
  }
  state.pointerDown = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= сброс ================= */
function resetAll(){
  state.vagaCenter.copy(VAGA_REST);
  for (const s of state.strings) s.offset.set(0, 0, 0);
  for (const b of state.boneList){
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    if (b.userData.restPos) b.position.copy(b.userData.restPos);
  }
  state.model.updateMatrixWorld(true);
  updateAll();
}

/* ================= UI ================= */
const ui = document.getElementById('ui');
function btn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

const btnStrings = btn('🪢 нити', function(){
  state.showStrings = !state.showStrings; updateAll(); refreshUI();
}, 'on');
const btnVaga = btn('✝ вага', function(){
  state.showVaga = !state.showVaga; updateAll(); refreshUI();
}, 'on');
const btnSkel = btn('🦴 скелет', function(){
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
});
const btnStrong = btn('💪 сильно', function(){
  K_STRENGTH = 1.1; updateAll(); refreshUI();
});
const btnSoft = btn('🪶 мягко', function(){
  K_STRENGTH = 0.5; updateAll(); refreshUI();
});

btn('⟲ сброс', resetAll, 'reset');
btn('🎥 вид', function(){
  camera.position.set(4.5, 2.8, 6.0);
  controls.target.set(0, 1.5, 0);
  controls.update();
});

function refreshUI(){
  btnStrings.classList.toggle('on', state.showStrings);
  btnVaga.classList.toggle('on', state.showVaga);
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnStrong.classList.toggle('on', K_STRENGTH === 1.1);
  btnSoft.classList.toggle('on', K_STRENGTH === 0.5);
}

/* ================= анимация ================= */
function animate(){
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', function(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
window.__hud('загружаю Xbot…');
animate();

} catch(e){
  window.__err('FATAL: ' + (e && e.message ? e.message : e) +
    '\n' + (e && e.stack ? e.stack : ''));
}
</script>
</body>
