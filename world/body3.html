<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>сакральная геометрия · связь тело↔тетра</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.6;
    font-family:ui-monospace,monospace;max-width:92%;pointer-events:none;white-space:pre;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:5px;
    display:flex;flex-wrap:wrap;gap:4px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.2));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:8px;
    padding:8px 10px;font-size:12px;touch-action:manipulation;font-weight:bold;}
  #ui button:active{background:#2a2a4a;}
  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;
    box-shadow:0 0 8px #a67cff88;}
  #ui button.breath{background:#1a3a1a;border-color:#4a6;}
  #ui button.breath.off{background:#3a1a1a;border-color:#a44;}
  #ui button.reset{background:#3a2a1a;border-color:#a86;color:#ffe;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
  #boneInfo{position:fixed;top:8px;right:8px;font-size:11px;background:rgba(40,20,60,.85);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.6;
    font-family:ui-monospace,monospace;color:#ddf;border:1px solid #a67cff;max-width:180px;}
</style>
</head>
<body>
<div id="load">загружаю тело…</div>
<div id="hud">готов</div>
<div id="boneInfo">привязки костей:
тапни ручку → кость по циклу</div>
<div id="ui"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 15, 50);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4, 2.8, 5.5);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1.2, 0);
controls.minDistance = 1;
controls.maxDistance = 25;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.6);
fill.position.set(-5, 3, -6);
scene.add(fill);

/* ================= сетка и оси ================= */
const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.5;
grid.material.transparent = true;
scene.add(grid);
const axes = new THREE.AxesHelper(1.5);
axes.position.y = 0.01;
scene.add(axes);

/* ================= состояние ================= */
const state = {
  model: null,
  skeletonHelper: null,
  bones: {},
  boneList: [],
  // геометрия
  upperTetra: null,
  lowerTetra: null,
  upperCircle: null,
  lowerCircle: null,
  sphereBelly: null,
  sphereHips: null,
  raysToBelly: [],
  handles: [],
  boneRays: [],
  markers: [],
  // флаги
  showSkeleton: true,
  showUpperTetra: true,
  showLowerTetra: true,
  showCircles: true,
  showSphereBelly: true,
  showSphereHips: true,
  showRaysBelly: true,
  showBoneRays: true,
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.5,
  baseRadius: 0.55,
  radiusRange: 0.3,
  // для drag ручек
  draggingHandle: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  // привязки
  boneOptions: ['none','leftarm','rightarm','leftforearm','rightforearm',
                'leftupleg','rightupleg','spine2','head','leftShoulder','rightShoulder'],
  boneIndex: [1, 2, 7, 8] // начальные: leftArm, rightArm, spine2, head
};

/* ================= загрузка Xbot ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.85;
    }
  });
  scene.add(model);
  state.model = model;

  // скелет
  const skinned = [];
  model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  // кости + сохранить restQuat
  const boneList = [];
  model.traverse(o => {
    if (o.isBone){
      boneList.push(o);
      o.userData.restQuat = o.quaternion.clone();
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;

  buildGeometry();
  document.getElementById('load').classList.add('hidden');
  hud('тело загружено · костей: ' + boneList.length);
  refreshUI();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'ошибка: ' + err.message;
});

/* ================= хелперы ================= */
function getBoneWorld(name){
  const b = state.bones[name];
  if (!b) return null;
  const v = new THREE.Vector3();
  b.getWorldPosition(v);
  return v;
}

function makeCircle(radius, y, color, cx = 0, cz = 0, segments = 80){
  const pts = [];
  for (let i = 0; i <= segments; i++){
    const a = i / segments * Math.PI * 2;
    pts.push(new THREE.Vector3(cx + Math.cos(a) * radius, y, cz + Math.sin(a) * radius));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.75
  }));
}

function makeTetraObj(color){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: 0.1,
    side: THREE.DoubleSide, emissive: color, emissiveIntensity: 0.25,
    depthWrite: false
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  group.add(new THREE.Mesh(geo, mat));

  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  group.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.9
  })));
  return group;
}

function makeLabel(text, color = '#88ccff'){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 32px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(0.7, 0.18, 1);
  return sp;
}

/* ================= стартовая сцена ================= */
function buildGeometry(){
  // стартовые позиции ручек
  const hips = getBoneWorld('hips') || new THREE.Vector3(0, 0.9, 0);
  const headTop = getBoneWorld('headtop_end') || new THREE.Vector3(0, 1.7, 0);
  const bodyHeight = headTop.distanceTo(hips);
  const baseR = bodyHeight * 0.65;

  // ===== 4 ручки =====
  // 0,1,2 — на полу треугольником вокруг тела
  // 3 — над головой
  const startPositions = [
    new THREE.Vector3(Math.cos(Math.PI/6)*baseR, 0.02, Math.sin(Math.PI/6)*baseR),
    new THREE.Vector3(Math.cos(Math.PI/6 + 2*Math.PI/3)*baseR, 0.02, Math.sin(Math.PI/6 + 2*Math.PI/3)*baseR),
    new THREE.Vector3(Math.cos(Math.PI/6 + 4*Math.PI/3)*baseR, 0.02, Math.sin(Math.PI/6 + 4*Math.PI/3)*baseR),
    new THREE.Vector3(0, bodyHeight * 1.35, 0)
  ];
  const handleColors = [0x88ff88, 0x88ff88, 0x88ff88, 0xffcc44];

  // очистка
  if (state.handles) {
    for (const h of state.handles){
      scene.remove(h.mesh); scene.remove(h.ray); scene.remove(h.label);
    }
  }
  state.handles = [];

  for (let i = 0; i < 4; i++){
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(i === 3 ? 0.16 : 0.13, 18, 14),
      new THREE.MeshStandardMaterial({
        color: handleColors[i],
        emissive: handleColors[i],
        emissiveIntensity: 0.7,
        transparent: true,
        opacity: 0.95
      })
    );
    mesh.position.copy(startPositions[i]);
    mesh.userData.isHandle = true;
    mesh.userData.handleIndex = i;
    mesh.renderOrder = 3;
    scene.add(mesh);

    // луч от ручки к её кости
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const ray = new THREE.Line(rg, new THREE.LineBasicMaterial({
      color: 0x88ccff, transparent: true, opacity: 0.85
    }));
    scene.add(ray);

    const label = makeLabel('', '#88ccff');
    scene.add(label);

    state.handles.push({
      index: i,
      mesh,
      ray,
      label,
      startPos: startPositions[i].clone()
    });
  }

  // ===== верхняя тетра =====
  if (state.upperTetra) scene.remove(state.upperTetra);
  state.upperTetra = makeTetraObj(0x66aaff);
  scene.add(state.upperTetra);

  // ===== нижняя тетра =====
  if (state.lowerTetra) scene.remove(state.lowerTetra);
  state.lowerTetra = makeTetraObj(0xdd66ff);
  scene.add(state.lowerTetra);

  // ===== два круга =====
  if (state.upperCircle) scene.remove(state.upperCircle);
  state.upperCircle = makeCircle(baseR * 1.3, 0.001, 0x88ddff);
  scene.add(state.upperCircle);

  if (state.lowerCircle) scene.remove(state.lowerCircle);
  state.lowerCircle = makeCircle(baseR * 1.3, bodyHeight * 1.35, 0xff99dd);
  scene.add(state.lowerCircle);

  // ===== два шара =====
  if (!state.sphereBelly){
    state.sphereBelly = new THREE.Mesh(
      new THREE.SphereGeometry(1, 32, 24),
      new THREE.MeshStandardMaterial({
        color: 0xffaa44, transparent: true, opacity: 0.28,
        emissive: 0xff6600, emissiveIntensity: 0.5, depthWrite: false
      })
    );
    scene.add(state.sphereBelly);
  }
  if (!state.sphereHips){
    state.sphereHips = new THREE.Mesh(
      new THREE.SphereGeometry(1, 32, 24),
      new THREE.MeshStandardMaterial({
        color: 0x44ff99, transparent: true, opacity: 0.18,
        emissive: 0x00aa55, emissiveIntensity: 0.4, depthWrite: false
      })
    );
    scene.add(state.sphereHips);
  }

  // ===== лучи от основания к животу =====
  for (const r of state.raysToBelly) scene.remove(r);
  state.raysToBelly = [];
  for (let i = 0; i < 4; i++){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: 0xff8844, transparent: true, opacity: 0.5
    }));
    state.raysToBelly.push(line);
    scene.add(line);
  }

  // маркеры якорей
  if (state.markers) state.markers.forEach(m => scene.remove(m));
  state.markers = [];
  const addMarker = (pos, color) => {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.035, 12, 10),
      new THREE.MeshBasicMaterial({color, depthTest: false})
    );
    m.position.copy(pos);
    m.renderOrder = 2;
    scene.add(m);
    state.markers.push(m);
  };
  addMarker(hips, 0x00ff88);
  addMarker(headTop, 0xff4488);
}

/* ================= поворот кости к цели ================= */
function aimBoneTo(bone, targetWorldPos){
  if (!bone || !targetWorldPos) return;

  // сбросить к rest
  if (bone.userData.restQuat){
    bone.quaternion.copy(bone.userData.restQuat);
    bone.updateMatrixWorld(true);
  }

  const boneWorldQuat = new THREE.Quaternion();
  bone.getWorldQuaternion(boneWorldQuat);
  const boneWorldPos = new THREE.Vector3();
  bone.getWorldPosition(boneWorldPos);

  // направление кости в rest (обычно Y)
  const restDir = new THREE.Vector3(0, 1, 0);
  const currentDir = restDir.clone().applyQuaternion(boneWorldQuat).normalize();

  const targetDir = targetWorldPos.clone().sub(boneWorldPos);
  if (targetDir.lengthSq() < 1e-6) return;
  targetDir.normalize();

  const deltaQ = new THREE.Quaternion().setFromUnitVectors(currentDir, targetDir);
  const newWorldQuat = deltaQ.multiply(boneWorldQuat);

  const parentWorldQuat = new THREE.Quaternion();
  bone.parent.getWorldQuaternion(parentWorldQuat);
  const parentInv = parentWorldQuat.clone().invert();

  bone.quaternion.copy(parentInv.multiply(newWorldQuat));
  bone.updateMatrixWorld(true);
}

function resetAllBones(){
  for (const b of state.boneList){
    if (b.userData.restQuat){
      b.quaternion.copy(b.userData.restQuat);
      b.updateMatrixWorld(true);
    }
  }
  hud('кости сброшены в rest');
}

/* ================= обновление геометрии каждый кадр ================= */
function updateGeometry(){
  if (!state.model || state.handles.length < 4) return;

  const hips = getBoneWorld('hips') || getBoneWorld('pelvis');
  const headTop = getBoneWorld('headtop_end') || getBoneWorld('head');
  const spine2 = getBoneWorld('spine2') || getBoneWorld('spine1');
  const lFoot = getBoneWorld('leftfoot') || getBoneWorld('lefttoebase');
  const rFoot = getBoneWorld('rightfoot') || getBoneWorld('righttoebase');
  if (!hips || !headTop) return;

  const belly = spine2
    ? hips.clone().lerp(spine2, 0.6)
    : hips.clone().lerp(headTop, 0.5);

  const feet = (lFoot && rFoot)
    ? lFoot.clone().add(rFoot).multiplyScalar(0.5)
    : new THREE.Vector3(hips.x, 0, hips.z);

  /* ===== 1. обновить кости от ручек ===== */
  for (let i = 0; i < 4; i++){
    const h = state.handles[i];
    const boneIdx = state.boneIndex[i];
    const boneName = state.boneOptions[boneIdx];
    if (boneName !== 'none'){
      const bone = state.bones[boneName];
      if (bone){
        aimBoneTo(bone, h.mesh.position);
      }
    }
  }

  /* ===== 2. пересчитать якоря костей после вращения ===== */
  const newHips = getBoneWorld('hips') || hips;
  const newHeadTop = getBoneWorld('headtop_end') || headTop;
  const newSpine2 = getBoneWorld('spine2') || spine2;
  const newBelly = newSpine2
    ? newHips.clone().lerp(newSpine2, 0.6)
    : newHips.clone().lerp(newHeadTop, 0.5);

  /* ===== 3. тетраэдр ===== */
  const basePts = [
    state.handles[0].mesh.position,
    state.handles[1].mesh.position,
    state.handles[2].mesh.position
  ];
  const apex = state.handles[3].mesh.position;

  // центр основания
  const cx = (basePts[0].x + basePts[1].x + basePts[2].x) / 3;
  const cz = (basePts[0].z + basePts[1].z + basePts[2].z) / 3;
  const cy = (basePts[0].y + basePts[1].y + basePts[2].y) / 3;

  // средний радиус от центра к вершинам
  let avgR = 0;
  for (const p of basePts){
    avgR += Math.hypot(p.x - cx, p.z - cz);
  }
  avgR /= 3;

  // верхняя тетра
  if (state.upperTetra){
    rebuildTetra(state.upperTetra, basePts, apex);
  }

  // нижняя тетра — зеркало по горизонтали, вершина внизу
  const lowerBasePts = basePts.map(p => new THREE.Vector3(p.x, apex.y, p.z));
  const lowerApex = new THREE.Vector3(cx, cy, cz);
  if (state.lowerTetra){
    rebuildTetra(state.lowerTetra, lowerBasePts, lowerApex);
  }

  // ===== 4. круги (больше тетраэдра в 1.3×) =====
  const circleR = avgR * 1.3;
  if (state.upperCircle){
    rebuildCircle(state.upperCircle, circleR, cy, cx, cz);
  }
  if (state.lowerCircle){
    rebuildCircle(state.lowerCircle, circleR, apex.y, cx, cz);
  }

  // ===== 5. шары =====
  // шар 1: живот — дышит
  let rBelly = state.baseRadius;
  if (state.breathing) rBelly += Math.sin(state.breathPhase) * state.radiusRange;
  state.sphereBelly.position.copy(newBelly);
  state.sphereBelly.scale.setScalar(rBelly);

  // шар 2: копчик → ноги
  const rHips = newHips.distanceTo(feet);
  state.sphereHips.position.copy(newHips);
  state.sphereHips.scale.setScalar(Math.max(rHips, 0.1));

  // ===== 6. лучи: от ручек к животу =====
  for (let i = 0; i < 4; i++){
    const line = state.raysToBelly[i];
    const h = state.handles[i].mesh.position;
    const arr = line.geometry.attributes.position.array;
    arr[0] = h.x; arr[1] = h.y; arr[2] = h.z;
    arr[3] = newBelly.x; arr[4] = newBelly.y; arr[5] = newBelly.z;
    line.geometry.attributes.position.needsUpdate = true;
  }

  // ===== 7. лучи: от ручек к костям =====
  for (let i = 0; i < 4; i++){
    const h = state.handles[i];
    const boneIdx = state.boneIndex[i];
    const boneName = state.boneOptions[boneIdx];
    let targetPos = null;
    if (boneName !== 'none'){
      const bone = state.bones[boneName];
      if (bone){
        targetPos = new THREE.Vector3();
        bone.getWorldPosition(targetPos);
      }
    }
    const arr = h.ray.geometry.attributes.position.array;
    if (targetPos){
      const hp = h.mesh.position;
      arr[0] = hp.x; arr[1] = hp.y; arr[2] = hp.z;
      arr[3] = targetPos.x; arr[4] = targetPos.y; arr[5] = targetPos.z;
      h.ray.visible = state.showBoneRays;
      // label
      h.label.position.copy(hp).add(new THREE.Vector3(0, 0.25, 0));
      h.label.visible = true;
    } else {
      h.ray.visible = false;
      h.label.visible = false;
    }
    h.ray.geometry.attributes.position.needsUpdate = true;
  }

  // ===== 8. маркеры =====
  if (state.markers.length >= 2){
    state.markers[0].position.copy(newHips);
    state.markers[1].position.copy(newHeadTop);
  }
}

function rebuildTetra(group, basePts, apex){
  if (!group) return;
  const verts = [...basePts, apex];
  const faces = [[0,1,2],[0,1,3],[1,2,3],[2,0,3]];
  const pos = [];
  for (const f of faces){
    for (const i of f) pos.push(verts[i].x, verts[i].y, verts[i].z);
  }
  const mesh = group.children[0];
  if (mesh && mesh.geometry){
    mesh.geometry.setAttribute('position',
      new THREE.Float32BufferAttribute(pos, 3));
    mesh.geometry.computeVertexNormals();
  }
  const edges = [[0,1],[1,2],[2,0],[0,3],[1,3],[2,3]];
  const ep = [];
  for (const [a,b] of edges){
    ep.push(verts[a].x, verts[a].y, verts[a].z);
    ep.push(verts[b].x, verts[b].y, verts[b].z);
  }
  const edgeMesh = group.children[1];
  if (edgeMesh && edgeMesh.geometry){
    edgeMesh.geometry.setAttribute('position',
      new THREE.Float32BufferAttribute(ep, 3));
  }
}

function rebuildCircle(line, radius, y, cx, cz){
  if (!line) return;
  const pts = [];
  const seg = 80;
  for (let i = 0; i <= seg; i++){
    const a = i / seg * Math.PI * 2;
    pts.push(new THREE.Vector3(cx + Math.cos(a) * radius, y, cz + Math.sin(a) * radius));
  }
  line.geometry.setFromPoints(pts);
}

/* ================= drag ручек ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownInfo = null;

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function findHandleAt(clientX, clientY){
  setPointer({clientX, clientY});
  raycaster.setFromCamera(pointer, camera);
  const meshes = state.handles.map(h => h.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (!hits.length) return null;
  return state.handles.find(h => h.mesh === hits[0].object);
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const h = findHandleAt(e.clientX, e.clientY);
  if (h){
    state.draggingHandle = h;
    controls.enabled = false;
    // плоскость, перпендикулярная камере, через ручку
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, h.mesh.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(h.mesh.position, hit);
    pointerDownInfo = {x: e.clientX, y: e.clientY, moved: false, handleIdx: h.index};
    e.preventDefault();
  } else {
    pointerDownInfo = {x: e.clientX, y: e.clientY, moved: false, handleIdx: -1};
  }
}, true);

renderer.domElement.addEventListener('pointermove', e => {
  if (pointerDownInfo && !pointerDownInfo.moved){
    const dx = e.clientX - pointerDownInfo.x, dy = e.clientY - pointerDownInfo.y;
    if (dx*dx + dy*dy > 25) pointerDownInfo.moved = true;
  }
  if (!state.draggingHandle) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(state.dragPlane, hit)){
    state.draggingHandle.mesh.position.copy(hit.add(state.dragOffset));
  }
  e.preventDefault();
}, {passive:false});

function endDrag(e){
  if (state.draggingHandle){
    // если не двигали — считаем это тапом: переключить кость
    if (pointerDownInfo && !pointerDownInfo.moved){
      const idx = state.draggingHandle.index;
      state.boneIndex[idx] = (state.boneIndex[idx] + 1) % state.boneOptions.length;
      const name = state.boneOptions[state.boneIndex[idx]];
      updateBoneInfo();
      hud('ручка ' + idx + ' → ' + name);
    }
    state.draggingHandle = null;
    controls.enabled = true;
  }
  pointerDownInfo = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= UI ================= */
const ui = document.getElementById('ui');
function btn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

let btnSkel, btnUp, btnLow, btnCircle, btnBel, btnHips, btnRaysBelly, btnRaysBone, btnBreath;

btnSkel = btn('🦴 скелет', () => {
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
}, 'on');

btnUp = btn('▲ верх', () => {
  state.showUpperTetra = !state.showUpperTetra;
  if (state.upperTetra) state.upperTetra.visible = state.showUpperTetra;
  refreshUI();
}, 'on');

btnLow = btn('▼ низ', () => {
  state.showLowerTetra = !state.showLowerTetra;
  if (state.lowerTetra) state.lowerTetra.visible = state.showLowerTetra;
  refreshUI();
}, 'on');

btnCircle = btn('◯ круги', () => {
  state.showCircles = !state.showCircles;
  if (state.upperCircle) state.upperCircle.visible = state.showCircles;
  if (state.lowerCircle) state.lowerCircle.visible = state.showCircles;
  refreshUI();
}, 'on');

btnBel = btn('🟠 живот', () => {
  state.showSphereBelly = !state.showSphereBelly;
  if (state.sphereBelly) state.sphereBelly.visible = state.showSphereBelly;
  refreshUI();
}, 'on');

btnHips = btn('🟢 копчик', () => {
  state.showSphereHips = !state.showSphereHips;
  if (state.sphereHips) state.sphereHips.visible = state.showSphereHips;
  refreshUI();
}, 'on');

btnRaysBelly = btn('📡 к телу', () => {
  state.showRaysBelly = !state.showRaysBelly;
  for (const r of state.raysToBelly) r.visible = state.showRaysBelly;
  refreshUI();
}, 'on');

btnRaysBone = btn('🧲 к костям', () => {
  state.showBoneRays = !state.showBoneRays;
  refreshUI();
}, 'on');

btnBreath = btn('🌬 дыхание', () => {
  state.breathing = !state.breathing;
  refreshUI();
}, 'breath');

btn('⟲ кости', resetAllBones, 'reset');

btn('⟲ ручки', () => {
  for (const h of state.handles){
    h.mesh.position.copy(h.startPos);
  }
  resetAllBones();
  hud('ручки и кости в исходное');
}, 'reset');

btn('🎥 вид', () => {
  camera.position.set(4, 2.8, 5.5);
  controls.target.set(0, 1.2, 0);
  controls.update();
});

function refreshUI(){
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnUp.classList.toggle('on', state.showUpperTetra);
  btnLow.classList.toggle('on', state.showLowerTetra);
  btnCircle.classList.toggle('on', state.showCircles);
  btnBel.classList.toggle('on', state.showSphereBelly);
  btnHips.classList.toggle('on', state.showSphereHips);
  btnRaysBelly.classList.toggle('on', state.showRaysBelly);
  btnRaysBone.classList.toggle('on', state.showBoneRays);
  btnBreath.classList.toggle('off', state.breathing);
  btnBreath.textContent = state.breathing ? '⏸ дыхание' : '🌬 дыхание';
}

/* ================= HUD ================= */
const hudEl = document.getElementById('hud');
function hud(msg){
  hudEl.textContent = msg;
  updateBoneInfo();
}

const boneInfoEl = document.getElementById('boneInfo');
function updateBoneInfo(){
  const lines = ['привязки:'];
  const names = ['◀','▶','◀','▲'];
  for (let i = 0; i < 4; i++){
    const bone = state.boneOptions[state.boneIndex[i]];
    lines.push(`${names[i]} р${i} → ${bone}`);
  }
  boneInfoEl.textContent = lines.join('\n');
}

/* ================= анимация ================= */
const clock = new THREE.Clock();

function animate(){
  const dt = clock.getDelta();

  if (state.breathing){
    state.breathPhase += dt * state.breathSpeed * Math.PI * 2;
  }

  updateGeometry();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
updateBoneInfo();
hud('готов · тащи зелёные ручки · тап по ручке → переключить кость');
animate();
</script>
</body>
</html>
