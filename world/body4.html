<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>меркаба · тело</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.6;
    font-family:ui-monospace,monospace;max-width:80%;pointer-events:none;white-space:pre;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:5px;
    display:flex;flex-wrap:wrap;gap:4px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.94), rgba(0,0,0,.2));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:8px;
    padding:8px 10px;font-size:12px;touch-action:manipulation;font-weight:bold;}
  #ui button:active{background:#2a2a4a;}
  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;
    box-shadow:0 0 8px #a67cff88;}
  #ui button.breath{background:#1a3a1a;border-color:#4a6;}
  #ui button.breath.off{background:#3a1a1a;border-color:#a44;}
  #ui button.reset{background:#3a2a1a;border-color:#a86;color:#ffe;}

  #spherePanel{position:fixed;top:8px;right:8px;z-index:10;
    background:rgba(10,10,20,.94);border:1px solid #66aaff;border-radius:10px;
    padding:8px 10px;font-size:11px;color:#cce;
    font-family:ui-monospace,monospace;display:flex;flex-direction:column;gap:6px;
    min-width:170px;}
  #spherePanel label{font-size:10px;color:#89c;}
  #spherePanel .val{text-align:right;font-weight:bold;color:#8cf;}
  #spherePanel input[type=range]{width:100%;accent-color:#66aaff;}
  #spherePanel .info{font-size:9px;color:#667;}

  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">загружаю тело…</div>
<div id="hud">готов</div>

<div id="spherePanel">
  <label>радиус шара</label>
  <input type="range" id="sphereSlider" min="0.05" max="0.6" step="0.01" value="0.25">
  <div><span class="val" id="sphereVal">0.25</span> м · <span class="info" id="stateInfo">правильная</span></div>
</div>

<div id="ui"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 15, 50);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.5, 1.8, 3.5);
camera.lookAt(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1.0, 0);
controls.minDistance = 0.5;
controls.maxDistance = 15;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.6);
fill.position.set(-5, 3, -6);
scene.add(fill);

/* ================= сетка и оси ================= */
const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.5;
grid.material.transparent = true;
scene.add(grid);
const axes = new THREE.AxesHelper(1.2);
axes.position.y = 0.01;
scene.add(axes);

/* ================= состояние ================= */
const state = {
  model: null,
  skeletonHelper: null,
  bones: {},
  boneList: [],
  // merkaba
  handleGroup: null,
  upperTetra: null,
  lowerTetra: null,
  sphereUpper: null,
  sphereLower: null,
  handles: [], // 8 мешей-ручек, индекс 0-3 верх, 4-7 низ
  sphereRadius: 0.25,
  isRegular: true,
  center: new THREE.Vector3(0, 1.05, 0),
  // флаги
  showSkeleton: true,
  showMerkaba: true,
  showSpheres: true,
  showEdges: true,
  showFaces: true,
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.5,
  breathAmp: 0.08,
  // drag
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDownInfo: null
};

/* ================= загрузка Xbot ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.82;
    }
  });
  scene.add(model);
  state.model = model;

  // скелет
  const skinned = [];
  model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  // кости
  const boneList = [];
  model.traverse(o => {
    if (o.isBone){
      boneList.push(o);
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;

  // центр меркабы — живот
  const hips = getBoneWorld('hips') || new THREE.Vector3(0, 0.9, 0);
  const spine2 = getBoneWorld('spine2') || getBoneWorld('spine1');
  state.center = spine2
    ? hips.clone().lerp(spine2, 0.6)
    : new THREE.Vector3(hips.x, hips.y + 0.2, hips.z);

  buildMerkaba();
  document.getElementById('load').classList.add('hidden');
  hud('меркаба готова · тащи вершины · крути радиус');
  refreshUI();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'ошибка: ' + err.message;
});

/* ================= хелперы ================= */
function getBoneWorld(name){
  const b = state.bones[name];
  if (!b) return null;
  const v = new THREE.Vector3();
  b.getWorldPosition(v);
  return v;
}

/* Правильная меркаба: 8 вершин на сфере радиуса 3r (circumradius)
   в тетраэдральных направлениях.
   k = √3 · r — множитель для координат (±1,±1,±1).
*/
function regularMerkabaPositions(center, r){
  const k = Math.sqrt(3) * r;
  return [
    // верхняя тетра (4 вершины)
    center.clone().add(new THREE.Vector3( k,  k,  k)),  // 0 — apex вверх
    center.clone().add(new THREE.Vector3( k, -k, -k)),  // 1
    center.clone().add(new THREE.Vector3(-k,  k, -k)),  // 2
    center.clone().add(new THREE.Vector3(-k, -k,  k)),  // 3
    // нижняя тетра (4 вершины)
    center.clone().add(new THREE.Vector3(-k, -k, -k)),  // 4 — apex вниз
    center.clone().add(new THREE.Vector3(-k,  k,  k)),  // 5
    center.clone().add(new THREE.Vector3( k, -k,  k)),  // 6
    center.clone().add(new THREE.Vector3( k,  k, -k))   // 7
  ];
}

/* ================= меркаба ================= */
function buildMerkaba(){
  // группа
  state.handleGroup = new THREE.Group();
  scene.add(state.handleGroup);

  // ===== 8 ручек =====
  const colors = [0xffcc44, 0x88ff88, 0x88ff88, 0x88ff88,
                  0xff88dd, 0xcc88ff, 0xcc88ff, 0xcc88ff];
  const positions = regularMerkabaPositions(state.center, state.sphereRadius);

  for (let i = 0; i < 8; i++){
    const isApex = (i === 0 || i === 4);
    const size = isApex ? 0.075 : 0.06;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(size, 20, 16),
      new THREE.MeshStandardMaterial({
        color: colors[i],
        emissive: colors[i],
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.95
      })
    );
    mesh.position.copy(positions[i]);
    mesh.userData.isHandle = true;
    mesh.userData.handleIndex = i;
    mesh.renderOrder = 3;
    state.handleGroup.add(mesh);
    state.handles.push(mesh);
  }

  // ===== верхняя тетра: 4 грани + рёбра =====
  state.upperTetra = makeTetraMesh(0x66aaff);
  scene.add(state.upperTetra.group);

  // ===== нижняя тетра =====
  state.lowerTetra = makeTetraMesh(0xff77cc);
  scene.add(state.lowerTetra.group);

  // ===== два шара =====
  state.sphereUpper = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 24),
    new THREE.MeshStandardMaterial({
      color: 0xffaa44,
      transparent: true,
      opacity: 0.16,
      emissive: 0xff6600,
      emissiveIntensity: 0.5,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  scene.add(state.sphereUpper);

  state.sphereLower = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 18),
    new THREE.MeshBasicMaterial({
      color: 0xcc88ff,
      transparent: true,
      opacity: 0.35,
      wireframe: true,
      depthWrite: false
    })
  );
  scene.add(state.sphereLower);

  updateMerkaba();
}

function makeTetraMesh(color){
  const group = new THREE.Group();

  // грани (4 треугольника)
  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  faceGeo.setIndex([0,1,2, 0,2,3, 0,3,1, 1,3,2]);
  const faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    color,
    transparent: true,
    opacity: 0.10,
    side: THREE.DoubleSide,
    emissive: color,
    emissiveIntensity: 0.3,
    depthWrite: false
  }));
  group.add(faceMesh);

  // рёбра (6 рёбер × 2 вершины × 3 координаты = 36)
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 0.9,
    linewidth: 2
  }));
  group.add(edgeLines);

  return { group, faceMesh, edgeLines };
}

/* Обновить всю геометрию меркабы из текущих позиций ручек */
function updateMerkaba(){
  if (!state.upperTetra || state.handles.length < 8) return;

  // собираем позиции
  const pos = state.handles.map(h => h.position);

  // верхняя тетра: индексы 0,1,2,3
  updateTetra(state.upperTetra, pos[0], pos[1], pos[2], pos[3]);
  // нижняя тетра: индексы 4,5,6,7
  updateTetra(state.lowerTetra, pos[4], pos[5], pos[6], pos[7]);

  // шары — в центре (среднее всех 8)
  const c = new THREE.Vector3();
  for (const p of pos) c.add(p);
  c.multiplyScalar(1/8);

  // дышащий радиус
  let r = state.sphereRadius;
  if (state.breathing){
    r += Math.sin(state.breathPhase) * state.breathAmp;
  }

  state.sphereUpper.position.copy(c);
  state.sphereUpper.scale.setScalar(r);

  state.sphereLower.position.copy(c);
  state.sphereLower.scale.setScalar(r);

  // видимость
  state.upperTetra.faceMesh.visible = state.showFaces;
  state.upperTetra.edgeLines.visible = state.showEdges;
  state.lowerTetra.faceMesh.visible = state.showFaces;
  state.lowerTetra.edgeLines.visible = state.showEdges;
  state.upperTetra.group.visible = state.showMerkaba;
  state.lowerTetra.group.visible = state.showMerkaba;
  state.sphereUpper.visible = state.showSpheres && state.showMerkaba;
  state.sphereLower.visible = state.showSpheres && state.showMerkaba;
}

function updateTetra(t, v0, v1, v2, v3){
  // грани: треугольники [v0,v1,v2], [v0,v2,v3], [v0,v3,v1], [v1,v3,v2]
  const faces = [
    [v0, v1, v2], [v0, v2, v3], [v0, v3, v1], [v1, v3, v2]
  ];
  const pos = [];
  for (const f of faces){
    for (const v of f){
      pos.push(v.x, v.y, v.z);
    }
  }
  t.faceMesh.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(pos, 3));
  t.faceMesh.geometry.computeVertexNormals();
  t.faceMesh.geometry.computeBoundingSphere();

  // рёбра: 6 рёбер
  const edges = [
    [v0,v1],[v1,v2],[v2,v0], // базовое кольцо
    [v0,v3],[v1,v3],[v2,v3]  // от вершины
  ];
  const ep = [];
  for (const [a,b] of edges){
    ep.push(a.x,a.y,a.z, b.x,b.y,b.z);
  }
  t.edgeLines.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(ep, 3));
  t.edgeLines.geometry.computeBoundingSphere();
}

/* Сбросить меркабу к правильной при текущем радиусе */
function resetToRegular(){
  const positions = regularMerkabaPositions(state.center, state.sphereRadius);
  for (let i = 0; i < 8; i++){
    state.handles[i].position.copy(positions[i]);
  }
  state.isRegular = true;
  updateMerkaba();
  updateStateInfo();
}

/* Слайдер радиуса: если правильная — пересчитать вершины,
   иначе просто изменить шар */
const slider = document.getElementById('sphereSlider');
const sphereValEl = document.getElementById('sphereVal');
const stateInfoEl = document.getElementById('stateInfo');

function onRadiusChange(){
  state.sphereRadius = parseFloat(slider.value);
  sphereValEl.textContent = state.sphereRadius.toFixed(2);
  if (state.isRegular){
    // пересчитать позиции ручек
    const positions = regularMerkabaPositions(state.center, state.sphereRadius);
    for (let i = 0; i < 8; i++){
      state.handles[i].position.copy(positions[i]);
    }
  }
  updateMerkaba();
}
slider.addEventListener('input', onRadiusChange);

function updateStateInfo(){
  stateInfoEl.textContent = state.isRegular ? 'правильная' : 'изменена';
  stateInfoEl.style.color = state.isRegular ? '#6f8' : '#f86';
}

/* ================= drag ручек ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function findHandleAt(clientX, clientY){
  setPointer({clientX, clientY});
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.handles, false);
  return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const h = findHandleAt(e.clientX, e.clientY);

  pointerDownInfo = {x: e.clientX, y: e.clientY, moved: false};

  if (h){
    state.dragging = h;
    controls.enabled = false;
    // плоскость перпендикулярно камере, проходящая через ручку
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, h.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(h.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', e => {
  if (pointerDownInfo && !pointerDownInfo.moved){
    const dx = e.clientX - pointerDownInfo.x, dy = e.clientY - pointerDownInfo.y;
    if (dx*dx + dy*dy > 25) pointerDownInfo.moved = true;
  }
  if (!state.dragging) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(state.dragPlane, hit)){
    state.dragging.position.copy(hit.add(state.dragOffset));
    state.isRegular = false;
    updateStateInfo();
    updateMerkaba();
  }
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    state.dragging = null;
    controls.enabled = true;
    updateStateInfo();
  }
  pointerDownInfo = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= UI ================= */
const ui = document.getElementById('ui');
function btn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

let btnSkel, btnMerk, btnSph, btnEdges, btnFaces, btnBreath;

btnSkel = btn('🦴 скелет', () => {
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
}, 'on');

btnMerk = btn('🔷 меркаба', () => {
  state.showMerkaba = !state.showMerkaba;
  updateMerkaba();
  refreshUI();
}, 'on');

btnSph = btn('⚪ шары', () => {
  state.showSpheres = !state.showSpheres;
  updateMerkaba();
  refreshUI();
}, 'on');

btnFaces = btn('🔹 грани', () => {
  state.showFaces = !state.showFaces;
  updateMerkaba();
  refreshUI();
}, 'on');

btnEdges = btn('📐 рёбра', () => {
  state.showEdges = !state.showEdges;
  updateMerkaba();
  refreshUI();
}, 'on');

btnBreath = btn('🌬 дыхание', () => {
  state.breathing = !state.breathing;
  refreshUI();
}, 'breath');

btn('⟲ правильно', resetToRegular, 'reset');

btn('🎥 вид', () => {
  camera.position.set(2.5, 1.8, 3.5);
  controls.target.set(0, 1.0, 0);
  controls.update();
});

function refreshUI(){
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnMerk.classList.toggle('on', state.showMerkaba);
  btnSph.classList.toggle('on', state.showSpheres);
  btnFaces.classList.toggle('on', state.showFaces);
  btnEdges.classList.toggle('on', state.showEdges);
  btnBreath.classList.toggle('off', state.breathing);
  btnBreath.textContent = state.breathing ? '⏸ дыхание' : '🌬 дыхание';
}

/* ================= HUD ================= */
const hudEl = document.getElementById('hud');
function hud(msg){
  hudEl.textContent = msg;
}

/* ================= анимация ================= */
const clock = new THREE.Clock();

function animate(){
  const dt = clock.getDelta();

  if (state.breathing){
    state.breathPhase += dt * state.breathSpeed * Math.PI * 2;
    updateMerkaba();
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

updateStateInfo();
refreshUI();
hud('меркаба · тащи вершины · крути радиус');
animate();
</script>
</body>
</html>
