<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>меркаба · вписанная сфера</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.6;
    font-family:ui-monospace,monospace;max-width:70%;pointer-events:none;white-space:pre;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:5px;
    display:flex;flex-wrap:wrap;gap:4px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.94), rgba(0,0,0,.2));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:8px;
    padding:8px 10px;font-size:12px;touch-action:manipulation;font-weight:bold;}
  #ui button:active{background:#2a2a4a;}
  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;
    box-shadow:0 0 8px #a67cff88;}
  #ui button.reset{background:#3a2a1a;border-color:#a86;color:#ffe;}
  #ui button.breath{background:#1a3a1a;border-color:#4a6;}
  #ui button.breath.off{background:#3a1a1a;border-color:#a44;}

  #panel{position:fixed;top:8px;right:8px;z-index:10;
    background:rgba(10,10,20,.94);border:1px solid #66aaff;border-radius:10px;
    padding:10px 12px;font-size:11px;color:#cce;
    font-family:ui-monospace,monospace;display:flex;flex-direction:column;gap:8px;
    min-width:180px;}
  #panel label{font-size:10px;color:#89c;letter-spacing:.5px;}
  #panel .val{color:#8cf;font-weight:bold;}
  #panel .row{display:flex;justify-content:space-between;align-items:baseline;}
  #panel input[type=range]{width:100%;accent-color:#66aaff;}
  #panel .math{font-size:9px;color:#567;line-height:1.5;margin-top:2px;}
  #panel .state{padding:3px 6px;border-radius:5px;font-size:10px;
    background:#1a3a1a;color:#8f8;text-align:center;}
  #panel .state.deformed{background:#3a1a1a;color:#f88;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">загружаю тело…</div>
<div id="hud">готов</div>

<div id="panel">
  <label>ВПИСАННАЯ СФЕРА · r</label>
  <input type="range" id="radiusSlider" min="0.15" max="0.5" step="0.01" value="0.3">
  <div class="row"><span>радиус</span><span class="val" id="rVal">0.30 м</span></div>
  <div class="row"><span>ребро тетры</span><span class="val" id="edgeVal">1.47 м</span></div>
  <div class="row"><span>высота</span><span class="val" id="hVal">1.20 м</span></div>
  <div class="state" id="stateInfo">правильная</div>
  <div class="math">r = a√6/12 · a = 2√6·r · h = 4r<br>основание верхней — на полу</div>
</div>

<div id="ui"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 10, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.2, 1.4, 2.8);
camera.lookAt(0, 0.7, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 0.7, 0);
controls.minDistance = 0.5;
controls.maxDistance = 12;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(4, 7, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.7);
fill.position.set(-4, 2, -5);
scene.add(fill);

/* ================= сетка и оси ================= */
const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.55;
grid.material.transparent = true;
scene.add(grid);
const axes = new THREE.AxesHelper(1.0);
axes.position.y = 0.002;
scene.add(axes);

/* ================= состояние ================= */
const state = {
  model: null,
  skeletonHelper: null,
  bones: {},
  boneList: [],
  // меркаба
  r: 0.30,
  sphere: null,
  upperTetra: null,
  lowerTetra: null,
  handles: [], // 8 ручек
  idealUpper: [], // идеальные позиции (для ресета)
  idealLower: [],
  isRegular: true,
  // флаги
  showSkeleton: true,
  showMerkaba: true,
  showSphere: true,
  showFaces: true,
  showEdges: true,
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.4,
  breathAmp: 0.035, // ±3.5 см
  // drag
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDownInfo: null
};

/* ================= математика меркабы ================= */
// Правильная меркаба:
//   - 2 тетраэдра, вписанные в одну сферу радиуса r
//   - r = inradius тетраэдра
//   - ребро a = 12r/√6 = 2√6·r
//   - высота h = 4r
//   - circumradius R = 3r
//   - base circumradius Rb = 2√2·r
//   - верхняя: основание на y=0, вершина на y=4r
//   - нижняя: вершина на y=-2r, основание на y=2r
//   - центр сферы: (0, r, 0) — касается земли снизу
//   - основания повёрнуты на 60°

function computeIdeal(r){
  const Rb = 2 * Math.sqrt(2) * r;
  const h = 4 * r;

  // верхняя тетра: apex вверху, base на y=0
  const upper = [];
  upper.push(new THREE.Vector3(0, h, 0)); // apex
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 - Math.PI / 2;
    upper.push(new THREE.Vector3(
      Math.cos(a) * Rb, 0, Math.sin(a) * Rb
    ));
  }

  // нижняя тетра: apex внизу, base на y=2r
  const lower = [];
  lower.push(new THREE.Vector3(0, -2 * r, 0)); // apex (вниз)
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 - Math.PI / 2 + Math.PI / 3; // +60°
    lower.push(new THREE.Vector3(
      Math.cos(a) * Rb, 2 * r, Math.sin(a) * Rb
    ));
  }

  return { upper, lower, center: new THREE.Vector3(0, r, 0) };
}

/* ================= меркаба ================= */
function buildMerkaba(){
  const { upper, lower, center } = computeIdeal(state.r);
  state.idealUpper = upper.map(v => v.clone());
  state.idealLower = lower.map(v => v.clone());

  // ===== 8 ручек =====
  for (let i = 0; i < 8; i++){
    const isUpper = i < 4;
    const isApex = (i === 0 || i === 4);
    const pos = isUpper ? upper[i] : lower[i - 4];

    let col;
    if (i === 0) col = 0xffcc44;        // верх apex
    else if (i < 4) col = 0x88ff88;     // верх base
    else if (i === 4) col = 0xff66aa;   // низ apex
    else col = 0xcc88ff;                // низ base

    const size = isApex ? 0.07 : 0.055;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(size, 20, 16),
      new THREE.MeshStandardMaterial({
        color: col, emissive: col, emissiveIntensity: 0.9,
        transparent: true, opacity: 0.95
      })
    );
    mesh.position.copy(pos);
    mesh.userData.isHandle = true;
    mesh.userData.handleIndex = i;
    mesh.renderOrder = 3;
    scene.add(mesh);
    state.handles.push(mesh);
  }

  // ===== верхняя тетра =====
  state.upperTetra = makeTetraObj(0x66aaff);
  scene.add(state.upperTetra.group);

  // ===== нижняя тетра =====
  state.lowerTetra = makeTetraObj(0xff77cc);
  scene.add(state.lowerTetra.group);

  // ===== вписанная сфера =====
  state.sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({
      color: 0xffaa44,
      transparent: true,
      opacity: 0.22,
      emissive: 0xff6600,
      emissiveIntensity: 0.6,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  scene.add(state.sphere);

  // проволочная сфера поверх
  state.sphereWire = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({
      color: 0xffdd88, transparent: true, opacity: 0.25,
      wireframe: true, depthWrite: false
    })
  );
  scene.add(state.sphereWire);

  updateAll();
}

function makeTetraObj(color){
  const group = new THREE.Group();

  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  faceGeo.setIndex([0,1,2, 0,2,3, 0,3,1, 1,3,2]);
  const faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: 0.12,
    side: THREE.DoubleSide, emissive: color, emissiveIntensity: 0.3,
    depthWrite: false
  }));
  group.add(faceMesh);

  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.95
  }));
  group.add(edgeLines);

  return { group, faceMesh, edgeLines };
}

function updateTetraMesh(t, verts){
  // verts = [v0(apex), v1, v2, v3]
  const pos = [];
  const faces = [[0,1,2],[0,2,3],[0,3,1],[1,2,3]];
  for (const f of faces){
    for (const i of f){
      pos.push(verts[i].x, verts[i].y, verts[i].z);
    }
  }
  t.faceMesh.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(pos, 3));
  t.faceMesh.geometry.computeVertexNormals();

  const edges = [[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]];
  const ep = [];
  for (const [a,b] of edges){
    ep.push(verts[a].x, verts[a].y, verts[a].z);
    ep.push(verts[b].x, verts[b].y, verts[b].z);
  }
  t.edgeLines.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(ep, 3));
}

function updateAll(){
  // вершины из ручек
  const upperVerts = state.handles.slice(0, 4).map(h => h.position.clone());
  const lowerVerts = state.handles.slice(4, 8).map(h => h.position.clone());

  updateTetraMesh(state.upperTetra, upperVerts);
  updateTetraMesh(state.lowerTetra, lowerVerts);

  // сфера — центр (0, r, 0), радиус r
  let r = state.r;
  if (state.breathing){
    r += Math.sin(state.breathPhase) * state.breathAmp;
  }
  const cx = 0, cy = state.r, cz = 0; // центр всегда на высоте r → касается земли
  state.sphere.position.set(cx, cy, cz);
  state.sphere.scale.setScalar(r);
  state.sphereWire.position.set(cx, cy, cz);
  state.sphereWire.scale.setScalar(r);

  // видимость
  state.upperTetra.group.visible = state.showMerkaba;
  state.lowerTetra.group.visible = state.showMerkaba;
  state.upperTetra.faceMesh.visible = state.showFaces;
  state.lowerTetra.faceMesh.visible = state.showFaces;
  state.upperTetra.edgeLines.visible = state.showEdges;
  state.lowerTetra.edgeLines.visible = state.showEdges;
  state.sphere.visible = state.showSphere;
  state.sphereWire.visible = state.showSphere;

  // инфо-панель
  const a = 2 * Math.sqrt(6) * state.r;
  document.getElementById('rVal').textContent = state.r.toFixed(2) + ' м';
  document.getElementById('edgeVal').textContent = a.toFixed(2) + ' м';
  document.getElementById('hVal').textContent = (4 * state.r).toFixed(2) + ' м';
}

/* ================= слайдер радиуса ================= */
const slider = document.getElementById('radiusSlider');
slider.addEventListener('input', () => {
  state.r = parseFloat(slider.value);

  // ВСЕГДА пересчитываем правильную меркабу (по определению она "правильная")
  // Если пользователь деформировал — он теряет деформацию (это ОК, он может нажать ⟲)
  const { upper, lower } = computeIdeal(state.r);
  for (let i = 0; i < 4; i++){
    state.handles[i].position.copy(upper[i]);
    state.handles[i + 4].position.copy(lower[i]);
  }
  state.isRegular = true;
  updateStateInfo();
  updateAll();
});

function updateStateInfo(){
  const el = document.getElementById('stateInfo');
  if (state.isRegular){
    el.textContent = 'правильная';
    el.classList.remove('deformed');
  } else {
    el.textContent = 'деформирована';
    el.classList.add('deformed');
  }
}

/* ================= drag ручек ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function findHandleAt(clientX, clientY){
  setPointer({clientX, clientY});
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.handles, false);
  return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const h = findHandleAt(e.clientX, e.clientY);
  pointerDownInfo = {x: e.clientX, y: e.clientY, moved: false};

  if (h){
    state.dragging = h;
    controls.enabled = false;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, h.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(h.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', e => {
  if (pointerDownInfo && !pointerDownInfo.moved){
    const dx = e.clientX - pointerDownInfo.x, dy = e.clientY - pointerDownInfo.y;
    if (dx*dx + dy*dy > 25) pointerDownInfo.moved = true;
  }
  if (!state.dragging) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(state.dragPlane, hit)){
    state.dragging.position.copy(hit.add(state.dragOffset));
    state.isRegular = false;
    updateStateInfo();
    updateAll();
  }
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    state.dragging = null;
    controls.enabled = true;
  }
  pointerDownInfo = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= загрузка Xbot ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.75;
    }
  });
  // Масштаб: сделаем так, чтобы модель совпадала с меркабой
  // Xbot ~1.8 м, а меркаба 4r ≈ 1.2 м при r=0.3. Уменьшим масштаб.
  model.scale.set(0.6, 0.6, 0.6);
  scene.add(model);
  state.model = model;

  const skinned = [];
  model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  const boneList = [];
  model.traverse(o => {
    if (o.isBone){
      boneList.push(o);
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;

  document.getElementById('load').classList.add('hidden');
  hud('меркаба готова · тяни вершины · крути радиус');
  refreshUI();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'ошибка: ' + err.message;
});

/* ================= UI ================= */
const ui = document.getElementById('ui');
function btn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

let btnSkel, btnMerk, btnSph, btnFaces, btnEdges, btnBreath;

btnSkel = btn('🦴 скелет', () => {
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
}, 'on');

btnMerk = btn('🔷 меркаба', () => {
  state.showMerkaba = !state.showMerkaba;
  updateAll();
  refreshUI();
}, 'on');

btnSph = btn('⚪ сфера', () => {
  state.showSphere = !state.showSphere;
  updateAll();
  refreshUI();
}, 'on');

btnFaces = btn('🔹 грани', () => {
  state.showFaces = !state.showFaces;
  updateAll();
  refreshUI();
}, 'on');

btnEdges = btn('📐 рёбра', () => {
  state.showEdges = !state.showEdges;
  updateAll();
  refreshUI();
}, 'on');

btnBreath = btn('🌬 дыхание', () => {
  state.breathing = !state.breathing;
  refreshUI();
}, 'breath');

btn('⟲ правильно', () => {
  const { upper, lower } = computeIdeal(state.r);
  for (let i = 0; i < 4; i++){
    state.handles[i].position.copy(upper[i]);
    state.handles[i + 4].position.copy(lower[i]);
  }
  state.isRegular = true;
  updateStateInfo();
  updateAll();
  hud('вернул правильную меркабу');
}, 'reset');

btn('🎥 вид', () => {
  camera.position.set(2.2, 1.4, 2.8);
  controls.target.set(0, 0.7, 0);
  controls.update();
});

function refreshUI(){
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnMerk.classList.toggle('on', state.showMerkaba);
  btnSph.classList.toggle('on', state.showSphere);
  btnFaces.classList.toggle('on', state.showFaces);
  btnEdges.classList.toggle('on', state.showEdges);
  btnBreath.classList.toggle('off', state.breathing);
  btnBreath.textContent = state.breathing ? '⏸ дыхание' : '🌬 дыхание';
}

/* ================= HUD ================= */
const hudEl = document.getElementById('hud');
function hud(msg){ hudEl.textContent = msg; }

/* ================= анимация ================= */
const clock = new THREE.Clock();

function animate(){
  const dt = clock.getDelta();

  if (state.breathing){
    state.breathPhase += dt * state.breathSpeed * Math.PI * 2;
    // дышит только сфера, тетра не двигается (иначе меркаба перестанет быть правильной)
    let r = state.r + Math.sin(state.breathPhase) * state.breathAmp;
    state.sphere.scale.setScalar(r);
    state.sphereWire.scale.setScalar(r);
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= старт ================= */
buildMerkaba();
refreshUI();
updateStateInfo();
hud('меркаба · сфера вписана математически · тяни 8 вершин');
animate();
</script>
</body>
</html>
