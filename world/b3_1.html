<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>v0.1 · Xbot test Babylon</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  #hud{position:fixed;top:8px;left:8px;font-size:12px;background:rgba(0,0,0,.85);
    padding:10px 12px;border-radius:8px;z-index:10;line-height:1.6;
    font-family:ui-monospace,monospace;color:#8cf;max-width:90%;
    white-space:pre-wrap;pointer-events:none;}
  #err{position:fixed;top:8px;left:8px;right:8px;font-size:12px;
    background:rgba(80,10,10,.95);padding:10px;border-radius:8px;z-index:20;
    font-family:ui-monospace,monospace;color:#fdd;display:none;white-space:pre-wrap;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">версия v0.1 · загружаю…</div>
<div id="hud">v0.1 · старт</div>
<div id="err"></div>

<script>
  window.__hud = function(m){
    var el = document.getElementById('hud');
    if (el) el.textContent = 'v0.1 · ' + m;
  };
  window.__err = function(m){
    var el = document.getElementById('err');
    if (el){ el.style.display = 'block'; el.textContent += m + '\n'; }
    console.error(m);
  };
  window.addEventListener('error', function(e){ window.__err('error: ' + (e.message || e)); });
  window.addEventListener('unhandledrejection', function(e){
    window.__err('reject: ' + (e.reason && e.reason.message || e.reason));
  });
</script>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
(async function(){
try {
  window.__hud('создаю canvas');

  const canvas = document.createElement('canvas');
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  canvas.style.touchAction = 'none';
  document.body.appendChild(canvas);

  const engine = new BABYLON.Engine(canvas, true);
  window.__hud('engine ok · создаю сцену');

  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.04, 0.04, 0.06, 1);

  // Камера — универсальная, смотрим на 0,1,0 с расстояния 5
  const camera = new BABYLON.ArcRotateCamera('cam',
    -Math.PI / 2, Math.PI / 2.5, 5,
    new BABYLON.Vector3(0, 1.0, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 1;
  camera.upperRadiusLimit = 50;
  camera.wheelDeltaPercentage = 0.02;

  window.__hud('камера ok · свет');

  const hemi = new BABYLON.HemisphericLight('hemi',
    new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 1.0;
  const dir = new BABYLON.DirectionalLight('dir',
    new BABYLON.Vector3(-1, -2, -1), scene);
  dir.intensity = 0.7;

  window.__hud('свет ok · создаю пол');

  const ground = BABYLON.MeshBuilder.CreateGround('ground',
    { width: 20, height: 20 }, scene);
  const gm = new BABYLON.StandardMaterial('gm', scene);
  gm.diffuseColor = new BABYLON.Color3(0.10, 0.10, 0.15);
  gm.specularColor = new BABYLON.Color3(0, 0, 0);
  ground.material = gm;

  window.__hud('пол ok · гружу Xbot…');

  const result = await BABYLON.SceneLoader.ImportMeshAsync(
    null,
    'https://threejs.org/examples/models/gltf/',
    'Xbot.glb',
    scene
  );

  window.__hud('модель загружена · считаю bounds');

  const rootMesh = result.meshes[0];
  rootMesh.computeWorldMatrix(true);
  const bounds = rootMesh.getHierarchyBoundingVectors(true);
  const size = bounds.max.subtract(bounds.min);

  let msg = 'мешей: ' + result.meshes.length + '\n';
  msg += 'bounding: x=' + size.x.toFixed(3) +
         ' y=' + size.y.toFixed(3) +
         ' z=' + size.z.toFixed(3) + '\n';
  msg += 'позиция корня: ' + rootMesh.position.toString() + '\n';

  // найти скелет
  let skeleton = null;
  let skinnedMesh = null;
  for (const m of result.meshes){
    if (m.skeleton){
      skeleton = m.skeleton;
      if (m.getTotalVertices && m.getTotalVertices() > 0){
        skinnedMesh = m;
      }
    }
  }
  if (skeleton){
    msg += 'костей: ' + skeleton.bones.length + '\n';
    msg += 'первая кость: ' + (skeleton.bones[0]?.name || '?') + '\n';
    const names = skeleton.bones.slice(0, 8).map(b => b.name).join(', ');
    msg += 'кости: ' + names + '\n';
  } else {
    msg += 'СКЕЛЕТ НЕ НАЙДЕН\n';
  }

  window.__hud(msg);

  // Подгонка масштаба — если модель крошечная или огромная
  const height = size.y;
  if (height > 0.001 && (height < 0.5 || height > 5)){
    const k = 1.8 / height;
    rootMesh.scaling = new BABYLON.Vector3(k, k, k);
    window.__hud(msg + '\nмасштаб применён: ' + k.toFixed(4));
  } else {
    window.__hud(msg + '\nмасштаб ок');
  }

  // камера смотрит на центр модели
  const center = bounds.min.add(size.scale(0.5));
  camera.target = center;
  camera.radius = size.length() * 1.6;

  engine.runRenderLoop(function(){
    scene.render();
  });
  window.addEventListener('resize', function(){
    engine.resize();
  });

  document.getElementById('load').classList.add('hidden');
  window.__hud(msg + '\nготов · тащи камеру пальцем');

} catch(e){
  window.__err('FATAL: ' + (e && e.message ? e.message : e) +
    '\n' + (e && e.stack ? e.stack : ''));
  document.getElementById('load').textContent = 'ошибка: ' + (e && e.message ? e.message : e);
}
})();
</script>
</body>
</html>
