<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>сакральная геометрия · тело</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.75);
    padding:8px 10px;border-radius:8px;z-index:10;line-height:1.6;
    font-family:ui-monospace,monospace;max-width:90%;pointer-events:none;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:8px;
    display:flex;flex-wrap:wrap;gap:6px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.2));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:9px;
    padding:10px 14px;font-size:14px;touch-action:manipulation;font-weight:bold;}
  #ui button:active{background:#2a2a4a;}
  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;
    box-shadow:0 0 8px #a67cff88;}
  #ui button.breath{background:#1a3a1a;border-color:#4a6;}
  #ui button.breath.off{background:#3a1a1a;border-color:#a44;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">загружаю тело…</div>
<div id="hud">готов</div>
<div id="ui"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 15, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 2, 4);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1, 0);
controls.minDistance = 1;
controls.maxDistance = 15;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(5, 8, 6);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.6);
fill.position.set(-5, 3, -6);
scene.add(fill);

/* ================= сетка-пол ================= */
const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.5;
grid.material.transparent = true;
scene.add(grid);

/* оси */
const axes = new THREE.AxesHelper(1.5);
axes.position.y = 0.01;
scene.add(axes);

/* ================= состояние ================= */
const state = {
  model: null,
  skeleton: null,
  skeletonHelper: null,
  bones: {},
  tetra: null,
  sphere: null,
  rays: [],
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.5,
  baseRadius: 0.6,
  radiusRange: 0.35,
  showSkeleton: true,
  showTetra: true,
  showSphere: true,
  showRays: true
};

/* ================= загрузка модели ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        o.material.transparent = true;
        o.material.opacity = 0.85;
      }
    }
  });
  scene.add(model);
  state.model = model;

  // Скелет
  const skinned = [];
  model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    state.skeleton = skinned[0].skeleton;
    state.skeletonHelper = new THREE.SkeletonHelper(model);
    state.skeletonHelper.material.linewidth = 2;
    state.skeletonHelper.material.depthTest = false;
    state.skeletonHelper.renderOrder = 1;
    scene.add(state.skeletonHelper);
  }

  // Индекс костей по имени
  const boneList = [];
  model.traverse(o => { if (o.isBone) boneList.push(o); });
  for (const b of boneList){
    // strip mixamorig: prefix
    const name = b.name.replace(/^mixamorig:?/, '').toLowerCase();
    state.bones[name] = b;
  }

  // Построить геометрию
  buildGeometry();

  document.getElementById('load').classList.add('hidden');
  hud('тело загружено · костей: ' + boneList.length);
  refreshUI();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'ошибка загрузки: ' + err.message;
});

/* ================= построение геометрии ================= */
function getBoneWorld(name){
  const b = state.bones[name];
  if (!b) return null;
  const v = new THREE.Vector3();
  b.getWorldPosition(v);
  return v;
}

function buildGeometry(){
  // якорные точки
  const hips = getBoneWorld('hips') || getBoneWorld('pelvis') || new THREE.Vector3(0, 0.9, 0);
  const headTop = getBoneWorld('headtop_end') || getBoneWorld('head') || new THREE.Vector3(0, 1.7, 0);
  const spine2 = getBoneWorld('spine2') || getBoneWorld('spine1') || hips.clone().lerp(headTop, 0.5);

  // живот = 60% от hips к spine2
  const belly = hips.clone().lerp(spine2, 0.6);
  state.anchorBelly = belly;
  state.anchorHips = hips;
  state.anchorHeadTop = headTop;

  // высота тела
  const bodyHeight = headTop.distanceTo(hips);
  state.bodyHeight = bodyHeight;

  // радиус основания тетраэдра
  const baseRadius = bodyHeight * 0.55;
  state.tetraBaseRadius = baseRadius;

  // --- тетраэдр вокруг тела ---
  if (state.tetra) scene.remove(state.tetra);
  const tetraGroup = new THREE.Group();

  const baseY = 0;
  const basePts = [];
  for (let i = 0; i < 3; i++){
    const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
    basePts.push(new THREE.Vector3(
      Math.cos(a) * baseRadius,
      baseY,
      Math.sin(a) * baseRadius
    ));
  }
  const apex = new THREE.Vector3(0, bodyHeight * 1.35, 0);

  // грани
  const verts = [...basePts, apex];
  const faces = [
    [0,1,2], [0,1,3], [1,2,3], [2,0,3]
  ];
  const positions = [];
  for (const f of faces){
    for (const idx of f){
      positions.push(verts[idx].x, verts[idx].y, verts[idx].z);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.computeVertexNormals();

  const tetraMat = new THREE.MeshStandardMaterial({
    color: 0x66aaff,
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide,
    emissive: 0x2244aa,
    emissiveIntensity: 0.3,
    depthWrite: false
  });
  const tetraMesh = new THREE.Mesh(geo, tetraMat);
  tetraGroup.add(tetraMesh);

  // рёбра тетраэдра
  const edgeGeo = new THREE.BufferGeometry();
  const edges = [
    [0,1],[1,2],[2,0], // основание
    [0,3],[1,3],[2,3]  // к вершине
  ];
  const edgePos = [];
  for (const [a,b] of edges){
    edgePos.push(verts[a].x, verts[a].y, verts[a].z);
    edgePos.push(verts[b].x, verts[b].y, verts[b].z);
  }
  edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos, 3));
  const edgeMat = new THREE.LineBasicMaterial({color: 0x88ccff, transparent:true, opacity:0.7});
  tetraGroup.add(new THREE.LineSegments(edgeGeo, edgeMat));

  state.tetra = tetraGroup;
  scene.add(tetraGroup);

  // --- сфера в животе ---
  if (state.sphere) scene.remove(state.sphere);
  const sphereGeo = new THREE.SphereGeometry(1, 32, 24);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0xffaa44,
    transparent: true,
    opacity: 0.35,
    emissive: 0xff6600,
    emissiveIntensity: 0.5,
    depthWrite: false
  });
  state.sphere = new THREE.Mesh(sphereGeo, sphereMat);
  state.sphere.position.copy(belly);
  state.sphere.scale.setScalar(state.baseRadius);
  scene.add(state.sphere);

  // --- лучи от основания тетраэдра к животу ---
  for (const r of state.rays) scene.remove(r);
  state.rays = [];
  for (let i = 0; i < 3; i++){
    const g = new THREE.BufferGeometry();
    const pos = new Float32Array(6);
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.LineBasicMaterial({
      color: 0xff8844,
      transparent: true,
      opacity: 0.6
    });
    const line = new THREE.Line(g, mat);
    line.userData.baseIndex = i;
    line.userData.basePt = basePts[i].clone();
    state.rays.push(line);
    scene.add(line);
  }

  // --- маркеры якорных точек ---
  if (state.markers) state.markers.forEach(m => scene.remove(m));
  state.markers = [];
  const addMarker = (pos, color) => {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 12, 10),
      new THREE.MeshBasicMaterial({color, depthTest: false})
    );
    m.position.copy(pos);
    m.renderOrder = 2;
    scene.add(m);
    state.markers.push(m);
  };
  addMarker(hips, 0x00ff88);
  addMarker(belly, 0xffaa00);
  addMarker(headTop, 0xff4488);
}

/* ================= обновление геометрии каждый кадр ================= */
const tmpV = new THREE.Vector3();

function updateGeometry(){
  if (!state.model) return;

  const hips = getBoneWorld('hips') || getBoneWorld('pelvis');
  const headTop = getBoneWorld('headtop_end') || getBoneWorld('head');
  const spine2 = getBoneWorld('spine2') || getBoneWorld('spine1');

  if (!hips || !headTop) return;

  const belly = spine2
    ? hips.clone().lerp(spine2, 0.6)
    : hips.clone().lerp(headTop, 0.5);

  const bodyHeight = headTop.distanceTo(hips);

  // сфера
  if (state.sphere){
    state.sphere.position.copy(belly);
    let r = state.baseRadius;
    if (state.breathing){
      r += Math.sin(state.breathPhase) * state.radiusRange;
    }
    state.sphere.scale.setScalar(r);
  }

  // тетраэдр — перестроить вершины динамически
  if (state.tetra && state.showTetra){
    const baseRadius = bodyHeight * 0.55;
    const verts = [];
    for (let i = 0; i < 3; i++){
      const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
      verts.push(new THREE.Vector3(
        Math.cos(a) * baseRadius,
        0,
        Math.sin(a) * baseRadius
      ));
    }
    verts.push(new THREE.Vector3(0, bodyHeight * 1.35, 0));

    // обновить позиции граней
    const faces = [[0,1,2],[0,1,3],[1,2,3],[2,0,3]];
    const positions = [];
    for (const f of faces){
      for (const idx of f){
        positions.push(verts[idx].x, verts[idx].y, verts[idx].z);
      }
    }
    const mesh = state.tetra.children[0];
    if (mesh && mesh.geometry){
      mesh.geometry.setAttribute('position',
        new THREE.Float32BufferAttribute(positions, 3));
      mesh.geometry.computeVertexNormals();
    }
    // рёбра
    const edgeMesh = state.tetra.children[1];
    if (edgeMesh && edgeMesh.geometry){
      const edges = [[0,1],[1,2],[2,0],[0,3],[1,3],[2,3]];
      const ep = [];
      for (const [a,b] of edges){
        ep.push(verts[a].x, verts[a].y, verts[a].z);
        ep.push(verts[b].x, verts[b].y, verts[b].z);
      }
      edgeMesh.geometry.setAttribute('position',
        new THREE.Float32BufferAttribute(ep, 3));
    }
  }

  // лучи
  if (state.rays.length === 3 && state.showRays){
    for (const line of state.rays){
      const i = line.userData.baseIndex;
      const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
      const r = bodyHeight * 0.55;
      const bp = new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
      const arr = line.geometry.attributes.position.array;
      arr[0] = bp.x; arr[1] = bp.y; arr[2] = bp.z;
      arr[3] = belly.x; arr[4] = belly.y; arr[5] = belly.z;
      line.geometry.attributes.position.needsUpdate = true;
    }
  }
}

/* ================= UI ================= */
const ui = document.getElementById('ui');
function btn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

let breathBtn = null;

btn('🦴 скелет', () => {
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
}, 'on');

btn('🔷 тетра', () => {
  state.showTetra = !state.showTetra;
  if (state.tetra) state.tetra.visible = state.showTetra;
  refreshUI();
}, 'on');

btn('⚪ сфера', () => {
  state.showSphere = !state.showSphere;
  if (state.sphere) state.sphere.visible = state.showSphere;
  refreshUI();
}, 'on');

btn('📡 лучи', () => {
  state.showRays = !state.showRays;
  for (const r of state.rays) r.visible = state.showRays;
  refreshUI();
}, 'on');

breathBtn = btn('🌬 дыхание', () => {
  state.breathing = !state.breathing;
  refreshUI();
}, 'breath');

btn('🎥 вид', () => {
  camera.position.set(3, 2, 4);
  controls.target.set(0, 1, 0);
  controls.update();
});

function refreshUI(){
  const kids = ui.querySelectorAll('button');
  // скелет
  kids[0].classList.toggle('on', state.showSkeleton);
  kids[1].classList.toggle('on', state.showTetra);
  kids[2].classList.toggle('on', state.showSphere);
  kids[3].classList.toggle('on', state.showRays);
  if (breathBtn){
    breathBtn.classList.toggle('breath', true);
    breathBtn.classList.toggle('off', state.breathing);
    breathBtn.textContent = state.breathing ? '⏸ дыхание' : '🌬 дыхание';
  }
}

/* ================= HUD ================= */
const hudEl = document.getElementById('hud');
function hud(msg){
  hudEl.textContent = msg;
}

/* ================= анимация ================= */
const clock = new THREE.Clock();

function animate(){
  const dt = clock.getDelta();

  if (state.breathing){
    state.breathPhase += dt * state.breathSpeed * Math.PI * 2;
  }

  // авто-вращение модели для демо (лёгкое покачивание)
  // (можно закомментировать, если модель статична)
  updateGeometry();

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
hud('готов · загружаю Xbot…');
animate();
</script>
</body>
</html>
