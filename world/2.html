<!DOCTYPE html>
<html lang="ru">
<head>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}

  #topbar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:5px;
    padding:5px;pointer-events:none;}
  #topbar button{pointer-events:auto;background:rgba(20,20,30,.85);color:#eee;
    border:1px solid #334;border-radius:8px;padding:6px 9px;font-size:12px;}
  #topbar button.acc{background:rgba(40,30,60,.85);border-color:#a67cff;}

  #coords{position:fixed;top:44px;right:6px;z-index:9;display:none;
    flex-direction:column;gap:3px;background:rgba(10,10,20,.92);
    border:1px solid #a67cff;border-radius:9px;padding:6px;font-size:11px;
    font-family:ui-monospace,monospace;}
  #coords.show{display:flex;}
  #coords .cRow{display:flex;align-items:center;gap:5px;}
  #coords label{width:14px;color:#aab;font-weight:bold;}
  #coords input{width:66px;background:#0a0a14;color:#eee;border:1px solid #445;
    border-radius:5px;padding:5px 5px;font-size:12px;font-family:ui-monospace,monospace;
    text-align:right;}
  #coords .unit{color:#778;font-size:10px;}
  #coords .title{color:#ccd;font-size:10px;text-align:center;padding-bottom:2px;}

  #hud{position:fixed;top:44px;left:6px;font-size:10px;background:rgba(0,0,0,.72);
    padding:5px 7px;border-radius:7px;z-index:8;line-height:1.5;max-width:55%;
    pointer-events:none;white-space:pre;font-family:ui-monospace,monospace;}

  #ui{position:fixed;bottom:0;left:0;right:0;padding:5px;
    display:flex;flex-wrap:wrap;gap:4px;z-index:10;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.94), rgba(0,0,0,.35));}
  #ui button{background:#161624;color:#eee;border:1px solid #333;border-radius:8px;
    padding:7px 8px;font-size:13px;min-width:40px;touch-action:manipulation;}
  #ui button:active{background:#2a2a4a;}
  #ui button.hi{background:#3a2a5a;border-color:#a67cff;color:#fff;}
  #ui button.axis{background:#1a1a26;border-color:#334;font-weight:bold;color:#aab;}
  #ui button.axis.on{background:#2a3a55;border-color:#66aaff;color:#fff;
    box-shadow:0 0 8px #66aaff88;}
  #ui button.play{background:#1a3a1a;border-color:#4a6;}
  #ui button.play.paused{background:#3a1a1a;border-color:#a44;}
  #ui button.drag{background:#1a2430;border-color:#456;font-size:12px;padding:6px 7px;}
  #ui button.drag.on{background:#2a4660;border-color:#69c;color:#fff;
    box-shadow:0 0 8px #69c8;}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
    display:none;flex-direction:column;padding:14px;gap:10px;overflow:auto;}
  .modal.show{display:flex;}
  .modal h2{margin:0;font-size:16px;color:#eee;}
  .modal .head{display:flex;justify-content:space-between;align-items:center;}
  .modal .head button{background:#422;color:#fff;border:none;border-radius:8px;
    padding:8px 12px;font-size:14px;}
  .modal .row{background:#14141e;border:1px solid #334;border-radius:10px;
    padding:10px;display:flex;gap:8px;align-items:center;font-size:14px;}
  .modal .row.current{border-color:#a67cff;background:#241a3a;}
  .modal .row input[type=text]{background:#0a0a14;color:#eee;border:1px solid #334;
    border-radius:6px;padding:6px 8px;font-size:14px;flex:1;min-width:0;}
  .modal .row input[type=color]{width:36px;height:36px;border:none;background:transparent;
    padding:0;border-radius:6px;}
  .modal .row .tag{font-size:11px;color:#889;font-family:ui-monospace,monospace;}
  .modal .row button{background:#223;color:#eef;border:1px solid #445;

  .modal .row button.danger{background:#5a2a2a;border-color:#a55;}
  .modal .foot{display:flex;gap:8px;flex-wrap:wrap;}
  .modal .foot button{background:#223;color:#eef;border:1px solid #445;

  #jsonbar{position:fixed;top:0;left:0;right:0;z-index:31;display:none;

<body>

  <button id="sceneBtn" class="acc">🎬 —</button>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

/* ================= three.js ================= */
/* Система координат:
   +X — вправо    −X — влево
   +Y — вверх     −Y — вниз
   −Z — ВПЕРЁД    +Z — назад      ← развёрнуто как в OpenGL/Unity
*/
const threeScene = new THREE.Scene();
threeScene.background = new THREE.Color(0x0a0a0f);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(4, 3, -6); // смотрим вдоль −Z, чуть выше

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.minDistance = 0.5; controls.maxDistance = 200;

threeScene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(6,10,7); threeScene.add(d1);
const d2 = new THREE.DirectionalLight(0x6688ff, 0.55); d2.position.set(-5,-3,-6); threeScene.add(d2);

/* ================= метровая сетка ================= */
const grid = new THREE.GridHelper(80, 80, 0x334455, 0x151a22);
grid.material.opacity = 0.55; grid.material.transparent = true;
threeScene.add(grid);

function meterLines(){
  const group = new THREE.Group();
  const matMajor = new THREE.LineBasicMaterial({color:0x445577, transparent:true, opacity:0.65});
  const HALF = 40;
  for (let i = -HALF; i <= HALF; i += 5){
    if (i === 0) continue;
    const gx = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-HALF, 0, i), new THREE.Vector3(HALF, 0, i)]);
    group.add(new THREE.Line(gx, matMajor));
    const gz = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(i, 0, -HALF), new THREE.Vector3(i, 0, HALF)]);
    group.add(new THREE.Line(gz, matMajor));
  }
  return group;
}
threeScene.add(meterLines());

/* ================= компактные метки осей ================= */
function makeLabel(text, color='#ccd', fontSize=40){
  const c = document.createElement('canvas');
  c.width = 96; c.height = 48;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = `bold ${fontSize}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 48, 24);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false,
    depthWrite:false});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(0.55, 0.28, 1);
  return sp;
}

const axisLabels = new THREE.Group();
threeScene.add(axisLabels);
(function initAxisLabels(){
  // метровые риски на осях — компактно
  const marks = [1, 2, 3, 5, 10, 15, 20];
  for (const m of marks){
    const lx = makeLabel(m+'м', '#ff9999', 32); lx.position.set(m, 0.08, 0);
    lx.scale.set(0.45, 0.22, 1); axisLabels.add(lx);
    const ly = makeLabel(m+'м', '#99ff99', 32); ly.position.set(0, m, 0);
    ly.scale.set(0.45, 0.22, 1); axisLabels.add(ly);
    const lz = makeLabel(m+'м', '#99aaff', 32); lz.position.set(0, 0.08, m);
    lz.scale.set(0.45, 0.22, 1); axisLabels.add(lz);
  }
  // стрелки осей — короткие
  const oX = makeLabel('X→', '#ff5555', 40); oX.position.set(1.6, 0.2, 0);
  oX.scale.set(0.7, 0.35, 1); axisLabels.add(oX);
  const oY = makeLabel('Y↑', '#55ff55', 40); oY.position.set(0, 1.7, 0);
  oY.scale.set(0.7, 0.35, 1); axisLabels.add(oY);
  // Z: вперёд — это −Z. Значит стрелка вперёд смотрит в -Z
  const oZf = makeLabel('Z←', '#5577ff', 40); oZf.position.set(0, 0.2, -1.6);
  oZf.scale.set(0.7, 0.35, 1); axisLabels.add(oZf);
})();

(function drawAxes(){
  const L = 40;
  const add = (a, b, c) => {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    return new THREE.Line(g, new THREE.LineBasicMaterial({color:c}));
  };
  threeScene.add(add(new THREE.Vector3(-L,0,0), new THREE.Vector3(L,0,0), 0xcc3333));
  threeScene.add(add(new THREE.Vector3(0,0,0), new THREE.Vector3(0,L,0), 0x33cc33));
  threeScene.add(add(new THREE.Vector3(0,0,-L), new THREE.Vector3(0,0,L), 0x3355cc));
})();

(function youMarker(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.35, 0.45, 32),
    new THREE.MeshBasicMaterial({color:0xffcc44, side:THREE.DoubleSide, transparent:true, opacity:0.8}));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; g.add(ring);
  const needle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 1.7, 8),
    new THREE.MeshBasicMaterial({color:0xffcc44, transparent:true, opacity:0.5}));
  needle.position.y = 0.85; g.add(needle);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 12, 10),
    new THREE.MeshBasicMaterial({color:0xffcc44}));
  dot.position.y = 1.7; g.add(dot);
  threeScene.add(g);
})();

/* ================= состояние ================= */
const state = {
  scenes: [],
  currentSceneId: null,
  nextSceneId: 1,
  selectedPoints: new Set(),
  selectedShapes: new Set(),
  paused: false,
  currentAxis: new THREE.Vector3(1,0,0),
  axisName: 'X',
  dragMode: 'ground'
};
const cs = () => state.scenes.find(s => s.id === state.currentSceneId);
const getPoint = id => { const s = cs(); return s ? s.points.find(p => p.id === id) : null; };
const getShape = id => { const s = cs(); return s ? s.shapes.find(x => x.id === id) : null; };

function newScene(name){
  const group = new THREE.Group();
  threeScene.add(group); group.visible = false;
  const s = {
    id: state.nextSceneId++,
    name: name || ('сцена-' + (state.scenes.length + 1)),
    points: [], shapes: [], group, nextLocalId: 1
  };
  state.scenes.push(s);
  return s;
}
function switchScene(id){
  const cur = cs(); if (cur) cur.group.visible = false;
  state.currentSceneId = id;
  const s = cs(); if (s) s.group.visible = true;
  state.selectedPoints.clear(); state.selectedShapes.clear();
  refreshSelection(); refreshSceneBtn(); save();
}
function deleteScene(id){
  const idx = state.scenes.findIndex(s => s.id === id);
  if (idx < 0) return;
  if (state.scenes.length === 1) return hud('нельзя удалить последнюю');
  if (!confirm('Удалить сцену "' + state.scenes[idx].name + '"?')) return;
  const s = state.scenes[idx];
  threeScene.remove(s.group);
  s.group.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  state.scenes.splice(idx, 1);
  if (state.currentSceneId === id) switchScene(state.scenes[0].id);
  refreshSceneList(); save();
}

/* ================= роли точек ================= */
function getPointRoles(pid){
  const roles = new Set();
  const s = cs(); if (!s) return null;
  for (const sh of s.shapes){
    if (sh.type === 'sphere' || sh.type === 'circle'){
      if (sh.pointIds[0] === pid) roles.add('center');
      if (sh.pointIds[1] === pid) roles.add('radius');
    }
  }
  if (roles.has('center')) return 'center';
  if (roles.has('radius')) return 'radius';
  return null;
}

/* ================= точки ================= */
const POINT_GEO_NORMAL = new THREE.SphereGeometry(0.08, 20, 16);
const POINT_GEO_CENTER = new THREE.SphereGeometry(0.13, 22, 18);
const POINT_GEO_RADIUS = new THREE.SphereGeometry(0.10, 20, 16);
const RING_GEO = new THREE.TorusGeometry(0.22, 0.018, 8, 32);

function makePointMat(role, sel=false){
  let color = 0xff8800, emissive = 0x552200, ei = 0.7;
  if (role === 'center'){ color = 0xffcc22; emissive = 0xaa7700; ei = 1.1; }
  else if (role === 'radius'){ color = 0x22ddff; emissive = 0x006688; ei = 1.1; }
  if (sel){ color = 0xffffff; emissive = 0x666699; ei = 1.4; }
  return new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity: ei, metalness: 0.35, roughness: 0.3});
}

function addPoint(x=null, y=null, z=null){
  const s = cs(); if (!s) return;
  if (x===null){
    // перед тобой: -Z это вперёд
    x = (Math.random()-0.5)*1.0;
    y = 1.5;
    z = -(1.5 + Math.random()*1.0);
  }
  const mesh = new THREE.Mesh(POINT_GEO_NORMAL, makePointMat(null));
  mesh.position.set(x, y, z);
  const localId = s.nextLocalId++;
  mesh.userData.pointId = localId;
  s.group.add(mesh);
  s.points.push({ id: localId, mesh });
  return s.points[s.points.length-1];
}

function refreshPointVisuals(){
  const s = cs(); if (!s) return;
  for (const p of s.points){
    const role = getPointRoles(p.id);
    const sel = state.selectedPoints.has(p.id);
    let geo = POINT_GEO_NORMAL;
    if (role === 'center') geo = POINT_GEO_CENTER;
    else if (role === 'radius') geo = POINT_GEO_RADIUS;
    if (p.mesh.geometry !== geo) p.mesh.geometry = geo;
    p.mesh.material.dispose();
    p.mesh.material = makePointMat(role, sel);
    if (role === 'center'){
      if (!p._ring){
        p._ring = new THREE.Mesh(RING_GEO,
          new THREE.MeshBasicMaterial({color:0xffcc22, transparent:true, opacity:0.65}));
        s.group.add(p._ring);
      }
      p._ring.visible = true;
      p._ring.position.copy(p.mesh.position);
      p._ring.lookAt(camera.position);
    } else if (p._ring){
      p._ring.visible = false;
    }
  }
}

/* ================= фигуры ================= */
const SHAPE_COLORS = [0x66aaff, 0xff7788, 0x88ff99, 0xffaa66, 0xbb77ff, 0x66dddd, 0xffee66];

function centroidOf(pts){
  const c = new THREE.Vector3();
  pts.forEach(p => c.add(p));
  return c.divideScalar(pts.length);
}

function buildShapeMesh(shape){
  const pts = shape.pointIds.map(id => getPoint(id).mesh.position);
  const centroid = centroidOf(pts);
  const local = pts.map(p => p.clone().sub(centroid));
  const color = shape.color;
  let mesh = null;

  if (shape.type === 'line'){
    const g = new THREE.BufferGeometry().setFromPoints(local);
    mesh = new THREE.Line(g, new THREE.LineBasicMaterial({color:0x66ccff}));
  } else if (shape.type === 'circle'){
    const r = pts[0].distanceTo(pts[1]);
    mesh = new THREE.Mesh(new THREE.CircleGeometry(r, 64),
      new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide, transparent:true,
        opacity:0.45, roughness:0.4}));
  } else if (shape.type === 'sphere'){
    const r = pts[0].distanceTo(pts[1]);
    mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24),
      new THREE.MeshStandardMaterial({color, transparent:true,
        opacity:0.25, roughness:0.3, metalness:0.35}));
    mesh.position.copy(pts[0]).sub(centroid);
  } else if (shape.type === 'triangle'){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(
      local.flatMap(v=>[v.x,v.y,v.z]), 3));
    g.setIndex([0,1,2]); g.computeVertexNormals();
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide,
      transparent:true, opacity:0.5, roughness:0.4}));
  } else if (shape.type === 'tetra' || shape.type === 'convex'){
    let g;
    try { g = new ConvexGeometry(local); }
    catch(e){ g = new THREE.BufferGeometry(); }
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide,
      transparent:true, opacity:0.45, flatShading:true, roughness:0.4}));
  } else if (shape.type === 'cube'){
    const sx = Math.max(Math.abs(pts[0].x-pts[1].x),0.2);
    const sy = Math.max(Math.abs(pts[0].y-pts[1].y),0.2);
    const sz = Math.max(Math.abs(pts[0].z-pts[1].z),0.2);
    mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),
      new THREE.MeshStandardMaterial({color, transparent:true,
        opacity:0.3, roughness:0.3, metalness:0.4}));
  }
  if (!mesh) return null;

  const group = new THREE.Group();
  group.position.copy(centroid);
  group.add(mesh);
  group.userData.shapeId = shape.id;
  mesh.userData.shapeId = shape.id;
  shape._innerMesh = mesh;
  return group;
}

function rebuildShape(shape){
  const s = cs(); if (!s) return;
  if (shape.mesh){
    s.group.remove(shape.mesh);
    shape.mesh.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  }
  shape.mesh = buildShapeMesh(shape);
  if (shape.mesh) s.group.add(shape.mesh);
}

function buildShape(type, pointIds){
  const s = cs(); if (!s) return;
  const shape = {
    id: s.nextLocalId++,
    name: type + '-' + s.shapes.length,
    type, pointIds: [...pointIds],
    locked: false,
    color: SHAPE_COLORS[s.shapes.length % SHAPE_COLORS.length],
    mesh: null, pendulum: null
  };
  s.shapes.push(shape);
  rebuildShape(shape);
  refreshPointVisuals();
  return shape;
}

/* ================= маятник ================= */
function togglePendulum(shapeId){
  const s = cs(); if (!s) return;
  const shape = getShape(shapeId);
  if (!shape) return;
  if (shape.pendulum){
    shape.pendulum = null;
    shape.locked = false;
    if (shape._anchorMark) shape._anchorMark.visible = false;
    hud('маятник снят · ' + shape.name);
    return;
  }
  const pts = shape.pointIds.map(id => getPoint(id).mesh.position);
  const anchor = centroidOf(pts);
  const baseOffsets = {};
  shape.pointIds.forEach(id => {
    const p = getPoint(id);
    baseOffsets[id] = p.mesh.position.clone().sub(anchor);
  });
  shape.pendulum = {
    anchor: anchor.clone(), baseOffsets,
    groupOffset: shape.mesh.position.clone().sub(anchor),
    axis: state.currentAxis.clone(),
    amplitude: 0.75, speed: 1.2, phase: 0
  };
  shape.locked = true;
  if (!shape._anchorMark){
    const g = new THREE.Group();
    const m = new THREE.MeshBasicMaterial({color:0xbb66ff});
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.5,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.5), m));
    shape._anchorMark = g;
    s.group.add(g);
  }
  shape._anchorMark.position.copy(anchor);
  shape._anchorMark.visible = true;
  state.paused = false;
  if (playBtn){ playBtn.textContent = '⏸'; playBtn.classList.remove('paused'); }

/* ================= drag ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragOffset = new THREE.Vector3();
let dragging = null, pointerDown = null;
let dragStartScreen = null;
let dragStartPos = null;

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

// сколько мира в одном пикселе экрана на расстоянии dist
function pixelsToWorld(dist){
  const vFov = camera.fov * Math.PI / 180;
  const h = renderer.domElement.clientHeight || 1;
  return (2 * Math.tan(vFov/2) * dist) / h;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const s = cs(); if (!s) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(s.points.map(p=>p.mesh), false);
  pointerDown = {x:e.clientX, y:e.clientY, moved:false};

  if (hits.length){
    const p = s.points.find(pp => pp.mesh === hits[0].object);
    dragging = p;
    controls.enabled = false;
    dragStartScreen = {x: e.clientX, y: e.clientY};
    dragStartPos = p.mesh.position.clone();

    if (state.dragMode === 'screen'){
      const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
      dragPlane.setFromNormalAndCoplanarPoint(camDir, p.mesh.position);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, hit);
      dragOffset.subVectors(p.mesh.position, hit);
    }
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  if (pointerDown && !pointerDown.moved){
    const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
    if (dx*dx + dy*dy > 36) pointerDown.moved = true;
  }
  if (!dragging) return;
  const s = cs(); if (!s) return;

  let newPos;

  if (state.dragMode === 'ground'){
    // экранные дельты → мир: вверх = вперёд (−Z вдоль камеры), влево/вправо = вбок
    const dxS = e.clientX - dragStartScreen.x;
    const dyS = e.clientY - dragStartScreen.y;

    const camFwd = new THREE.Vector3();
    camera.getWorldDirection(camFwd);
    camFwd.y = 0;
    if (camFwd.lengthSq() < 1e-6) camFwd.set(0,0,-1);
    camFwd.normalize();
    const camRight = new THREE.Vector3().crossVectors(camFwd, new THREE.Vector3(0,1,0)).normalize();

    const dist = camera.position.distanceTo(dragStartPos);
    const scale = pixelsToWorld(dist);

    newPos = dragStartPos.clone()
      .addScaledVector(camRight, dxS * scale)
      .addScaledVector(camFwd, -dyS * scale);  // палец вверх → вперёд
    newPos.y = dragStartPos.y;
  }
  else if (state.dragMode === 'vertical'){
    // экранная вертикаль → мировая Y
    const dyS = e.clientY - dragStartScreen.y;
    const dist = camera.position.distanceTo(dragStartPos);
    const scale = pixelsToWorld(dist);
    newPos = dragStartPos.clone();
    newPos.y = dragStartPos.y - dyS * scale;
  }
  else {
    // screen: свободный по плоскости экрана
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    const hit = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(dragPlane, hit)) return;
    newPos = hit.add(dragOffset);
  }

  const delta = newPos.clone().sub(dragging.mesh.position);
  const role = getPointRoles(dragging.id);
  if (role === 'center'){
    for (const sh of s.shapes){
      if ((sh.type==='sphere'||sh.type==='circle') && sh.pointIds[0]===dragging.id && !sh.pendulum){
        for (let i=1; i<sh.pointIds.length; i++){
          const p2 = getPoint(sh.pointIds[i]);
          if (p2) p2.mesh.position.add(delta);
        }
      }
    }
  }
  dragging.mesh.position.copy(newPos);
  s.shapes.forEach(sh => {
    if (sh.pendulum) return;
    if (sh.pointIds.includes(dragging.id)) rebuildShape(sh);
  });
  refreshPointVisuals();
  syncCoordPanel();
  hud();
});

function endDrag(e){
  const s = cs();
  if (dragging){
    if (pointerDown && !pointerDown.moved) togglePoint(dragging.id);
    dragging = null; controls.enabled = true; save();
    dragStartScreen = null; dragStartPos = null;
  } else if (pointerDown && !pointerDown.moved && s){
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    const shapes = s.shapes.filter(x=>x.mesh).map(x=>x.mesh);
    const hits = raycaster.intersectObjects(shapes, true);
    if (hits.length){
      let obj = hits[0].object;
      while (obj && obj.userData.shapeId == null) obj = obj.parent;
      if (obj) toggleShape(obj.userData.shapeId);
    } else clearSelection();
  }
  pointerDown = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

const ROLES = {
  line: ['a','b'], circle: ['center','edge'], sphere: ['center','radius'],
  triangle: ['a','b','c'], tetra: ['p1','p2','p3','p4'],

function serializeScene(s){
  const usedIds = new Set();
  const shapes = s.shapes.map(sh => {
    sh.pointIds.forEach(id => usedIds.add(id));
    const points = sh.pointIds.map((id, i) => {
      const p = s.points.find(x => x.id === id);
      return {
        role: roleFor(sh.type, i), id: p.id,
        x: +p.mesh.position.x.toFixed(4),
        y: +p.mesh.position.y.toFixed(4),
        z: +p.mesh.position.z.toFixed(4)
      };
    });
    return {
      id: sh.id, name: sh.name, type: sh.type,
      color: '#' + sh.color.toString(16).padStart(6,'0'),
      locked: !!sh.locked, points,
      pendulum: sh.pendulum ? {
        axis: sh.pendulum.axis.toArray().map(v => +v.toFixed(2)),
        amplitude: +sh.pendulum.amplitude.toFixed(3),
        speed: +sh.pendulum.speed.toFixed(3),
        phase: +sh.pendulum.phase.toFixed(3)
      } : null
    };
  });
  const freePoints = s.points
    .filter(p => !usedIds.has(p.id))
    .map(p => ({
      id: p.id,
      x: +p.mesh.position.x.toFixed(4),
      y: +p.mesh.position.y.toFixed(4),
      z: +p.mesh.position.z.toFixed(4)
    }));
  return { name: s.name, shapes, freePoints };
}
function serializeAll(){
  return {
    v: 5, type: 'all', current: state.currentSceneId,
    axisConvention: { x: 'right+', y: 'up+', z: 'back+ (forward = −Z)' },
    scenes: state.scenes.map(s => ({ id: s.id, ...serializeScene(s) }))
  };
}
function serializeCurrentScene(){
  const s = cs();
  return { v: 5, type: 'scene', ...serializeScene(s),
    axisConvention: { x: 'right+', y: 'up+', z: 'back+ (forward = −Z)' } };
}

function deserializeSceneInto(target, data){
  if (data.v === 1 || data.v === 2) data = migrateV1toV2(data);
  for (const p of target.points){
    target.group.remove(p.mesh);
    if (p._ring) target.group.remove(p._ring);
  }
  for (const sh of target.shapes){
    if (sh.mesh) target.group.remove(sh.mesh);
    if (sh._anchorMark) target.group.remove(sh._anchorMark);
  }
  target.points = []; target.shapes = [];
  target.nextLocalId = 1;
  if (data.name) target.name = data.name;

  (data.shapes || []).forEach(sd => {
    const colorInt = typeof sd.color === 'string'
      ? parseInt(sd.color.replace('#',''), 16) : (sd.color || 0x66aaff);
    const pointIds = [];
    (sd.points || []).forEach(pd => {
      const mesh = new THREE.Mesh(POINT_GEO_NORMAL, makePointMat(null));
      mesh.position.set(pd.x, pd.y, pd.z);
      mesh.userData.pointId = pd.id;
      target.group.add(mesh);
      target.points.push({ id: pd.id, mesh });
      pointIds.push(pd.id);
      target.nextLocalId = Math.max(target.nextLocalId, pd.id + 1);
    });
    const shape = {
      id: sd.id, name: sd.name, type: sd.type,
      pointIds, locked: !!sd.locked,
      color: colorInt, mesh: null, pendulum: null
    };
    target.shapes.push(shape);
    target.nextLocalId = Math.max(target.nextLocalId, sd.id + 1);
  });
  (data.freePoints || []).forEach(pd => {
    const mesh = new THREE.Mesh(POINT_GEO_NORMAL, makePointMat(null));
    mesh.position.set(pd.x, pd.y, pd.z);
    mesh.userData.pointId = pd.id;
    target.group.add(mesh);
    target.points.push({ id: pd.id, mesh });
    target.nextLocalId = Math.max(target.nextLocalId, pd.id + 1);
  });

  const oldCurrent = state.currentSceneId;
  state.currentSceneId = target.id;
  target.shapes.forEach(sh => rebuildShape(sh));

  (data.shapes || []).forEach(sd => {
    if (!sd.pendulum) return;
    const sh = target.shapes.find(x => x.id === sd.id);
    if (!sh) return;
    const pts = sh.pointIds.map(id => getPoint(id).mesh.position);
    const anchor = centroidOf(pts);
    const baseOffsets = {};
    sh.pointIds.forEach(id => {
      const p = getPoint(id);
      baseOffsets[id] = p.mesh.position.clone().sub(anchor);
    });
    sh.pendulum = {
      anchor, baseOffsets,
      groupOffset: sh.mesh.position.clone().sub(anchor),
      axis: new THREE.Vector3(...(sd.pendulum.axis || [1,0,0])),
      amplitude: sd.pendulum.amplitude ?? 0.75,
      speed: sd.pendulum.speed ?? 1.2,
      phase: sd.pendulum.phase ?? 0
    };
    sh.locked = true;
    const g = new THREE.Group();
    const m = new THREE.MeshBasicMaterial({color:0xbb66ff});
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.5,0.02), m));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.5), m));
    g.position.copy(anchor);
    sh._anchorMark = g;
    target.group.add(g);
  });

  state.currentSceneId = oldCurrent;
  refreshPointVisuals();
}
function migrateV1toV2(data){
  const used = new Set();
  const shapes = (data.shapes || []).map(s => {
    const pts = (s.pointIds || []).map(id => {
      const p = (data.points || []).find(x => x.id === id);
      if (!p) return null;
      used.add(id);
      return { id: p.id, x: p.x, y: p.y, z: p.z };
    }).filter(Boolean);
    return {
      id: s.id, name: s.name, type: s.type,
      color: '#' + (s.color || 0x66aaff).toString(16).padStart(6,'0'),
      locked: !!s.locked, points: pts, pendulum: null
    };
  });
  const freePoints = (data.points || [])
    .filter(p => !used.has(p.id))
    .map(p => ({ id: p.id, x: p.x, y: p.y, z: p.z }));
  return { name: data.name, shapes, freePoints };
}
function deserializeAll(data){
  state.scenes.forEach(s => {
    threeScene.remove(s.group);
    s.group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  });
  state.scenes = []; state.nextSceneId = 1;
  state.selectedPoints.clear(); state.selectedShapes.clear();
  (data.scenes || []).forEach(sd => {
    const s = newScene(sd.name || ('сцена-' + state.scenes.length));
    deserializeSceneInto(s, sd);
    s.id = sd.id || s.id;
    state.nextSceneId = Math.max(state.nextSceneId, s.id + 1);
  });
  if (!state.scenes.length) newScene();
  const cur = data.current && state.scenes.find(x => x.id === data.current);
  switchScene(cur ? cur.id : state.scenes[0].id);
  refreshSceneBtn();
}
function showJSON(exporting){
  if (exporting){
    const data = serializeCurrentScene();
    const txt = JSON.stringify(data, null, 2);
    jsonEl.value = txt;
    try { navigator.clipboard.writeText(txt); hud('в буфер'); }
    catch(e){ hud('нажми 📋'); }
  } else { jsonEl.value = ''; jsonEl.placeholder = 'Вставь JSON...'; }
  jsonEl.classList.add('show'); jsonbar.classList.add('show');
}
document.getElementById('copyAll').onclick = async () => {
  jsonEl.focus(); jsonEl.select();
  try { await navigator.clipboard.writeText(jsonEl.value); hud('скопировано ✓'); }
  catch(e){
    try { document.execCommand('copy'); hud('скопировано ✓'); }
    catch(e2){ hud('выдели вручную'); }
  }
};
document.getElementById('applyJson').onclick = () => {
  const txt = jsonEl.value.trim(); if (!txt) return hud('пусто');
  try {
    const data = JSON.parse(txt);
    if (data.type === 'all' || (data.scenes && Array.isArray(data.scenes)))
      deserializeAll(data);
    else { deserializeSceneInto(cs(), data); refreshSceneBtn(); refreshSelection(); }
    hud('загружено');
  } catch(e){ hud('ошибка: ' + e.message); }
};
document.getElementById('closeJson').onclick = () => {
  jsonEl.classList.remove('show'); jsonbar.classList.remove('show');
};

/* ================= HUD ================= */
const hudEl = document.getElementById('hud');
let hudMsg = '';

function describe(p){
  const parts = [];
  const fmt = v => Math.abs(v).toFixed(2);
  if (Math.abs(p.x) > 0.01) parts.push(fmt(p.x) + 'м ' + (p.x>0?'вправо':'влево'));
  if (Math.abs(p.y) > 0.01) parts.push(fmt(p.y) + 'м ' + (p.y>0?'вверх':'вниз'));
  // Z: вперёд = отрицательный
  if (Math.abs(p.z) > 0.01) parts.push(fmt(p.z) + 'м ' + (p.z<0?'вперёд':'назад'));
  return parts.length ? parts.join(', ') : 'в нуле';
}

function hud(msg){
  if (msg) hudMsg = msg;
  const s = cs();
  const sceneName = s ? s.name : '—';
  const shapeList = s ? s.shapes.map(sh => {
    const tag = sh.pendulum ? '🎯' : (sh.locked ? '🔒' : '·');
    return `${tag}${sh.name}`;
  }).join('  ') : '';
  let coords = '';
  if (state.selectedPoints.size && s){
    const ids = [...state.selectedPoints].slice(0, 2);
    coords = ids.map(id => {
      const p = s.points.find(x => x.id === id);
      if (!p) return '';
      const v = p.mesh.position;
      return `• №${id}  X${v.x>=0?'+':''}${v.x.toFixed(2)}  Y${v.y>=0?'+':''}${v.y.toFixed(2)}  Z${v.z>=0?'+':''}${v.z.toFixed(2)}\n  ${describe(v)}`;
    }).join('\n');
    if (state.selectedPoints.size > 2) coords += `\n…ещё ${state.selectedPoints.size-2}`;
  }
  const dragName = {ground:'⬛ вперёд/вбок', vertical:'↕ верх/низ', screen:'🖐 своб'}[state.dragMode];
  hudEl.textContent =
    `🎬 ${sceneName} · точек:${s?s.points.length:0} фигур:${s?s.shapes.length:0}\n` +
    `ось:${state.axisName}  режим:${dragName}` +
    (state.paused ? '  ПАУЗА' : '') +
    (shapeList ? '\n' + shapeList : '') +
    `\nвыд: т${state.selectedPoints.size} ф${state.selectedShapes.size}` +
    (coords ? '\n' + coords : '') +
    (hudMsg ? '\n' + hudMsg : '');
}

/* ================= сохранение ================= */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem('forma.v7', JSON.stringify(serializeAll())); } catch(e){}
  }, 400);
}
function load(){
  try {
    const raw = localStorage.getItem('forma.v7');
    if (raw){ deserializeAll(JSON.parse(raw)); return; }
    for (const key of ['forma.v6','forma.v5','forma.v4']){
      const old = localStorage.getItem(key);
      if (old){ deserializeAll(JSON.parse(old)); return; }
    }
  } catch(e){}
  const s = newScene('сцена-1');
  switchScene(s.id);
}

/* ================= анимация ================= */
const clock = new THREE.Clock();
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();

function animate(){
  const t = clock.getElapsedTime();
  for (const s of state.scenes){
    if (!s.group.visible) continue;
    for (const sh of s.shapes){
      const pl = sh.pendulum;
      if (!pl || !sh.mesh) continue;
      const angle = state.paused ? 0 : Math.sin(t * pl.speed + pl.phase) * pl.amplitude;
      tmpQ.setFromAxisAngle(pl.axis, angle);
      tmpV.copy(pl.groupOffset).applyQuaternion(tmpQ);
      sh.mesh.position.copy(pl.anchor).add(tmpV);
      sh.mesh.quaternion.copy(tmpQ);
      for (const pid of sh.pointIds){
        const p = s.points.find(x => x.id === pid);
        if (!p) continue;
        tmpV.copy(pl.baseOffsets[pid]).applyQuaternion(tmpQ);
        p.mesh.position.copy(pl.anchor).add(tmpV);
        if (p._ring) p._ring.position.copy(p.mesh.position);
      }
    }
    for (const p of s.points){
      if (p._ring && p._ring.visible) p._ring.lookAt(camera.position);
    }
  }
  controls.update();
  renderer.render(threeScene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

load();
refreshSceneBtn();
hud('готов · X→ право, Y↑ верх, Z← вперёд (в минус)');
animate();
</script>
