<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 8, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(3.2, 2.0, 4.0);
camera.lookAt(0, 0.95, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1;
controls.target.set(0, 0.95, 0);
controls.minDistance = 0.4; controls.maxDistance = 20;

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(4, 7, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.7);
fill.position.set(-4, 2, -5); scene.add(fill);

const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.55; grid.material.transparent = true;
scene.add(grid);
scene.add(new THREE.AxesHelper(0.8));

/* ================= чакры ================= */
const CHAKRAS = [
  { label:'копчик',     bone:['hips','pelvis'] },
  { label:'сакральн',   bone:['spine'] },
  { label:'сплетение',  bone:['spine1'] },
  { label:'сердце',     bone:['spine2','chest'] },
  { label:'горло',      bone:['neck'] },
  { label:'3-й глаз',   bone:['head'] },
  { label:'макушка',    bone:['headtop_end'] }
];

/* ================= манипуляторы ================= */
const MANIPULATORS = [
  { key:'макушка', bone:'head',        color:0xffcc44, size:0.075 },
  { key:'плечо Л', bone:'leftarm',     color:0x88ff88, size:0.065 },
  { key:'плечо П', bone:'rightarm',    color:0x88ff88, size:0.065 },
  { key:'локоть Л',bone:'leftforearm', color:0x88ff88, size:0.055 },
  { key:'локоть П',bone:'rightforearm',color:0x88ff88, size:0.055 },
  { key:'копчик',  bone:'hips',        color:0xff66aa, size:0.07 },
  { key:'бедро Л', bone:'leftupleg',   color:0xcc88ff, size:0.065 },
  { key:'бедро П', bone:'rightupleg',  color:0xcc88ff, size:0.065 }
];

// какой костью управляет ручка (для AIM) — от корня к ручке
const AIM_BONES = new Set(['leftarm','rightarm','leftforearm','rightforearm',
  'leftupleg','rightupleg','head']);

let K_STRENGTH = 1.0;

/* ================= состояние ================= */
const state = {
  model: null,
  skeletonHelper: null,
  bones: {},
  boneList: [],
  centerIdx: 0,
  centerWorld: new THREE.Vector3(0, 0.95, 0),
  r: 0.6,
  userHeight: 1.8,
  upperTetra: null,
  lowerTetra: null,
  sphere: null,
  sphereWire: null,
  manip: [],
  manipRays: [],
  centerRays: [],
  // диагностика
  diagPoints: [],   // 10 точек тела для анализа
  diagLines: [],    // отвесы к полу
  diagHorizL: null, // линия горизонтали таза
  diagHorizS: null, // линия горизонтали плеч
  // флаги
  showSkeleton: true,
  showMerkaba: true,
  showSphere: true,
  showManip: true,
  showFaces: true,
  showEdges: true,
  showRays: true,
  showBoneRays: true,
  showDiag: true,
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.4,
  breathAmp: 0.04,
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDownInfo: null
};

/* ================= диагностические точки ================= */
const DIAG_POINTS = [
  { bone:'headtop_end',  label:'макушка',   pair:null,       axis:'vertical' },
  { bone:'leftshoulder', label:'плечо Л',   pair:'rightshoulder', axis:'shoulders' },
  { bone:'rightshoulder',label:'плечо П',   pair:'leftshoulder',  axis:'shoulders' },
  { bone:'leftupleg',    label:'бедро Л',   pair:'rightupleg',    axis:'hips' },
  { bone:'rightupleg',   label:'бедро П',   pair:'leftupleg',     axis:'hips' },
  { bone:'leftfoot',     label:'стопа Л',   pair:'rightfoot',     axis:'feet' },
  { bone:'rightfoot',    label:'стопа П',   pair:'leftfoot',      axis:'feet' },
  { bone:'neck',         label:'шея',       pair:null,            axis:'vertical' }
];

/* ================= математика ================= */
function computeIdealMerkaba(C, r){
  const Rb = 2 * Math.sqrt(2) * r;
  const R = 3 * r;
  const upper = [];
  upper.push(new THREE.Vector3(C.x, C.y + R, C.z));
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 + Math.PI / 2;
    upper.push(new THREE.Vector3(C.x + Rb*Math.cos(a), C.y - r, C.z + Rb*Math.sin(a)));
  }
  const lower = [];
  lower.push(new THREE.Vector3(C.x, C.y - R, C.z));
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 + Math.PI / 2 + Math.PI / 3;
    lower.push(new THREE.Vector3(C.x + Rb*Math.cos(a), C.y + r, C.z + Rb*Math.sin(a)));
  }
  return { upper, lower };
}

function findBoneWorld(names){
  for (const n of names){
    const b = state.bones[n.toLowerCase()];
    if (b){
      b.updateWorldMatrix(true, false);
      const v = new THREE.Vector3();
      b.getWorldPosition(v);
      return v;
    }
  }
  return null;
}

/* ================= объекты ================= */
function makeTetraObj(color, opacity = 0.06){
  const group = new THREE.Group();
  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  faceGeo.setIndex([0,1,2, 0,2,3, 0,3,1, 1,3,2]);
  const faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: opacity, side: THREE.DoubleSide,
    emissive: color, emissiveIntensity: 0.25, depthWrite: false
  }));
  group.add(faceMesh);
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.75
  }));
  group.add(edgeLines);
  return { group, faceMesh, edgeLines };
}

const HIT_GEO = new THREE.SphereGeometry(0.22, 8, 6);
const HIT_MAT = new THREE.MeshBasicMaterial({visible: false});

function buildMerkaba(){
  state.upperTetra = makeTetraObj(0x66aaff, 0.06);
  scene.add(state.upperTetra.group);
  state.lowerTetra = makeTetraObj(0xff77cc, 0.06);
  scene.add(state.lowerTetra.group);

  state.sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({
      color: 0xffaa44, transparent: true, opacity: 0.15,
      emissive: 0xff6600, emissiveIntensity: 0.5,
      depthWrite: false, side: THREE.DoubleSide
    }));
  scene.add(state.sphere);
  state.sphereWire = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({
      color: 0xffdd88, transparent: true, opacity: 0.15,
      wireframe: true, depthWrite: false
    }));
  scene.add(state.sphereWire);

  for (let i = 0; i < 8; i++){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: i < 4 ? 0xffcc88 : 0xff88cc, transparent: true, opacity: 0.3
    }));
    scene.add(l);
    state.centerRays.push(l);
  }

  updateAll();
}

function buildManipulators(){
  for (const m of state.manip){
    scene.remove(m.mesh); scene.remove(m.label);
  }
  state.manip = [];
  for (const r of state.manipRays) scene.remove(r);
  state.manipRays = [];

  for (let i = 0; i < MANIPULATORS.length; i++){
    const spec = MANIPULATORS[i];
    const pos = findBoneWorld([spec.bone]) || new THREE.Vector3(0, 1, 0);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(spec.size, 22, 16),
      new THREE.MeshStandardMaterial({
        color: spec.color, emissive: spec.color, emissiveIntensity: 1.0,
        transparent: true, opacity: 0.95
      })
    );
    mesh.position.copy(pos);
    mesh.userData.isManip = true;
    mesh.userData.manipIdx = i;
    mesh.renderOrder = 5;
    mesh.add(new THREE.Mesh(HIT_GEO, HIT_MAT));
    scene.add(mesh);

    const label = makeLabel(spec.key, '#88ccff', 22);
    label.position.copy(pos).add(new THREE.Vector3(0, -0.13, 0));
    scene.add(label);

    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const ray = new THREE.Line(rg, new THREE.LineBasicMaterial({
      color: 0x00ffcc, transparent: true, opacity: 0.9
    }));
    scene.add(ray);
    state.manipRays.push(ray);

    state.manip.push({
      mesh, label, key: spec.key,
      boneName: spec.bone, restPos: pos.clone(), color: spec.color
    });
  }
}

/* ================= диагностический слой ================= */
function buildDiagnostic(){
  // отвесы (вертикальные линии от точки до пола)
  for (const p of DIAG_POINTS){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(g, new THREE.LineDashedMaterial({
      color: 0x556677, dashSize: 0.06, gapSize: 0.04,
      transparent: true, opacity: 0.5
    }));
    scene.add(line);
    state.diagLines.push(line);
  }
  // горизонт таза
  const gh = new THREE.BufferGeometry();
  gh.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  state.diagHorizH = new THREE.Line(gh, new THREE.LineBasicMaterial({
    color: 0x00ff88, linewidth: 2
  }));
  scene.add(state.diagHorizH);

  // горизонт плеч
  const gs = new THREE.BufferGeometry();
  gs.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  state.diagHorizS = new THREE.Line(gs, new THREE.LineBasicMaterial({
    color: 0x00ff88, linewidth: 2
  }));
  scene.add(state.diagHorizS);
}

function makeLabel(text, color, size=24){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(0.30, 0.075, 1);
  return sp;
}

/* ================= AIM ================= */
function aimBoneAtRoot(bone, targetWorld, k){
  if (!bone.userData.restQuat) return;
  bone.quaternion.copy(bone.userData.restQuat);
  bone.updateWorldMatrix(true, false);

  const bonePos = new THREE.Vector3();
  bone.getWorldPosition(bonePos);
  const worldQuat = new THREE.Quaternion();
  bone.getWorldQuaternion(worldQuat);
  const yAxis = new THREE.Vector3(0,1,0).applyQuaternion(worldQuat).normalize();

  const toTarget = targetWorld.clone().sub(bonePos);
  if (toTarget.lengthSq() < 1e-8) return;
  toTarget.normalize();

  const kk = Math.max(0, Math.min(1.5, k));
  const blended = yAxis.clone().lerp(toTarget, kk).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(yAxis, blended);
  const newWorldQuat = q.multiply(worldQuat);

  const pq = new THREE.Quaternion();
  if (bone.parent) bone.parent.getWorldQuaternion(pq);
  bone.quaternion.copy(pq.clone().invert().multiply(newWorldQuat));
  bone.updateWorldMatrix(true, false);
}

/* ================= update ================= */
function updateTetraMesh(t, verts){
  const pos = [];
  const faces = [[0,1,2],[0,2,3],[0,3,1],[1,2,3]];
  for (const f of faces)
    for (const i of f) pos.push(verts[i].x, verts[i].y, verts[i].z);
  t.faceMesh.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(pos, 3));
  t.faceMesh.geometry.computeVertexNormals();
  const edges = [[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]];
  const ep = [];
  for (const [a,b] of edges){
    ep.push(verts[a].x, verts[a].y, verts[a].z);
    ep.push(verts[b].x, verts[b].y, verts[b].z);
  }
  t.edgeLines.geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(ep, 3));
}

function getDepth(obj){
  let d = 0, p = obj.parent;
  while (p){ d++; p = p.parent; }
  return d;
}

function updateAll(){
  if (!state.model) return;

  // 1. Все кости в rest
  for (const b of state.boneList){
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
  }
  state.model.updateMatrixWorld(true);

  // 2. AIM по манипуляторам
  const controlled = [];
  for (const m of state.manip){
    const bone = state.bones[m.boneName.toLowerCase()];
    if (!bone) continue;
    controlled.push({ bone, boneName: m.boneName.toLowerCase(),
      target: m.mesh.position.clone(), depth: getDepth(bone) });
  }
  controlled.sort((a,b) => a.depth - b.depth);
  for (const c of controlled){
    if (AIM_BONES.has(c.boneName)) aimBoneAtRoot(c.bone, c.target, K_STRENGTH);
  }
  state.model.updateMatrixWorld(true);

  // 3. Меркаба
  const { upper, lower } = computeIdealMerkaba(state.centerWorld, state.r);
  updateTetraMesh(state.upperTetra, upper);
  updateTetraMesh(state.lowerTetra, lower);

  let r = state.r;
  if (state.breathing) r += Math.sin(state.breathPhase) * state.breathAmp;
  state.sphere.position.copy(state.centerWorld);
  state.sphere.scale.setScalar(r);
  state.sphereWire.position.copy(state.centerWorld);
  state.sphereWire.scale.setScalar(r);

  // 4. Лучи к центру
  for (let i = 0; i < 8; i++){
    const v = i < 4 ? upper[i] : lower[i-4];
    const a = state.centerRays[i].geometry.attributes.position.array;
    a[0] = v.x; a[1] = v.y; a[2] = v.z;
    a[3] = state.centerWorld.x; a[4] = state.centerWorld.y; a[5] = state.centerWorld.z;
    state.centerRays[i].geometry.attributes.position.needsUpdate = true;
    state.centerRays[i].visible = state.showRays;
  }

  // 5. Лучи манипулятор → кость
  for (let i = 0; i < state.manip.length; i++){
    const m = state.manip[i];
    const bone = state.bones[m.boneName.toLowerCase()];
    const ray = state.manipRays[i];
    if (bone){
      const bp = new THREE.Vector3();
      bone.getWorldPosition(bp);
      const a = ray.geometry.attributes.position.array;
      a[0] = m.mesh.position.x; a[1] = m.mesh.position.y; a[2] = m.mesh.position.z;
      a[3] = bp.x; a[4] = bp.y; a[5] = bp.z;
      ray.geometry.attributes.position.needsUpdate = true;
      ray.visible = state.showBoneRays && state.showManip;
    } else ray.visible = false;

    const delta = m.mesh.position.distanceTo(m.restPos);
    m.label.position.copy(m.mesh.position).add(new THREE.Vector3(0, 0.14, 0));
    updateLabelText(m.label, m.key + ' ' + (delta*100).toFixed(0) + 'см');
    const t = Math.min(delta / (state.r * 1.5), 1);
    const col = new THREE.Color(m.color).lerp(new THREE.Color(0xff3333), t);
    m.mesh.material.color.copy(col);
    m.mesh.material.emissive.copy(col);
    m.mesh.visible = state.showManip;
    m.label.visible = state.showManip;
  }

  // 6. ДИАГНОСТИКА
  updateDiagnostic();

  // 7. Видимость
  state.upperTetra.group.visible = state.showMerkaba;
  state.lowerTetra.group.visible = state.showMerkaba;
  state.upperTetra.faceMesh.visible = state.showFaces;
  state.lowerTetra.faceMesh.visible = state.showFaces;
  state.upperTetra.edgeLines.visible = state.showEdges;
  state.lowerTetra.edgeLines.visible = state.showEdges;
  state.sphere.visible = state.showSphere;
  state.sphereWire.visible = state.showSphere;

  document.getElementById('rVal').textContent = state.r.toFixed(2) + ' м';
}

function updateDiagnostic(){
  const vis = state.showDiag;

  // текущие позиции диagnostic-точек
  const realPts = {};
  for (let i = 0; i < DIAG_POINTS.length; i++){
    const p = DIAG_POINTS[i];
    const pos = findBoneWorld([p.bone]);
    if (!pos) { state.diagLines[i].visible = false; continue; }
    realPts[p.bone] = pos;

    // отвес вниз к полу
    const arr = state.diagLines[i].geometry.attributes.position.array;
    arr[0] = pos.x; arr[1] = pos.y; arr[2] = pos.z;
    arr[3] = pos.x; arr[4] = 0;    arr[5] = pos.z;
    state.diagLines[i].geometry.attributes.position.needsUpdate = true;
    state.diagLines[i].computeLineDistances();
    state.diagLines[i].visible = vis;
  }

  // горизонт таза
  const lHip = realPts['leftupleg'];
  const rHip = realPts['rightupleg'];
  let hipDiff = 0;
  if (lHip && rHip){
    const a = state.diagHorizH.geometry.attributes.position.array;
    a[0] = lHip.x; a[1] = lHip.y; a[2] = lHip.z;
    a[3] = rHip.x; a[4] = rHip.y; a[5] = rHip.z;
    state.diagHorizH.geometry.attributes.position.needsUpdate = true;
    hipDiff = (lHip.y - rHip.y) * 100; // см
    // цвет: зелёный если <2см, жёлтый <5, красный больше
    const c = Math.abs(hipDiff) < 2 ? 0x00ff88 :
              Math.abs(hipDiff) < 5 ? 0xffcc44 : 0xff4444;
    state.diagHorizH.material.color.setHex(c);
    state.diagHorizH.visible = vis;
  }

  // горизонт плеч
  const lSh = realPts['leftshoulder'];
  const rSh = realPts['rightshoulder'];
  let shDiff = 0;
  if (lSh && rSh){
    const a = state.diagHorizS.geometry.attributes.position.array;
    a[0] = lSh.x; a[1] = lSh.y; a[2] = lSh.z;
    a[3] = rSh.x; a[4] = rSh.y; a[5] = rSh.z;
    state.diagHorizS.geometry.attributes.position.needsUpdate = true;
    shDiff = (lSh.y - rSh.y) * 100;
    const c = Math.abs(shDiff) < 2 ? 0x00ff88 :
              Math.abs(shDiff) < 5 ? 0xffcc44 : 0xff4444;
    state.diagHorizS.material.color.setHex(c);
    state.diagHorizS.visible = vis;
  }

  // таблица
  const el = document.getElementById('diag');
  let html = '<div style="font-size:9px;color:#89c;margin-bottom:3px;">АСИММЕТРИИ</div>';

  const f = (d) => {
    const a = Math.abs(d);
    const cls = a < 2 ? 'ok' : a < 5 ? 'warn' : 'bad';
    const arrow = d > 0 ? 'Л выше П' : 'П выше Л';
    return {cls, text: a.toFixed(1) + 'см · ' + arrow};
  };

  const h = f(hipDiff);
  html += `<div class="item"><span>таз</span><span class="${h.cls}">${h.text}</span></div>`;

  const s = f(shDiff);
  html += `<div class="item"><span>плечи</span><span class="${s.cls}">${s.text}</span></div>`;

  // наклон головы
  const head = realPts['headtop_end'];
  const neck = realPts['neck'];
  if (head && neck){
    const dx = (head.x - neck.x) * 100;
    const cls = Math.abs(dx) < 2 ? 'ok' : Math.abs(dx) < 5 ? 'warn' : 'bad';
    html += `<div class="item"><span>голова</span><span class="${cls}">${dx.toFixed(1)}см ${dx>0?'вправо':'влево'}</span></div>`;
  }

  // ПОДСКАЗКИ — какую ручку тянуть
  html += '<div class="tip">';
  if (Math.abs(hipDiff) >= 2){
    html += hipDiff > 0
      ? `▸ правый таз ниже → подтяни <b>бедро П</b> вверх на ${Math.abs(hipDiff).toFixed(0)}см<br>`
      : `▸ левый таз ниже → подтяни <b>бедро Л</b> вверх на ${Math.abs(hipDiff).toFixed(0)}см<br>`;
  }
  if (Math.abs(shDiff) >= 2){
    html += shDiff > 0
      ? `▸ правое плечо ниже → подтяни <b>плечо П</b> вверх на ${Math.abs(shDiff).toFixed(0)}см<br>`
      : `▸ левое плечо ниже → подтяни <b>плечо Л</b> вверх на ${Math.abs(shDiff).toFixed(0)}см<br>`;
  }
  if (Math.abs(hipDiff) < 2 && Math.abs(shDiff) < 2){
    html += '✓ тело симметрично по тазу и плечам';
  }
  html += '</div>';

  el.innerHTML = html;
}

function updateLabelText(sprite, text){
  if (sprite.userData.text === text) return;
  sprite.userData.text = text;
  sprite.material.map.dispose();
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#88ccff';
  ctx.font = 'bold 22px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  sprite.material.map = tex;
  sprite.material.needsUpdate = true;
}

/* ================= reset ================= */
function resetToT(){
  for (const b of state.boneList){
    if (b.userData.restQuat){
      b.quaternion.copy(b.userData.restQuat);
      b.updateWorldMatrix(true, false);
    }
  }
  state.model.updateMatrixWorld(true);
  for (const m of state.manip){
    const pos = findBoneWorld([m.boneName]);
    if (pos){ m.restPos.copy(pos); m.mesh.position.copy(pos); }
  }
  updateAll();
  hud('T-поза восстановлена');
}

/* ================= чакры ================= */
function buildChakraButtons(){
  const row = document.getElementById('chakraRow');
  row.innerHTML = '';
  CHAKRAS.forEach((ch, i) => {
    const b = document.createElement('button');
    b.textContent = ch.label;
    b.style.cssText = 'flex:1;min-width:38px;background:#1a1a2a;color:#cce;' +
      'border:1px solid #445;border-radius:6px;padding:5px 4px;font-size:10px;' +
      'font-weight:bold;font-family:inherit;';
    b.classList.toggle('on', i === state.centerIdx);
    if (i === state.centerIdx) b.style.background = '#5a2a6a';
    b.onclick = () => setCenter(i);
    row.appendChild(b);
  });
}

function setCenter(idx){
  state.centerIdx = idx;
  const pos = findBoneWorld(CHAKRAS[idx].bone);
  if (pos) state.centerWorld.copy(pos);
  document.querySelectorAll('#chakraRow button').forEach((b, i) => {
    b.style.background = i === idx ? '#5a2a6a' : '#1a1a2a';
    b.style.borderColor = i === idx ? '#e8f' : '#445';
  });
  updateAll();
  hud('центр сферы: ' + CHAKRAS[idx].label);
}

/* ================= drag ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(x, y){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
}

function findManipAt(x, y){
  setPointer(x, y);
  raycaster.setFromCamera(pointer, camera);
  const meshes = state.manip.map(m => m.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !obj.userData.isManip) obj = obj.parent;
  return obj;
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  const obj = findManipAt(e.clientX, e.clientY);
  state.pointerDownInfo = {x: e.clientX, y: e.clientY, moved: false};

  if (obj){
    state.dragging = obj;
    controls.enabled = false;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, obj.position);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(obj.position, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', e => {
  if (state.pointerDownInfo && !state.pointerDownInfo.moved){
    const dx = e.clientX - state.pointerDownInfo.x;
    const dy = e.clientY - state.pointerDownInfo.y;
    if (dx*dx + dy*dy > 25) state.pointerDownInfo.moved = true;
  }
  if (!state.dragging) return;
  setPointer(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(state.dragPlane, hit)){
    state.dragging.position.copy(hit.add(state.dragOffset));
    updateAll();
  }
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    state.dragging = null;
    controls.enabled = true;
  }
  state.pointerDownInfo = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= загрузка ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.72;
    }
  });
  scene.add(model);
  state.model = model;

  const skinned = [];
  model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  const boneList = [];
  model.traverse(o => {
    if (o.isBone){
      boneList.push(o);
      o.userData.restQuat = o.quaternion.clone();
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;
  model.updateMatrixWorld(true);
  for (const b of boneList){
    const wq = new THREE.Quaternion();
    b.getWorldQuaternion(wq);
    b.userData.restWorldQuat = wq;
  }

  const startPos = findBoneWorld(CHAKRAS[0].bone);
  if (startPos) state.centerWorld.copy(startPos);

  state.r = state.userHeight / 3;
  slider.value = state.r;

  buildMerkaba();
  buildManipulators();
  buildDiagnostic();
  buildChakraButtons();

  document.getElementById('load').classList.add('hidden');
  hud('готов · диагностика включена');
  refreshUI();
}, undefined, (err) => {
  document.getElementById('load').textContent = 'ошибка: ' + err.message;
});

  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

  state.showSkeleton = !state.showSkeleton;

}, 'on');
btnMerk = btn('🔷 меркаба', () => { state.showMerkaba = !state.showMerkaba; updateAll(); refreshUI(); }, 'on');
btnSph = btn('⚪ сфера', () => { state.showSphere = !state.showSphere; updateAll(); refreshUI(); }, 'on');
btnManip = btn('🎯 ручки', () => { state.showManip = !state.showManip; updateAll(); refreshUI(); }, 'on');
btnDiag = btn('📊 диагност', () => { state.showDiag = !state.showDiag; updateAll(); refreshUI(); }, 'diag on');
btnFaces = btn('🔹 грани', () => { state.showFaces = !state.showFaces; updateAll(); refreshUI(); }, 'on');
btnEdges = btn('📐 рёбра', () => { state.showEdges = !state.showEdges; updateAll(); refreshUI(); }, 'on');
btnRays = btn('📡 к центру', () => { state.showRays = !state.showRays; updateAll(); refreshUI(); }, 'on');
btnBreath = btn('🌬 дыхание', () => { state.breathing = !state.breathing; refreshUI(); }, 'breath');

btn('⟲ T-поза', resetToT, 'reset');
btn('🎥 вид', () => {
  camera.position.set(3.2, 2.0, 4.0);
  controls.target.set(0, 0.95, 0);
  controls.update();
});

function refreshUI(){
  btnSkel.classList.toggle('on', state.showSkeleton);
  btnMerk.classList.toggle('on', state.showMerkaba);
  btnSph.classList.toggle('on', state.showSphere);
  btnManip.classList.toggle('on', state.showManip);
  btnDiag.classList.toggle('on', state.showDiag);
  btnFaces.classList.toggle('on', state.showFaces);
  btnEdges.classList.toggle('on', state.showEdges);
  btnRays.classList.toggle('on', state.showRays);
  btnBreath.classList.toggle('off', state.breathing);
  btnBreath.textContent = state.breathing ? '⏸ дыхание' : '🌬 дыхание';
}

const hudEl = document.getElementById('hud');
function hud(m){ hudEl.textContent = m; }

/* ================= анимация ================= */
const clock = new THREE.Clock();
function animate(){
  const dt = clock.getDelta();
  if (state.breathing){
    state.breathPhase += dt * state.breathSpeed * Math.PI * 2;
    let r = state.r + Math.sin(state.breathPhase) * state.breathAmp;
    state.sphere.scale.setScalar(r);
    state.sphereWire.scale.setScalar(r);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
hud('загружаю Xbot…');
animate();
</script>
