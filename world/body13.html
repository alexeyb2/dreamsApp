<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>меркаба · диагностика</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;color:#ddd;
    font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.78);

    font-family:ui-monospace,monospace;max-width:52%;pointer-events:none;white-space:pre;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:5px;

    padding:8px 10px;font-size:12px;touch-action:manipulation;font-weight:bold;}

  #ui button.on{background:#3a2a5a;border-color:#a67cff;color:#fff;

  #ui button.breath{background:#1a3a1a;border-color:#4a6;}
  #ui button.breath.off{background:#3a1a1a;border-color:#a44;}
  #ui button.diag{background:#2a1a3a;border-color:#b6a;color:#eef;}

  #panel{position:fixed;top:8px;right:8px;z-index:10;
    background:rgba(10,10,20,.94);border:1px solid #66aaff;border-radius:10px;
    padding:8px 10px;font-size:11px;color:#cce;
    font-family:ui-monospace,monospace;display:flex;flex-direction:column;gap:5px;
    min-width:230px;max-width:280px;max-height:85vh;overflow-y:auto;}
  #panel.hidden{display:none;}
  #panelHead{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #223;padding-bottom:4px;}
  #panelHead span{font-size:10px;color:#89c;letter-spacing:.4px;}
  #panelHead button{background:#332;color:#fee;border:none;border-radius:5px;
    padding:3px 7px;font-size:11px;cursor:pointer;}
  #panel label{font-size:10px;color:#89c;}
  #panel .val{color:#8cf;font-weight:bold;}
  #panel .row{display:flex;justify-content:space-between;font-size:11px;}
  #panel input[type=range]{width:100%;accent-color:#66aaff;}
  #panel input[type=number]{width:55px;background:#0a0a14;color:#eee;
    border:1px solid #445;border-radius:4px;padding:3px 4px;font-size:11px;
    font-family:ui-monospace,monospace;text-align:right;}
  #panel .heightRow{display:flex;gap:4px;align-items:center;justify-content:space-between;}
  #panel .heightRow button{background:#3a5a3a;color:#efe;border:1px solid #6a6;
    border-radius:5px;padding:4px 6px;font-size:10px;font-weight:bold;}
  #panel .state{padding:3px 6px;border-radius:5px;font-size:10px;
    background:#1a3a1a;color:#8f8;text-align:center;}
  #panel .state.deformed{background:#3a1a1a;color:#f88;}
  #diag{font-size:10px;line-height:1.6;border-top:1px solid #223;padding-top:5px;}
  #diag .item{display:flex;justify-content:space-between;padding:2px 0;}
  #diag .ok{color:#6f8;}
  #diag .warn{color:#fc6;}
  #diag .bad{color:#f88;}
  #diag .tip{color:#8cf;font-style:italic;font-size:9px;padding:2px 0;
    border-top:1px dashed #223;margin-top:3px;}

  #chakraRow{display:flex;flex-wrap:wrap;gap:3px;}
  #chakraRow button{flex:1;min-width:38px;background:#1a1a2a;color:#cce;
    border:1px solid #445;border-radius:6px;padding:5px 4px;font-size:10px;
    font-weight:bold;font-family:inherit;}
  #chakraRow button.on{background:#5a2a6a;border-color:#e8f;color:#fff;
    box-shadow:0 0 6px #e8f8;}

  #openPanel{position:fixed;top:8px;right:8px;z-index:11;
    background:rgba(40,30,60,.9);color:#eef;border:1px solid #a67cff;
    border-radius:8px;padding:6px 10px;font-size:14px;display:none;}
  #openPanel.show{display:block;}

  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0a0f;z-index:100;font-size:16px;color:#a67cff;}
  #load.hidden{display:none;}
</style>
</head>
<body>
<div id="load">загружаю тело…</div>
<div id="hud">готов</div>

<button id="openPanel">⚙</button>

<div id="panel">
  <div id="panelHead">
    <span>ДИАГНОСТИКА ТЕЛА</span>
    <button id="closePanel">✕</button>
  </div>

  <label>центр сферы</label>
  <div id="chakraRow"></div>

  <div class="heightRow">
    <label>рост</label>
    <input type="number" id="heightInput" value="1.80" step="0.01" min="1.0" max="2.5">
    <button id="heightApply">рост/3</button>
  </div>

  <input type="range" id="radiusSlider" min="0.10" max="1.20" step="0.01" value="0.6">
  <div class="row"><span>r (шар)</span><span class="val" id="rVal">0.60 м</span></div>

  <label>сила притяжения кости</label>
  <input type="range" id="strengthSlider" min="0.3" max="2.5" step="0.05" value="1.0">
  <div class="row"><span>k</span><span class="val" id="kVal">1.00</span></div>

  <div class="state" id="stateInfo">T-поза</div>

  <div id="diag"></div>
</div>

<div id="ui"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 8, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(3.2, 2.0, 4.0);
camera.lookAt(0, 0.95, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1;
controls.target.set(0, 0.95, 0);
controls.minDistance = 0.4; controls.maxDistance = 20;

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(4, 7, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x6688ff, 0.7);
fill.position.set(-4, 2, -5); scene.add(fill);

const grid = new THREE.GridHelper(20, 40, 0x334455, 0x151a22);
grid.material.opacity = 0.55; grid.material.transparent = true;
scene.add(grid);
scene.add(new THREE.AxesHelper(0.8));

/* ================= чакры ================= */
const CHAKRAS = [
  { label:'копчик',     bone:['hips','pelvis'] },
  { label:'сакральн',   bone:['spine'] },
  { label:'сплетение',  bone:['spine1'] },
  { label:'сердце',     bone:['spine2','chest'] },
  { label:'горло',      bone:['neck'] },
  { label:'3-й глаз',   bone:['head'] },
  { label:'макушка',    bone:['headtop_end'] }
];

/* ================= манипуляторы ================= */
const MANIPULATORS = [
  { key:'макушка', bone:'head',        color:0xffcc44, size:0.075 },
  { key:'плечо Л', bone:'leftarm',     color:0x88ff88, size:0.065 },
  { key:'плечо П', bone:'rightarm',    color:0x88ff88, size:0.065 },
  { key:'локоть Л',bone:'leftforearm', color:0x88ff88, size:0.055 },
  { key:'локоть П',bone:'rightforearm',color:0x88ff88, size:0.055 },
  { key:'копчик',  bone:'hips',        color:0xff66aa, size:0.07 },
  { key:'бедро Л', bone:'leftupleg',   color:0xcc88ff, size:0.065 },
  { key:'бедро П', bone:'rightupleg',  color:0xcc88ff, size:0.065 }
];

const AIM_BONES = new Set(['leftarm','rightarm','leftforearm','rightforearm',
  'leftupleg','rightupleg','head']);

let K_STRENGTH = 1.0;

/* ================= состояние ================= */
const state = {
  model: null,
  skeletonHelper: null,
  bones: {},
  boneList: [],
  centerIdx: 0,
  centerWorld: new THREE.Vector3(0, 0.95, 0),
  r: 0.6,
  userHeight: 1.8,
  upperTetra: null,
  lowerTetra: null,
  sphere: null,
  sphereWire: null,
  manip: [],
  manipRays: [],
  centerRays: [],
  // диагностика
  diagPoints: [],
  diagLines: [],
  diagHorizH: null,
  diagHorizS: null,
  // флаги
  showSkeleton: true,
  showMerkaba: true,
  showSphere: true,
  showManip: true,
  showFaces: true,
  showEdges: true,
  showRays: true,
  showBoneRays: true,
  showDiag: true,
  breathing: false,
  breathPhase: 0,
  breathSpeed: 1.4,
  breathAmp: 0.04,
  dragging: null,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDownInfo: null
};

/* ================= диагностические точки ================= */
const DIAG_POINTS = [
  { bone:'headtop_end',   label:'макушка' },
  { bone:'leftshoulder',  label:'плечо Л' },
  { bone:'rightshoulder', label:'плечо П' },
  { bone:'leftupleg',     label:'бедро Л' },
  { bone:'rightupleg',    label:'бедро П' },
  { bone:'leftfoot',      label:'стопа Л' },
  { bone:'rightfoot',     label:'стопа П' },
  { bone:'neck',          label:'шея' }
];

/* ================= математика ================= */
function computeIdealMerkaba(C, r){
  const Rb = 2 * Math.sqrt(2) * r;
  const R = 3 * r;
  const upper = [];
  upper.push(new THREE.Vector3(C.x, C.y + R, C.z));
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 + Math.PI / 2;
    upper.push(new THREE.Vector3(C.x + Rb*Math.cos(a), C.y - r, C.z + Rb*Math.sin(a)));
  }
  const lower = [];
  lower.push(new THREE.Vector3(C.x, C.y - R, C.z));
  for (let i = 0; i < 3; i++){
    const a = i * 2 * Math.PI / 3 + Math.PI / 2 + Math.PI / 3;
    lower.push(new THREE.Vector3(C.x + Rb*Math.cos(a), C.y + r, C.z + Rb*Math.sin(a)));
  }
  return { upper, lower };
}

function findBoneWorld(names){
  for (const n of names){
    const b = state.bones[n.toLowerCase()];
    if (b){
      b.updateWorldMatrix(true, false);
      const v = new THREE.Vector3();
      b.getWorldPosition(v);
      return v;
    }
  }
  return null;
}

/* ================= объекты ================= */
function makeTetraObj(color, opacity = 0.06){
  const group = new THREE.Group();
  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  faceGeo.setIndex([0,1,2, 0,2,3, 0,3,1, 1,3,2]);
  const faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: opacity, side: THREE.DoubleSide,
    emissive: color, emissiveIntensity: 0.25, depthWrite: false
  }));
  group.add(faceMesh);
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
  const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.75
  }));
  group.add(edgeLines);
  return { group, faceMesh, edgeLines };
}

const HIT_GEO = new THREE.SphereGeometry(0.22, 8, 6);
const HIT_MAT = new THREE.MeshBasicMaterial({visible: false});

function makeLabel(text, color, size=24){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(0.30, 0.075, 1);
  return sp;
}

function buildMerkaba(){
  state.upperTetra = makeTetraObj(0x66aaff, 0.06);
  scene.add(state.upperTetra.group);
  state.lowerTetra = makeTetraObj(0xff77cc, 0.06);
  scene.add(state.lowerTetra.group);

  state.sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({
      color: 0xffaa44, transparent: true, opacity: 0.15,
      emissive: 0xff6600, emissiveIntensity: 0.5,
      depthWrite: false, side: THREE.DoubleSide
    }));
  scene.add(state.sphere);
  state.sphereWire = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({
      color: 0xffdd88, transparent: true, opacity: 0.15,
      wireframe: true, depthWrite: false
    }));
  scene.add(state.sphereWire);

  for (let i = 0; i < 8; i++){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: i < 4 ? 0xffcc88 : 0xff88cc, transparent: true, opacity: 0.3
    }));
    scene.add(l);
    state.centerRays.push(l);
  }
}

function buildManipulators(){
  for (const m of state.manip){
    scene.remove(m.mesh); scene.remove(m.label);
  }
  state.manip = [];
  for (const r of state.manipRays) scene.remove(r);
  state.manipRays = [];

  for (let i = 0; i < MANIPULATORS.length; i++){
    const spec = MANIPULATORS[i];
    const pos = findBoneWorld([spec.bone]) || new THREE.Vector3(0, 1, 0);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(spec.size, 22, 16),
      new THREE.MeshStandardMaterial({
        color: spec.color, emissive: spec.color, emissiveIntensity: 1.0,
        transparent: true, opacity: 0.95
      })
    );
    mesh.position.copy(pos);
    mesh.userData.isManip = true;
    mesh.userData.manipIdx = i;
    mesh.renderOrder = 5;
    mesh.add(new THREE.Mesh(HIT_GEO, HIT_MAT));
    scene.add(mesh);

    const label = makeLabel(spec.key, '#88ccff', 22);
    label.position.copy(pos).add(new THREE.Vector3(0, -0.13, 0));
    scene.add(label);

    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const ray = new THREE.Line(rg, new THREE.LineBasicMaterial({
      color: 0x00ffcc, transparent: true, opacity: 0.9
    }));
    scene.add(ray);
    state.manipRays.push(ray);

    state.manip.push({
      mesh, label, key: spec.key,
      boneName: spec.bone, restPos: pos.clone(), color: spec.color
    });
  }
}

/* ================= диагностический слой ================= */
function buildDiagnostic(){
  for (const line of state.diagLines) scene.remove(line);
  state.diagLines = [];

  for (let i = 0; i < DIAG_POINTS.length; i++){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(g, new THREE.LineDashedMaterial({
      color: 0x556677, dashSize: 0.06, gapSize: 0.04,
      transparent: true, opacity: 0.5
    }));
    scene.add(line);
    state.diagLines.push(line);
  }

  if (state.diagHorizH) scene.remove(state.diagHorizH);
  const gh = new THREE.BufferGeometry();
  gh.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),
