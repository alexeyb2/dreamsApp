    console.error(m);

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

try {

/* ================= сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 12, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(3.5, 2.2, 4.5);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1.2, 0);
controls.minDistance = 0.5;
controls.maxDistance = 25;

/* ================= свет ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const keyL = new THREE.DirectionalLight(0xffffff, 1.3);
keyL.position.set(4, 8, 5); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x6688ff, 0.55);
fillL.position.set(-4, 2, -5); scene.add(fillL);

/* ================= пол ================= */
const grid = new THREE.GridHelper(16, 32, 0x334455, 0x151a22);
grid.material.opacity = 0.55;
grid.material.transparent = true;
scene.add(grid);

/* ================= вага X ================= */
const VAGA_REST = new THREE.Vector3(0, 2.10, 0);
const VAGA_HALF = 0.72;

// локальные позиции точек привязки нитей на ваге (относительно центра)
const STRING_SPECS = [
  { key:'кисть Л', bone:'lefthand',   local:new THREE.Vector3(-VAGA_HALF, 0.15, -VAGA_HALF), color:0x88ff88, group:'arm' },
  { key:'кисть П', bone:'righthand',  local:new THREE.Vector3( VAGA_HALF, 0.15, -VAGA_HALF), color:0x88ff88, group:'arm' },
  { key:'стопа Л', bone:'leftfoot',   local:new THREE.Vector3(-VAGA_HALF,-0.20,  VAGA_HALF), color:0xcc88ff, group:'leg' },
  { key:'стопа П', bone:'rightfoot',  local:new THREE.Vector3( VAGA_HALF,-0.20,  VAGA_HALF), color:0xcc88ff, group:'leg' },
  { key:'голова',  bone:'head',       local:new THREE.Vector3( 0,       0.55,  0),        color:0xffcc44, group:'head' }
];

/* ================= состояние ================= */
const state = {
  model: null,
  bones: {},
  boneList: [],
  skeletonHelper: null,
  vagaCenter: VAGA_REST.clone(),
  vagaVisual: null,
  vagaHandle: null,
  strings: [],
  chains: {},           // IK-цепочки
  kStrength: 1.0,
  dragging: false,
  dragPlane: new THREE.Plane(),
  dragOffset: new THREE.Vector3(),
  pointerDown: null,
  showStrings: true,
  showVaga: true,
  showSkeleton: false
};

/* ссылки на кнопки — заранее */
var btnStrings = null;
var btnVaga = null;
var btnSkel = null;
var btnStrong = null;
var btnSoft = null;

/* ================= helpers ================= */
function bone(name){
  return state.bones[name.toLowerCase()] || null;
}

function boneWorld(b){
  if (!b) return null;
  b.updateWorldMatrix(true, false);
  const v = new THREE.Vector3();
  b.getWorldPosition(v);
  return v;
}

function makeLabel(text, color){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 26px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(0.46, 0.11, 1);
  return sp;
}

/* ================= вага ================= */
function buildVaga(){
  if (state.vagaVisual) scene.remove(state.vagaVisual);
  const g = new THREE.Group();
  scene.add(g);
  state.vagaVisual = g;

  const S = VAGA_HALF;
  const mat = new THREE.LineBasicMaterial({color:0xdddddd, transparent:true, opacity:0.95});
  const matUp = new THREE.LineBasicMaterial({color:0xffcc44, transparent:true, opacity:0.95});

  function seg(a, b, m){
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    g.add(new THREE.Line(geo, m));
  }

  // X-крест
  seg(new THREE.Vector3(-S, 0.15, -S), new THREE.Vector3(S, 0.15, S), mat);
  seg(new THREE.Vector3(-S, 0.15,  S), new THREE.Vector3(S, 0.15, -S), mat);
  // нижний брус
  seg(new THREE.Vector3(-S, -0.20, S), new THREE.Vector3(S, -0.20, S), mat);
  // перемычки
  seg(new THREE.Vector3(-S, 0.15, -S), new THREE.Vector3(-S, -0.20, S), mat);
  seg(new THREE.Vector3( S, 0.15, -S), new THREE.Vector3( S, -0.20, S), mat);
  // стойка к ручке
  seg(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.55, 0), matUp);

  // ручка
  state.vagaHandle = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 22, 16),
    new THREE.MeshStandardMaterial({
      color:0xffcc44, emissive:0xffaa00, emissiveIntensity:1.2,
      transparent:true, opacity:0.95
    }));
  state.vagaHandle.userData.isVagaHandle = true;
  state.vagaHandle.renderOrder = 6;
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 8, 6),
    new THREE.MeshBasicMaterial({visible:false}));
  hit.userData.isHit = true;
  state.vagaHandle.add(hit);
  scene.add(state.vagaHandle);

  const sp = makeLabel('ВАГА', '#ffcc44');
  sp.position.set(0, 0.80, 0);
  g.add(sp);
}

/* ================= нити ================= */
function buildStrings(){
  for (const s of state.strings){
    scene.remove(s.mesh); scene.remove(s.line); scene.remove(s.label);
  }
  state.strings = [];

  for (let i = 0; i < STRING_SPECS.length; i++){
    const spec = STRING_SPECS[i];
    const b = bone(spec.bone);
    if (!b) continue;

    // маркер точки — БЕЗ драга, только визуал
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 16, 12),
      new THREE.MeshStandardMaterial({
        color: spec.color, emissive: spec.color, emissiveIntensity: 1.0,
        transparent: true, opacity: 0.95
      }));
    mesh.renderOrder = 5;
    scene.add(mesh);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: spec.color, transparent: true, opacity: 0.7
    }));
    scene.add(line);

    const label = makeLabel(spec.key, '#88ccff');
    scene.add(label);

    state.strings.push({
      mesh, line, label,
      boneRef: b,
      local: spec.local.clone(),
      group: spec.group,
      key: spec.key,
      color: spec.color
    });
  }
}

function stringWorldPos(s){
  return new THREE.Vector3(
    state.vagaCenter.x + s.local.x,
    state.vagaCenter.y + s.local.y,
    state.vagaCenter.z + s.local.z
  );
}

/* ================= CCD-IK =================
   Тянет кончик цепочки костей к точке в мире.
============================================== */
function ccdIK(chain, target, iterations){
  if (!chain || chain.length < 2) return;
  const endIdx = chain.length - 1;

  for (let it = 0; it < iterations; it++){
    for (let i = endIdx - 1; i >= 0; i--){
      const b = chain[i];
      b.updateWorldMatrix(true, false);

      const bonePos = new THREE.Vector3();
      b.getWorldPosition(bonePos);

      const endBone = chain[endIdx];
      endBone.updateWorldMatrix(true, false);
      const endPos = new THREE.Vector3();
      endBone.getWorldPosition(endPos);

      const toEnd = endPos.clone().sub(bonePos);
      const toTarget = target.clone().sub(bonePos);
      if (toEnd.lengthSq() < 1e-8 || toTarget.lengthSq() < 1e-8) continue;

      toEnd.normalize();
      toTarget.normalize();

      const cosA = Math.max(-1, Math.min(1, toEnd.dot(toTarget)));
      const angle = Math.acos(cosA);
      if (angle < 1e-4) continue;

      const axis = new THREE.Vector3().crossVectors(toEnd, toTarget);
      if (axis.lengthSq() < 1e-8) continue;
      axis.normalize();

      const dq = new THREE.Quaternion().setFromAxisAngle(axis, angle);
      const wq = new THREE.Quaternion();
      b.getWorldQuaternion(wq);
      const newWQ = dq.clone().multiply(wq);

      const parentQ = new THREE.Quaternion();
      if (b.parent) b.parent.getWorldQuaternion(parentQ);
      b.quaternion.copy(parentQ.clone().invert().multiply(newWQ));
      b.updateWorldMatrix(true, true);
    }
  }
}

/* ================= построить цепочки IK ================= */
function buildChains(){
  // руки
  const lShoulder = bone('leftshoulder');
  const lArm      = bone('leftarm');
  const lFore     = bone('leftforearm');
  const lHand     = bone('lefthand');
  const rShoulder = bone('rightshoulder');
  const rArm      = bone('rightarm');
  const rFore     = bone('rightforearm');
  const rHand     = bone('righthand');

  const lUpLeg = bone('leftupleg');
  const lLeg   = bone('leftleg');
  const lFoot  = bone('leftfoot');
  const rUpLeg = bone('rightupleg');
  const rLeg   = bone('rightleg');
  const rFoot  = bone('rightfoot');

  const neck   = bone('neck');
  const head   = bone('head');

  state.chains.lArm = [lShoulder, lArm, lFore, lHand].filter(Boolean);
  state.chains.rArm = [rShoulder, rArm, rFore, rHand].filter(Boolean);
  state.chains.lLeg = [lUpLeg, lLeg, lFoot].filter(Boolean);
  state.chains.rLeg = [rUpLeg, rLeg, rFoot].filter(Boolean);
  state.chains.head = [neck, head].filter(Boolean);
}

/* ================= обновить всё ================= */
function updateAll(){
  if (!state.model) return;

  // 1. Сброс всех костей в rest
  for (const b of state.boneList){
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    if (b.userData.restPos) b.position.copy(b.userData.restPos);
  }
  state.model.updateMatrixWorld(true);

  // 2. IK: ноги сначала, потом руки, потом голова
  const iters = Math.max(2, Math.round(state.kStrength * 8));

  if (state.chains.lLeg && state.chains.lLeg.length){
    const target = new THREE.Vector3();
    const s = state.strings.find(function(x){ return x.key === 'стопа Л'; });
    if (s) ccdIK(state.chains.lLeg, stringWorldPos(s), iters);
  }
  if (state.chains.rLeg && state.chains.rLeg.length){
    const s = state.strings.find(function(x){ return x.key === 'стопа П'; });
    if (s) ccdIK(state.chains.rLeg, stringWorldPos(s), iters);
  }
  if (state.chains.lArm && state.chains.lArm.length){
    const s = state.strings.find(function(x){ return x.key === 'кисть Л'; });
    if (s) ccdIK(state.chains.lArm, stringWorldPos(s), iters);
  }
  if (state.chains.rArm && state.chains.rArm.length){
    const s = state.strings.find(function(x){ return x.key === 'кисть П'; });
    if (s) ccdIK(state.chains.rArm, stringWorldPos(s), iters);
  }
  if (state.chains.head && state.chains.head.length){
    const s = state.strings.find(function(x){ return x.key === 'голова'; });
    if (s) ccdIK(state.chains.head, stringWorldPos(s), iters);
  }

  state.model.updateMatrixWorld(true);

  // 3. Визуал ваги
  const off = new THREE.Vector3().subVectors(state.vagaCenter, VAGA_REST);
  if (state.vagaVisual){
    state.vagaVisual.position.copy(off);
    state.vagaVisual.visible = state.showVaga;
  }
  if (state.vagaHandle){
    state.vagaHandle.position.copy(state.vagaCenter);
    state.vagaHandle.visible = state.showVaga;
  }

  // 4. Визуал нитей
  for (const s of state.strings){
    const wpos = stringWorldPos(s);
    s.mesh.position.copy(wpos);

    const bp = new THREE.Vector3();
    s.boneRef.updateWorldMatrix(true, false);
    s.boneRef.getWorldPosition(bp);

    const a = s.line.geometry.attributes.position.array;
    a[0] = wpos.x; a[1] = wpos.y; a[2] = wpos.z;
    a[3] = bp.x;   a[4] = bp.y;   a[5] = bp.z;
    s.line.geometry.attributes.position.needsUpdate = true;
    s.line.visible = state.showStrings;

    s.label.position.set(wpos.x, wpos.y + 0.13, wpos.z);
    s.label.visible = state.showStrings;
    s.mesh.visible = state.showStrings;
  }
}

/* ================= загрузка Xbot ================= */
const loader = new GLTFLoader();
const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

loader.load(MODEL_URL, function(gltf){
  window.__hud('модель получена · собираю');

  const model = gltf.scene;
  model.traverse(function(o){
    if (o.isMesh && o.material){
      o.material.transparent = true;
      o.material.opacity = 0.85;
    }
  });
  scene.add(model);
  state.model = model;

  const skinned = [];
  model.traverse(function(o){ if (o.isSkinnedMesh) skinned.push(o); });
  if (skinned.length){
    const helper = new THREE.SkeletonHelper(model);
    helper.material.depthTest = false;
    helper.renderOrder = 1;
    helper.visible = false;
    scene.add(helper);
    state.skeletonHelper = helper;
  }

  const boneList = [];
  model.traverse(function(o){
    if (o.isBone){
      boneList.push(o);
      o.userData.restQuat = o.quaternion.clone();
      o.userData.restPos = o.position.clone();
      const name = o.name.replace(/^mixamorig:?/i, '').toLowerCase();
      state.bones[name] = o;
    }
  });
  state.boneList = boneList;

  // Руки опустить из T-позы в A-позу
  const lArm = bone('leftarm');
  const rArm = bone('rightarm');
  if (lArm) lArm.rotateZ(-Math.PI * 0.42);
  if (rArm) rArm.rotateZ(Math.PI * 0.42);
  const lFore = bone('leftforearm');
  const rFore = bone('rightforearm');
  if (lFore) lFore.rotateZ(-Math.PI * 0.08);
  if (rFore) rFore.rotateZ(Math.PI * 0.08);

  model.updateMatrixWorld(true);

  // сохранить новую позу как rest
  for (const b of boneList){
    b.userData.restQuat.copy(b.quaternion);
    b.userData.restPos.copy(b.position);
  }

  buildVaga();
  buildStrings();
  buildChains();
  updateAll();

  document.getElementById('load').classList.add('hidden');
  window.__hud('готов · тяни ручку ваги (IK подтянет руки/ноги)');
  refreshUI();
}, undefined, function(err){
  window.__err('модель: ' + (err && err.message ? err.message : err));
  document.getElementById('load').textContent = 'ошибка загрузки';
});

/* ================= управление ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(x, y){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
}

function findVagaHandleAt(x, y){
  setPointer(x, y);
  raycaster.setFromCamera(pointer, camera);
  if (state.vagaHandle && state.vagaHandle.visible){
    const hh = raycaster.intersectObject(state.vagaHandle, true);
    if (hh.length){
      let o = hh[0].object;
      while (o && !o.userData.isVagaHandle) o = o.parent;
      if (o) return o;
    }
  }
  return null;
}

renderer.domElement.addEventListener('pointerdown', function(e){
  if (e.target !== renderer.domElement) return;
  const h = findVagaHandleAt(e.clientX, e.clientY);
  state.pointerDown = {x: e.clientX, y: e.clientY, moved: false};
  if (h){
    state.dragging = true;
    controls.enabled = false;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    state.dragPlane.setFromNormalAndCoplanarPoint(camDir, state.vagaCenter);
    const hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(state.dragPlane, hit);
    state.dragOffset.subVectors(state.vagaCenter, hit);
    e.preventDefault();
  }
}, true);

renderer.domElement.addEventListener('pointermove', function(e){
  if (state.pointerDown && !state.pointerDown.moved){
    const dx = e.clientX - state.pointerDown.x;
    const dy = e.clientY - state.pointerDown.y;
    if (dx*dx + dy*dy > 25) state.pointerDown.moved = true;
  }
  if (!state.dragging) return;
  setPointer(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(state.dragPlane, hit)) return;
  const newPos = hit.add(state.dragOffset);
  state.vagaCenter.copy(newPos);
  updateAll();
  e.preventDefault();
}, {passive:false});

function endDrag(){
  if (state.dragging){
    state.dragging = false;
    controls.enabled = true;
  }
  state.pointerDown = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ================= сброс ================= */
function resetAll(){
  state.vagaCenter.copy(VAGA_REST);
  for (const b of state.boneList){
    if (b.userData.restQuat) b.quaternion.copy(b.userData.restQuat);
    if (b.userData.restPos) b.position.copy(b.userData.restPos);
  }
  state.model.updateMatrixWorld(true);
  updateAll();
}

/* ================= UI ================= */
const ui = document.getElementById('ui');
function mkBtn(label, fn, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  ui.appendChild(b);
  return b;
}

btnStrings = mkBtn('🪢 нити', function(){
  state.showStrings = !state.showStrings; updateAll(); refreshUI();
}, 'on');

btnVaga = mkBtn('✝ вага', function(){
  state.showVaga = !state.showVaga; updateAll(); refreshUI();
}, 'on');

btnSkel = mkBtn('🦴 скелет', function(){
  state.showSkeleton = !state.showSkeleton;
  if (state.skeletonHelper) state.skeletonHelper.visible = state.showSkeleton;
  refreshUI();
});

btnStrong = mkBtn('💪 сильно', function(){
  state.kStrength = 1.4; updateAll(); refreshUI();
});

btnSoft = mkBtn('🪶 мягко', function(){
  state.kStrength = 0.4; updateAll(); refreshUI();
});

mkBtn('⟲ сброс', resetAll, 'reset');
mkBtn('🎥 вид', function(){
  camera.position.set(3.5, 2.2, 4.5);
  controls.target.set(0, 1.2, 0);
  controls.update();
});

/* refreshUI — ПОСЛЕ всех кнопок */
function refreshUI(){
  if (btnStrings) btnStrings.classList.toggle('on', state.showStrings);
  if (btnVaga) btnVaga.classList.toggle('on', state.showVaga);
  if (btnSkel) btnSkel.classList.toggle('on', state.showSkeleton);
  if (btnStrong) btnStrong.classList.toggle('on', state.kStrength === 1.4);
  if (btnSoft) btnSoft.classList.toggle('on', state.kStrength === 0.4);
}

/* ================= анимация ================= */
function animate(){
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', function(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshUI();
window.__hud('загружаю Xbot…');
animate();
