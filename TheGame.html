<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семья: Распорядок дня</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 0%,#2b1f4a 0%,#120d22 45%,#08060f 100%);
    color:#eae6ff;min-height:100vh;padding:16px;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1100px;margin:0 auto}

  /* ── ШАПКА ── */
  header{
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;padding:16px 18px;margin-bottom:16px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    backdrop-filter:blur(8px);
  }
  .clockbox{display:flex;align-items:center;gap:12px}
  #phase{font-size:30px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,220,120,.6))}
  #clock{
    font-size:40px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#b9a4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{
    font-family:inherit;font-size:14px;font-weight:600;color:#eae6ff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    border-radius:12px;padding:9px 14px;cursor:pointer;transition:.15s;
  }
  button:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.on{
    background:linear-gradient(180deg,#8b6bff,#6a45e0);
    border-color:#a68bff;box-shadow:0 0 18px rgba(139,107,255,.55);
  }
  #playBtn{font-size:18px;min-width:52px}

  .bar{
    width:100%;height:7px;border-radius:99px;background:rgba(255,255,255,.08);
    overflow:hidden;margin-top:4px;
  }
  #progress{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#5b8cff,#a06bff,#ff6bd6);
    transition:width .1s linear;
    box-shadow:0 0 12px rgba(160,107,255,.8);
  }

  .hint{
    text-align:center;font-size:12.5px;opacity:.55;margin-bottom:14px;line-height:1.6;
  }
  .hint b{opacity:.9;color:#c9b6ff}

  /* ── ЛОКАЦИИ ── */
  .grid{
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }
  .loc{
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;padding:13px;
    display:flex;flex-direction:column;gap:10px;
    min-height:150px;transition:.18s;position:relative;overflow:hidden;
  }
  .loc::before{
    content:'';position:absolute;inset:0;opacity:0;transition:.2s;pointer-events:none;
    background:radial-gradient(circle at 50% 0%,rgba(160,120,255,.25),transparent 70%);
  }
  .loc:hover::before{opacity:1}
  .loc.dragover{
    border-color:#a68bff;transform:translateY(-3px);
    box-shadow:0 8px 32px rgba(139,107,255,.45),0 0 0 1px #a68bff inset;
  }
  .loc.sleep{background:linear-gradient(160deg,rgba(70,60,140,.35),rgba(20,15,50,.4))}
  .loc.work{background:linear-gradient(160deg,rgba(255,170,80,.11),rgba(255,255,255,.015))}

  .loc-head{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
  .loc-head .ico{font-size:22px;line-height:1}
  .loc-head .sub{font-size:10.5px;font-weight:500;opacity:.5;display:block;margin-top:2px}

  .zone{
    display:flex;flex-wrap:wrap;gap:7px;min-height:74px;
    align-content:flex-start;flex:1;
    border-radius:14px;padding:4px;
    transition:.15s;
  }
  .zone:empty::after{
    content:'пусто';
    font-size:11px;opacity:.22;align-self:center;margin:auto;
  }

  .tok{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:7px 9px;border-radius:15px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.10);
    cursor:grab;transition:.15s;
    animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .tok:hover{background:rgba(255,255,255,.2);transform:translateY(-2px) scale(1.05)}
  .tok:active{cursor:grabbing}
  .tok.dragging{opacity:.35}
  .tok .em{font-size:27px;line-height:1;pointer-events:none}
  .tok .nm{font-size:10px;margin-top:4px;opacity:.75;pointer-events:none;white-space:nowrap}
  .tok.sel{
    background:linear-gradient(180deg,#8b6bff,#6a45e0);
    border-color:#c9b6ff;box-shadow:0 0 20px rgba(139,107,255,.8);
    transform:scale(1.08);
  }

  footer{
    text-align:center;font-size:11.5px;opacity:.4;margin-top:22px;padding-bottom:10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="clockbox">
      <div id="phase">☀️</div>
      <div id="clock">07:00</div>
    </div>
    <div class="ctrls">
      <button id="playBtn">▶</button>
      <button class="speed" data-s="1">×1</button>
      <button class="speed" data-s="5">×5</button>
      <button class="speed" data-s="20">×20</button>
      <button id="resetBtn">🔄 Сброс</button>
    </div>
    <div class="bar"><div id="progress"></div></div>
  </header>

  <div class="hint">
    Перетаскивай смайликов мышкой (или <b>тапни смайлика → тапни по дому</b>).<br>
    <b>7:00–17:00</b> работа и садик · <b>17:00–21:00</b> дома · <b>21:00–7:00</b> сон 😴
  </div>

  <div class="grid" id="grid"></div>

  <footer>Прогресс сохраняется автоматически в localStorage 💾</footer>
</div>

<script>
/* ══════════════ ДАННЫЕ ══════════════ */
const MEMBERS = [
  { id:'me',   emoji:'🥳',          name:'Я' },
  { id:'vika', emoji:'😘',          name:'Вика' },
  { id:'papa', emoji:'😍',          name:'Папа' },
  { id:'mama', emoji:'🥰',          name:'Мама' },
  { id:'baba', emoji:'🤩',          name:'Бабушка' },
  { id:'ded',  emoji:'😶‍🌫️',        name:'Дедушка' },
];

const LOCATIONS = [
  { id:'myhome',   emoji:'🏡', name:'Мой дом',            sub:'дом',        cls:'' },
  { id:'vikahome', emoji:'🏠', name:'Викин дом',          sub:'дом',        cls:'' },
  { id:'work1',    emoji:'🏢', name:'Работа папы и мамы', sub:'10 ч в день', cls:'work' },
  { id:'work2',    emoji:'🏬', name:'Работа бабушки и дедушки', sub:'10 ч в день', cls:'work' },
  { id:'sad',      emoji:'🏩', name:'Викин садик',        sub:'10 ч в день', cls:'work' },
  { id:'sleep',    emoji:'🛏️', name:'Сон',                sub:'21:00 – 7:00', cls:'sleep' },
];

const KEY = 'family-schedule-game-v1';
const DAY_START = 420;   // 07:00
const WORK_END  = 1020;  // 17:00
const SLEEP     = 1260;  // 21:00

/* ══════════════ СОСТОЯНИЕ ══════════════ */
const defaultState = () => ({
  time: DAY_START,
  speed: 1,
  running: false,
  slot: null,
  placements: {}
});

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(typeof s.time !== 'number' || !s.placements) return null;
    return { ...defaultState(), ...s, running:false };
  }catch(e){ return null; }
}

let state = loadState() || defaultState();
let selected = null;

/* ══════════════ РАСПИСАНИЕ ══════════════ */
function getSlot(min){
  if(min >= DAY_START && min < WORK_END) return 'day';      // 7–17
  if(min >= WORK_END  && min < SLEEP)    return 'evening';  // 17–21
  return 'night';                                            // 21–7
}

const PLAN = {
  day:     { me:'myhome', vika:'sad', papa:'work1', mama:'work1', baba:'work2', ded:'work2' },
  evening: { me:'myhome', papa:'myhome', mama:'myhome', vika:'vikahome', baba:'vikahome', ded:'vikahome' },
  night:   { me:'sleep', vika:'sleep', papa:'sleep', mama:'sleep', baba:'sleep', ded:'sleep' },
};

function applySchedule(){
  const plan = PLAN[getSlot(state.time)];
  state.placements = { ...plan };
  state.slot = getSlot(state.time);
}

/* ══════════════ СОХРАНЕНИЕ ══════════════ */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* ══════════════ ПОСТРОЕНИЕ DOM ══════════════ */
const gridEl     = document.getElementById('grid');
const clockEl    = document.getElementById('clock');
const phaseEl    = document.getElementById('phase');
const progressEl = document.getElementById('progress');

LOCATIONS.forEach(loc => {
  const card = document.createElement('div');
  card.className = 'loc ' + loc.cls;
  card.dataset.loc = loc.id;
  card.innerHTML = `
    <div class="loc-head">
      <span class="ico">${loc.emoji}</span>
      <div>${loc.name}<span class="sub">${loc.sub}</span></div>
    </div>
    <div class="zone" data-zone="${loc.id}"></div>
  `;
  gridEl.appendChild(card);

  const zone = card.querySelector('.zone');

  /* drag & drop */
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    card.classList.add('dragover');
  });
  card.addEventListener('dragleave', e => {
    if(!card.contains(e.relatedTarget)) card.classList.remove('dragover');
  });
  card.addEventListener('drop', e => {
    e.preventDefault();
    card.classList.remove('dragover');
    const id = e.dataTransfer.getData('text/plain');
    if(id) place(id, loc.id);
  });

  /* тап-режим */
  card.addEventListener('click', e => {
    if(selected){
      e.stopPropagation();
      place(selected, loc.id);
      selected = null;
    }
  });
  zone.addEventListener('click', e => e.stopPropagation());
});

/* ══════════════ ТОКЕН СМАЙЛИКА ══════════════ */
function makeToken(m){
  const el = document.createElement('div');
  el.className = 'tok' + (selected === m.id ? ' sel' : '');
  el.draggable = true;
  el.innerHTML = `<div class="em">${m.emoji}</div><div class="nm">${m.name}</div>`;

  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', m.id);
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('dragging');
    selected = null;
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

  el.addEventListener('click', e => {
    e.stopPropagation();
    selected = (selected === m.id) ? null : m.id;
    render();
  });

  return el;
}

/* ══════════════ РЕНДЕР ══════════════ */
function render(){
  LOCATIONS.forEach(loc => {
    const zone = document.querySelector(`[data-zone="${loc.id}"]`);
    zone.innerHTML = '';
    MEMBERS.forEach(m => {
      if(state.placements[m.id] === loc.id) zone.appendChild(makeToken(m));
    });
  });
}

function place(memberId, locId){
  if(!memberId || !locId) return;
  state.placements[memberId] = locId;
  save();
  render();
}

/* ══════════════ ЧАСЫ ══════════════ */
let lastShown = -1;
function updateClock(force){
  const m = Math.floor(state.time) % 1440;
  if(!force && m === lastShown) return;
  lastShown = m;

  const hh = String(Math.floor(m / 60)).padStart(2,'0');
  const mm = String(m % 60).padStart(2,'0');
  clockEl.textContent = `${hh}:${mm}`;
  progressEl.style.width = (m / 1440 * 100).toFixed(2) + '%';

  const slot = getSlot(state.time);
  phaseEl.textContent = slot === 'night' ? '🌙' : slot === 'day' ? '☀️' : '🌇';
}

/* ══════════════ ИГРОВОЙ ЦИКЛ ══════════════ */
const MIN_PER_MS = 1 / 200;  // 1 игровая минута за 200 мс при ×1

let lastFrame = performance.now();
function loop(now){
  const dt = Math.min(now - lastFrame, 250);
  lastFrame = now;

  if(state.running){
    state.time += dt * MIN_PER_MS * state.speed;
    if(state.time >= 1440) state.time -= 1440;

    const slot = getSlot(state.time);
    if(slot !== state.slot){
      applySchedule();
      save();
      render();
    }
  }
  updateClock();
  requestAnimationFrame(loop);
}

/* ══════════════ КНОПКИ ══════════════ */
const playBtn = document.getElementById('playBtn');

playBtn.addEventListener('click', () => {
  state.running = !state.running;
  playBtn.textContent = state.running ? '⏸' : '▶';
  playBtn.classList.toggle('on', state.running);
  save();
});

document.querySelectorAll('.speed').forEach(btn => {
  btn.addEventListener('click', () => {
    state.speed = Number(btn.dataset.s);
    document.querySelectorAll('.speed').forEach(b =>
      b.classList.toggle('on', b === btn));
    save();
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  localStorage.removeItem(KEY);
  state = defaultState();
  selected = null;
  playBtn.textContent = '▶';
  playBtn.classList.remove('on');
  document.querySelectorAll('.speed').forEach(b =>
    b.classList.toggle('on', b.dataset.s === '1'));
  applySchedule();
  render();
  updateClock(true);
  save();
});

/* периодическое автосохранение */
setInterval(save, 4000);
window.addEventListener('beforeunload', save);

/* ══════════════ СТАРТ ══════════════ */
if(!state.placements || !Object.keys(state.placements).length ||
   state.slot !== getSlot(state.time)){
  applySchedule();
}

document.querySelectorAll('.speed').forEach(b =>
  b.classList.toggle('on', Number(b.dataset.s) === state.speed));

playBtn.textContent = state.running ? '⏸' : '▶';
playBtn.classList.toggle('on', state.running);

render();
updateClock(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
